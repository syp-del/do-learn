/* 성향에 맞춘 한마디 — 도전을 좋아하면 기록 깨기, 차분하면 어제의 나와 비교, 리더십이 있으면 가르쳐 주기 */
function ttStyleNote(k, p){
  const st = kidStyle(k), days = (p && p.days) || {}, keys = Object.keys(days).sort();
  const today = days[todayKey()] || {}, prev = keys.filter(x => x < todayKey()).map(x => days[x]).pop() || null;
  const lines = [];
  if (st.compete === 'high') lines.push(prev ? ((today.stars || 0) > (prev.stars || 0)
    ? `🔥 기록 깨기 성공! 지난번 별 ${prev.stars || 0}개 → 오늘 ${today.stars || 0}개!` : `🔥 지난번 기록은 별 ${prev.stars || 0}개! 다음엔 깰 수 있어!`)
    : '🔥 첫 기록을 세웠어요! 다음엔 이 기록을 깨볼까?');
  else if (st.compete === 'low' && prev) lines.push(`🌿 어제의 나보다 한 걸음! 말해 본 횟수 ${prev.rec || 0}번 → 오늘 ${today.rec || 0}번`);
  if (st.strengths.includes('leader')) lines.push(ttStyleLine('leader', k));
  if (st.strengths.includes('smart') && Math.random() < 0.5) lines.push(ttStyleLine('smart', k));
  return lines.length ? `<div class="banner info" style="text-align:left"><span>✨</span><span>${lines.map(esc).join('<br>')}</span></div>` : '';
}

function ttDrawWave(cv, contour, end){
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 300, h = cv.clientHeight || 74;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const vals = contour.filter(v => v !== null);
  if (!vals.length) return;
  const lo = Math.min(-4, ...vals), hi = Math.max(4, ...vals);
  const X = i => 12 + i * (w - 44) / Math.max(1, contour.length - 1), Y = v => h - 10 - (v - lo) / (hi - lo) * (h - 20);
  g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#3FA687';
  g.beginPath(); let pen = false;
  contour.forEach((v, i) => { if (v === null){ pen = false; return; } if (!pen){ g.moveTo(X(i), Y(v)); pen = true; } else g.lineTo(X(i), Y(v)); });
  g.stroke();
  g.fillStyle = '#E85C7C'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center';
  g.fillText(end === 'rise' ? '↗' : '↘', w - 16, h / 2 + 8);
}

/* ============================================================
   🎤 ECC speech 연습 — 원고를 한 문장씩 읽고, 영어 공부 앱처럼 봐 준다
   🔊 뚜뚜 목소리로 먼저 들어 보고(빠르기 고르기) → 🎤 읽으면, 기기 음성 인식이 되는 곳에서는 알아들은 단어가 바로 초록색.
   다 읽으면 잘 말한 단어는 초록 · 더 연습할 단어는 빨강. 빨간 단어를 누르면 "여기 이렇게 말해 보자!" — 천천히 들려주고 팁.
   AI 듣기(부모님이 켜면)는 발음·유창성·억양까지 본다. 꺼져 있으면 기기 인식 + 소리 크기·빠르기·쉼·끝 높낮이로.
   녹음 중에도, 결과를 본 뒤에도 언제든 🔁 다시 해보기. 문장마다 마지막 결과(초록·빨강)와 가장 좋은 별을 진도에 남긴다(prog.ecc[i]).
   그림 힌트·시간 제한은 없다. 원고의 {name} 자리는 아이 영어 이름(부모님 화면 → 아이)이고, 이름이 든 문장은 AI로 보내지 않는다.
   아이패드에서 녹음과 음성 인식이 함께 안 되면(오류) 이번 연습은 녹음만 쓴다(ECC.srOff).
   ============================================================ */
const ECC = { srOff:false };
const ECC_NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];

function ttNameFill(en, k){ const n = ttKidName(k); return String(en || '').replace(/\{name\}/g, n || '____'); }

/* 낱말 맞추기 — 숫자는 글자로(2 = two), 한 글자씩 들린 줄임말(E C C)은 붙이고, 이름 칸은 늘 맞은 걸로 */
function eccTok(text, target){
  let s = String(text || '').toLowerCase();

  else s = s.replace(/\b([a-z])\s+(?=[a-z]\b)/g, '$1');

         say:`${callName(k.name)}, ECC speech 연습이야! 한 문장씩 읽어 보자. 뚜뚜 목소리로 먼저 들어 봐도 좋아.` };

function eccTop(){

    return `<button class="ecc-dot ${c}${i === t.i && t.step !== 'done' ? ' now' : ''}" data-act="eccGo" data-arg="${i}" aria-label="${i + 1}번 문장">${i + 1}</button>`; }).join('');

ACTS.eccRate = (arg) => { const t = TT; if (!t) return; nvUnlock(); t.rate = +arg || 0.8; lsSet('dolearn.ttRate', String(t.rate)); ttLayer(); ttModel(eccText(t, t.i), t.rate); };
ACTS.eccWord = async (arg) => {
  const t = TT; if (!t || t.kind !== 'ecc' || t.step === 'rec' || t.step === 'think') return;
  const words = eccText(t, t.i).match(/[A-Za-z0-9’'-]+/g) || [], wi = +arg, w = words[wi]; if (!w) return;
  nvUnlock(); hush(); playStop();
  const phrase = words.slice(Math.max(0, wi - 1), wi + 2).join(' ');
  t.say = `여기 이렇게 말해 보자! “${w}” — ${eccTip(t, w, t.fb)}`;
  const b = document.getElementById('ttBubble'); if (b) b.textContent = t.say;
  const spans = Array.prototype.slice.call(document.querySelectorAll('#eccEn .w'));
  spans.forEach((sp, j) => sp.classList.toggle('on', j === wi));
  const me = t;
  if (!t.quiet){ ttMouth(true); await voice('여기 이렇게 말해 보자!', { lang:'ko' }); ttMouth(false); }
  if (TT !== me) return;
  await voice(w, { lang:'en', rate:0.7 });
  if (TT !== me) return;
  if (phrase !== w) await voice(phrase, { lang:'en', rate:0.8 });
  spans.forEach(sp => sp.classList.remove('on'));
};
function eccMove(i){
  const t = TT; if (!t || t.kind !== 'ecc') return;
  hush(); playStop(); if (t.step === 'rec'){ recCancel(); eccSrAbort(t); }
  const n = t.script.sentences.length;
  if (i >= n){
    t.step = 'done'; t.fb = null; t.clip = null; ttMood('cheer');
    t.say = '끝까지 다 읽었어! 초록색이 가득해졌지? 정말 대단해!'; ttLayer(); ttTalk(t.say); confetti(); ttChime(); t.cheer = true; return;
  }
  t.i = clamp(i, 0, n - 1); t.step = 'ready'; t.fb = null; t.clip = null; t.live = null; ttMood('happy');
  const saved = (t.prog.ecc || {})[t.i];
  t.say = saved && (saved.best || 0) >= 3 ? `${koOrd(t.i + 1)} 문장! 전에 잘 읽었던 문장이야. 한 번 더 해볼까?` : `${koOrd(t.i + 1)} 문장이야. 뚜뚜 목소리로 먼저 들어 보고 읽어 봐!`;
  ttLayer(); ttTalk(t.say);
}
ACTS.eccNext = () => { const t = TT; if (t) eccMove(t.i + 1); };
ACTS.eccPrev = () => { const t = TT; if (t && t.i > 0) eccMove(t.i - 1); };
ACTS.eccGo = (arg) => { const t = TT; if (!t || t.kind !== 'ecc' || t.step === 'rec' || t.step === 'think') return; eccMove(+arg || 0); };
ACTS.eccWeak = () => {
  const t = TT; if (!t) return; const e = t.prog.ecc || {};
  const j = t.script.sentences.findIndex((_, i) => ((e[i] || {}).best || 0) < 3);
  eccMove(j >= 0 ? j : 0);
};
ACTS.eccFull = () => { const t = TT; if (!t) return; ttRemoveLayer(); TT = null; ttOpenStage(); };

/* ---------- 🎤 처음부터 끝까지 이어 말하기 — 시간 제한·그림 힌트 없이 끝까지 (예전 '실전 무대') ---------- */
function ttOpenStage(){
  if (TT) return;
  nvUnlock();
  const k = curKid(); if (!k) return;
  const sc = ttScript(k.id); if (!sc) return;
  const prog = JSON.parse(JSON.stringify(ttProg(k.id, sc.id) || ttBlank(k.id, sc.id)));
  TT = { kind:'stage', kidId:k.id, script:sc, prog, step:'ready', hints:false, say:ttFill(ttPick('stage'), k),
         mood:'happy', quiet:false, t0:Date.now(), talking:false };
  ttLayer(); ttTalk(TT.say); wakeOn();
}
function ttStageView(){
  const t = TT, sc = t.script, lim = 0;          // 시간 제한은 두지 않는다 (부모님 요청)
  let card = '';
  if (t.askQuit) card = ttQuitCard();
  else if (t.step === 'ready'){

      <div style="font-size:48px">🎤🌟</div>
      <h3 class="sub" style="margin:0">처음부터 끝까지 말해봐요</h3>
      <p class="muted" style="margin:0">${lim ? `제한 시간은 <b>${fmtClock(lim)}</b>이에요. ` : ''}틀려도 멈추지 말고 끝까지! 그게 제일 멋져요.</p>
      <button class="btn wide" id="ttStageGo">시작 ▶</button>
      <p class="muted" style="margin:0;font-size:13px">녹음은 이 기기에만 저장돼요. 첫 무대 녹음은 계속 간직해요.</p>

  } else if (t.step === 'count'){
    card = `<div class="tt-card" style="text-align:center"><div class="tt-count" id="ttCount">${t.count}</div>
      <p class="muted" style="margin:6px 0 0">심호흡 한 번… 준비!</p></div>`;
  } else if (t.step === 'run'){
    card = `<div class="tt-card stack" style="text-align:center">
      <div class="muted">🔴 녹음 중</div>
      <div class="tt-big-time" id="ttClock">0:00</div>
      ${lim ? `<div class="muted" id="ttLimitNote">제한 ${fmtClock(lim)}</div>` : ''}
      <button class="tt-mic rec" id="ttStageStop" aria-label="끝">⏹</button>
      <p class="muted" style="margin:0">다 말했으면 눌러요</p>
    </div>`;
  } else if (t.step === 'think'){
    card = `<div class="tt-card" style="text-align:center"><div class="waiting"><i></i><i></i><i></i></div>
      <p class="muted" style="margin:0">뚜뚜가 끝까지 잘 들었어요. 잠깐만요…</p></div>`;
  } else if (t.step === 'result') card = ttStageResult();
  return `${ttTopBar('🎤 처음부터 끝까지')}<div class="ttl-body">${ttTeacher()}${card}</div>`;
}
function ttStageResult(){
  const t = TT, f = t.fb || {}, sc = t.script, lim = 0, secs = t.secs || 0;
  const skipped = (f.skipped || []).filter(n => n >= 1 && n <= sc.sentences.length);
  return `<div class="tt-card stack" style="text-align:center">
    <div style="font-size:48px">🏆</div>
    <h3 class="sub" style="margin:0">끝까지 해냈어요!</h3>
    <div class="tt-stars" aria-label="별 ${f.stars || 1}개">${[1, 2, 3].map(i => `<span class="${i <= (f.stars || 1) ? '' : 'off'}">⭐</span>`).join('')}</div>
    <div class="tt-badges">
      <span class="tt-badge${lim && secs > lim ? ' try' : ''}">⏱ ${fmtClock(secs)}${lim ? (secs <= lim ? ' · 시간 안에 딱!' : ` · 제한 ${fmtClock(lim)}보다 조금 길어요`) : ''}</span>
      ${f.local && !f.local.silent ? `<span class="tt-badge${f.local.loudDb < -40 ? ' try' : ''}">${f.local.loudDb < -40 ? '📣 조금 더 크게' : '📣 목소리 좋아요'}</span>` : ''}
    </div>

    ${skipped.length ? `<div><div class="muted" style="margin-bottom:6px">🧩 한 번 더 연습하면 좋은 문장 — 눌러서 들어봐요</div>
      <div class="chips" style="justify-content:center">${skipped.map(n => `<button class="chip" data-ttsent="${n - 1}">🔊 ${n}번</button>`).join('')}</div></div>` : ''}
    ${t.aiNote ? `<p class="muted" style="font-size:13px;margin:0">${esc(t.aiNote)}</p>` : ''}
    <div class="tt-foot">
      ${t.clip ? '<button class="btn ghost sm" id="ttMine">▶ 내 무대 듣기</button>' : ''}
      ${t.hasFirst ? '<button class="btn ghost sm" id="ttFirst">⭐ 첫 무대 듣기</button>' : ''}
    </div>
    <div class="tt-foot">
      <button class="btn ghost" id="ttStageAgain">🔁 한 번 더</button>
      <button class="btn" id="ttDoneBtn">끝내기</button>
    </div>
  </div>`;

function ttStageGo(){
  const t = TT; if (!t || t.step !== 'ready') return;
  audioCtx(); hush();
  t.step = 'count'; t.count = 3; ttLayer(); ttTone(660, 0, 0.18);
  t.cd = setInterval(async () => {
    if (TT !== t){ clearInterval(t.cd); return; }
    t.count--;
    if (t.count > 0){ const c = document.getElementById('ttCount'); if (c) c.textContent = t.count; ttTone(660, 0, 0.18); return; }
    clearInterval(t.cd); ttTone(990, 0, 0.3);
    try {
      await recStart({ maxSec:Math.max(90, (t.script.timeLimitSec || 120) + 90), silenceMs:1e9, onAuto:() => ttStageStop() });
    } catch(e){
      if (TT !== t) return;
      t.step = 'ready'; t.say = '마이크를 켜지 못했어. “허용”을 눌렀는지 확인해 볼까? 괜찮아, 다시 해보면 돼!';
      ttLayer(); ttTalk(t.say); return;
    }
    if (TT !== t){ recCancel(); return; }
    t.step = 'run'; t.runAt = Date.now(); ttMood('listen'); ttLayer();
    const lim = t.script.timeLimitSec || 0;
    t.tick = setInterval(() => {
      const el = document.getElementById('ttClock'); if (!el) return;
      const s = (Date.now() - t.runAt) / 1000;
      el.textContent = fmtClock(s);
      el.style.color = lim && s > lim ? 'var(--berry-deep)' : (lim && s > lim - 10 ? 'var(--butter-deep)' : '');
    }, 250);
  }, 900);
}
async function ttStageStop(){
  const t = TT; if (!t || t.step !== 'run') return;
  clearInterval(t.tick);
  const secs = (Date.now() - t.runAt) / 1000;
  t.step = 'think'; ttMood('think'); t.say = '뚜뚜가 끝까지 잘 들었어! 잠깐만…'; ttLayer();
  const blob = await recStop();
  if (TT !== t) return;
  if (!blob || !blob.size){
    t.step = 'ready'; ttMood('happy'); t.say = '앗, 녹음이 안 됐어. 괜찮아, 한 번 더 해볼까?';
    ttLayer(); ttTalk(t.say); return;
  }
  let m = null, x = null, fb = null;
  try { const d = await decodeAudio(blob); x = resample(d.pcm, d.rate, 16000); m = analyzeVoice(x, 16000); } catch(e){}
  if (ttAiReady() && m && !m.silent && secs <= 180 && !t.script.sentences.some(x => ttHasName(x.en))){
    try {
      const x8 = resample(x.subarray(m.s0, m.s1), 16000, 8000);
      const ai = await ttAsk({ task:'speech', kind:'stage', stage:4, mime:'audio/wav', audio:wavBase64(x8, 8000),
        sentence:t.script.sentences.map((s, i) => `${i + 1}. ${s.en}`).join('\n'), metrics:ttMetrics(m) });
      fb = ttMerge(ai, m);
    } catch(e){ ttAiFail(e); t.aiNote = `${e.message || '뚜뚜가 잠깐 쉬고 있어요.'} 이번엔 시간·목소리 크기만 봤어요.`; }
  }
  if (!fb) fb = { stars:(m && !m.silent) ? 2 : 1, praise:'끝까지 해낸 거 정말 멋져!', tip:'', words:[], skipped:[], local:m, source:'local' };
  if (TT !== t) return;
  t.fb = fb; t.secs = secs; t.clip = blob;
  const p = t.prog, day = ttDay(p);
  p.runs = (p.runs || []).slice(-30);
  p.runs.push({ at:new Date().toISOString(), secs:Math.round(secs), stars:fb.stars });
  day.runs = (day.runs || 0) + 1; day.rec = (day.rec || 0) + 1; day.secs = (day.secs || 0) + Math.round(secs);
  ttSaveProg(p);
  const owner = `${t.kidId}|${t.script.id}|-1`;
  let first = false;
  try { first = !(await AudioBox.list(owner)).length; } catch(e){}
  ttKeepClip(owner, blob, fb.stars, secs, first);
  try { t.hasFirst = !first && (await AudioBox.list(owner)).some(r => r.pinned); } catch(e){ t.hasFirst = false; }
  if (ttMarkMission(t.kidId, t.script, p)) t.cheer = true;
  t.step = 'result'; ttMood('cheer'); t.say = `${fb.praise || '끝까지 해냈어! 정말 멋져!'}`;
  ttLayer(); confetti(); ttChime(); ttTalk(t.say + (fb.tip ? ' ' + fb.tip : ''));
}
async function ttPlayFirst(){

    const r = (await AudioBox.list(`${t.kidId}|${t.script.id}|-1`)).find(x => x.pinned);
    if (r) playBlob(AudioBox.blob(r));

}

    : '<div class="empty"><div class="face">🎤</div><p>아직 무대 녹음이 없어요.<br>실전 무대에 한 번 올라가 볼까요?</p></div>'}`);

/* 수업 층 안의 단추들 — 처리했으면 true */
async function ttClick(t, d){
  const T = TT; if (!T) return false;
  nvUnlock();
  if (t.id === 'ttExit'){
    if ((T.kind === 'lesson' && (T.step === 'intro' || T.step === 'done')) || (T.kind === 'stage' && (T.step === 'ready' || T.step === 'result'))
      || (T.kind === 'ecc' && (T.step === 'done' || (T.step === 'ready' && !Object.keys(T.done || {}).length)))){ ttClose(); return true; }
    if (T.kind === 'ecc' && T.step === 'rec'){ recCancel(); eccSrAbort(T); T.step = 'ready'; T.live = null; }
    if (T.step === 'rec' || T.step === 'run'){ recCancel(); clearInterval(T.tick); T.step = T.kind === 'stage' ? 'ready' : 'speak'; }
    hush(); ttMouth(false); T.askQuit = true; ttLayer(); return true;
  }
  if (t.id === 'ttQuitNo'){ T.askQuit = false; ttLayer(); return true; }
  if (t.id === 'ttQuitYes' || t.id === 'ttDoneBtn'){ ttClose(); return true; }
  if (t.id === 'ttQuiet'){ T.quiet = !T.quiet; if (T.quiet){ hush(); ttMouth(false); } ttLayer(); return true; }
  if (d.ttword){ hush(); voice(d.ttword, { lang:'en', rate:0.7 }); return true; }
  if (d.ttsent){ const s = T.script.sentences[+d.ttsent]; if (s){ hush(); voice(s.en, { lang:'en', rate:0.8 }); } return true; }
  if (t.id === 'ttMine'){ hush(); playBlob(T.clip); return true; }
  if (T.kind === 'stage'){
    if (t.id === 'ttHints'){ T.hints = !T.hints; ttLayer(); return true; }
    if (t.id === 'ttStageGo'){ ttStageGo(); return true; }
    if (t.id === 'ttStageStop'){ ttStageStop(); return true; }
    if (t.id === 'ttFirst'){ hush(); ttPlayFirst(); return true; }
    if (t.id === 'ttStageAgain'){ playStop(); T.step = 'ready'; T.fb = null; T.clip = null; T.aiNote = ''; ttMood('happy'); T.say = '좋아, 한 번 더! 할 수 있어!'; ttLayer(); ttTalk(T.say); return true; }
    return false;
  }
  if (t.id === 'ttStart'){ ttEnterItem(); return true; }
  if (t.id === 'ttListen' || t.id === 'ttAgain'){
    const s = ttItemSentence(ttItem());
    if (T.step !== 'listen'){ T.step = 'listen'; T.say = ttPick('listen'); ttMood('happy'); ttLayer(); }
    const me = TT;
    ttModel(s.en, T.rate).then(() => { if (TT === me && me.step === 'listen') ttTalk('자 이제 말해볼까?'); });
    return true;
  }
  if (d.ttrate){
    T.rate = +d.ttrate; lsSet('dolearn.ttRate', d.ttrate); ttLayer();
    const me = TT;
    ttModel(ttItemSentence(ttItem()).en, T.rate).then(() => { if (TT === me && me.step === 'listen') ttTalk('자 이제 말해볼까?'); });
    return true;
  }
  if (t.id === 'ttSpeak'){
    hush(); T.step = 'speak'; ttMood('happy');
    const k = kid(T.kidId);
    T.say = kidStyle(k).pace === 'quick' ? ttStyleLine('quickSpeak', k) : ttFill(ttPick('speak'), k);
    ttLayer(); ttTalk(T.say); return true;
  }
  if (t.id === 'ttMic'){ ttMicStart(); return true; }
  if (t.id === 'ttStop'){ ttMicStop(); return true; }
  if (t.id === 'ttRecRestart'){ if (T.step === 'rec'){ recCancel(); T.step = 'speak'; setTimeout(() => { if (TT === T) ttMicStart(); }, 250); } return true; }
  if (t.id === 'ttSelf'){ ttSelfDone(); return true; }
  if (t.id === 'ttModel'){ ttModel(ttItemSentence(ttItem()).en, T.rate); return true; }
  if (t.id === 'ttPeek'){ T.peek = true; ttLayer(); return true; }
  if (t.id === 'ttRetry'){ ttRetry(); return true; }
  if (t.id === 'ttNext'){ ttNext(); return true; }
  if (t.id === 'ttStageFromDone'){ ttRemoveLayer(); TT = null; eccOpen(); return true; }
  return false;
}

/* ---------- 🦜 스피치 탭 — 뚜뚜 교실 + 내 원고 (문장을 누르면 그 문장만 연습) ---------- */
function viewSpeech(){
  const card = ttCard(false);
  const k = curKid(), sc = k && ttScript(k.id);
  if (!sc || window.claude) return card;
  const sents = ttSents(sc, ttProg(k.id, sc.id));
  return `${card}
  <div class="card">
    <h3 class="sub">📜 내 원고</h3>

    ${sc.sentences.map((s, i) => {
      const lv = Math.min(4, sents[i].lv || 0);
      return `<button class="todo" data-ttone="${i}" style="width:100%;text-align:left">
        <span class="tick" aria-hidden="true" style="font-size:20px;${lv >= 4 ? 'background:var(--mint-soft);border-color:var(--mint)' : ''}">${lv >= 4 ? '🌟' : esc(s.cue || '💬')}</span>

      </button>`;
    }).join('')}
  </div>`;

/* ---------- 스피치 탭 · 오늘 탭 카드 ---------- */
function ttCard(compact){
  if (window.claude){
    return compact ? '' : `<div class="card tt-mini">${ttSvg('idle')}<p class="muted" style="margin:0">🦜 뚜뚜 스피치 교실은
      버셀 주소(do-learn-syp4.vercel.app)로 열었을 때 쓸 수 있어요.</p></div>`;
  }
  const k = curKid(); if (!k) return '';
  const sc = ttScript(k.id);
  if (!sc){
    if (compact) return '';
    return `<div class="card tt-mini">${ttSvg('happy')}<div class="grow">
      <h3 class="sub" style="margin:0 0 4px">🦜 뚜뚜 스피치 교실</h3>
      <p class="muted" style="margin:0 0 9px">부모님이 대회 원고를 넣어주시면 뚜뚜 선생님이랑 한 문장씩 연습할 수 있어요!</p>
      <button class="btn ghost sm" id="ttSample">예시 원고로 먼저 해보기</button></div></div>`;
  }
  const plan = ttPlan(sc, ttProg(k.id, sc.id)), day = plan.day;
  const pct = plan.n ? plan.learned / plan.n * 100 : 0;
  const bits = [
    plan.newGoal ? `<span class="${(day.learn || 0) >= plan.newGoal ? 'ok' : ''}">🌱 새 문장 ${Math.min(day.learn || 0, plan.newGoal)}/${plan.newGoal}</span>` : '',
    plan.reviewGoal ? `<span class="${(day.review || 0) >= plan.reviewGoal ? 'ok' : ''}">🔁 복습 ${Math.min(day.review || 0, plan.reviewGoal)}/${plan.reviewGoal}</span>` : '',
    plan.runGoal ? `<span class="${(day.runs || 0) >= plan.runGoal ? 'ok' : ''}">🎤 ECC 연습 ${Math.min(day.runs || 0, plan.runGoal)}/${plan.runGoal}</span>` : ''
  ].join('');
  return `<div class="card" style="background:linear-gradient(170deg,#FFFFFF,#E9F8F1)">
    <div class="tt-mini">${ttSvg(plan.done ? 'cheer' : 'happy')}
      <div class="grow">
        <h3 class="sub" style="margin:0">🦜 뚜뚜 스피치 교실</h3>
        <div class="muted" style="font-size:14px">${esc(sc.title || '스피치 원고')} · ${plan.learned}/${plan.n} 문장 외웠어요</div>
        <div class="gauge" style="height:12px;margin-top:6px"><span style="width:${pct}%"></span></div>
      </div></div>
    <div class="tt-mission">${bits || '<span class="ok">오늘도 연습해볼까요?</span>'}</div>
    <p class="muted" style="margin:0 0 10px;font-size:14px">${plan.done
      ? '오늘 미션 완료! 너무 잘하고 있어요 🎉' : '틀려도 괜찮아요. 뚜뚜랑 천천히 해봐요!'}</p>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn grow" id="ttGo">${plan.done ? '🦜 더 연습하기' : '🦜 뚜뚜랑 수업하기'}</button>
      ${compact ? '' : '<button class="btn ghost grow" id="ttStage">🎤 ECC speech 연습</button><button class="btn ghost sm" id="ttRecs" aria-label="처음부터 끝까지 녹음 듣기">🎧</button>'}
    </div>
  </div>`;
}
function ttTodoNote(kidId){
  const sc = ttScript(kidId); if (!sc) return '';
  const plan = ttPlan(sc, ttProg(kidId, sc.id)), d = plan.day;
  const bits = [];
  if (plan.newGoal) bits.push(`새 문장 ${Math.min(d.learn || 0, plan.newGoal)}/${plan.newGoal}`);
  if (plan.reviewGoal) bits.push(`복습 ${Math.min(d.review || 0, plan.reviewGoal)}/${plan.reviewGoal}`);
  if (plan.runGoal) bits.push(`ECC 연습 ${Math.min(d.runs || 0, plan.runGoal)}/${plan.runGoal}`);
  return bits.join(' · ');
}
async function ttAddSample(){

async function ttRunPrep(){
  const d = S.view.ttDraft; if (!d || d.busy) return;
  const list = d.sentences.map(s => String(s.en || '').trim()).filter(Boolean);
  if (!list.length){ toast('문장이 하나는 있어야 해요'); return; }
  d.busy = true; d.msg = ''; openModal(parentSheet());
  try {
    const j = await ttAsk({ task:'prep', sentences:d.sentences.map(s => ttMask(String(s.en || '').trim())) });
    (j.items || []).forEach((it, i) => {
      const s = d.sentences[i]; if (!s) return;
      s.ko = it.ko || s.ko || ''; s.cue = it.cue || s.cue || ''; s.stress = it.stress || []; s.end = it.end || 'fall'; s.tricky = it.tricky || [];
    });
    d.prepped = true;
  } catch(e){
    d.msg = (e.code === 'no_key' ? '뚜뚜 AI 키가 아직 없어서' : (e.message || '지금은 준비하지 못해서'))
      + ' 그림 힌트·힘줄 단어·억양·발음 팁은 기기가 먼저 채웠어요. 한국어 뜻은 직접 적어주세요.';
    d.sentences.forEach((s, i) => ttLocalPrep(s, i));
  }
  d.busy = false;
  if (S.view.parentTab === 'speech' && $('#modalRoot .sheet')) openModal(parentSheet());
}

    stress:s.stress || [], end:s.end === 'rise' ? 'rise' : 'fall', tricky:s.tricky || [] })).filter(s => s.en);
  if (!sentences.length){ toast('문장이 하나는 있어야 해요'); return; }
  const kidIds = d.kidIds.length ? d.kidIds.slice() : kids().map(k => k.id);

/* ============================================================
   🎈 생각 놀이 4가지 — 놀이 방식만 참고해 이 앱 그림체로 새로 만들었다
   🧱 쌓기나무 탐험대(공간 감각) · 🍕 피자 가게(분수) · ✏️ 한붓그리기(길 찾기) · 🔍 패턴 탐정(규칙 찾기)
   틀려도 괜찮아 — 다시 해볼 수 있고, 맞히면 별을 받는다. 단계는 아이마다 기억한다(profile.play).
   ============================================================ */
const PLAY_COL = ['#FF8FA8', '#9BE0C8', '#FFD98E', '#B3A6EE', '#9DBBEA'];
const PLAY_SOFT = ['#FFE3EA', '#E2F7EF', '#FFF1D6', '#EAE6FB', '#E3EDFB'];
const PLAY_MID = ['#FFC2CE', '#BFE7D2', '#FFE79C', '#D5CCF5', '#CBDDF7'];
function playLevel(game){ const k = curKid(); return Math.max(1, ((k && k.play) || {})[game] || 1); }
function playLevelUp(game){
  const k = curKid(); if (!k) return;
  const play = { ...(k.play || {}) }; play[game] = (play[game] || 1) + 1;
  Store.update('profiles', k.id, { play });
}
function playRand(n){ return Math.floor(Math.random() * n); }
function playShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = playRand(i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
const PLAY_OK = ['딩동댕! 정답이에요!', '우와, 척척박사!', '최고예요! 너무 잘하고 있어요!', '멋져요! 생각하는 힘이 쑥쑥!'];
const PLAY_TRY = ['괜찮아요! 틀려도 괜찮아, 다시 생각해 볼까?', '거의 다 왔어요! 한 번 더 해볼까?', '좋은 생각이었어요! 다른 것도 골라볼까?'];
const playPick = l => l[playRand(l.length)];

/* ---------- 🧱 쌓기나무 탐험대 ----------
   높이 지도 H[y][x] (y 0=뒤 → 앞, x 0=왼쪽 → 오른쪽)로 쌓는다. 공중에 뜬 나무는 없다.
   묻는 것: 모두 몇 개(한 줄) · 위에서 본 모양 · 앞에서 본 모양 · 옆(오른쪽)에서 본 모양 */
/* 다른 나무에 가려 보이지 않는 나무 수 — 윗면·오른쪽·앞쪽이 모두 막힌 나무 (‘보이는 것만 센’ 실수를 보기로 쓴다) */
function stkHidden(H){
  const D = H.length, W = H[0].length; let n = 0;
  for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) for (let z = 0; z < H[y][x]; z++){
    const top = z + 1 < H[y][x], right = x + 1 < W && H[y][x + 1] > z, front = y + 1 < D && H[y + 1][x] > z;
    if (top && right && front) n++;
  }
  return n;
}
/* 단계가 오를수록 넓고 높아지고(최대 가로 4 · 세로 3 · 4층), 숨은 나무가 생긴다.
   묻는 것: 모두 몇 개 · 위/앞/옆에서 본 모양 · 몇 개 더 쌓으면 상자 모양 · 위에서 본 모양에 층수 쓰기 */
function stkMake(lv){
  const L = Math.max(1, lv || 1);
  const types = L <= 1 ? ['count', 'top', 'front'] : L <= 2 ? ['count', 'top', 'front', 'side']
    : L <= 3 ? ['count', 'front', 'side', 'more'] : ['count', 'front', 'side', 'more', 'topnum'];
  const type = types[playRand(types.length)];
  const W = L <= 2 ? 3 : (L <= 4 ? 3 + playRand(2) : 4);
  const D = L <= 1 ? 2 : (L <= 3 ? 2 + playRand(2) : 3);
  const maxH = L <= 1 ? 3 : (L <= 4 ? 3 : 4);
  let H;
  for (let guard = 0; guard < 120; guard++){
    H = Array.from({ length:D }, () => Array.from({ length:W }, () => playRand(maxH + 1)));
    // 앞쪽 대각선 기둥이 더 높으면 뒤 기둥이 통째로 가려질 수 있어서 낮춘다 (숨은 나무는 있어도, 통째로 안 보이는 기둥은 없게)
    for (let y = 0; y + 1 < D; y++) for (let x = 0; x + 1 < W; x++) if (H[y + 1][x + 1] > H[y][x]) H[y + 1][x + 1] = H[y][x];
    const flat = H.flat(), total = flat.reduce((a, v) => a + v, 0), cols = flat.filter(v => v > 0).length, top = Math.max(...flat);
    if (total < 6 || cols < Math.ceil(W * D * 0.6) || top < 2 || !H[0].some(v => v > 0) || !H[D - 1].some(v => v > 0)) continue;
    if ((type === 'count' || type === 'more') && stkHidden(H) < (L >= 3 ? 2 : 1)) continue;          // 숨은 나무가 있어야 도전!
    if (type === 'more' && W * D * top - total < 3) continue;
    break;
  }
  const total = H.flat().reduce((a, v) => a + v, 0), hidden = stkHidden(H), Hb = Math.max(...H.flat());
  const nums = (right, extra) => {                        // 정답 + 흔한 실수 + 가까운 수
    const set = new Set([right]); (extra || []).forEach(v => { if (v > 0 && set.size < 4) set.add(v); });
    for (const d of playShuffle([-2, -1, 1, 2, 3])){ if (set.size >= 4) break; if (right + d > 0) set.add(right + d); }
    return playShuffle([...set]).map(v => ({ t:String(v), ok:v === right }));
  };
  const key = g => g.map(r => r.join('')).join('/');
  let options, ask, box = 0, more = 0;
  if (type === 'count'){
    ask = '쌓기나무는 모두 몇 개일까요? 보이지 않는 나무도 있어요!';
    options = nums(total, [total - hidden]);
  } else if (type === 'more'){
    box = W * D * Hb; more = box - total;
    ask = `쌓기나무를 더 쌓아서 빈틈없는 상자 모양(가로 ${W}개 · 세로 ${D}개 · ${Hb}층)을 만들려면 몇 개가 더 있어야 할까요?`;
    options = nums(more, [box - (total - hidden)]);
  } else if (type === 'topnum'){
    ask = '위에서 본 모양에 칸마다 몇 층인지 적었어요. 맞는 것은?';
    const cells = g => { const c = []; g.forEach((r, y) => r.forEach((v, x) => { if (v > 0) c.push([y, x]); })); return c; };
    const bump = g => { const c = g.map(r => r.slice()), cs = cells(c), [y, x] = cs[playRand(cs.length)]; c[y][x] = c[y][x] > 1 && playRand(2) ? c[y][x] - 1 : c[y][x] + 1; return c; };
    const swap = g => { const c = g.map(r => r.slice()), cs = playShuffle(cells(c)).filter(([y, x], n, all) => all.findIndex(([yy, xx]) => c[yy][xx] !== c[y][x]) >= 0);
      if (cs.length >= 2){ const a = cs[0], b = cs.find(([y, x]) => c[y][x] !== c[a[0]][a[1]]); if (b){ const t = c[a[0]][a[1]]; c[a[0]][a[1]] = c[b[0]][b[1]]; c[b[0]][b[1]] = t; } } return c; };
    const outs = [H], seen = new Set([key(H)]);
    for (const c of [swap(H), bump(H), stkFlip(H), swap(bump(H)), bump(bump(H))]){ if (outs.length >= 4) break; if (!seen.has(key(c))){ seen.add(key(c)); outs.push(c); } }
    for (let g = 0; outs.length < 4 && g < 40; g++){ const c = bump(outs[playRand(outs.length)]); if (!seen.has(key(c))){ seen.add(key(c)); outs.push(c); } }
    options = playShuffle(outs.map((v, n) => ({ grid:v, nums:true, ok:n === 0 })));
  } else {
    const view = stkView(H, type);
    ask = { top:'위에서 보면 어떤 모양일까요?', front:'앞에서 보면 어떤 모양일까요? 👀', side:'오른쪽 옆에서 보면 어떤 모양일까요? 👀' }[type];
    const want = L >= 2 ? 4 : 3;
    const outs = [view], seen = new Set([key(view)]);
    const cands = [stkToggle(view), stkFlip(view), stkShift(view), stkToggle(stkFlip(view)), stkToggle(view), stkToggle(stkToggle(view))];
    for (const c of cands){ if (outs.length >= want) break; if (!seen.has(key(c)) && c.flat().some(Boolean)){ seen.add(key(c)); outs.push(c); } }
    for (let g = 0; outs.length < want && g < 40; g++){ const c = stkToggle(outs[playRand(outs.length)]); if (!seen.has(key(c)) && c.flat().some(Boolean)){ seen.add(key(c)); outs.push(c); } }
    options = playShuffle(outs.map((v, n) => ({ grid:v, ok:n === 0 })));
  }
  return { type, H, ask, options, total, hidden, box, more, Hb, W, D };
}
// 보이는 모양 — 1 은 칠한 칸. 위: D×W, 앞: 높이×W, 옆: 높이×D (왼쪽이 앞)
function stkView(H, type){
  const D = H.length, W = H[0].length, maxH = Math.max(1, ...H.flat());
  if (type === 'top') return H.map(r => r.map(v => v > 0 ? 1 : 0));
  if (type === 'front'){
    const col = Array.from({ length:W }, (_, x) => Math.max(...H.map(r => r[x])));
    return Array.from({ length:maxH }, (_, z) => col.map(h => h >= maxH - z ? 1 : 0));
  }
  const row = Array.from({ length:D }, (_, y) => Math.max(...H[y])).reverse();
  return Array.from({ length:maxH }, (_, z) => row.map(h => h >= maxH - z ? 1 : 0));
}
const stkFlip = g => g.map(r => r.slice().reverse());
const stkShift = g => g.map(r => r.slice(1).concat(r[0]));
function stkToggle(g){ const c = g.map(r => r.slice()); const y = playRand(c.length), x = playRand(c[0].length); c[y][x] = c[y][x] ? 0 : 1; return c; }
/* 입체 그림 (등각 투영) — 먼 것부터 그린다 */
function stkSvg(H, eye){
  const D = H.length, W = H[0].length, a = 26, b = 15, c = 30;
  const P = (X, Y, Z) => [(X - Y) * a, (X + Y) * b - Z * c];
  const cubes = [];
  for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) for (let z = 0; z < H[y][x]; z++) cubes.push([x, y, z]);
  cubes.sort((p, q) => (p[0] + p[1]) - (q[0] + q[1]) || p[2] - q[2]);
  const pts = []; cubes.forEach(([x, y, z]) => { pts.push(P(x, y + 1, z), P(x + 1, y, z), P(x + 1, y + 1, z), P(x, y, z + 1)); });
  pts.push(P(0, D, 0), P(W, 0, 0), P(W, D, 0));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs) - 28, maxX = Math.max(...xs) + 28, minY = Math.min(...ys) - 12, maxY = Math.max(...ys) + 24;
  const poly = (list, fill) => `<polygon points="${list.map(p => p.join(',')).join(' ')}" fill="${fill}" stroke="#6B4A52" stroke-width="1.6" stroke-linejoin="round"/>`;
  const body = cubes.map(([x, y, z]) => {
    const ci = (x + y * 2) % PLAY_COL.length;
    return poly([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], PLAY_SOFT[ci])
      + poly([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], PLAY_COL[ci])
      + poly([P(x, y + 1, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], PLAY_MID[ci]);
  }).join('');
  let mark = '';
  if (eye === 'front'){ const p = P(W / 2, D + 0.9, 0); mark = `<text x="${p[0] - 14}" y="${p[1] + 18}" font-size="20">👀</text>`; }
  if (eye === 'side'){ const p = P(W + 0.9, D / 2, 0); mark = `<text x="${p[0] + 2}" y="${p[1] + 18}" font-size="20">👀</text>`; }
  if (eye === 'top'){ const p = P(0, 0, Math.max(...H.flat()) + 0.6); mark = `<text x="${p[0] - 10}" y="${p[1] - 2}" font-size="20">👀</text>`; }
  return `<svg viewBox="${minX} ${minY - (eye === 'top' ? 22 : 0)} ${maxX - minX} ${maxY - minY + 22 + (eye === 'top' ? 22 : 0)}" style="width:100%;max-width:${W * D >= 12 ? 330 : 290}px;height:auto;display:block;margin:0 auto" aria-label="쌓기나무">${body}${mark}</svg>`;
}
function stkGridSvg(g, nums){
  const s = 20, h = g.length, w = g[0].length;
  return `<svg viewBox="-2 -2 ${w * s + 4} ${h * s + 4}" style="width:${Math.min(128, w * 30)}px;height:auto">${g.map((r, y) => r.map((v, x) =>
    `<rect x="${x * s}" y="${y * s}" width="${s - 2}" height="${s - 2}" rx="4" fill="${v ? (nums ? '#FFC2CE' : '#FF8FA8') : '#FFFFFF'}" stroke="${v ? '#6B4A52' : '#F3DDE2'}" stroke-width="1.5"/>`
    + (nums && v ? `<text x="${x * s + (s - 2) / 2}" y="${y * s + (s - 2) / 2 + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4A52">${v}</text>` : '')).join('')).join('')}</svg>`;
}
function startStack(){ S.view.game = 'stack'; S.view.stk = { lv:playLevel('stack'), q:stkMake(playLevel('stack')), pick:null, answered:false, streak:0 }; render(); }
function stackBody(){
  const st = S.view.stk, q = st.q;

/* ---------- 🍕 피자 가게 ----------

const PZ_GUESTS = [['🐰','토끼'], ['🐻','곰돌이'], ['🐱','야옹이'], ['🐧','펭귄'], ['🦊','여우'], ['🐨','코알라']];

  else if (rule === 'abb'){ const a = I({ shape:sh[0], col:co[0] }), b = I({ shape:sh[1], col:co[1] }); unit = [a, b, b]; desc = `${N(0)} 한 번, ${N(1)} 두 번씩!`; }
  else if (rule === 'aabb'){ const a = I({ shape:sh[0], col:co[0] }), b = I({ shape:sh[1], col:co[1] }); unit = [a, a, b, b]; desc = `${N(0)} 두 번, ${N(1)} 두 번씩!`; }
  else if (rule === 'abcd'){ unit = [0, 1, 2, 3].map(k => I({ shape:sh[k], col:co[k] })); desc = `${N(0)} → ${N(1)} → ${N(2)} → ${N(3)}, 네 가지가 차례대로!`; }
  else if (rule === 'abcb'){ const t = [0, 1, 2].map(k => I({ shape:sh[k], col:co[k] })); unit = [t[0], t[1], t[2], t[1]]; desc = `${N(0)} → ${N(1)} → ${N(2)} → 다시 ${N(1)}, 갔다가 돌아와요!`; }
  else if (rule === 'abcdcb'){ const t = [0, 1, 2, 3].map(k => I({ shape:sh[k], col:co[k] })); unit = [t[0], t[1], t[2], t[3], t[2], t[1]]; desc = `${N(0)}에서 ${N(3)}까지 갔다가 거꾸로 돌아와요!`; }
  else if (rule === 'bounce'){ unit = [0, 1, 2, 1].map(z => I({ shape:sh[0], col:co[0], size:z })); desc = '작은 것 → 중간 → 큰 것 → 중간, 커졌다 작아졌다 해요!'; }
  else if (rule === 'rot'){ unit = [0, 90, 180, 270].map(r => I({ shape:'triangle', col:co[0], rot:r })); desc = '세모가 시계 방향으로 한 번씩 돌아가요!'; }
  else if (rule === 'rotsize'){ unit = [0, 90, 180, 270].map((r, k) => I({ shape:'triangle', col:co[0], rot:r, size:k % 2 ? 0 : 2 })); desc = '세모가 시계 방향으로 돌면서, 큰 것과 작은 것이 번갈아 나와요!'; }
  else if (rule === 'shapesize'){ unit = [0, 1, 2, 0, 1, 2].map((z, k) => I({ shape:sh[k % 2], col:co[k % 2], size:z })); desc = `${N(0)}·${N(1)}가 번갈아 나오고, 크기는 작은 것 → 중간 → 큰 것으로 커져요!`; }
  else if (rule === 'two'){ unit = [0, 1, 2, 3, 4, 5].map(k => I({ shape:sh[k % 2], col:co[k % 3] })); desc = '모양은 두 가지가 번갈아, 색깔은 세 가지가 차례대로 바뀌어요!'; }
  else if (rule === 'two3'){ unit = [0, 1, 2, 3, 4, 5].map(k => I({ shape:sh[k % 3], col:co[k % 2] })); desc = '모양은 세 가지가 차례대로, 색깔은 두 가지가 번갈아 바뀌어요!'; }
  else if (rule === 'updown'){ const b = I({ shape:sh[0], col:co[0] }); seq = [1, 2, 3, 4, 3, 2, 1, 2, 3].map(n => ({ ...b, cnt:n })); desc = '하나씩 늘었다가, 하나씩 줄었다가 해요!'; }
  else { const b = I({ shape:sh[0], col:co[0] }); seq = [1, 2, 1, 3, 1, 4, 1, 5].map(n => ({ ...b, cnt:n })); desc = '1이 사이사이에 나오고, 다른 수는 하나씩 늘어나요!'; }
  if (!seq){ const len = unit.length * 2 + (unit.length <= 3 ? 1 : 0); seq = Array.from({ length:len }, (_, k) => unit[k % unit.length]); }
  // 3단계부터는 가운데도 비운다 — 앞뒤를 모두 살펴야 풀 수 있다
  const hole = L >= 3 && playRand(2) ? 2 + playRand(seq.length - 3) : seq.length - 1;
  const ans = seq[hole];
  const want = Math.min(5, (L >= 2 ? 4 : 3) + (kidStyle(curKid()).pace === 'careful' ? 1 : 0));
  const opts = [ans], seen = new Set([ptLook(ans)]);
  // 헷갈리는 보기 — 한 가지만 다른 것, 바로 앞뒤에 오는 것. 돌리기는 돌리면 달라 보이는 세모에만.
  const near = [seq[hole - 1], seq[hole + 1]].filter(Boolean);
  const turn = ans.shape === 'triangle' ? [{ rot:(ans.rot + 90) % 360 }, { rot:(ans.rot + 180) % 360 }] : [];
  const variants = near.concat([{ col:(ans.col + 1) % 5 }, { shape:sh.find(x => x !== ans.shape) }, { size:(ans.size + 1) % 3 }, { size:(ans.size + 2) % 3 },
    { cnt:Math.max(1, ans.cnt + (ans.cnt >= 5 ? -1 : 1)) }, { cnt:Math.max(1, ans.cnt - 1) }].concat(turn)
    .map(v => ({ ...ans, ...v })), seq);
  for (const v of variants.slice(0, near.length).concat(playShuffle(variants.slice(near.length)))){
    if (opts.length >= want) break;
    if (v && !seen.has(ptLook(v))){ seen.add(ptLook(v)); opts.push(v); }
  }
  return { seq, hole, desc, options:playShuffle(opts.map(o => ({ it:o, ok:ptLook(o) === ptLook(ans) }))) };
}
function startPattern(){ S.view.game = 'pattern'; S.view.pt = { lv:playLevel('pattern'), q:ptMake(playLevel('pattern')), pick:null, answered:false, streak:0 }; render(); }
function patternBody(){
  const st = S.view.pt, q = st.q, ok = st.answered && q.options[st.pick] && q.options[st.pick].ok;
  const cells = q.seq.map((it, i) => i === q.hole

    : ptSvg(it)).join('');
  return `<div class="card">

    <p class="muted" style="margin:0 0 8px">규칙을 찾아서 <b>?</b> 자리에 올 것을 골라요!</p>

    <div style="display:grid;grid-template-columns:repeat(${q.options.length},1fr);gap:9px;margin-top:12px">${q.options.map((o, i) => {
      let css = '';
      if (st.answered){ if (o.ok) css = 'background:var(--mint-soft);border-color:var(--mint-deep)'; else if (st.pick === i) css = 'background:var(--berry-soft);border-color:var(--berry)'; }
      return `<button class="matchbtn" data-pt="${i}" style="${css};display:grid;place-items:center;min-height:76px" ${st.answered ? 'disabled' : ''}>${ptSvg(o.it, true)}</button>`;
    }).join('')}</div>
    ${st.answered ? `<div class="banner ${ok ? 'info' : 'warn'}" style="margin-top:12px"><span>${ok ? '🕵️' : '🤗'}</span><span>${esc((ok ? playPick(PLAY_OK) : '괜찮아요! 탐정은 다시 살펴보면 돼요.') + ' 규칙: ' + q.desc)}</span></div>
      <button class="btn wide" id="ptNext" style="margin-top:10px">다음 사건 ▶</button>` : ''}
  </div>`;
}
function patternTap(i){
  const st = S.view.pt; if (!st || st.answered) return;
  st.pick = i; st.answered = true;
  if (st.q.options[i].ok){ st.streak++; ttChime(); awardStars(1); if (st.streak % 3 === 0){ st.lv++; playLevelUp('pattern'); toast(`${st.lv}단계 탐정이 되었어요! 🔍`); } }
  else st.streak = 0;
  render();
}

/* ---------- ✏️ 한붓그리기 — 손가락을 떼지 않고 모든 칸을 한 번씩 ----------
   정답 길을 먼저 만들고(무작위 + 막다른 곳을 피하는 규칙), 길이 지나지 않은 칸은 돌로 막는다. 그래서 언제나 풀 수 있다.
   5초 동기화에 지워지지 않도록 화면 위 층에서 한다. */
let OL = null;
/* 단계가 오를수록 판이 커진다: 4×4 → 5×5 → 6×6 → 7×7 → 8×8. 3단계부터는 🏁 깃발 칸에서 끝나야 한다 */
function olMake(lv){
  const L = Math.max(1, lv || 1);
  const n = L <= 2 ? 4 : L <= 4 ? 5 : L <= 6 ? 6 : L <= 8 ? 7 : 8;
  const cover = L <= 2 ? 0.94 : 0.88;
  const total = n * n, id = (x, y) => y * n + x, nb = c => { const x = c % n, y = Math.floor(c / n), out = []; if (x > 0) out.push(c - 1); if (x < n - 1) out.push(c + 1); if (y > 0) out.push(c - n); if (y < n - 1) out.push(c + n); return out; };
  let best = null;
  for (let t = 0; t < 260; t++){
    const start = playRand(total), path = [start], used = new Set([start]);
    for (;;){
      const cur = path[path.length - 1], next = playShuffle(nb(cur).filter(c => !used.has(c)));
      if (!next.length) break;
      next.sort((p, q) => nb(p).filter(c => !used.has(c)).length - nb(q).filter(c => !used.has(c)).length);
      const pick = Math.random() < 0.8 ? next[0] : next[playRand(next.length)];
      path.push(pick); used.add(pick);
    }
    if (!best || path.length > best.length) best = path;
    if (path.length >= Math.ceil(total * cover) && (cover < 1 || path.length === total)) { best = path; break; }
  }
  const open = new Set(best), walls = new Set(); for (let c = 0; c < total; c++) if (!open.has(c)) walls.add(c);
  return { n, sol:best, walls, start:best[0], goal:L >= 3 ? best[best.length - 1] : -1 };
}
function openOneline(){
  if (OL) return;
  const lv = playLevel('oneline'), g = olMake(lv);
  OL = { lv, ...g, path:[g.start], hint:-1, done:false, kidId:S.kidId };
  const el = document.createElement('div');
  el.className = 'ttl'; el.id = 'olLayer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', '한붓그리기');
  document.body.appendChild(el);
  OL.el = el; olDraw();
}
function closeOneline(msg){ if (!OL) return; OL.el.remove(); OL = null; if (S.view.game === 'oneline') S.view.game = null; render(); if (msg) toast(msg); }
function olDraw(){
  const o = OL, n = o.n, s = 60, pad = 8, W = n * s + pad * 2;
  const cxy = c => [pad + (c % n) * s + s / 2, pad + Math.floor(c / n) * s + s / 2];
  const on = new Set(o.path);
  let cells = '';
  for (let c = 0; c < n * n; c++){
    const x = pad + (c % n) * s, y = pad + Math.floor(c / n) * s;
    if (o.walls.has(c)) cells += `<rect x="${x + 4}" y="${y + 4}" width="${s - 8}" height="${s - 8}" rx="12" fill="#E4D2F3" opacity="0.55"/><text x="${x + s / 2}" y="${y + s / 2 + 8}" text-anchor="middle" font-size="22">🪨</text>`;
    else cells += `<rect x="${x + 4}" y="${y + 4}" width="${s - 8}" height="${s - 8}" rx="12" fill="${on.has(c) ? '#FFE3EA' : '#FFFFFF'}" stroke="${c === o.hint ? '#3FA687' : '#F3DDE2'}" stroke-width="${c === o.hint ? 4 : 2.5}"/>`;
  }
  const line = o.path.map(cxy).map(p => p.join(',')).join(' ');
  const end = cxy(o.path[o.path.length - 1]), st = cxy(o.start);
  const left = n * n - o.walls.size - o.path.length;
  o.el.innerHTML = `<div class="ttl-top">
      <button class="ttl-x" id="olExit" aria-label="그만하기">✕</button>
      <div class="ttl-dots"><span class="ttl-chip" style="background:var(--berry-soft);color:var(--berry-deep)">✏️ 한붓그리기 · ${o.lv}단계</span></div>
    </div>
    <div class="ttl-body">
      <div class="tt-card stack" style="text-align:center">
        <p style="margin:0;font-family:var(--display);font-size:21px">${o.done ? '다 지나갔어요! 최고예요! 🎉' : (o.goal >= 0 ? '🐣에서 시작해서 🏁에서 끝! 모든 칸을 한 번씩 지나가요' : '🐣에서 시작! 손가락을 떼지 않고 모든 칸을 한 번씩 지나가요')}</p>
        <svg id="olSvg" viewBox="0 0 ${W} ${W}" style="width:100%;max-width:420px;height:auto;margin:0 auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none">
          ${cells}
          <polyline points="${line}" fill="none" stroke="#FF8FA8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          <text x="${st[0]}" y="${st[1] + 9}" text-anchor="middle" font-size="26">🐣</text>
          ${o.goal >= 0 && !o.path.includes(o.goal) ? `<text x="${cxy(o.goal)[0]}" y="${cxy(o.goal)[1] + 9}" text-anchor="middle" font-size="26">🏁</text>` : ''}
          ${o.path.length > 1 ? `<circle cx="${end[0]}" cy="${end[1]}" r="11" fill="#E85C7C" stroke="#fff" stroke-width="3"/>` : ''}
        </svg>
        <p class="muted" style="margin:0">${o.done ? '생각하는 힘이 쑥쑥 자랐어요!' : `${n}×${n} · 남은 칸 ${left}개 · 되돌아가고 싶으면 방금 지나온 칸으로 가요`}</p>
        <div class="tt-foot">${o.done
          ? '<button class="btn wide" id="olNext">다음 단계 ▶</button>'
          : '<button class="btn ghost sm" id="olUndo">↩ 한 칸 되돌리기</button><button class="btn ghost sm" id="olReset">🔄 처음부터</button><button class="btn ghost sm" id="olHint">💡 힌트</button>'}</div>
      </div>
    </div>`;
  olBind();
}
function olCellAt(ev){
  const svg = document.getElementById('olSvg'); if (!svg || !OL) return -1;
  const r = svg.getBoundingClientRect(), n = OL.n, s = 60, pad = 8, W = n * s + pad * 2;
  const x = (ev.clientX - r.left) * W / r.width - pad, y = (ev.clientY - r.top) * W / r.height - pad;
  if (x < 0 || y < 0 || x >= n * s || y >= n * s) return -1;
  const cx = Math.floor(x / s), cy = Math.floor(y / s);
  const fx = x - cx * s, fy = y - cy * s;
  if (fx < 8 || fy < 8 || fx > s - 8 || fy > s - 8) return -1;           // 칸 가장자리는 무시 — 대각선으로 새지 않게
  return cy * n + cx;
}
function olBind(){
  const svg = document.getElementById('olSvg'); if (!svg) return;
  const adj = (a, b) => { const n = OL.n; return (Math.abs(a - b) === 1 && Math.floor(a / n) === Math.floor(b / n)) || Math.abs(a - b) === n; };
  const step = c => {
    const o = OL; if (!o || o.done || c < 0 || o.walls.has(c)) return;
    const end = o.path[o.path.length - 1];
    if (o.path.length >= 2 && c === o.path[o.path.length - 2]){ o.path.pop(); o.hint = -1; olDraw(); return; }
    if (c !== end && adj(c, end) && !o.path.includes(c)){
      if (c === o.goal && o.path.length + 1 < o.n * o.n - o.walls.size){
        if (!o.goalWarned || Date.now() - o.goalWarned > 2500){ o.goalWarned = Date.now(); toast('🏁 깃발은 맨 마지막에 도착해요! 다른 칸을 먼저 지나가 볼까요?'); }
        return;
      }
      o.path.push(c); o.hint = -1;
      if (o.path.length === o.n * o.n - o.walls.size){ o.done = true; ttChime(); confetti(); awardStars(2); playLevelUp('oneline'); }
      olDraw();
    }
  };
  svg.addEventListener('pointerdown', ev => {
    const c = olCellAt(ev); if (!OL || OL.done) return;
    if (c === OL.path[OL.path.length - 1] || c === OL.start){ OL.dragging = true; if (c === OL.start && OL.path.length > 1 && c !== OL.path[OL.path.length - 1]){ OL.path = [OL.start]; olDraw(); } try { svg.setPointerCapture(ev.pointerId); } catch(e){} }
    else step(c);
  });
  svg.addEventListener('pointermove', ev => { if (OL && OL.dragging) step(olCellAt(ev)); });
  const up = () => { if (OL) OL.dragging = false; };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
}
function olClick(t){
  const o = OL; if (!o) return false;
  if (t.id === 'olExit'){ closeOneline(); return true; }
  if (t.id === 'olUndo'){ if (o.path.length > 1) o.path.pop(); o.hint = -1; olDraw(); return true; }
  if (t.id === 'olReset'){ o.path = [o.start]; o.hint = -1; olDraw(); return true; }
  if (t.id === 'olHint'){
    const k = o.path.length, prefix = o.path.every((c, i) => c === o.sol[i]);
    if (prefix){ o.hint = o.sol[k]; olDraw(); }
    else { toast('다른 길로 가 보는 중이네요! 🔄 처음부터 하면 힌트를 줄게요'); }
    return true;
  }
  if (t.id === 'olNext'){ const lv = playLevel('oneline'), g = olMake(lv); Object.assign(o, { lv, ...g, path:[g.start], hint:-1, done:false }); olDraw(); return true; }
  return false;
}

/* ============================================================
   🌱 이또 — 풀숲 친구 찾기 (놀이 시간에)
   ① 정원: 손가락으로 좌우로 쓱쓱 문지르면 풀이 깎이고, 숨어 있던 친구가 뿅! 나타난다.
   ② 나타난 친구를 누르면 땅속 탐험차에 쏙 탄다 (5자리 — 친구 모두 탈 수 있다).
   ③ 🚗 출발! → 하늘로 슝~ 날아올랐다가 빙글 돌아 땅속으로 쏙! 개미집에 도착한다.
   ④ 개미집: 큰 방들이 굴로 이어져 있고 방마다 버블이 몇 개씩 있다. 차에 탄 친구를 버블에 옮겨 담으면,
      친구들이 굴을 따라 다른 방에 놀러 갔다가 돌아오거나 이사한다. 🌱 정원으로 → 땅 위로 뿅! 풀이 새로 자라 있다.
   친구들은 이 앱에서 새로 그린 캐릭터다(다른 게임의 캐릭터는 저작권 때문에 쓰지 않는다).
   개미집 버블 자리·차에 탄 친구·만난 친구 수는 아이마다 기억한다(profile.itto).
   화면 위 층(#itLayer)에서 해서 5초 동기화에 깎은 풀이 되살아나지 않는다.
   ============================================================ */
const IT_FRIENDS = [
  { id:'berry',  name:'딸기콩', w:14, note:'딸기밭에서 낮잠 자는 걸 좋아해요' },
  { id:'sprout', name:'새싹이', w:14, note:'머리 위 새싹이 햇볕을 받으면 쑥쑥 자라요' },
  { id:'drop',   name:'방울이', w:14, note:'비 오는 날이면 신나서 통통 튀어요' },
  { id:'acorn',  name:'도토리', w:12, note:'주머니에 작은 도토리를 모아요' },
  { id:'cloud',  name:'솜구름', w:10, note:'폭신폭신, 안으면 구름처럼 가벼워요' },
  { id:'bug',    name:'꼬물이', w:10, note:'천천히 가도 끝까지 가는 친구예요' },
  { id:'star',   name:'반짝이', w:4,  note:'밤하늘에서 떨어진 별이래요. 만나면 행운!', rare:true },
  { id:'moon',   name:'달님이', w:3,  note:'잠꾸러기 달님, 자장가를 좋아해요', rare:true }
];
const IT_SEATS = 5;                        // 정원 친구(3~5명)가 모두 탈 수 있게
const itFriend = id => IT_FRIENDS.find(f => f.id === id) || IT_FRIENDS[0];
const itIGa = w => `${w}${hasJong(w) ? '이' : '가'}`;       // 딸기콩이 · 새싹이가
function itRoll(){ const sum = IT_FRIENDS.reduce((a, f) => a + f.w, 0); let r = Math.random() * sum; for (const f of IT_FRIENDS){ r -= f.w; if (r < 0) return f.id; } return IT_FRIENDS[0].id; }

/* ---------- 친구 그림 (앱 스티커 그림체: 코코아 테두리 · 볼 터치) ---------- */
const itEye = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="4.3" ry="5.3" fill="#3A2A2E"/><circle cx="${x + 1.4}" cy="${y - 1.9}" r="1.6" fill="#fff"/>`;

/* ---------- 소리 (파일 없이) ---------- */
function itNoise(dur, vol){
  const c = audioCtx(); if (!c) return;
  try {
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = b; f.type = 'bandpass'; f.frequency.value = 3400; g.gain.value = vol || 0.03;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  } catch(e){}
}
function itPop(){ ttTone(660, 0, 0.12, 0.1); ttTone(990, 0.07, 0.16, 0.1); ttTone(1320, 0.14, 0.2, 0.08); }
function itHop(){ ttTone(520, 0, 0.1, 0.08); ttTone(780, 0.06, 0.14, 0.08); }
function itNote(){ const f = [523, 587, 659, 784, 880][playRand(5)]; ttTone(f, 0, 0.2, 0.09); ttTone(f * 1.5, 0.1, 0.2, 0.07); }
function itPlop(){
  const c = audioCtx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(980, t + 0.16);
  g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.28);
}
function itDrill(sec){
  const c = audioCtx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = 'sawtooth'; o.frequency.setValueAtTime(58, t); o.frequency.linearRampToValueAtTime(96, t + sec);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.045, t + 0.25);
  g.gain.setValueAtTime(0.045, t + sec - 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + sec + 0.05);
}

/* ---------- ① 정원 ---------- */
function itGarden(first){
  const I = IT; I.scene = 'garden'; I.sel = -1;
  const W = Math.round(Math.min(660, Math.max(280, window.innerWidth - 28))), H = Math.round(W * 0.7);
  const size = Math.round(clamp(W * 0.2, 62, 118));
  const n = 3 + playRand(3), fr = [];
  for (let guard = 0; fr.length < n && guard < 500; guard++){
    const x = size * 0.62 + Math.random() * (W - size * 1.24), y = size * 0.62 + Math.random() * (H - size * 1.24);
    if (fr.some(f => Math.hypot(f.x - x, f.y - y) < size * 1.08)) continue;
    fr.push({ x, y, s:size, type:itRoll(), shown:false, boarded:false });
  }
  I.friends = fr; I.W = W; I.H = H;
  I.el.innerHTML = `${itTop('🌱 이또 · 정원')}
    <div class="ttl-body it-body">
      <div class="it-say" id="itSay">${first ? '풀숲을 손가락으로 좌우로 쓱쓱 문질러 봐요! 누가 숨어 있을까요? 🌿' : '풀이 다시 쑥쑥 자랐어요! 이번엔 누가 숨어 있을까요? 🌿'}</div>
      <div class="it-garden" id="itGarden" style="width:${W}px;height:${H}px">
        <div class="it-lawn"></div>
        ${fr.map((f, i) => `<button class="it-fr" id="itF${i}" data-act="itPick" data-arg="${i}" style="left:${f.x.toFixed(0)}px;top:${f.y.toFixed(0)}px;width:${f.s}px;height:${f.s}px" aria-label="숨은 친구">${itSvg(f.type)}</button>`).join('')}
        <canvas class="it-grass" id="itGrass" aria-label="풀숲 — 손가락으로 문질러 깎아요"></canvas>
        <div class="it-parts" id="itParts"></div>
      </div>
      <div class="it-park"><div class="it-carbox" id="itCar">${itCarSvg(I.car, -1)}</div>
        <div class="stack" style="gap:6px;align-items:center"><button class="btn" data-act="itGo" id="itGo" ${I.car.length ? '' : 'disabled'}>🚗 출발!</button>
          <span class="muted" id="itCount" style="font-size:13px;text-align:center"></span></div></div>
    </div>`;
  const cv = document.getElementById('itGrass'), dpr = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  I.g = cv.getContext('2d'); I.dpr = dpr; I.brush = Math.max(34, W * 0.12) * dpr;
  itDrawGrass(I.g, cv.width, cv.height, dpr);
  itBindGrass(cv);
  itCount();
}
function itDrawGrass(g, W, H, dpr){
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#93DB90'); grd.addColorStop(1, '#69C274');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const cols = ['#58B464', '#7FD37F', '#A6E39F', '#4DA25A', '#8ED88A'];
  const n = Math.round(W * H / (70 * dpr * dpr));
  g.lineCap = 'round';
  for (let i = 0; i < n; i++){
    const x = Math.random() * W, y = Math.random() * (H + 20 * dpr), h = (9 + Math.random() * 15) * dpr, lean = (Math.random() - 0.5) * 9 * dpr;
    g.strokeStyle = cols[i % cols.length]; g.lineWidth = (1.4 + Math.random() * 1.8) * dpr;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.3, y - h * 0.6, x + lean, y - h); g.stroke();
  }
  for (let i = 0; i < Math.round(W * H / (7000 * dpr * dpr)); i++){          // 작은 꽃
    const x = Math.random() * W, y = Math.random() * H, r = (2.2 + Math.random() * 1.6) * dpr;
    g.fillStyle = ['#FFFFFF', '#FFC2CE', '#FFE79C'][i % 3];
    for (let k = 0; k < 5; k++){ const a = k / 5 * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.8, 0, 7); g.fill(); }
    g.fillStyle = '#FFD98E'; g.beginPath(); g.arc(x, y, r * 0.6, 0, 7); g.fill();
  }
}
function itBindGrass(cv){
  let last = null;
  const pos = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * cv.width / r.width, (ev.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', ev => {
    if (!IT || IT.scene !== 'garden') return;
    ev.preventDefault(); last = pos(ev);
    try { cv.setPointerCapture(ev.pointerId); } catch(e){}
    itMow(last, last);
  });
  cv.addEventListener('pointermove', ev => { if (!last || !IT || IT.scene !== 'garden') return; const p = pos(ev); itMow(last, p); last = p; });
  const up = () => { if (last && IT && IT.scene === 'garden') itCheck(); last = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}
function itMow(a, b){
  const I = IT, g = I.g;
  g.save(); g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = I.brush;
  g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0] + 0.01, b[1]); g.stroke(); g.restore();
  const now = performance.now();
  if (now - I.t.snd > 120){ I.t.snd = now; itNoise(0.06, 0.03); }
  if (now - I.t.part > 60){ I.t.part = now; itBits(b[0] / I.dpr, b[1] / I.dpr); }
  if (now - I.t.chk > 150){ I.t.chk = now; itCheck(); }
}
function itBits(x, y){                                     // 깎인 풀잎이 톡톡 튄다
  const box = document.getElementById('itParts'); if (!box || box.childElementCount > 40) return;
  for (let k = 0; k < 3; k++){
    const i = document.createElement('i');
    i.style.left = x + 'px'; i.style.top = y + 'px'; i.style.background = ['#58B464', '#7FD37F', '#A6E39F'][k];
    i.style.setProperty('--dx', ((Math.random() - 0.5) * 90).toFixed(0) + 'px');
    i.style.setProperty('--dy', (-20 - Math.random() * 60).toFixed(0) + 'px');
    i.style.setProperty('--r', (Math.random() * 360).toFixed(0) + 'deg');
    box.appendChild(i); setTimeout(() => i.remove(), 760);
  }
}
/* 친구 둘레의 풀이 반 넘게 깎이면 뿅! */
function itCheck(){
  const I = IT; if (!I || I.scene !== 'garden' || !I.g) return;
  const cw = I.g.canvas.width, ch = I.g.canvas.height;
  I.friends.forEach((f, idx) => {
    if (f.shown) return;
    const d = I.dpr, w = Math.max(4, Math.min(cw, ch, Math.round(f.s * 0.76 * d)));
    const x0 = clamp(Math.round((f.x - f.s * 0.38) * d), 0, cw - w), y0 = clamp(Math.round((f.y - f.s * 0.38) * d), 0, ch - w);
    let px; try { px = I.g.getImageData(x0, y0, w, w).data; } catch(e){ return; }
    let clear = 0, tot = 0;
    for (let yy = 0; yy < w; yy += 5) for (let xx = 0; xx < w; xx += 5){ tot++; if (px[(yy * w + xx) * 4 + 3] < 70) clear++; }
    if (tot && clear / tot >= 0.55) itReveal(idx);
  });
}
function itReveal(i){
  const I = IT, f = I.friends[i]; if (f.shown) return;
  f.shown = true;
  const fr = itFriend(f.type), first = !I.found[f.type];
  I.found[f.type] = (I.found[f.type] || 0) + 1;
  const el = document.getElementById('itF' + i);
  if (el){ el.classList.add('show'); el.setAttribute('aria-label', `${fr.name} — 누르면 차에 타요`); }
  itPop(); itTag(f, fr.name);
  itSay(first ? `✨ 새 친구 발견! ${itIGa(fr.name)} 나타났어요! 📖 도감에 등록됐어요${fr.rare ? ' — 아주 드문 친구예요!' : ''}`
    : `뿅! ${itIGa(fr.name)} 나타났어요! 눌러서 차에 태워 볼까요?`);
  if (first){ awardStars(1); if (fr.rare) confetti(); }
  itCount();
}
function itTag(f, name){
  const box = document.getElementById('itGarden'); if (!box) return;
  const t = document.createElement('span'); t.className = 'it-tag'; t.textContent = `${name}!`;
  t.style.left = f.x.toFixed(0) + 'px'; t.style.top = Math.max(4, f.y - f.s * 0.64).toFixed(0) + 'px';
  box.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function itCount(){
  const I = IT, e = document.getElementById('itCount'); if (!e || !I) return;
  const shown = I.friends.filter(f => f.shown).length;
  e.textContent = `찾은 친구 ${shown}/${I.friends.length} · 차에 탄 친구 ${I.car.length}/${IT_SEATS}`;
  if (shown === I.friends.length && I.friends.every(f => f.boarded || !f.shown) && I.car.length) itSay('모두 찾았어요! 🚗 출발하면 하늘로 슝~ 갔다가 땅속 개미집으로 쏙!');

function bhSetCard(){ const old = document.getElementById('bhCard'); if (old) old.remove(); const st = document.getElementById('bhStage'); if (st && BH.phase !== 'play') st.insertAdjacentHTML('beforeend', bhCard()); }

/* ---------- 놀이 흐름 ---------- */
function bhCountdown(then){

  clearInterval(b.cd);
  b.cd = setInterval(() => {
    if (BH !== b){ clearInterval(b.cd); return; }

    if (n > 0){ if (c) c.textContent = String(n); ttTone(660, 0, 0.12, 0.08); }
    else { clearInterval(b.cd); if (c) c.textContent = '시작!'; ttTone(990, 0, 0.2, 0.1); setTimeout(() => { if (BH === b) then(); }, 350); }
  }, 750);
}
function bhPlay(ms){
  const b = BH, p = bhParams(b.stage);
  b.phase = 'play'; bhSetCard();
  b.endAt = performance.now() + (ms != null ? ms : p.secs * 1000);
  b.nextAt = performance.now() + 450; b.running = true;

function bhLoop(){

  const sec = Math.ceil(left / 1000);
  if (sec !== b.lastSec){ b.lastSec = sec; bhClock(left); if (sec <= 5 && sec > 0) ttTone(880, 0, 0.05, 0.04); }
  b.pops.slice().forEach(o => { if (!o.done && now >= o.until) bhPopHide(o); });
  if (left > 400 && b.pops.filter(o => !o.done).length < p.maxOn && now >= b.nextAt){ bhSpawn(now, p); b.nextAt = now + p.gap * (0.6 + bhR() * 0.8); }

/* 아무 데서나 뿅! — 다른 친구와 겹치지 않고, 방금 나온 자리와도 떨어진 곳 */

    ok = b.pops.every(o => o.done || Math.hypot(o.x - x, o.y - y) > s * 1.05) && (!b.last || Math.hypot(b.last[0] - x, b.last[1] - y) > s * 1.2);

/* 다른 앱으로 가면 멈춘다 — 돌아오면 "계속하기" */
document.addEventListener('visibilitychange', () => {
  const b = BH; if (!b || !document.hidden || b.vs) return;   // 대결 중에는 멈추지 않는다(형제와 시간이 어긋나지 않게)

  else if (b.phase === 'count'){ clearInterval(b.cd); b.pausedLeft = bhParams(b.stage).secs * 1000; b.phase = 'pause'; bhSetCard(); }

/* ============================================================
   🤝 같이 놀기 — 두 아이가 각자 기기에서 같은 놀이로 겨룬다
   현황판: 아이마다 🔓 놀이 허락(부모님 승인) · ✅ 들어왔어요 · 👍 준비됐어요. 둘 다 들어와서 준비되면 3·2·1 같이 시작.
   놀이: 🔍 틀린 그림 찾기(같은 그림 · 다른 곳 5개를 먼저 다 찾으면 이겨요) · 🧸 숨바꼭질 대결(같은 순서로 튀어나와요 · 60초 점수).
   연결은 Supabase Realtime(방송 + 누가 있는지). 방 이름은 가족 ID를 섞은 값이라 우리 가족만 들어온다.
   아이가 자기 공간에 들어오면 조용히 연결해 두고(VSN), 형제가 방에 들어오면 "같이 놀자고 기다려요!" 카드를 띄운다.
   기록은 남기지 않고 별만 준다 — 이기면 2개, 비기거나 져도 1개(같이 논 것만으로도 멋지다). 틀린 그림 찾기는 혼자 연습도 된다.
   ============================================================ */
let VS = null;
const VSN = { ch:null, kid:'', peers:{}, ok:false, invited:{} };
const VS_GAMES = {
  spot:{ ico:'🔍', name:'틀린 그림 찾기', note:'똑같은 두 그림에서 다른 곳 5개! 먼저 다 찾으면 이겨요' },
  bear:{ ico:'🧸', name:'숨바꼭질 대결', note:'똑같은 순서로 곰돌이가 튀어나와요. 60초 동안 누가 더 많이 찾을까? 🐰 토끼는 -1' }
};
const SD_N = 5, SD_SECS = 90;
function vsRand(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/* ---------- 연결 ---------- */
async function vsNetStart(){
  const k = S.kidId && curKid();
  if (!k || !S.sb || window.claude){ vsNetStop(); return; }
  if (VSN.ch && VSN.kid === k.id) return;
  vsNetStop(); VSN.kid = k.id;
  let h = ''; try { h = await famHash(); } catch(e){ h = ''; }
  if (!h || VSN.kid !== k.id || VSN.ch) return;
  const ch = S.sb.channel('dl-vs-' + h.slice(0, 24), { config:{ broadcast:{ self:false }, presence:{ key:k.id } } });
  VSN.ch = ch;
  ch.on('presence', { event:'sync' }, () => vsPeers());
  ch.on('broadcast', { event:'vs' }, p => vsOnMsg((p && p.payload) || {}));
  ch.subscribe(st => {
    if (VSN.ch !== ch) return;
    if (st === 'SUBSCRIBED'){ VSN.ok = true; VSN.where = ''; vsTrack(); vsState(); }
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED'){
      VSN.ok = false; if (VS && VS.phase === 'lobby') vsRender();
      clearTimeout(VSN.retry);                                // 끊기면 잠깐 뒤에 다시 붙는다
      VSN.retry = setTimeout(() => { if (VSN.ch === ch && S.kidId === VSN.kid){ const id = VSN.kid; vsNetStop(); VSN.kid = ''; if (S.kidId === id) vsNetStart(); } }, 2500);
    }
  });
}
function vsNetStop(){ clearTimeout(VSN.trackT); clearTimeout(VSN.retry); if (VSN.ch){ try { S.sb.removeChannel(VSN.ch); } catch(e){} } VSN.ch = null; VSN.kid = ''; VSN.peers = {}; VSN.ok = false; VSN.where = ''; const inv = document.getElementById('vsInvite'); if (inv) inv.remove(); }
function vsWhere(){ return VS && !VS.solo ? (VS.phase === 'count' || VS.phase === 'play' ? 'play' : 'lobby') : 'app'; }
function vsTrack(){
  if (!VSN.ch || !VSN.ok) return;
  const w = vsWhere();
  if (w === VSN.where) return;
  const wait = Math.max(0, (VSN.trackAt || 0) + 3000 - Date.now());
  clearTimeout(VSN.trackT);
  VSN.trackT = setTimeout(() => {
    if (!VSN.ch || !VSN.ok) return;
    const now = vsWhere(); if (now === VSN.where) return;
    VSN.where = now; VSN.trackAt = Date.now();
    try { VSN.ch.track({ kid:VSN.kid, where:now, at:Date.now() }); } catch(e){}
  }, wait);
}
/* 준비됐어요·고른 놀이는 방송으로 (접속 표시는 느리게만 바꾼다) */
function vsState(){ if (!VSN.ch || !VSN.ok) return; vsSend({ t:'st', where:vsWhere(), ready:!!(VS && VS.ready), game:VS ? VS.game : '' }); vsTrack(); }
function vsPeers(){
  const st = VSN.ch ? VSN.ch.presenceState() : {}, out = {};
  let fresh = false;
  Object.keys(st).forEach(key => { const arr = st[key] || [], last = arr[arr.length - 1]; if (!last || !last.kid || last.kid === VSN.kid) return;
    const old = VSN.peers[last.kid]; if (!old) fresh = true;
    out[last.kid] = Object.assign({}, old || {}, { kid:last.kid, where:(old && old.stAt > (last.at || 0)) ? old.where : last.where }); });
  VSN.peers = out;
  if (fresh && Date.now() - (VSN.helloAt || 0) > 1500){ VSN.helloAt = Date.now(); vsState(); }   // 새로 온 형제에게 내 상태를 알려 준다
  vsPeersChanged();
}
function vsPeersChanged(){ if (VS){ if (VS.phase === 'lobby') vsRender(); vsMaybeStart(); vsResendStart(); } else vsInviteCheck(); }
function vsSend(msg){ if (VSN.ch && VSN.ok) try { VSN.ch.send({ type:'broadcast', event:'vs', payload:Object.assign({ from:VSN.kid, at:Date.now() }, msg) }); } catch(e){} }
/* 형제가 방에 들어오면 — 오른쪽 아래에 초대 카드 */
function vsInviteCheck(){
  const inv0 = document.getElementById('vsInvite');
  const peer = Object.values(VSN.peers).find(p => p.where === 'lobby');
  if (!peer || VS || !S.kidId){ if (inv0) inv0.remove(); return; }
  if (VSN.invited[peer.kid] && VSN.invited[peer.kid] > Date.now() - 90000) return;
  const k = kid(peer.kid); if (!k || inv0) return;
  const d = document.createElement('div'); d.id = 'vsInvite'; d.className = 'vs-invite';
  d.innerHTML = `<span style="font-size:32px">🤝</span><div class="grow"><b>${esc(subj(k.name))} 같이 놀자고 기다려요!</b><div class="muted" style="font-size:13px">${esc((VS_GAMES[peer.game] || VS_GAMES.spot).name)}</div></div>
    <button class="btn sm" data-act="vsJoin">들어가기</button><button class="ttl-x" data-act="vsNo" aria-label="닫기" style="width:36px;height:36px">✕</button>`;
  document.body.appendChild(d);
  try { ttChime(); } catch(e){}
}
ACTS.vsJoin = () => { const d = document.getElementById('vsInvite'); if (d) d.remove(); if (S.tab !== 'games'){ S.tab = 'games'; S.view.game = null; render(); } vsOpen(); };
ACTS.vsNo = () => { const p = Object.values(VSN.peers).find(x => x.where === 'lobby'); if (p) VSN.invited[p.kid] = Date.now(); const d = document.getElementById('vsInvite'); if (d) d.remove(); };
/* ---------- 방 ---------- */
function vsOpen(solo){
  if (VS) return;
  const k = curKid(); if (!k) return;
  if (!solo && (!S.sb || window.claude)){ toast('같이 놀기는 인터넷에 연결된 앱에서만 할 수 있어요'); return; }
  nvUnlock(); audioCtx();
  VS = { kidId:k.id, game:'spot', ready:false, phase:'lobby', scores:{}, done:{}, solo:!!solo, el:null };
  const el = document.createElement('div'); el.className = 'ttl vs'; el.id = 'vsLayer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', '같이 놀기');
  document.body.appendChild(el); VS.el = el;
  const inv = document.getElementById('vsInvite'); if (inv) inv.remove();
  if (solo){ vsBegin('spot', Math.floor(Math.random() * 2147483647), Date.now() + 2400, ''); return; }
  vsNetStart(); vsState(); vsRender();
}
function vsClose(msg){
  const v = VS; if (!v) return;
  clearInterval(v.cd); clearInterval(v.tick); clearTimeout(v.waitT);
  if (BH && BH.vs) bearClose();
  if (!v.solo) vsSend({ t:'leave' });
  v.el.remove(); VS = null; vsState(); render(); if (msg) toast(msg);
}
function vsOther(){ const v = VS; return kids().find(k => k.id !== (v ? v.kidId : S.kidId)) || null; }
function vsRender(){
  const v = VS; if (!v) return;
  if (v.phase === 'play' && v.game === 'spot'){ sdRender(); return; }
  if (v.phase === 'play' && v.game === 'bear') return;       // 숨바꼭질 층이 위에 있다
  const top = `<div class="ttl-top"><button class="ttl-x" data-act="vsExit" aria-label="그만하기">✕</button>
    <div class="ttl-dots"><span class="ttl-chip">🤝 같이 놀기</span></div><span style="width:48px"></span></div>`;
  let card = '';
  if (v.phase === 'lobby') card = vsLobbyHtml();
  else if (v.phase === 'count') card = `<div class="tt-card" style="text-align:center"><div class="tt-count" id="vsCount">3</div>
      <p style="margin:0;font-family:var(--display);font-size:22px">${esc((VS_GAMES[v.game] || {}).ico || '')} ${esc((VS_GAMES[v.game] || {}).name || '')} — 준비!</p></div>`;
  else if (v.phase === 'result') card = vsResultHtml();
  v.el.innerHTML = `${top}<div class="ttl-body">${card}</div>`;
}
function vsLobbyHtml(){
  const v = VS, me = v.kidId, other = vsOther();
  const rows = kids().map(k => {
    const un = activeUnlock(k.id), mine = k.id === me, p = mine ? { where:'lobby', ready:v.ready } : VSN.peers[k.id];
    const inRoom = !!(p && p.where === 'lobby'), inApp = !!p, pend = pendingRequests().some(r => r.kidId === k.id);
    return `<div class="vs-row${inRoom ? ' in' : ''}"><span class="avatar" style="background:${kidColor(k).bg};width:44px;height:44px;font-size:26px">${esc(k.avatar || '')}</span>
      <div class="grow"><b style="font-family:var(--display);font-size:20px">${esc(k.name)}${mine ? ' <small class="muted">(나)</small>' : ''}</b>
        <div class="vs-tags"><span class="${un ? 'ok' : 'no'}">${un ? `🔓 놀이 허락 · ${fmtClock((new Date(un.expiresAt).getTime() - Date.now()) / 1000)} 남음` : (pend ? '⏳ 부모님 허락 기다리는 중' : '🔒 아직 허락 전')}</span>
          <span class="${inRoom ? 'ok' : 'no'}">${inRoom ? '✅ 들어왔어요' : (inApp ? '📱 앱에 있어요' : '⏳ 아직 안 들어왔어요')}</span>
          ${inRoom && p.ready ? '<span class="ok">👍 준비됐어요</span>' : ''}</div></div></div>`;
  }).join('');
  const meOk = !!activeUnlock(me), op = other && VSN.peers[other.id], opIn = !!(op && op.where === 'lobby'), opOk = !!(other && activeUnlock(other.id));
  const pend = pendingRequests().some(r => r.kidId === me);
  let note = '';

  else if (!other) note = '같이 놀 친구가 아직 없어요. 부모님 화면에서 친구를 추가해요.';
  else if (!opIn) note = `⏳ ${esc(subj(other.name))} 들어오길 기다려요. ${esc(other.name)}의 기기에서 놀이 → 🤝 같이 놀기를 눌러요!`;
  else if (!opOk) note = `${esc(topic(other.name))} 아직 놀이 허락 전이에요. 부모님께 부탁해 볼까요?`;
  else if (!meOk) note = '나도 놀이 허락을 받아야 같이 할 수 있어요!';
  else if (!(v.ready && op.ready)) note = '둘 다 👍 준비됐어요를 누르면 바로 시작해요!';
  else note = '곧 시작해요! 두근두근 💓';
  return `<div class="tt-card stack">
    <h3 class="sub" style="margin:0;text-align:center">🤝 같이 놀기 현황판</h3>
    <div class="stack" style="gap:8px">${rows}</div>
    <div class="muted" style="text-align:center;font-size:14px">${note}</div>
    <div><div class="muted" style="margin-bottom:6px">무슨 놀이로 겨룰까요?</div>
      <div class="vs-games">${Object.keys(VS_GAMES).map(id => { const g = VS_GAMES[id]; return `<button class="vs-game" data-act="vsPick" data-arg="${id}" aria-pressed="${v.game === id}"><span style="font-size:34px">${g.ico}</span><b>${esc(g.name)}</b><small>${esc(g.note)}</small></button>`; }).join('')}</div></div>
    <div class="tt-foot">
      ${meOk ? `<button class="btn ${v.ready ? 'mint' : ''}" data-act="vsReady" aria-pressed="${v.ready}">${v.ready ? '👍 준비됐어요! (누르면 취소)' : '👍 준비됐어요!'}</button>`
        : (pend ? '<button class="btn ghost" disabled>⏳ 부모님께 알렸어요</button>' : '<button class="btn" data-act="vsAsk">🔔 부모님께 허락 받기</button>')}
      <button class="btn ghost" data-act="vsSolo">🔍 혼자 연습하기</button>
    </div>
    <p class="muted" style="margin:0;font-size:12px;text-align:center">각자 자기 기기에서 들어와요. 이기면 ⭐2, 비기거나 져도 ⭐1 — 같이 논 것만으로도 멋져요!</p>
  </div>`;
}
ACTS.vsExit = () => vsClose();
ACTS.vsOpenBtn = () => vsOpen();
function vsPeerLine(){
  const o = kids().find(k => k.id !== S.kidId); if (!o) return '형제·친구와 같은 놀이로 겨뤄요';
  const p = VSN.peers[o.id], un = activeUnlock(o.id);
  return `${esc(o.name)}: ${p ? (p.where === 'lobby' ? '✅ 같이 놀기 방에 들어왔어요!' : '📱 앱에 있어요') : '⏳ 아직 안 들어왔어요'} · ${un ? '🔓 놀이 허락' : '🔒 허락 전'}`;
}
ACTS.vsPick = (arg) => { const v = VS; if (!v || v.phase !== 'lobby' || !VS_GAMES[arg]) return; v.game = arg; v.ready = false; vsSend({ t:'pick', game:arg }); vsState(); vsRender(); };
ACTS.vsReady = () => { const v = VS; if (!v || v.phase !== 'lobby') return; if (!activeUnlock(v.kidId)) return; v.ready = !v.ready; vsState(); vsRender(); vsMaybeStart(); };
ACTS.vsAsk = async () => { await requestUnlock(); toast('부모님께 알렸어요! 조금만 기다려요 ⏳'); vsRender(); };
ACTS.vsSolo = () => { const was = VS; if (was){ vsClose(); } vsOpen(true); };
function vsMaybeStart(){
  const v = VS; if (!v || v.phase !== 'lobby' || v.solo) return;
  const other = vsOther(); if (!other) return;
  const op = VSN.peers[other.id];
  if (!(v.ready && op && op.where === 'lobby' && op.ready && activeUnlock(v.kidId) && activeUnlock(other.id))) return;
  if (v.kidId > other.id) return;                          // 아이 id가 앞서는 쪽이 시작 신호를 보낸다(둘이 동시에 보내지 않게)
  const seed = Math.floor(Math.random() * 2147483647), at = Date.now() + 3400;
  v.startMsg = { t:'start', game:v.game, seed, startAt:at };
  vsSend(v.startMsg);
  vsBegin(v.game, seed, at, other.id);
}
function vsResendStart(){
  const v = VS; if (!v || !v.startMsg || (v.phase !== 'count' && v.phase !== 'play')) return;
  const op = VSN.peers[v.opp];
  if (op && op.where === 'lobby' && op.ready && Date.now() - (v.resentAt || 0) > 1500 && Date.now() - v.startMsg.startAt < 20000){ v.resentAt = Date.now(); vsSend(v.startMsg); }
}
function vsOnMsg(m){
  if (m.t === 'st' && m.from && m.from !== VSN.kid){
    VSN.peers[m.from] = Object.assign({}, VSN.peers[m.from] || {}, { kid:m.from, where:m.where, ready:!!m.ready, game:m.game || '', stAt:m.at || Date.now() });
    vsPeersChanged(); return;
  }
  const v = VS; if (!v || v.solo) return;
  if (m.t === 'pick' && v.phase === 'lobby' && VS_GAMES[m.game]){ v.game = m.game; v.ready = false; vsState(); vsRender(); }
  else if (m.t === 'start' && v.phase === 'lobby'){ vsBegin(VS_GAMES[m.game] ? m.game : 'spot', m.seed, m.startAt, m.from); }

}
/* 3·2·1 — 시작 시각(startAt)에 맞춰 둘이 같이 */
function vsBegin(game, seed, startAt, opp){

function vsGo(){

function vsScoreUi(){

}
function vsCheckEnd(force){

function vsFinish(){

  let win = '';

  } else win = a > b ? me : (b > a ? op : '');

/* ---------- 🔍 틀린 그림 찾기 — 같은 씨앗(seed)이면 두 기기에 똑같은 그림이 나온다 ---------- */
const SD_THEMES = [
  { name:'정원', sky:'#DDF3FF', ground:'#C8EDC0', line:0.58, items:['🌳', '🌷', '🦋', '🐞', '🍄', '🐝', '🌼', '🐿️', '🌻', '🐦', '🐌', '🍓', '🐸', '🪺', '🌵', '🐇'] },
  { name:'놀이방', sky:'#FFF1E6', ground:'#FFE0E8', line:0.62, items:['🧸', '🪀', '🎲', '🚂', '🧩', '🎈', '🪁', '🚗', '⚽', '🎨', '📚', '🎁', '🦖', '🎸', '🧃', '🤖'] },
  { name:'바닷속', sky:'#D5EEFF', ground:'#A8DDF4', line:0.5, items:['🐠', '🐙', '🦀', '🐚', '🐬', '🪸', '🐡', '⭐', '🦑', '🐢', '⚓', '🐳', '🦐', '🐟', '🦈', '🫧'] }
];
function sdMake(seed){
  const R = vsRand(seed), th = SD_THEMES[Math.floor(R() * SD_THEMES.length)];
  const cols = 5, rows = 4, cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); const t = cells[i]; cells[i] = cells[j]; cells[j] = t; }
  const objs = cells.slice(0, 15).map(([c, r]) => ({ e:th.items[Math.floor(R() * th.items.length)], x:(c + 0.5 + (R() - 0.5) * 0.45) * 400 / cols,
    y:(r + 0.5 + (R() - 0.5) * 0.4) * 300 / rows, s:34 + R() * 16, rot:Math.round((R() - 0.5) * 24), hue:0, flip:false }));
  const right = objs.map(o => Object.assign({}, o));
  const idx = objs.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  const types = ['gone', 'swap', 'big', 'small', 'move', 'hue']; for (let i = types.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); const t = types[i]; types[i] = types[j]; types[j] = t; }
  const diffs = [];
  for (let d = 0; d < SD_N; d++){
    const i = idx[d], o = right[i], type = types[d];
    if (type === 'gone') o.gone = true;
    else if (type === 'swap'){ let e = o.e; while (e === o.e) e = th.items[Math.floor(R() * th.items.length)]; o.e = e; }
    else if (type === 'big') o.s = Math.min(70, o.s * 1.55);
    else if (type === 'small') o.s = o.s * 0.55;
    else if (type === 'move'){ o.x = clamp(o.x + (R() < 0.5 ? -1 : 1) * 34, 22, 378); o.y = clamp(o.y + (R() < 0.5 ? -1 : 1) * 22, 22, 278); }
    else if (type === 'hue') o.hue = 150;
    diffs.push({ i, type, x:(objs[i].x + o.x) / 2, y:(objs[i].y + o.y) / 2, r:Math.max(30, Math.max(objs[i].s, o.s) * 0.75 + (type === 'move' ? 18 : 0)) });
  }
  return { th, objs, right, diffs };
}

/* ---------- 📘 AR 지수 — 영어책 난이도 (Renaissance ATOS) ----------
   아이의 최근 AR(STAR) 점수와 비교해 술술 책 · 딱 맞는 책 · 도전 책으로 보여준다. 모두 칭찬하는 말로. */
function arParse(v){
  const m = String(v || '').replace(',', '.').match(/(\d{1,2}(?:\.\d)?)/);

function arBand(ar, score){

  if (d < -0.5) return { ico:'😊', label:'술술 책', note:'자신 있게 술술 읽는 책' };
  if (d <= 0.7) return { ico:'👍', label:'딱 맞는 책', note:'지금 실력에 딱 맞아요' };
  return { ico:'📈', label:'도전 책', note:'한 걸음 위로 도전하는 멋진 책' };
}
function arShelfCard(kidObj, books){

  const bands = { '술술 책':0, '딱 맞는 책':0, '도전 책':0 };

/* ============================================================
   ✏️ 받아쓰기 — 학교 급수표로 연습한다

   패드에 쓰면 글자·받침·띄어쓰기·문장 부호를 하나씩 봐 주고, 틀린 문장은 🔁 오답 노트로 모인다.
   틀려도 괜찮아 — 다시 쓰면 오래 기억난다. 척척 빠른 아이는 "한 번만 더 읽어 볼까?"로 확인하는 습관을,

const DT_SAMPLE = ['가방을 메고 학교에 가요.', '친구와 같이 놀이터에서 놀았어요.', '꽃밭에 나비가 날아와요.',

const DT_OK = ['딩동댕! 완벽해!', '우와, 받침까지 딱 맞았어!', '띄어쓰기도 완벽해!', '최고야! 받아쓰기 박사!', '또박또박 멋지게 썼어!'];
const DT_TRY = ['괜찮아! 여기만 고치면 돼.', '거의 다 맞았어! 한 군데만 볼까?', '틀려도 괜찮아. 이렇게 배우는 거야!', '좋은 도전이었어! 같이 볼까?'];
const DT_PUNCT = { '.':'마침표(.)', ',':'쉼표(,)', '?':'물음표(?)', '!':'느낌표(!)', '~':'물결표(~)' };
const dtPick = a => a[Math.floor(Math.random() * a.length)];

function dlistsFor(kidId){
  return S.data.dlists.filter(l => !l.archived && Array.isArray(l.lines) && l.lines.length &&
      (!Array.isArray(l.kidIds) || !l.kidIds.length || l.kidIds.includes(kidId)))
    .sort((a, b) => (a.no || 0) - (b.no || 0) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
}
function dprogOf(kidId, listId){ return S.data.dprog.find(p => p.kidId === kidId && p.listId === listId); }
function dWrongIdx(kidId, l){
  const p = dprogOf(kidId, l.id), it = (p && p.items) || {};
  return l.lines.map((_, i) => i).filter(i => it[i] && it[i].last === false);
}
function dDaysTo(date){ return Math.round((new Date(date + 'T12:00:00') - new Date(todayKey() + 'T12:00:00')) / 86400000); }
function dDateLabel(date){ const x = new Date(date + 'T12:00:00'); return `${x.getMonth() + 1}월 ${x.getDate()}일 (${DAYNAMES[x.getDay()]})`; }
function dNextTest(kidId){
  const t = todayKey();
  return dlistsFor(kidId).filter(l => l.testDate && l.testDate >= t).sort((a, b) => a.testDate.localeCompare(b.testDate))[0] || null;
}
function dCurList(kidId){
  const ls = dlistsFor(kidId); if (!ls.length) return null;
  return ls.find(l => l.id === S.view.dtList) || dNextTest(kidId)
    || ls.find(l => { const p = dprogOf(kidId, l.id); return !p || (p.best || 0) < 100; }) || ls[ls.length - 1];
}
function dStars(best){ return best >= 100 ? 3 : (best >= 70 ? 2 : (best > 0 ? 1 : 0)); }
/* 이번 주에 쓴 받아쓰기 문장 수 (배움기록·약속에 쓴다) */
function dWeekCount(kidId, back){
  const s0 = weekStart(); s0.setDate(s0.getDate() - 7 * (back || 0));
  const a = todayKey(s0), e = new Date(s0); e.setDate(e.getDate() + 7); const b = todayKey(e);
  let n = 0, runs = 0;
  for (const p of S.data.dprog.filter(x => x.kidId === kidId))
    for (const [dk, v] of Object.entries(p.days || {})) if (dk >= a && dk < b){ n += v.n || 0; runs += v.runs || 0; }
  for (const r of S.data.spell.filter(x => x.kidId === kidId))
    for (const [dk, v] of Object.entries(r.days || {})) if (dk >= a && dk < b) n += v.n || 0;
  return { n, runs };
}

/* ---------- 채점 — 글자마다 맞춰 보고, 받침·모음·띄어쓰기·문장 부호로 나눠 알려 준다 ---------- */
function dtNorm(s){ return String(s || '').replace(/[\u200b\u00a0]/g, ' ').replace(/\s+/g, ' ').trim(); }
function dtCost(a, b){
  if (a === b) return 0;
  if (a === ' ' || b === ' ') return 1;
  const x = kjSplit(a), y = kjSplit(b);
  if (x && y){ const d = (x[0] !== y[0] ? 1 : 0) + (x[1] !== y[1] ? 1 : 0) + (x[2] !== y[2] ? 1 : 0); return d === 1 ? 0.5 : (d === 2 ? 0.8 : 1); }
  return 1;
}
function dtAlign(E, T){
  const n = E.length, m = T.length, D = [];
  for (let i = 0; i <= n; i++){ D.push(new Array(m + 1).fill(0)); D[i][0] = i; }
  for (let j = 0; j <= m; j++) D[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + dtCost(E[i - 1], T[j - 1]));
  const ops = []; let i = n, j = m;
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  while (i > 0 || j > 0){
    if (i > 0 && j > 0 && near(D[i][j], D[i - 1][j - 1] + dtCost(E[i - 1], T[j - 1]))){ ops.push([E[i - 1] === T[j - 1] ? 'eq' : 'sub', i - 1, j - 1]); i--; j--; }
    else if (i > 0 && near(D[i][j], D[i - 1][j] + 1)){ ops.push(['del', i - 1, -1]); i--; }
    else { ops.push(['ins', -1, j - 1]); j--; }

}
function dtWhy(e, t){
  const x = kjSplit(e), y = kjSplit(t);
  if (!x || !y) return 'char';
  if (x[0] === y[0] && x[1] === y[1]) return 'jong';
  if (x[0] === y[0] && x[2] === y[2]) return 'vowel';
  if (x[1] === y[1] && x[2] === y[2]) return 'cho';
  return 'char';
}
function dtWordAt(E, i){               // i번째 글자가 들어 있는 낱말
  let a = i, b = i;
  while (a > 0 && E[a - 1] !== ' ') a--;
  while (b < E.length - 1 && E[b + 1] !== ' ') b++;
