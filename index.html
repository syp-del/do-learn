/* 가족 ID — 주소(#f=...)에 있으면 그걸 쓰고, 없으면 이 기기에 저장된 걸,
   그것도 없으면 새로 만든다. 주소를 아는 사람만 같은 기록을 본다. */
function resolveFamilyId(){
  const fromUrl = new URLSearchParams(location.hash.slice(1)).get('f')
               || new URLSearchParams(location.search).get('f');
  const re = /^[0-9a-f-]{36}$/i;
  let id = (fromUrl && re.test(fromUrl)) ? fromUrl : null;
  if (!id){ const saved = lsGet('dolearn.family'); if (saved && re.test(saved)) id = saved; }
  if (!id) id = uid();
  lsSet('dolearn.family', id);
  if (location.protocol.startsWith('http') && !fromUrl){
    try { history.replaceState(null, '', `${location.pathname}#f=${id}`); } catch(e){}
  }
  return id;
}
function familyLink(){
  return location.protocol.startsWith('http')
    ? `${location.origin}${location.pathname}#f=${S.familyId}`
    : `(주소는 인터넷에 올린 뒤에 생겨요) #f=${S.familyId}`;
}

/* 내가 쓰는 중이면, 그 사이에 받아 온 옛 기록으로 화면을 되돌리지 않는다
   (5초 동기화가 저장보다 먼저 읽으면, 방금 쓴 답이 몇 초 동안 사라져 보였다) */
const SYNC = { gen:0, busy:0 };
async function syncWrite(fn){ SYNC.gen++; SYNC.busy++; try { return await fn(); } finally { SYNC.busy--; SYNC.gen++; } }
const Store = {
  async add(coll, data, presetId){
    const id = presetId || uid();
    S.data[coll].push({id, ...data});
    render();
    if (S.sb){
      try { await syncWrite(() => S.sb.from('items').insert({ id, family_id:S.familyId, coll, data })); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).set(data); } catch(e){ warnWrite(e); }
    }
    return id;
  },
  async update(coll, id, patch){
    const rec = S.data[coll].find(r=>r.id===id);
    if (rec) Object.assign(rec, patch);
    render();
    if (S.sb){
      const { id:_drop, ...data } = rec || patch;
      try { await syncWrite(() => S.sb.from('items').update({ data, updated_at:new Date().toISOString() }).eq('id', id)); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).update(patch); } catch(e){ warnWrite(e); }
    }
  },
  async remove(coll, id){
    S.data[coll] = S.data[coll].filter(r=>r.id!==id);
    render();
    if (S.sb){
      try { await syncWrite(() => S.sb.from('items').delete().eq('id', id)); } catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).delete(); } catch(e){ warnWrite(e); }
    }
  },
  async saveSettings(patch){
    Object.assign(S.settings, patch);
    render();
    if (S.sb){
      try { await syncWrite(() => S.sb.from('settings')
        .upsert({ family_id:S.familyId, data:S.settings, updated_at:new Date().toISOString() })); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.doc('settings/app').set({...S.settings}); } catch(e){ warnWrite(e); }
    }
  }
};

/* 서버는 한 번에 1000줄까지만 돌려준다. 기록이 쌓여도 빠지지 않도록 1000줄씩 나눠 끝까지 읽는다. */
async function sbAllItems(){
  const all = [];
  for (let from = 0; from < 50000; from += 1000){
    const r = await S.sb.from('items').select('id,coll,data').neq('coll', 'vclip').order('id').range(from, from + 999);   // 🎤 음성은 누를 때만 받는다
    if (r.error) throw r.error;
    const rows = r.data || [];
    all.push(...rows);
    if (rows.length < 1000) break;
  }
  return { data:[...new Map(all.map(r => [r.id, r])).values()] };
}

/* 수파베이스에서 전체를 한 번 읽어 화면 상태를 갈아끼운다.
   실시간 구독 대신 5초 폴링 — 코드가 단순하고 RLS 헤더 방식과도 잘 맞는다. */
async function sbPull(){
  if (!S.sb) return;
  if (SYNC.busy && S.persistent) return;            // 쓰는 중이면 이번 차례는 건너뛴다
  const gen0 = SYNC.gen;
  try {
    const [items, st] = await Promise.all([
      sbAllItems(),
      S.sb.from('settings').select('data').eq('family_id', S.familyId).maybeSingle()
    ]);
    if (S.persistent && (SYNC.busy || SYNC.gen !== gen0)) return;   // 받아 오는 사이에 내가 쓴 게 있으면 이번 결과는 버린다
    // 바뀐 게 없으면 화면을 다시 그리지 않는다.
    // 매번 다시 그리면 입력칸이 새로 만들어져 쓰던 글자가 5초마다 지워진다(첫 화면의 아이 이름 등).
    const rows = (items.data || []).slice().sort((a, b) => a.id < b.id ? -1 : 1);
    const sig = JSON.stringify(rows) + '|' + JSON.stringify((st && st.data && st.data.data) || null);
    const firstLoad = !S.persistent;
    if (sig === S.lastPullSig && !firstLoad) return;
    S.lastPullSig = sig;
    const next = Object.fromEntries(COLLS.map(c=>[c,[]]));
    for (const row of (items.data||[])){
      if (!next[row.coll]) next[row.coll] = [];
      next[row.coll].push({ id:row.id, ...(row.data||{}) });
    }
    S.data = next;
    if (st && st.data && st.data.data){
      S.settings = { ...S.settings, ...st.data.data };
      if (!Array.isArray(S.settings.cats) || !S.settings.cats.length) S.settings.cats = DEFAULT_CATS.slice();
    }
    S.persistent = true;
    render({ keepInputs:true });      // 다른 기기에서 바뀐 걸 반영하되, 쓰던 글자는 지킨다
  } catch(e){ warnWrite(e); }
}
let writeWarned = false;
function warnWrite(e){
  if (writeWarned) return;
  writeWarned = true;
  S.persistent = false;
  console.warn('db write failed', e);
  render();
}

/* ---------- 기능(capability) 연결 ---------- */
async function connect(){
  // 1순위: 수파베이스 (버셀 등 일반 웹에서 연 경우)
  if (!window.claude && window.supabase && location.protocol.startsWith('http')){
    try {
      S.sb = window.supabase.createClient(SB_URL, SB_KEY, {
        auth: { persistSession:false },
        global: { headers: { 'x-family-id': S.familyId } }
      });
      await sbPull();
      S.capsResolved = true;
      setInterval(() => { if (document.visibilityState === 'visible') sbPull(); }, 5000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') sbPull();
      });
      render();
      return;
    } catch(e){ S.sb = null; console.warn('supabase 연결 실패', e); }
  }

  // 2순위: claude.ai Artifact 기능
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ S.capsResolved = true; render(); return; }
  const grab = async n => { try { return await c.use(n); } catch(e){ return null; } };
  const [db, sample, assets, downloads] = await Promise.all(
    ['db','sample','assets','downloads'].map(grab)
  );
  S.sample = sample; S.assets = assets; S.downloads = downloads;
  S.capsResolved = true;

  if (db){
    S.db = db; S.persistent = true;
    for (const coll of COLLS){
      try {
        db.collection(coll).onSnapshot(snap => {
          S.data[coll] = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
          render({ keepInputs:true });
        }, err => { console.warn('snapshot', coll, err); });
      } catch(e){ console.warn('subscribe failed', coll, e); }
    }
    try {
      db.doc('settings/app').onSnapshot(snap => {
        if (snap.exists){
          const d = snap.data()||{};
          S.settings = {...S.settings, ...d};
          if (!Array.isArray(S.settings.cats) || !S.settings.cats.length) S.settings.cats = DEFAULT_CATS.slice();
        }
        render({ keepInputs:true });
      });
    } catch(e){}
  }
  render();
}

/* 한 주의 기록 — back 0 이번 주, 1 지난주. 노력은 공부한 시간(분) + 뚜뚜에게 말해 본 횟수, 착한 일은 받은 칭찬 스티커 */
function weekStatsAt(kidId, back){
  const s0 = weekStart(); s0.setDate(s0.getDate() - 7 * (back || 0));
  const start = s0.getTime(), end = start + 7 * 86400000, inWeek = t => t >= start && t < end;
  const books = S.data.books.filter(b => b.kidId === kidId && bookRead(b) && inWeek(new Date(b.readAt || 0).getTime())).length;
  const words = S.data.words.filter(w => w.kidId === kidId && inWeek(new Date(w.createdAt || 0).getTime())).length;
  let sched = 0, done = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(s0); d.setDate(d.getDate() + i);
    if (d > new Date()) break;
    const key = todayKey(d), list = todosFor(kidId, d);
    sched += list.length;
    done += list.filter(t => { const s = sessionOf(kidId, t.id, key); return s && s.done; }).length;
  }
  const secs = S.data.sessions.filter(x => x.kidId === kidId && inWeek(new Date(x.date + 'T12:00:00').getTime()))
    .reduce((n, x) => n + (x.durationSec || 0), 0);
  let speech = 0;
  for (const p of S.data.speech.filter(x => x.kidId === kidId))
    for (const [dk, v] of Object.entries(p.days || {})) if (inWeek(new Date(dk + 'T12:00:00').getTime())) speech += (v.rec || 0);
  const kind = S.data.kudos.filter(x => x.to === kidId && inWeek(new Date(x.at || 0).getTime())).length;
  const mins = Math.round(secs / 60);
  const dict = dWeekCount(kidId, back).n;                                       // 받아쓰기 문장 + 철자 단어
  const mineThink = S.data.think.filter(x => x.kidId === kidId);
  const think = mineThink.filter(x => inWeek(new Date(x.at || 0).getTime())).length;   // 질문·돌아보기·궁금해·미션·일기
  const q = mineThink.filter(x => x.type === 'q' && inWeek(new Date(x.date + 'T12:00:00').getTime())).length;
  const world = wWeekCount(kidId, back);
  const kudoSent = S.data.kudos.filter(x => x.from === kidId && inWeek(new Date(x.at || 0).getTime())).length;
  const estHits = S.data.sessions.filter(x => x.kidId === kidId && x.estHit && inWeek(new Date(x.date + 'T12:00:00').getTime())).length;
  return { books, words, done, sched, rate: sched ? Math.round(done / sched * 100) : 0, speech, mins, effort: mins + speech + dict, kind,
    dict, think, q, world, kudoSent, estHits };
}
function weekStats(kidId){ return weekStatsAt(kidId, 0); }

/* ============================================================
   렌더 진입점
   ============================================================ */
let renderQueued = false, renderKeep = true;
/* opts.keepInputs — 다른 기기에서 온 변경으로 다시 그릴 때, 화면의 입력칸에 쓰던 글자와 커서를 지킨다.
   사용자가 직접 한 동작(저장 뒤 칸 비우기 등)으로 그릴 때는 지키지 않는다. */
function render(opts){
  const keep = !!(opts && opts.keepInputs);
  if (renderQueued){ renderKeep = renderKeep && keep; return; }
  renderQueued = true; renderKeep = keep;
  // 숨겨진 탭(뒤에서 열린 알림 링크 등)에서는 requestAnimationFrame이 멈추므로 setTimeout으로 그린다
  const schedule = document.hidden ? (fn => setTimeout(fn, 0)) : requestAnimationFrame;
  schedule(() => {
    renderQueued = false;
    const root = $('#screen');
    const snap = renderKeep ? snapshotInputs(root) : null;
    draw();
    if (snap) restoreInputs(root, snap);
  });
}
function snapshotInputs(root){
  const vals = {};
  root.querySelectorAll('input[id], textarea[id]').forEach(el => {
    if (el.type !== 'file' && el.type !== 'checkbox') vals[el.id] = el.value;
  });
  const a = document.activeElement;
  const focus = (a && root.contains(a) && a.id)
    ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null;
  return { vals, focus };
}
function restoreInputs(root, snap){
  for (const id in snap.vals){
    const el = document.getElementById(id);
    if (el && root.contains(el) && el.value !== snap.vals[id]) el.value = snap.vals[id];
  }
  if (snap.focus){
    const el = document.getElementById(snap.focus.id);
    if (el && root.contains(el)){
      el.focus({ preventScroll:true });
      try { el.setSelectionRange(snap.focus.s, snap.focus.e); } catch(e){}
    }
  }
}

/* ============================================================

   비밀번호를 누르면 누구인지 알아본다(S.parentId). 비밀번호는 서로 겹치지 않게 만든다.

const PARENT_AVATARS = ['👨', '👩', '👵', '👴', '🧑', '🧔', '👱'];
function ownerNick(){ return String(S.settings.ownerNick || '').trim().slice(0, 10) || '뚜뚜아빠'; }
function parentList(){

function isParentId(id){ return id === 'parent' || /^p:/.test(String(id || '')); }

/* ~로/~으로 — 받침이 없거나 ㄹ 받침이면 '로' */

/* ---------- 💌 쪽지·칭찬 스티커 알림 — 화면 오른쪽에 살짝 떠오른다 ----------
   부모님이 쪽지를 붙이거나(settings.parentNote), 형제·부모님이 칭찬 스티커를 보내면(kudos) 받는 아이 화면 오른쪽에 카드가 뜬다.
   "고마워요!"를 누르면 본 걸로 기억한다(profile.noti = { since, seen[], noteAt }) — 다른 기기에서도 다시 뜨지 않는다.
   처음 쓰는 날에는 지난 하루 것만 보여 준다(예전 칭찬이 한꺼번에 쏟아지지 않게).
   놀이·수업 층이나 창이 열려 있으면 기다렸다가 닫힌 뒤에 띄운다. 카드는 창·놀이 층보다 아래(z 58)에 있다. */
const NOTI = { kid:'', rung:new Set() };
function notiState(k){
  const n = (k && k.noti) || {};
  return { since:n.since || new Date(Date.now() - 86400000).toISOString(), seen:Array.isArray(n.seen) ? n.seen.slice() : [], noteAt:n.noteAt || '', chatAt:n.chatAt || '' };
}
function notiPending(k){
  if (!k) return [];
  const st = notiState(k), out = [], note = S.settings.parentNote;
  if (note && String(note.text || '').trim() && note.at && note.at > st.noteAt && note.at > st.since)
    out.push({ key:'note:' + note.at, kind:'note', text:String(note.text) });
  const mine = new Set(chatRooms(k.id).filter(r => r.members.indexOf(k.id) >= 0).map(r => r.id));
  chatAll().filter(x => mine.has(x.room) && x.from !== k.id && x.at > chatSeenAt(k.id, x.room) && x.at > st.since && st.seen.indexOf(x.id) < 0 && (x.kind !== 'kudo' || x.to === k.id))
    .forEach(x => out.push({ key:x.id, kind:x.kind === 'kudo' ? 'kudo' : 'msg', text:x.text || '💖 칭찬 스티커', from:x.from, room:x.room, clip:x.clip || '' }));
  return out;
}
function notiWho(x){ return chatWho(x.from).name; }
function notiCard(x, more){
  const note = x.kind === 'note', msg = x.kind === 'msg';
  const ico = note ? '💌' : (msg ? '💬' : ((String(x.text).match(/^\S+/) || ['💖'])[0]));
  const rm = x.room && x.room !== 'family' ? chatRoom(x.room) : null;
  const title = note ? '엄마 아빠가 쪽지를 남겼어요' : (msg ? `${subj(notiWho(x))} 말했어요${rm ? ` · ${rm.emoji} ${rm.name}` : ''}` : (isParentId(x.from) ? `${subj(notiWho(x))} 칭찬 스티커를 붙여 줬어요!` : `${subj(notiWho(x))} 칭찬 스티커를 보냈어요!`));
  const body = note || msg ? `“${x.text}”` : String(x.text).replace(/^\S+\s/, '');
  return `<div class="noti-card ${note ? 'note' : 'kudo'}" data-key="${esc(x.key)}" role="status">
    <div class="noti-ico" aria-hidden="true">${esc(ico)}</div>
    <div class="noti-main"><div class="noti-t">${esc(title)}</div><div class="noti-b">${esc(body)}</div>
      ${more ? `<div class="noti-more">그리고 ${more}개 더 있어요 💕</div>` : ''}
      <div class="noti-btns"><button class="btn ghost sm" data-act="notiSay" data-arg="${esc(x.key)}" aria-label="읽어 주기">🔊</button>
        <button class="btn ghost sm" data-act="notiChat" data-arg="${esc(x.key)}">💬 답장</button>
        <button class="btn sm" data-act="notiOk" data-arg="${esc(x.key)}">${note || msg ? '읽었어요 💕' : '고마워요 💕'}</button></div></div>
  </div>`;
}
function notiBox(){
  let b = document.getElementById('notiBox');
  if (!b){ b = document.createElement('div'); b.id = 'notiBox'; b.className = 'noti-box'; b.setAttribute('aria-live', 'polite'); document.body.appendChild(b); }
  return b;
}
function notiCheck(){
  const box = notiBox(), k = S.kidId && curKid();
  if (!k){ box.innerHTML = ''; NOTI.kid = ''; return; }
  if (NOTI.kid !== k.id){ box.innerHTML = ''; NOTI.kid = k.id; }
  const items = notiPending(k), show = items.slice(0, window.innerWidth < 600 ? 1 : 2), keys = new Set(show.map(x => x.key));   // 폰은 하나씩, 아이패드는 둘까지
  box.querySelectorAll('.noti-card').forEach(el => { if (!keys.has(el.dataset.key) && !el.classList.contains('out')) el.remove(); });
  if (CHAT.open){ box.innerHTML = ''; return; }            // 대화방이 열려 있으면 거기서 다 보인다
  if (document.querySelector('.ttl') || document.querySelector('#modalRoot .sheet') || document.querySelector('.cheer-pop')) return;
  let fresh = 0;
  show.forEach((x, i) => {
    const more = i === show.length - 1 ? items.length - show.length : 0;
    const old = Array.prototype.find.call(box.querySelectorAll('.noti-card'), el => el.dataset.key === x.key);
    if (old){ const m = old.querySelector('.noti-more'); if ((m ? 1 : 0) !== (more ? 1 : 0) || (m && more && m.textContent.indexOf(String(more)) < 0)) old.outerHTML = notiCard(x, more); return; }
    box.insertAdjacentHTML('beforeend', notiCard(x, more));
    if (!NOTI.rung.has(x.key)){ NOTI.rung.add(x.key); fresh++; }
  });
  if (fresh) try { ttChime(); } catch(e){}
}
function notiFind(key){ const k = curKid(); return k ? notiPending(k).find(x => x.key === key) : null; }
ACTS.notiSay = (arg) => {
  const x = notiFind(arg); if (!x) return;

ACTS.notiChat = async (arg, btn) => { const x = notiFind(arg); await ACTS.notiOk(arg, btn); chatOpen((x && x.room) || 'family'); };
ACTS.notiOk = async (arg, btn) => {

  const x = notiFind(arg), st = notiState(k);

  else if (st.seen.indexOf(arg) < 0) st.seen = st.seen.concat(arg).slice(-80);
  const el = btn && btn.closest('.noti-card');
  if (el){ el.classList.add('out'); setTimeout(() => { el.remove(); notiCheck(); }, 380); }
  if (x && x.kind === 'kudo') toast(isParentId(x.from) ? `${notiWho(x)}의 칭찬, 마음에 쏙! 💕` : `${notiWho(x)}의 고마운 마음, 잘 받았어요 💕`);
  await Store.update('profiles', k.id, { noti:st });
};

/* ============================================================
   💬 대화방 — 오른쪽 위 💬 단추 → 오른쪽에서 열린다. 누구를 초대하느냐에 따라 단체방을 여러 개 만든다.
   👪 우리 가족방(모두)은 늘 있다. ➕ 새 방: 초대할 사람(아이들·엄마 아빠)을 고르고 이름·그림을 정한다 — 컬렉션 chatrooms {name, emoji, members[], createdBy, at}.
   글은 chat {room, from:아이 id | 'parent', text, at}, 칭찬 스티커는 kudos {from, to, reason, room, at}(배움기록·왕관이 센다). room 이 없으면 가족방.
   아이는 들어와 있는 아이로만 쓴다. 엄마 아빠로 쓰려면 부모님 비밀번호(대화방을 닫으면 끝). 안전을 위해 엄마 아빠는 모든 방을 볼 수 있다.
   안 읽은 수는 방마다(아이 profile.noti.chatSeen, 부모님은 이 기기 localStorage), 💬 빨간 숫자는 내 방을 모두 더한 것.
   부모님의 예전 쪽지(settings.parentNote)는 가족방 맨 위에 📌. 5초 동기화 때는 보고 있는 목록만 다시 그려서 쓰던 글은 그대로 남는다.
   ============================================================ */
const CHAT = { open:false, as:'', tray:false, to:'', sig:'', room:'family', view:'room', pick:[], emoji:'🌈' };
const CHAT_EMOJI = ['🌈', '🐰', '🐻', '🍓', '⭐', '🎈', '🚀', '🌻'];
function chatMe(){ if (isParentId(CHAT.as)) return CHAT.as; return S.kidId && curKid() ? S.kidId : ''; }
function chatWho(id){
  if (isParentId(id)){ const p = parentById(id); return p ? { name:p.nick, avatar:p.avatar, bg:'#FFF1D0' } : { name:'부모님', avatar:'🧑', bg:'#FFF1D0' }; }
  const k = kid(id); return k ? { name:k.name, avatar:k.avatar || '🐰', bg:kidColor(k).bg } : { name:'친구', avatar:'🙂', bg:'#EEE' };
}
function chatFamily(){ return { id:'family', name:'우리 가족', emoji:'👪', members:kids().map(k => k.id).concat(parentList().map(p => 'p:' + p.id)), fixed:true }; }
/* 방에 있는 사람 — 예전 'parent'는 부모님 모두 */
function chatMembers(r){ const out = []; (r.members || []).forEach(id => { if (id === 'parent') parentList().forEach(p => out.push('p:' + p.id)); else out.push(id); }); return Array.from(new Set(out)); }
/* 내가 볼 수 있는 방 — 아이는 초대받은 방만, 엄마 아빠는 모두 */
function chatRooms(me){
  const list = S.data.chatrooms.filter(r => Array.isArray(r.members) && (isParentId(me) || chatMembers(r).indexOf(me) >= 0))
    .map(r => ({ id:r.id, name:r.name || '우리 방', emoji:r.emoji || '💬', members:chatMembers(r), createdBy:r.createdBy, at:r.at }));
  return [chatFamily()].concat(list.sort((a, b) => String(chatLastAt(b.id) || b.at || '').localeCompare(String(chatLastAt(a.id) || a.at || ''))));
}
function chatRoom(id){ if (id === 'family' || !id) return chatFamily(); const r = S.data.chatrooms.find(x => x.id === id); return r ? { id:r.id, name:r.name || '우리 방', emoji:r.emoji || '💬', members:chatMembers(r), createdBy:r.createdBy } : null; }
function chatInRoom(me, room){ return !!room && room.members.indexOf(me) >= 0; }          // 말할 수 있는 사람 — 방에 있는 사람
function chatCanSee(me, room){ return !!room && (isParentId(me) || room.members.indexOf(me) >= 0); }   // 볼 수 있는 사람 — 부모님은 모든 방
function chatAll(){
  const a = S.data.chat.map(x => ({ id:x.id, kind:x.kind === 'voice' ? 'voice' : 'msg', room:x.room || 'family', from:x.from, text:x.kind === 'voice' ? '🎤 음성 메시지' : String(x.text || ''), clip:x.clip || '', secs:x.secs || 0, at:String(x.at || '') }));
  const b = S.data.kudos.map(x => ({ id:x.id, kind:'kudo', room:x.room || 'family', from:x.from, to:x.to, text:String(x.reason || ''), at:String(x.at || '') }));
  return a.concat(b).filter(x => x.at).sort((p, q) => p.at.localeCompare(q.at));
}
function chatItems(roomId){ const id = roomId || 'family'; return chatAll().filter(x => x.room === id).slice(-200); }
function chatLastAt(roomId){ const it = chatItems(roomId); return it.length ? it[it.length - 1].at : ''; }
function chatSeenMap(me){
  if (isParentId(me)){ try { return JSON.parse(lsGet('dolearn.chatSeen.' + me) || '{}') || {}; } catch(e){ return {}; } }
  const k = kid(me), n = (k && k.noti) || {};
  const m = Object.assign({}, n.chatSeen || {});
  if (!m.family && n.chatAt) m.family = n.chatAt;                         // 예전(방이 하나일 때) 기록
  return m;
}
function chatSeenAt(me, roomId){ const m = chatSeenMap(me); return m[roomId] || (isParentId(me) ? '' : notiState(kid(me)).since); }
/* 방마다 나에게 온 새 글 — 남이 쓴 글, 나에게 온 칭찬 스티커(엄마 아빠는 방 안의 모든 칭찬) */
function chatUnreadIn(me, roomId){
  const seen = chatSeenAt(me, roomId);
  return chatItems(roomId).filter(x => x.at > seen && x.from !== me && (x.kind !== 'kudo' || x.to === me || isParentId(me)));
}
function chatUnread(me){
  if (!me) return [];
  return chatRooms(me).filter(r => r.members.indexOf(me) >= 0).reduce((acc, r) => acc.concat(chatUnreadIn(me, r.id)), []);
}
function chatBadge(){
  const b = document.getElementById('chatBtn'); if (!b) return;
  b.hidden = !S.data.profiles.length;
  const n = CHAT.open ? 0 : chatUnread(chatMe()).length, el = document.getElementById('chatBadge');
  if (el){ el.hidden = !n; el.textContent = n > 9 ? '9+' : String(n); }
}
async function chatMarkRead(){
  const me = chatMe(); if (!me || CHAT.view !== 'room') return;
  const room = CHAT.room, last = chatLastAt(room), note = S.settings.parentNote;
  if (isParentId(me)){ const m = chatSeenMap(me); if (last && (m[room] || '') < last){ m[room] = last; lsSet('dolearn.chatSeen.' + me, JSON.stringify(m)); } chatBadge(); return; }
  const k = kid(me); if (!k) return;
  const st = notiState(k), m = chatSeenMap(me);
  const noteNew = room === 'family' && note && note.at && note.at > (st.noteAt || '');   // 📌 쪽지도 가족방 맨 위에서 봤다
  if ((!last || (m[room] || '') >= last) && !noteNew) return;
  if (last && (m[room] || '') < last) m[room] = last;
  st.chatSeen = m; if (m.family) st.chatAt = m.family;
  if (noteNew) st.noteAt = note.at;
  await Store.update('profiles', k.id, { noti:st });
}
function chatDay(at){ const d = new Date(at); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYNAMES[d.getDay()]}요일`; }
function chatTime(at){ const d = new Date(at), h = d.getHours(); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`; }
function chatAvatars(members){ return members.map(id => { const w = chatWho(id); return `<span class="cb-av sm" style="background:${w.bg}" title="${esc(w.name)}">${esc(w.avatar)}</span>`; }).join(''); }
/* ---------- 방 목록 ---------- */
function chatRoomsHtml(){
  const me = chatMe();
  const rows = chatRooms(me).map(r => {
    const it = chatItems(r.id), last = it[it.length - 1], n = me && r.members.indexOf(me) >= 0 ? chatUnreadIn(me, r.id).length : 0;
    const prev = last ? (last.kind === 'kudo' ? `🎁 ${chatWho(last.from).name} → ${chatWho(last.to).name} 칭찬 스티커` : `${chatWho(last.from).name}: ${last.kind === 'voice' ? `🎤 음성 메시지 (${vcTime(last.secs)})` : last.text}`) : '아직 아무 말도 없어요';
    return `<button class="chat-room" data-act="chatGo" data-arg="${esc(r.id)}"><span class="chat-room-ico">${esc(r.emoji)}</span>
      <div class="grow" style="min-width:0"><div class="row" style="gap:6px"><b>${esc(r.name)}</b><span class="chat-room-av">${chatAvatars(r.members)}</span></div>
        <div class="chat-room-last">${esc(prev)}</div></div>
      <div class="chat-room-side">${last ? `<small>${chatTime(last.at)}</small>` : ''}${n ? `<span class="chat-badge in">${n > 9 ? '9+' : n}</span>` : ''}</div></button>`;
  }).join('');
  return `<div class="chat-rooms">${rows}
    ${me ? '<button class="btn ghost wide" data-act="chatNew" style="margin-top:6px">➕ 새 방 만들기</button>' : ''}
    ${isParentId(me) ? '<p class="muted" style="font-size:12px;text-align:center;margin:6px 0 0">👀 부모님은 모든 방을 볼 수 있어요</p>' : ''}</div>`;
}
/* ---------- 새 방 만들기 — 초대할 사람 고르기 ---------- */
function chatNewHtml(){
  const me = chatMe(), all = kids().map(k => k.id).concat(parentList().map(p => 'p:' + p.id));
  const picked = new Set(CHAT.pick.concat(me));
  const auto = Array.from(picked).map(id => chatWho(id).name).join('·');
  return `<div class="chat-new">
    <h3 class="sub" style="margin:0 0 6px">➕ 새 방 만들기</h3>
    <div class="muted" style="font-size:14px;margin-bottom:6px">누구를 초대할까요?</div>
    <div class="chips">${all.map(id => { const w = chatWho(id), mine = id === me;
      return `<button class="chip" data-act="chatPick" data-arg="${esc(id)}" aria-pressed="${picked.has(id)}" ${mine ? 'disabled' : ''}>${esc(w.avatar)} ${esc(w.name)}${mine ? ' (나)' : ''}</button>`; }).join('')}</div>
    <div class="muted" style="font-size:14px;margin:10px 0 4px">방 이름</div>
    <input class="field" id="chatRoomName" maxlength="16" placeholder="${esc(auto)}" autocomplete="off">
    <div class="muted" style="font-size:14px;margin:10px 0 4px">방 그림</div>
    <div class="chips">${CHAT_EMOJI.map(e => `<button class="chip" data-act="chatEmoji" data-arg="${e}" aria-pressed="${CHAT.emoji === e}" style="font-size:20px">${e}</button>`).join('')}</div>
    ${!isParentId(me) ? '<p class="muted" style="font-size:12px;margin:8px 0 0">👀 부모님은 모든 방을 볼 수 있어요</p>' : ''}
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn ghost grow" data-act="chatList">그만두기</button><button class="btn grow" data-act="chatCreate" ${picked.size >= 2 ? '' : 'disabled'}>방 만들기</button></div>
  </div>`;
}
function chatListHtml(){
  const me = chatMe(), room = CHAT.room, items = chatItems(room), note = S.settings.parentNote;
  let day = '', out = '';
  if (room === 'family' && note && String(note.text || '').trim()) out += `<div class="chat-pin">📌 <b>엄마 아빠의 쪽지</b> ${esc(note.text)}</div>`;
  if (!items.length) out += `<div class="chat-empty">💬 아직 아무 말도 없어요.<br>“안녕!” 하고 먼저 말을 걸어 볼까요? 칭찬 스티커 🎁도 보낼 수 있어요.</div>`;
  for (const x of items){
    const d = chatDay(x.at); if (d !== day){ day = d; out += `<div class="chat-date">${esc(d)}</div>`; }
    const w = chatWho(x.from), mine = x.from === me;
    if (x.kind === 'kudo'){
      const to = chatWho(x.to), ico = (x.text.match(/^\S+/) || ['💖'])[0], body = x.text.replace(/^\S+\s/, '');
      out += `<div class="cb kudo${mine ? ' me' : ''}"><span class="cb-av" style="background:${w.bg}">${esc(w.avatar)}</span>
        <div class="cb-body"><div class="cb-name">${esc(w.name)} → ${esc(to.name)} · ${chatTime(x.at)}</div>
          <div class="cb-sticker"><span class="cb-ico">${esc(ico)}</span><div><b>칭찬 스티커</b><div>${esc(body)}</div></div></div></div></div>`;
    } else if (x.kind === 'voice'){
      out += `<div class="cb${mine ? ' me' : ''}"><span class="cb-av" style="background:${w.bg}">${esc(w.avatar)}</span>
        <div class="cb-body"><div class="cb-name">${esc(w.name)} · ${chatTime(x.at)}</div>
          <button class="cb-voice${VC.playing === x.clip ? ' on' : ''}" data-act="chatPlay" data-arg="${esc(x.clip)}" aria-label="음성 메시지 듣기"><span class="vc-i">${VC.playing === x.clip ? '⏸' : '▶'}</span><span class="vc-wave">${'<i></i>'.repeat(Math.min(14, 4 + Math.round((x.secs || 1) / 2)))}</span><small>🎤 ${vcTime(x.secs)}</small></button></div></div>`;
    } else {
      out += `<div class="cb${mine ? ' me' : ''}"><span class="cb-av" style="background:${w.bg}">${esc(w.avatar)}</span>
        <div class="cb-body"><div class="cb-name">${esc(w.name)} · ${chatTime(x.at)}</div><div class="cb-text">${esc(x.text)}</div></div></div>`;
    }
  }
  return out;
}
/* 칭찬 스티커 — 이 방에 있는 다른 아이에게 (아이끼리는 하루 3번까지) */
function chatKudoTargets(){ const me = chatMe(), r = chatRoom(CHAT.room); return r && chatInRoom(me, r) ? r.members.filter(id => id !== me && !isParentId(id) && kid(id)) : []; }
function chatReasons(me){ return isParentId(me) ? KUDOS.concat(['😇 착한 일을 했어요', '🌟 끝까지 해냈어요']) : KUDOS; }
function chatTrayHtml(){
  const me = chatMe(); if (!me) return '';
  const others = chatKudoTargets();
  if (!others.length) return '<div class="chat-tray"><p class="muted" style="margin:0">이 방에는 칭찬 스티커를 보낼 친구가 없어요.</p></div>';
  if (others.indexOf(CHAT.to) < 0) CHAT.to = others[0];
  const left = isParentId(me) ? 99 : 3 - kudosToday(me);
  return `<div class="chat-tray">
    ${others.length > 1 ? `<div class="chips" style="margin-bottom:6px">${others.map(id => `<button class="chip" data-act="chatTo" data-arg="${id}" aria-pressed="${CHAT.to === id}">${esc(chatWho(id).avatar)} ${esc(chatWho(id).name)}</button>`).join('')}</div>`
      : `<div class="muted" style="font-size:13px;margin-bottom:6px">🎁 ${esc(chatWho(CHAT.to).name)}에게 칭찬 스티커 보내기${isParentId(me) ? '' : ` (오늘 ${Math.max(0, left)}번 남았어요)`}</div>`}
    ${left > 0 ? `<div class="chat-stickers">${chatReasons(me).map((r, i) => `<button class="chat-st" data-act="chatKudo" data-arg="${i}">${esc(r)}</button>`).join('')}</div>`
      : '<p class="muted" style="margin:0;font-size:13px">오늘은 칭찬 스티커를 다 보냈어요. 내일 또 보내요! 글로 고마운 마음을 전해도 좋아요 💕</p>'}
  </div>`;
}
function chatComposeHtml(){
  const me = chatMe();
  if (!me) return `<div class="chat-who"><div class="muted" style="font-size:14px;margin-bottom:6px">누구로 말할까요?</div>
    <div class="chips" style="justify-content:center">${kids().map(k => `<button class="chip" data-act="chatAsKid" data-arg="${k.id}">${esc(k.avatar || '')} ${esc(k.name)}</button>`).join('')}
      <button class="chip" data-act="chatAsParent">👪 부모님 (비밀번호)</button></div></div>`;
  if (CHAT.view !== 'room') return '';
  const room = chatRoom(CHAT.room);
  if (!chatInRoom(me, room)) return '<p class="muted" style="text-align:center;margin:0">이 방의 친구만 말할 수 있어요</p>';
  if (CHAT.rec) return `<div class="chat-rec"><span class="chat-rec-dot"></span><b id="chatRecT">${CHAT.rec.starting ? '3…' : vcTime((Date.now() - CHAT.rec.t0) / 1000)}</b><span class="muted" style="font-size:13px">/ 0:30</span>
      <div class="tt-level grow" id="chatRecLv"><span></span></div>
      <button class="btn ghost sm" data-act="chatVoiceCancel">✕ 그만</button><button class="btn sm" data-act="chatVoiceSend">⏹ 보내기</button></div>`;
  return `${CHAT.tray ? chatTrayHtml() : ''}
    <div class="chat-compose">
      ${micSupported() ? '<button class="btn ghost sm" data-act="chatVoice" aria-label="목소리로 보내기">🎤</button>' : ''}
      ${chatKudoTargets().length ? `<button class="btn ghost sm chat-gift" data-act="chatTray" aria-pressed="${CHAT.tray}" aria-label="칭찬 스티커">🎁</button>` : ''}
      <input class="field grow" id="chatIn" maxlength="200" placeholder="${isParentId(me) ? '아이들에게 한마디 (쪽지)' : '하고 싶은 말'}" enterkeyhint="send" autocomplete="off">
      <button class="btn sm" data-act="chatSend">보내기</button>
    </div>`;
}
function chatHeadHtml(){
  const me = chatMe(), who = me ? chatWho(me) : null, r = chatRoom(CHAT.room);
  if (CHAT.view === 'room' && r){
    const canDel = !r.fixed && (isParentId(me) || r.createdBy === me), canLeave = !r.fixed && me && !isParentId(me) && r.members.indexOf(me) >= 0;
    return `<button class="ttl-x" data-act="chatList" aria-label="방 목록">◀</button>
      <b class="chat-title">${esc(r.emoji)} ${esc(r.name)}</b><span class="chat-room-av">${chatAvatars(r.members)}</span>
      ${canDel ? '<button class="btn ghost sm" data-act="chatDel" aria-label="방 지우기">🗑</button>' : (canLeave ? '<button class="btn ghost sm" data-act="chatLeave">나가기</button>' : '')}
      <button class="ttl-x" data-act="chatClose" aria-label="대화방 닫기">✕</button>`;
  }
  return `<b class="chat-title">💬 대화방</b>${who ? `<span class="chat-me"><span class="cb-av sm" style="background:${who.bg}">${esc(who.avatar)}</span>${esc(who.name)}</span>` : ''}
    <button class="ttl-x" data-act="chatClose" aria-label="대화방 닫기">✕</button>`;
}
function chatDraw(keepInput, first){
  const w = document.getElementById('chatWrap'); if (!w) return;
  const keep = keepInput ? (($('#chatIn') || {}).value || '') : '';
  const body = CHAT.view === 'list' ? chatRoomsHtml() : (CHAT.view === 'new' ? chatNewHtml() : chatListHtml());
  w.innerHTML = `<div class="chat-dim" data-act="chatClose"></div>
    <aside class="chat-panel${first ? ' anim' : ''}" role="dialog" aria-label="대화방">
      <div class="chat-head">${chatHeadHtml()}</div>
      <div class="chat-list${CHAT.view === 'room' ? '' : ' plain'}" id="chatList">${body}</div>
      <div class="chat-foot" id="chatFoot">${chatComposeHtml()}</div>
    </aside>`;
  const i = $('#chatIn'); if (i && keep) i.value = keep;
  const l = document.getElementById('chatList'); if (l && CHAT.view === 'room') l.scrollTop = l.scrollHeight;
  CHAT.sig = chatSig();
  if (CHAT.view === 'room') chatMarkRead();
  chatBadge();
}
function chatSig(){ const all = chatAll(); return [CHAT.view, CHAT.room, all.length, (all[all.length - 1] || {}).id || '', S.data.chatrooms.length, JSON.stringify(S.settings.parentNote || null).length].join('|'); }
function chatOpen(room){
  CHAT.open = true; CHAT.tray = false;
  const me = chatMe();
  let r = chatRoom(room || CHAT.room);
  if (!r || (me && !chatCanSee(me, r))) r = chatFamily();
  CHAT.room = r.id; CHAT.view = 'room';
  let w = document.getElementById('chatWrap');
  const first = !w;
  if (!w){ w = document.createElement('div'); w.id = 'chatWrap'; w.className = 'chat-wrap'; document.body.appendChild(w); }
  chatDraw(false, first);                                  // 처음 열 때만 오른쪽에서 스르륵
  vcCleanup();
  const box = document.getElementById('notiBox'); if (box) box.innerHTML = '';   // 알림 카드는 대화방 안에서 다 보인다
}
function chatClose(){
  if (CHAT.rec){ clearInterval(CHAT.recT); recCancel(); CHAT.rec = null; }
  vcStop();
  CHAT.open = false; CHAT.as = ''; CHAT.tray = false;
  const w = document.getElementById('chatWrap'); if (w) w.remove();
  chatBadge(); setTimeout(notiCheck, 60);
}
/* 동기화로 새 글이 오면 — 방 안이면 목록만, 아래를 보고 있었으면 계속 아래로 */
function chatRefresh(){
  if (!CHAT.open) return;
  const sig = chatSig(); if (sig === CHAT.sig) return;
  if (CHAT.view === 'room' && !chatRoom(CHAT.room)){ CHAT.room = 'family'; chatDraw(true); return; }   // 방이 지워졌으면 가족방으로
  if (CHAT.view !== 'room'){ if (CHAT.view === 'list') chatDraw(true); CHAT.sig = sig; return; }
  CHAT.sig = sig;
  const l = document.getElementById('chatList'); if (!l) return;
  const atEnd = l.scrollHeight - l.scrollTop - l.clientHeight < 80;
  l.innerHTML = chatListHtml();
  if (atEnd) l.scrollTop = l.scrollHeight;
  chatMarkRead(); chatBadge();
}
function chatFootRedraw(){ const f = document.getElementById('chatFoot'), keep = ($('#chatIn') || {}).value || ''; if (f){ f.innerHTML = chatComposeHtml(); const i = $('#chatIn'); if (i) i.value = keep; } }
ACTS.chatOpen = () => { nvUnlock(); chatOpen(); };
ACTS.chatClose = () => chatClose();
ACTS.chatList = () => { CHAT.view = 'list'; CHAT.tray = false; chatDraw(false); };

/* ---------- 🎤 음성 메시지 — 대화방에서 목소리를 녹음해 보낸다 ----------
   녹음은 30초까지, 작게(32kbps) 만든다. 소리는 가족 데이터의 따로 칸(coll 'vclip' {mime, secs, b64, at})에 두고,
   5초 동기화에서는 빼서(sbAllItems) 누를 때만 받아 온다(한 번 받은 건 이 기기에 저장). 2주가 지나면 지운다(vcCleanup).
   대화 글은 chat {room, from, kind:'voice', clip, secs, at}. AI로는 보내지 않는다. */
const VC = { mem:new Map(), audio:null, playing:'', cleaned:false };
function vcKey(id){ return 'vclip|' + id; }
async function vcGet(id){
  if (VC.mem.has(id)) return VC.mem.get(id);
  try { const hit = await AudioBox.ttsGet(vcKey(id)); if (hit && hit.data){ const b = new Blob([hit.data], { type:hit.mime || 'audio/mp4' }); VC.mem.set(id, b); return b; } } catch(e){}
  if (!S.sb) return null;
  const r = await S.sb.from('items').select('data').eq('id', id).maybeSingle();
  const d = r && r.data && r.data.data; if (!d || !d.b64) return null;
  const bin = atob(d.b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const blob = new Blob([u8], { type:d.mime || 'audio/mp4' });
  VC.mem.set(id, blob); if (VC.mem.size > 30) VC.mem.delete(VC.mem.keys().next().value);
  AudioBox.ttsPut({ k:vcKey(id), at:Date.now(), data:u8.buffer, mime:d.mime || 'audio/mp4' }).catch(() => {});
  return blob;
}
function vcStop(){ if (VC.audio){ try { VC.audio.pause(); } catch(e){} if (VC.audio._url) try { URL.revokeObjectURL(VC.audio._url); } catch(e){} } VC.audio = null; const was = VC.playing; VC.playing = ''; if (was) vcMark(was, false); }
function vcMark(id, on){ document.querySelectorAll(`[data-act="chatPlay"][data-arg="${id}"]`).forEach(el => { el.classList.toggle('on', !!on); const i = el.querySelector('.vc-i'); if (i) i.textContent = on ? '⏸' : '▶'; }); }
async function vcPlay(id){
  if (VC.playing === id){ vcStop(); return; }
  vcStop(); hush(); playStop();
  VC.playing = id; vcMark(id, true);
  let blob = null; try { blob = await vcGet(id); } catch(e){ blob = null; }
  if (VC.playing !== id) return;
  if (!blob){ VC.playing = ''; vcMark(id, false); toast('이 음성 메시지는 이제 들을 수 없어요 (2주가 지나면 지워져요)'); return; }
  const a = new Audio(); a.setAttribute('playsinline', ''); a._url = URL.createObjectURL(blob); a.src = a._url; VC.audio = a;
  a.onended = () => { if (VC.audio === a) vcStop(); };
  a.onerror = () => { if (VC.audio === a){ vcStop(); toast('이 기기에서는 이 소리를 틀 수 없어요'); } };
  a.play().catch(() => { if (VC.audio === a) vcStop(); });
}
/* 2주가 지난 음성은 지운다 — 한 번 열 때 한 번만 */
async function vcCleanup(){
  if (VC.cleaned || !S.sb) return; VC.cleaned = true;
  try { await S.sb.from('items').delete().eq('coll', 'vclip').lt('data->>at', new Date(Date.now() - 14 * 86400000).toISOString()); } catch(e){}
}
async function vcDelete(ids){ if (!S.sb) return; for (const id of ids.filter(Boolean)){ try { await S.sb.from('items').delete().eq('id', id).eq('coll', 'vclip'); } catch(e){} VC.mem.delete(id); } }
function vcTime(s){ s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
async function chatVoiceStart(){
  const me = chatMe(); if (!me || CHAT.rec || !chatInRoom(me, chatRoom(CHAT.room))) return;
  if (!micSupported()){ toast('이 기기에서는 녹음을 할 수 없어요'); return; }
  nvUnlock(); hush(); playStop(); vcStop();
  CHAT.rec = { t0:Date.now(), room:CHAT.room, starting:true };
  chatFootRedraw();
  try {
    await recStart({ maxSec:30, silenceMs:600000, bps:32000,
      onCount:n => { if (!CHAT.rec) return; const el = document.getElementById('chatRecT'); if (el) el.textContent = n ? `${n}…` : '말해요!'; },
      onLevel:lv => { const el = document.querySelector('#chatRecLv span'); if (el) el.style.width = Math.round(lv * 100) + '%'; },
      onAuto:() => chatVoiceSend() });
  } catch(e){
    recCancel(); CHAT.rec = null; chatFootRedraw();
    toast(e && e.name === 'NotAllowedError' ? '마이크를 쓰려면 “허용”을 눌러 주세요' : '마이크를 켜지 못했어요. 잠깐 뒤에 다시 해 볼까요?');
    return;
  }
  if (!CHAT.rec){ recCancel(); return; }
  CHAT.rec.starting = false; CHAT.rec.t0 = Date.now();
  clearInterval(CHAT.recT);
  CHAT.recT = setInterval(() => { const el = document.getElementById('chatRecT'); if (!CHAT.rec){ clearInterval(CHAT.recT); return; } if (el) el.textContent = vcTime((Date.now() - CHAT.rec.t0) / 1000); }, 250);
  chatFootRedraw();
}
async function chatVoiceSend(){
  const r = CHAT.rec, me = chatMe(); if (!r || r.starting || r.sending) return;
  r.sending = true; clearInterval(CHAT.recT);
  const secs = (Date.now() - r.t0) / 1000;
  const blob = await recStop();
  CHAT.rec = null; chatFootRedraw();
  if (!blob || blob.size < 600 || secs < 0.8){ toast('너무 짧아요. 🎤을 누르고 조금 더 길게 말해 볼까요?'); return; }
  const id = uid(), mime = (blob.type || 'audio/mp4').split(';')[0], at = new Date().toISOString();
  const u8 = new Uint8Array(await blob.arrayBuffer());
  VC.mem.set(id, blob); AudioBox.ttsPut({ k:vcKey(id), at:Date.now(), data:u8.buffer, mime }).catch(() => {});
  if (S.sb){
    try {
      const res = await syncWrite(() => S.sb.from('items').insert({ id, family_id:S.familyId, coll:'vclip', data:{ mime, secs:Math.round(secs), b64:bytesBase64(u8), at } }));
      if (res && res.error) throw res.error;
    } catch(e){ toast('음성 메시지를 보내지 못했어요. 인터넷을 확인해 볼까요?'); return; }
  }
  await Store.add('chat', { room:r.room, from:me, kind:'voice', clip:id, secs:Math.max(1, Math.round(secs)), mime, text:'', at });
  chatRefresh(); const l = document.getElementById('chatList'); if (l) l.scrollTop = l.scrollHeight;
  ttTone(880, 0, 0.08, 0.05);
}
function chatVoiceCancel(){ clearInterval(CHAT.recT); recCancel(); CHAT.rec = null; chatFootRedraw(); }
ACTS.chatVoice = () => chatVoiceStart();
ACTS.chatVoiceSend = () => chatVoiceSend();
ACTS.chatVoiceCancel = () => chatVoiceCancel();
ACTS.chatPlay = (arg) => { nvUnlock(); vcPlay(arg); };

/* ============================================================
   🔐 그림 비밀번호 — 아이마다 자기 공간(할 일·책장·단어…)을 지킨다
   시작 화면에서 아이를 고르면 그림 9개 중 4개를 순서대로 누른다. 처음이면 아이가 직접 정한다(두 번 눌러 확인).
   잊어버리면 "비밀번호를 잊었어요" → 부모님 비밀번호로 연다. 부모님 화면 → 아이에서 지우면 다음에 새로 정한다.
   📒 배움기록·💬 대화방은 함께 보는 곳이다. 비밀번호는 그대로가 아니라 섞어서(kpinHash) profile.kpin 에 둔다.
   ============================================================ */
const KPIN_PICS = ['🍓', '🐰', '⭐', '🌈', '🍦', '🚀', '🐬', '🌻', '🎈'];
const KP = { kid:'', seq:[], mode:'', first:'', err:'', then:null };
function kpinHash(kidId, seq){ let h = 5381; const s = kidId + '|' + seq.join('-'); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'k' + h.toString(36); }
function kidEnter(id, then){
  const k = kid(id); if (!k) return;
  KP.kid = id; KP.seq = []; KP.err = ''; KP.first = ''; KP.then = then || null;
  KP.mode = k.kpin ? 'check' : 'new';
  openModal(kpinSheet());
}
function kidEnterNow(id){
  if (!kid(id)) return;
  S.kidId = id; lsSet('dolearn.kid', id); S.tab = 'today'; closeModal(); render();
  const f = KP.then; KP.then = null; if (f) setTimeout(f, 80);
}
function kpinSheet(){
  const k = kid(KP.kid); if (!k) return '';
  const title = KP.mode === 'check' ? `${esc(k.avatar || '')} ${esc(k.name)}의 그림 비밀번호` : (KP.mode === 'again' ? '한 번 더 눌러 확인해요' : `🔐 ${esc(k.name)}만의 그림 비밀번호를 정해요`);
  const note = KP.mode === 'check' ? '그림 4개를 순서대로 눌러요' : (KP.mode === 'again' ? '방금 고른 그림 4개를 같은 순서로!' : '그림 4개를 순서대로 골라요. 나만 아는 비밀이에요! 🤫');
  return `<h3 style="text-align:center">${title}</h3>
    <p class="muted" style="text-align:center;margin:0 0 8px">${note}</p>
    <div class="kp-dots">${[0, 1, 2, 3].map(i => `<i class="${KP.seq.length > i ? 'on' : ''}"></i>`).join('')}</div>
    ${KP.err ? `<p style="text-align:center;color:var(--berry-deep);margin:6px 0">${esc(KP.err)}</p>` : ''}
    <div class="kp-pad">${KPIN_PICS.map((p, i) => `<button class="kp-b" data-act="kpTap" data-arg="${i}" aria-label="그림 ${i + 1}">${p}</button>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost sm" data-act="kpBack">← 하나 지우기</button>
      ${KP.mode === 'check' ? '<button class="btn ghost sm" data-act="kpForgot">비밀번호를 잊었어요</button>' : '<button class="btn ghost sm" data-act="kpLater">나중에 정할래요</button>'}
    </div>`;
}
ACTS.kpTap = async (arg) => {
  if (KP.seq.length >= 4) return;
  KP.seq.push(+arg); KP.err = ''; try { ttTone(620 + KP.seq.length * 70, 0, 0.06, 0.05); } catch(e){}
  if (KP.seq.length < 4){ openModal(kpinSheet()); return; }
  const k = kid(KP.kid); if (!k) return;
  const h = kpinHash(k.id, KP.seq);
  if (KP.mode === 'check'){
    if (h === k.kpin){ kidEnterNow(k.id); return; }
    KP.seq = []; KP.err = '앗, 그림이 달라요. 괜찮아요, 천천히 다시 눌러 볼까요?'; openModal(kpinSheet()); return;
  }
  if (KP.mode === 'new'){ KP.first = h; KP.seq = []; KP.mode = 'again'; openModal(kpinSheet()); return; }
  if (h !== KP.first){ KP.seq = []; KP.mode = 'new'; KP.first = ''; KP.err = '두 번 누른 그림이 달라요. 처음부터 다시 정해 볼까요?'; openModal(kpinSheet()); return; }
  await Store.update('profiles', k.id, { kpin:h });
  toast('그림 비밀번호를 정했어요! 나만 아는 비밀이에요 🤫');
  kidEnterNow(k.id);
};
ACTS.kpBack = () => { KP.seq.pop(); KP.err = ''; openModal(kpinSheet()); };
ACTS.kpLater = () => { kidEnterNow(KP.kid); };
ACTS.kpForgot = () => { S.view.pin = ''; S.view.pinError = ''; S.view.pinPurpose = 'kidin:' + KP.kid; openModal(pinSheet('부모님, 열어 주세요')); };
ACTS.kpReset = async (arg) => { if (!kid(arg)) return; await Store.update('profiles', arg, { kpin:'' }); toast('그림 비밀번호를 지웠어요. 다음에 들어올 때 새로 정해요'); openModal(parentSheet()); };

/* ---------- 💮 참 잘했어요 도장 — 할 일을 끝낸 날·끝낸 할 일에 찍는다 (이 앱에서 새로 그린 도장) ---------- */
function stampSvg(){

  </svg>`;
}

function draw(){
  const screen = $('#screen'), tabs = $('#tabs'), who = $('#whoami'), home = $('#homeBtn');
  const onHome = !S.data.profiles.length || !S.kidId || !curKid();
  $('#topbar').classList.toggle('home', onHome);

  const w = todayWeather();
  $('#dateChip').innerHTML = `${esc(dateLabel())} <span style="font-size:15px">${w ? w.icon : '＋'}</span>`;
  $('#dateChip').setAttribute('aria-label', w ? `오늘 날씨 ${w.label}, 눌러서 바꾸기` : '오늘 날씨 고르기');

  // 아직 아무 프로필도 없음 → 첫 설정
  if (!S.data.profiles.length){
    tabs.hidden = true; who.hidden = true; home.hidden = true;
    screen.innerHTML = viewSetup();
    return;
  }
  // 프로필 미선택 → 시작 화면
  if (!S.kidId || !curKid()){
    tabs.hidden = true; who.hidden = true; home.hidden = true;
    screen.innerHTML = viewGate();
    notiCheck(); chatBadge(); chatRefresh();
    if (VSN.ch) vsNetStop();
    return;
  }

  const k = curKid(), col = kidColor(k);
  who.hidden = false; home.hidden = false;
  who.innerHTML = `<span class="avatar" style="background:${col.bg}">${esc(k.avatar||'🐰')}</span><b>${esc(k.name)}</b>`;

  tabs.hidden = false;
  const items = [
    ['today','오늘','🌤'], ['shelf','책장','📚'], ['words','단어장','🫧'], ['write','받아쓰기','✏️'], ['speech','스피치','🦜'],
    ['think','생각','💭'], ['world','세계','🌏'], ['versus','배움기록','📒'], ['games','놀이','🎈']
  ];
  tabs.innerHTML = items.map(([id,label,ico]) =>
    `<button data-tab="${id}" aria-current="${S.tab===id}"><span class="ico">${ico}</span>${label}</button>`
  ).join('');
  // 좁은 화면에서 탭 줄이 옆으로 밀릴 때 — 지금 탭이 가려져 있으면 보이게
  const curTab = tabs.querySelector('[aria-current="true"]');
  if (curTab && tabs.scrollWidth > tabs.clientWidth && (curTab.offsetLeft < tabs.scrollLeft || curTab.offsetLeft + curTab.offsetWidth > tabs.scrollLeft + tabs.clientWidth))
    tabs.scrollLeft = Math.max(0, curTab.offsetLeft - (tabs.clientWidth - curTab.offsetWidth) / 2);

  // 다른 아이가 올린 승인 요청은 어느 화면에서든 보이게 한다 (부모님 폰에서 바로 승인)
  const others = pendingRequests().filter(r => r.kidId !== S.kidId);

  const views = { today:viewToday, shelf:viewShelf, words:viewWords, write:viewWrite, speech:viewSpeech, think:viewThink, world:viewWorld, versus:viewVersus, games:viewGames };
  screen.innerHTML = `<div class="wrap stack">${storageBanner()}${others.map(askCard).join('')}${(views[S.tab]||viewToday)()}</div>`;

  if (S.tab === 'shelf') requestAnimationFrame(fitSpines);
  if (S.tab === 'world') worldMount();          // 지구본 캔버스는 하나를 계속 다시 붙여 쓴다
  hydratePhotos(screen);
  notiCheck(); chatBadge(); chatRefresh();
  if (VSN.kid !== S.kidId) vsNetStart();
  if (VS && VS.phase === 'lobby') vsRender();
}

   좌우 여백과 위아래 띠에 붙인다. 'wide'는 폰처럼 좁은 화면에서 숨기고, 'bob'은 살랑살랑 움직인다. */
const DECOR = [
  // 위쪽 띠
  ['st-key-berry',     6,  5,  88, -14, 'bob'],
  ['st-ribbon',       30,  3,  72,   8, 'wide'],
  ['st-candy',        66,  4,  66, -10, 'wide'],
  ['st-plush-bear',   92,  6, 108,  10, ''],
  // 왼쪽 여백
  ['st-book-stack',    6, 25,  98,   7, 'wide'],
  ['st-key-heart',     5, 44,  78, -12, 'wide bob'],
  ['st-plush-bunny',   7, 63, 102,  -6, 'wide'],
  ['st-pencils',       5, 81,  84,  14, 'wide'],
  // 오른쪽 여백
  ['st-milk',         94, 24,  86,  -9, 'wide'],
  ['st-key-cat',      95, 43,  84,  12, 'wide bob'],
  ['st-slime',        93, 62,  80,  -8, 'wide'],
  ['st-book-cover',   94, 80,  90,  10, 'wide'],
  // 아래쪽 띠
  ['st-mochi',        10, 95,  80,  -6, ''],
  ['st-bracelet',     33, 96,  70,  12, 'wide'],
  ['st-book-open',    58, 95,  94,  -4, 'wide'],
  ['st-key-d',        78, 96,  72,  -12, 'wide bob'],
  ['st-plush-penguin',93, 93,  96,   8, '']
];
function decorLayer(){
  return `<div class="decor" aria-hidden="true">${DECOR.map(([id, x, y, s, r, cls]) => {
    const delay = `animation-delay:${(x*7+y*3)%5}s`;
    // 키꾸 — 키캡은 키링 고리를 달아 매단 모양으로 (위로 36만큼 늘린 캔버스)
    if (id.startsWith('st-key-')){
      const h = Math.round(s * 156 / 120);
      return `<svg class="stk keyring ${cls}" viewBox="0 -36 120 156"
        style="left:${x}%;top:${y}%;width:${s}px;height:${h}px;--s:${s}px;--r:${r}deg;${delay}"
        ><use href="#st-keyring" x="0" y="-36" width="120" height="60"/><use href="#${id}" width="120" height="120"/></svg>`;
    }
    return `<svg class="stk ${cls}" viewBox="0 0 120 120"
      style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--s:${s}px;--r:${r}deg;${delay}"
      ><use href="#${id}"/></svg>`;
  }).join('')}</div>`;
}

/* ============================================================
   화면: 오늘
   ============================================================ */
function viewToday(){
  const k = curKid(), col = kidColor(k);
  const list = todosFor(S.kidId), key = todayKey();
  const done = doneCount(S.kidId, key);
  const all = list.length > 0 && done === list.length;

  const strip = Array.from({length:7}, (_,i) => {
    const d = new Date(weekStart()); d.setDate(d.getDate()+i);
    const dk = todayKey(d), isToday = dk === key, future = d > new Date();
    const tl = todosFor(S.kidId, d);
    const ok = tl.length > 0 && doneCount(S.kidId, dk) === tl.length;
    return `<div><div class="dot ${ok?'on':''} ${isToday?'today':''}">${ok?stampSvg():(future?'':'·')}</div>
      <small>${DAYNAMES[d.getDay()]}</small></div>`;
  }).join('');

  const pct = list.length ? done/list.length*100 : 0;
  return `
  <div class="card">
    <div class="row" style="align-items:flex-end">
      <div class="grow">
        <div class="muted">오늘 할 일</div>
        <div class="big" style="color:${col.ink}">${done}<span style="font-size:24px">/${list.length}</span></div>
      </div>
      <div class="muted" style="text-align:right">${
        all ? '다 했어요! 🎉' : (list.length ? `${list.length-done}개 남았어요` : '오늘은 쉬는 날')}</div>
    </div>
    <div class="gauge" style="margin-top:10px;height:16px">
      <span style="width:${pct}%;background:${col.bar}"></span></div>
  </div>

  <div class="card">
    <h3 class="sub">이번 주</h3>
    <div class="weekstrip">${strip}</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h3 class="sub grow" style="margin:0">오늘 할 일</h3>
      <button class="btn ghost sm" id="addTodo">+ 추가</button>
    </div>
    ${list.length ? list.map(t=>todoRow(t,key)).join('') : `
      <div class="empty"><div class="face">🧺</div>
        <p>아직 할 일이 없어요.<br>오늘 해보고 싶은 걸 직접 적어볼까요? ✨</p></div>`}
  </div>

  ${all ? `<div class="card" style="text-align:center;background:var(--mint-soft)">
      <div style="font-size:40px">🎉</div>
      <h3 class="sub" style="margin:0">오늘 할 일을 다 했어요!</h3>
    </div>` : ''}
  `;
}

function todoRow(t, key){
  const s = sessionOf(S.kidId, t.id, key);
  const done = !!(s && s.done);
  const running = S.running && S.running.todoId === t.id;
  const secs = (s && s.durationSec) || 0;
  if (t.kind === 'speech'){
    const note = ttTodoNote(S.kidId);
    return `<div class="todo ${done?'done':''}">
      <button class="tick" data-tick="${t.id}" aria-pressed="${done}" aria-label="${esc(t.title)} 완료">${done?'✓':''}</button>
      <div class="grow">
        <div class="name">${esc(t.icon||'')} ${esc(t.title)}</div>
        <div class="muted">${done ? '오늘 미션 완료! 멋져요 🎉' : (note ? esc(note) : '뚜뚜 선생님이 기다려요')}</div>
      </div>
      ${done ? `<span class="todo-stamp">${stampSvg()}</span>` : `<button class="btn sm" data-ttgo="1">🦜 하러 가기</button>`}
    </div>`;
  }
  return `<div class="todo ${done?'done':''}">
    <button class="tick" data-tick="${t.id}" aria-pressed="${done}" aria-label="${esc(t.title)} 완료">${done?'✓':''}</button>
    <div class="grow">
      <div class="name">${esc(t.icon||'')} ${esc(t.title)}</div>
      ${secs ? `<div class="muted">${fmtDur(secs)} 했어요</div>` : ''}
    </div>
    ${running
      ? `${S.running.est ? `<span class="muted" style="font-size:12px;white-space:nowrap">예상 ${S.running.est}분</span>` : ''}<span class="timer" data-live="${t.id}">${fmtClock((Date.now()-S.running.startedAt)/1000)}</span>
         <button class="btn sm" data-stop="${t.id}">끝</button>`
      : (done ? `<span class="todo-stamp">${stampSvg()}</span>` : `<button class="btn ghost sm" data-start="${t.id}">시작</button>`)}
    ${t.createdBy === 'kid' ? `<button class="btn ghost sm" data-deltodo="${t.id}" aria-label="지우기">🗑</button>` : ''}
  </div>`;
}

function viewShelf(){
  const all = S.data.books.filter(b=>b.kidId===S.kidId);
  const mine = all.filter(bookRead).sort((a,b)=>String(a.readAt).localeCompare(String(b.readAt)));
  const later = all.filter(b => !bookRead(b)).sort((a,b)=>String(b.addedAt || '').localeCompare(String(a.addedAt || '')));
  const kObj = curKid();
  const cats = S.settings.cats && S.settings.cats.length ? S.settings.cats : DEFAULT_CATS;

  const towers = cats.map(cat=>{
    const bs = mine.filter(b=>b.category===cat);
    const shown = bs.slice(-14);
    const spines = shown.map((b,i)=>{
      const nth = bs.length - shown.length + i + 1;
      const ribbon = (nth % 10 === 0) ? `<div class="ribbon" title="${nth}권째!"></div>` : '';
      return `<div class="spine ${b.id===S.freshBookId?'fresh':''}" data-book="${b.id}"

      <div class="plank"></div>
      <div class="label">${esc(cat)}</div>
      <div class="count">${bs.length}권</div>

  const withCovers = mine.filter(b=>b.coverAssetId || b.coverUrl).slice().reverse();
  const arCard = arShelfCard(kObj, mine);
  const laterShelf = later.map(b => {
    const img = b.coverAssetId ? '/_blob/' + b.coverAssetId : (b.coverUrl || '');

    return `<button class="tr-book ${b.id===S.freshBookId?'fresh':''}" data-book="${b.id}" aria-label="${esc(b.title)} — 읽을 책">

      ${bd ? `<span class="tr-ar">${bd.ico} ${esc(bd.label)}</span>` : (b.ar ? `<span class="tr-ar">📘 AR ${b.ar}</span>` : '')}
    </button>`; }).join('');

  return `
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <div class="grow">
        <h3 class="sub" style="margin:0">📗 읽은 책</h3>

      </div>
      <button class="btn" id="addBook">📷 책 등록</button>
    </div>
    <div class="towers">${towers}</div>

  <div class="card" style="background:linear-gradient(170deg,#FFFFFF,#EAF3FF)">
    <div class="row" style="margin-bottom:10px">
      <div class="grow">
        <h3 class="sub" style="margin:0">📘 읽을 책</h3>
        <div class="muted">${later.length ? `읽을 책 ${later.length}권이 기다려요. 다 읽으면 책을 눌러요!` : '읽고 싶은 책을 꽂아 두는 책장이에요'}</div>
      </div>
      <button class="btn ghost sm" id="addToRead">📘 꽂아 두기</button>
    </div>
    ${later.length ? `<div class="toread">${laterShelf}</div><div class="plank"></div>`
      : `<div class="ghostbox" style="border:2px dashed var(--blush);border-radius:12px;padding:16px;text-align:center;color:var(--cocoa-soft);font-size:14px">책을 등록할 때 <b>📘 읽을 예정이에요</b>를 고르면 여기에 꽂혀요</div>`}

      <button class="cover" data-book="${b.id}">

          : (b.coverUrl ? `<img src="${esc(b.coverUrl)}" alt="${esc(b.title)}">` : esc(b.title))}
      </button>`).join('')}</div>
  </div>` : ''}

  ${!all.length ? `<div class="card empty">
    <div class="face">📚</div>
    <p>첫 책을 등록해 볼까요?<br>책 뒤쪽 바코드를 찍으면 돼요.</p>

/* 반짝 왕관 — 한 아이가 왕관을 다 가져가지 않으면서도, 정말 잘한 건 정직하게.
   실력 왕관(책·단어·성실·연습): 앞선 아이가 받는다. 비기면 둘 다.
     한 아이가 절반보다 많이 앞서면, 차이가 작은 것부터 '둘이 함께' 왕관이 된다(빼앗아 주지 않는다).
   개인 왕관(노력·착한·생각·탐험·성장): 형제끼리 겨루지 않고, 기준을 넘으면 둘 다 받는다. */
function crownPlan(sa, sb, pa, pb){
  const head = [
    { id:'books',  ico:'📚', title:'책왕',   va:sa.books,  vb:sb.books,  unit:'권' },
    { id:'words',  ico:'🫧', title:'단어왕', va:sa.words,  vb:sb.words,  unit:'개' },
    { id:'rate',   ico:'⏰', title:'성실왕', va:sa.rate,   vb:sb.rate,   unit:'%' }
  ];
  if (S.data.scripts.length) head.push({ id:'speech', ico:'🦜', title:'연습왕', va:sa.speech, vb:sb.speech, unit:'번' });
  if (S.data.dlists.length || sa.dict || sb.dict) head.push({ id:'dict', ico:'✏️', title:'받아쓰기왕', va:sa.dict || 0, vb:sb.dict || 0, unit:'개' });
  const out = { a:[], b:[], both:[] };
  const live = head.filter(c => c.va > 0 || c.vb > 0);
  live.filter(c => c.va === c.vb).forEach(c => out.both.push(c));
  const won = live.filter(c => c.va !== c.vb).map(c => ({ ...c, lead:c.va > c.vb ? 'a' : 'b', gap:Math.abs(c.va - c.vb) / Math.max(c.va, c.vb) }));
  const cap = Math.ceil(won.length / 2);
  for (const who of ['a', 'b']){
    const mine = won.filter(c => c.lead === who).sort((x, y) => y.gap - x.gap);
    mine.slice(0, cap).forEach(c => out[who].push(c));
    mine.slice(cap).forEach(c => out.both.push(c));                  // 넘치는 건 함께
  }
  // 개인 왕관 — 둘 다 받을 수 있다
  const grew = (s, p) => ['books', 'words', 'speech', 'mins', 'kind', 'dict', 'think', 'world'].filter(k => (s[k] || 0) > (p[k] || 0)).length;
  const mine = (s, p, who) => {
    const list = [];
    if (s.effort >= 20) list.push({ id:'effort', ico:'💪', title:'노력왕', unit:'점', ['v' + who]:s.effort });
    if (s.kind >= 1) list.push({ id:'kind', ico:'😇', title:'착한왕', unit:'개', ['v' + who]:s.kind });
    if (s.think >= 3) list.push({ id:'think', ico:'💭', title:'생각왕', unit:'개', ['v' + who]:s.think });
    if (s.world >= 2) list.push({ id:'world', ico:'🌏', title:'탐험왕', unit:'개', ['v' + who]:s.world });
    if (grew(s, p) >= 2) list.push({ id:'grow', ico:'🌱', title:'성장왕', unit:'' });
    return list;
  };
  out.a.push(...mine(sa, pa, 'a'));
  out.b.push(...mine(sb, pb, 'b'));
  return out;
}

        <h3 class="sub grow" style="margin:0">단어 짝 맞추기</h3>
        <span class="muted">${st.solved.length}/${st.pairs.length}</span>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

          <button class="matchbtn ${st.solved.includes(p.id)?'gone':''}" data-ml="${p.id}"

        <div class="matchcol">${st.right.map(p=>`
          <button class="matchbtn ${st.solved.includes(p.id)?'gone':''}" data-mr="${p.id}"

  }
  return '';
}

/* 샌드박스 안에서는 브라우저 기본 prompt/confirm/alert 가 막힌다.
   그래서 앱 안에서 쓰는 입력창·확인창·알림을 직접 만든다. */
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function askText({ title, note, placeholder, value, okLabel, onOk }){
  S.view.askCb = onOk;
  openModal(`<h3>${esc(title)}</h3>
    ${note ? `<p class="muted" style="margin:0 0 10px">${esc(note)}</p>` : ''}
    <input class="field" id="askInput" placeholder="${esc(placeholder||'')}"
      value="${esc(value||'')}" enterkeyhint="done">
    <div class="row" style="gap:9px;margin-top:12px">
      <button class="btn ghost grow" data-close="1">그만두기</button>
      <button class="btn grow" id="askOk">${esc(okLabel||'좋아요')}</button>
    </div>`);
  setTimeout(() => { const i = $('#askInput'); if (i) i.focus(); }, 60);
}
function askConfirm({ title, note, okLabel, danger, onOk }){
  S.view.confirmCb = onOk;
  openModal(`<h3>${esc(title)}</h3>
    ${note ? `<p class="muted" style="margin:0 0 12px">${esc(note)}</p>` : ''}
    <div class="row" style="gap:9px">
      <button class="btn ghost grow" data-close="1">아니요</button>
      <button class="btn grow" id="confirmOk" style="${danger?'background:var(--berry-deep)':''}"
        >${esc(okLabel||'네')}</button>
    </div>`);
}

function openModal(html){
  const root = $('#modalRoot');
  const inner = `<button class="close btn ghost sm" data-close="1" aria-label="닫기">✕</button>${html}`;
  const open = root.querySelector('.sheet');
  if (open){
    // 이미 열려 있으면 안쪽만 갈아끼운다.
    // 창을 통째로 다시 만들면 열림 애니메이션이 매번 돌아 깜빡인다(비밀번호 누를 때처럼).
    const y = open.scrollTop;
    open.innerHTML = inner;
    open.scrollTop = y;
    hydratePhotos(open);
    return;
  }
  root.innerHTML = `<div class="modal" id="modal"><div class="sheet" style="position:relative">${inner}</div></div>`;
  hydratePhotos(root);
}
function closeModal(){
  stopScanner();
  if (!TT) hush();
  $('#modalRoot').innerHTML = '';
  setTimeout(notiCheck, 60);                     // 창을 닫으면 기다리던 쪽지·칭찬을 띄운다
}

/* ---------- QR ---------- */
function qrSvg(text){
  try {
    if (!window.qrcode || !text) return '';
    const q = window.qrcode(0, 'M');
    q.addData(text); q.make();
    return q.createSvgTag({ cellSize:4, margin:2, scalable:true, alt:'QR 코드' });
  } catch(e){ return ''; }
}

/* ---------- 부모님 관리 → 알림 (텔레그램) ----------
   흐름: QR을 폰으로 찍거나 버튼 → 텔레그램에서 봇 열림 → 시작(START) → 여기서 '연결 확인'
   서버가 "/start <가족ID>" 메시지를 찾아 대화방 번호를 돌려주면 가족 설정에 저장한다. */
function notifyTab(){

  const d = tg.data || {};

    return `<div class="card">
      <h3 class="sub">텔레그램 알림</h3>

  const linked = S.settings.telegram && S.settings.telegram.chatId;

    <p class="muted" style="margin:0 0 12px">아이가 놀이를 요청하면 부모님 폰 텔레그램으로 알림이 가요.</p>

      ${qr ? `<div class="qrbox">${qr}</div>` : ''}
      <a class="btn wide" href="${esc(d.link)}" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px">
        텔레그램에서 @${esc(d.bot.username)} 열기</a>
    </div></div>

    <div class="tgstep"><span class="tgnum">2</span><div class="grow">
      <b>텔레그램에서 <u>시작</u>(START) 누르기</b>
      <p style="margin:4px 0 0">화면 아래 파란 <b>시작</b> 버튼을 누르세요. 봇이 대답하지 않아도 괜찮아요.</p>
    </div></div>

    <div class="tgstep"><span class="tgnum">3</span><div class="grow">
      <b>여기로 돌아와서 연결 확인</b>
      <button class="btn mint wide" id="tgCheck" style="margin-top:8px">연결 확인</button>
      ${tg.checkedEmpty ? `<p class="muted" style="margin:8px 0 0">아직 시작(START) 메시지가 안 보여요.
        텔레그램에서 시작을 누른 뒤 다시 확인해 주세요.</p>` : ''}
    </div></div>

    ${(d.candidates||[]).length ? `<div style="margin-top:12px">
      <p class="muted" style="margin:0 0 6px">QR 없이 봇에게 직접 말을 거셨나요? 부모님 계정을 고르세요.</p>
      ${d.candidates.map(c => `<button class="btn ghost wide sm" data-tglink="${esc(c.id)}|${esc(c.name)}"
        style="margin-top:6px">${esc(c.name || '이름 없음')} 계정으로 연결</button>`).join('')}
    </div>` : ''}
  </div>`;
}

async function tgRefresh(userAsked){
  S.view.tg = { ...(S.view.tg || {}), loading:true };
  if (S.view.parentTab === 'notify') openModal(parentSheet());
  let next;
  try {
    const r = await fetch(`/api/telegram-link?familyId=${encodeURIComponent(S.familyId)}`);
    const j = await r.json();
    next = { loading:false, data:j };
    if (j.ok && j.chat){
      const cur = S.settings.telegram;
      if (!cur || String(cur.chatId) !== String(j.chat.id)){
        await Store.saveSettings({ telegram:{ chatId:String(j.chat.id), name:j.chat.name || '', linkedAt:new Date().toISOString() } });
        tgSendTest(true);
      }
    } else if (j.ok && userAsked){
      next.checkedEmpty = true;
    }
  } catch(e){
    next = { loading:false, error:'알림 연결 상태를 불러오지 못했어요. 인터넷을 확인해 주세요.' };
  }
  S.view.tg = next;
  if (S.view.parentTab === 'notify' && $('#modalRoot .sheet')) openModal(parentSheet());
}

async function tgSendTest(afterLink){
  const chatId = S.settings.telegram && S.settings.telegram.chatId;
  if (!chatId) return;
  try {
    const r = await fetch('/api/telegram-link', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ action:'test', chatId })
    });
    const j = await r.json();
    toast(j.ok ? (afterLink ? '연결됐어요! 텔레그램을 확인해 보세요 📨' : '텔레그램으로 보냈어요 📨')
               : (j.message || '보내지 못했어요'));
  } catch(e){ toast('보내지 못했어요. 인터넷을 확인해 주세요'); }
}

/* ---------- 부모님 화면 → 📂 기록 관리 ----------
   아이마다 할 일·한 일 기록·책장·단어·생각·여행… 을 보고 고치거나 지운다.
   고치기는 줄 안에서 칸을 펼치고(data-keep 칸이라 5초 동기화에도 글자가 남는다), 지우기는 줄 안에서 한 번 더 묻는다.
   부모님 화면(비밀번호)을 떠나지 않게 askConfirm 대신 줄 안에서 묻는다. */
function pdDate(v){ if (!v) return ''; const d = new Date(String(v).length === 10 ? v + 'T12:00:00' : v); return isNaN(d.getTime()) ? '' : `${d.getMonth() + 1}/${d.getDate()}`; }
function pdTodo(id){ const t = S.data.todos.find(x => x.id === id); return t ? `${t.icon || '📌'} ${t.title}` : '지운 할 일'; }
const PD_THINK = {
  q:{ t:x => `🌟 ${x.q || '오늘의 질문'}`, s:x => [x.a1, x.a2].filter(Boolean).join(' → '), f:[['a1', '내 생각', 'area', 200], ['a2', '한 번 더 생각', 'area', 200]] },
  day:{ t:x => `${x.mood || '🙂'} 하루 돌아보기`, s:x => [x.good && '잘한 것: ' + x.good, x.hard && '어려웠던 것: ' + x.hard, x.next && '내일은: ' + x.next].filter(Boolean).join(' · '),
    f:[['good', '잘한 것', 'text', 100], ['hard', '어려웠던 것', 'text', 100], ['next', '내일은', 'text', 100]] },

}

  if (type === 'number' || type === 'date')
    return `<div><div class="muted" style="font-size:13px;margin-bottom:3px">${esc(label)}</div><input class="field" type="${type}" data-keep="${k}" id="kv-${k}" ${type === 'number' ? 'inputmode="numeric" min="0"' : ''} value="${esc(kv(k))}"></div>`;
  return `<div><div class="muted" style="font-size:13px;margin-bottom:3px">${esc(label)}</div>${kvField(k, label, { max })}</div>`;
}

function pdFind(id){ const v = pdState(), kind = PD_KINDS.find(x => x.id === v.kind); return { v, kind, k:kid(v.kid), x:(S.data[kind.coll] || []).find(y => y.id === id) }; }

ACTS.pdKid = (arg) => { const v = pdState(); v.kid = arg; v.edit = v.del = null; v.more = 40; kvClear('pd_'); pdOpen(); };
ACTS.pdKind = (arg) => { const v = pdState(); v.kind = arg; v.edit = v.del = null; v.more = 40; kvClear('pd_'); pdOpen(); };
ACTS.pdMore = () => { pdState().more += 40; pdOpen(); };
ACTS.pdEdit = (arg) => {
  const { v, kind, x } = pdFind(arg); if (!x) return;
  if (kind.edit === 'book'){ bookEditOpen(x.id, 'parent'); return; }
  kvClear('pd_');
  (kind.f(x) || []).forEach(f => kvSet('pd_' + f[0], String(kind.get ? kind.get(x, f[0]) : (x[f[0]] == null ? '' : x[f[0]]))));
  v.edit = x.id; v.del = null; pdOpen();
};
ACTS.pdEditNo = () => { const v = pdState(); v.edit = null; kvClear('pd_'); pdOpen(); };
ACTS.pdSave = async (arg) => {
  const { v, kind, x } = pdFind(arg); if (!x) return;
  const vals = {};
  (kind.f(x) || []).forEach(f => { vals[f[0]] = String(kv('pd_' + f[0])).trim().slice(0, f[3] || 200); });
  if (kind.need && !vals[kind.need]){ toast('비워 둘 수 없는 칸이 있어요'); return; }
  await Store.update(kind.coll, x.id, kind.put ? kind.put(vals) : vals);
  v.edit = null; kvClear('pd_'); toast('고쳤어요 ✨'); pdOpen();
};
ACTS.pdDel = (arg) => { const v = pdState(); v.del = arg; v.edit = null; pdOpen(); };
ACTS.pdDelNo = () => { pdState().del = null; pdOpen(); };
ACTS.pdDelOk = async (arg) => {
  const { v, kind, k, x } = pdFind(arg); if (!x){ v.del = null; pdOpen(); return; }
  if (kind.del) await kind.del(x, k); else await Store.remove(kind.coll, x.id);
  if (kind.coll === 'dprog') delete DT_PID[x.kidId + '|' + x.listId];
  v.del = null; toast('지웠어요'); pdOpen();
};
ACTS.pdBack = () => { S.view.bookEdit = null; pdOpen(); };
/* 할 일 탭의 ✏️ — 기록 관리의 할 일 고치기로 바로 간다 */

};

const DICT_MODES = {
  en: { label:'영어', instruct:'영어 단어를 풀이한다. meaning은 한국어 뜻, meaningEn은 아주 쉬운 영어 풀이 한 문장, example은 아주 쉬운 영어 한 문장, exampleKo는 그 예문의 한국어 뜻으로 쓴다.' },
  ek: { label:'영한', instruct:'영어 단어를 한국어로 풀이한다. meaning과 exampleKo는 한국어로, example은 아주 쉬운 영어 한 문장으로 쓴다.' },
  ee: { label:'영영', instruct:'영어 단어를 아주 쉬운 영어로 풀이한다. meaning과 example은 영어로, exampleKo는 그 예문의 한국어 뜻으로 쓴다.' },
  kk: { label:'한글', instruct:'한국어 낱말을 한국어로 풀이한다. meaning과 example은 한국어로 쓰고, exampleKo는 빈 문자열로 둔다.' }
};

async function lookupWord(term, mode){
  const key = `${mode}:${term.trim().toLowerCase()}`;
  const cached = S.data.dict.find(d => d.key === key);
  if (cached) return cached.value;

  const m = DICT_MODES[mode] || DICT_MODES.ek;

  // 웹(버셀)에서는 서버 함수가 Claude API를 대신 부른다 — 키가 브라우저에 노출되지 않는다.
  if (!S.sample){
    const res = await fetch('/api/dict', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ term, mode })
    }).catch(() => null);
    if (!res) throw new Error('사전에 연결하지 못했어요. 인터넷을 확인해 주세요.');
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || out.error){
      throw new Error((out && out.message) || '지금은 사전을 쓸 수 없어요.');
    }
    const val = normalizeDict(out, term);
    Store.add('dict', { key, value: val, createdAt:new Date().toISOString() });
    return val;
  }

  const prompt = `너는 초등학교 1학년 아이에게 낱말을 알려주는 다정한 선생님이야.
낱말: "${term}"
사전 종류: ${m.label}. ${m.instruct}

아래 JSON 하나만 출력해. 설명도 마크다운도 코드펜스도 쓰지 마.
{"term":"","reading":"","meaning":"","meaningEn":"","example":"","exampleKo":"","emoji":""}

규칙:
- meaning은 15자 안팎의 한 문장. 어려운 한자어와 전문 용어를 쓰지 마.
- meaningEn: 영어 단어면 아주 쉬운 영어 풀이 한 문장, 한국어 낱말이면 빈 문자열.
- reading: 영어 단어면 한글로 읽는 법(예: 레인보우), 한국어 낱말이면 빈 문자열.
- emoji: 낱말이 떠오르는 이모지 딱 한 개.
- 그런 낱말을 모르면 meaning에 "잘 모르겠어요"라고만 써.`;

  const out = await S.sample.json(prompt, { modelTier:'quick', cache:true });
  const val = normalizeDict(out, term);
  Store.add('dict', { key, value: val, createdAt:new Date().toISOString() });
  return val;
}

function normalizeDict(out, term){
  return {
    term: (out && out.term) || term,
    reading: (out && out.reading) || '',
    meaning: (out && out.meaning) || '',
    example: (out && out.example) || '',
    exampleKo: (out && out.exampleKo) || '',
    meaningEn: (out && out.meaningEn) || '',
    emoji: (out && out.emoji) || '📖'
  };
}

/* ---------- 카카오 책 검색 ----------
   GET https://dapi.kakao.com/v3/search/book
     ?target=isbn|title &query=<검색어> &size=<개수>
     헤더: Authorization: KakaoAK <REST API 키>
   응답 documents[]: title, authors[], publisher, thumbnail, isbn, contents
   키는 부모님 화면 → 설정에서 넣는다(코드에 박아두지 않는다).       */
const KAKAO_URL = 'https://dapi.kakao.com/v3/search/book';

async function bookSearch(query, target){
  // 웹(버셀)에서는 서버 함수가 알라딘 → 카카오 순으로 찾아준다. 키는 서버에만 있다.
  if (!window.claude){
    try {
      const q = target === 'isbn' ? `isbn=${encodeURIComponent(query)}` : `title=${encodeURIComponent(query)}`;
      const r = await fetch(`/api/book?${q}`);
      if (!r.ok) return { ok:false, reason:'http' };
      const j = await r.json();
      const docs = (j.docs || []).map(d => ({
        title:d.title || '', author:d.author || '', publisher:d.publisher || '',
        coverUrl:d.cover || '', isbn:d.isbn || '', category:catFromShop(d.category || '')
      }));
      if (!docs.length && !j.provider && (j.tried || []).length && /열쇠/.test(j.message || '')) return { ok:false, reason:'nokey' };
      return { ok:true, docs, provider:j.provider || '' };
    } catch(e){ return { ok:false, reason:'blocked' }; }
  }

  // Artifact에서 열었을 때는 브라우저가 직접 카카오를 부른다(CSP에 막힐 수 있음).
  const key = (S.settings.kakaoKey||'').trim();
  if (!key) return { ok:false, reason:'nokey' };
  try {
    const url = `${KAKAO_URL}?target=${target}&query=${encodeURIComponent(query)}&size=${target==='isbn'?1:6}`;
    const res = await fetch(url, { headers: { Authorization: 'KakaoAK ' + key } });
    if (res.status === 401 || res.status === 403) return { ok:false, reason:'badkey' };
    if (res.status === 429) return { ok:false, reason:'quota' };
    if (!res.ok) return { ok:false, reason:'http' };
    const j = await res.json();
    const docs = (j.documents || []).map(d => ({
      title: d.title || '',
      author: (d.authors || []).join(', '),
      publisher: d.publisher || '',
      coverUrl: d.thumbnail || '',
      isbn: (d.isbn || '').split(' ').pop() || ''
    }));
    return { ok:true, docs };
  } catch(e){
    return { ok:false, reason:'blocked' };   // CSP 또는 네트워크 차단
  }
}
const BOOK_MSG = {
  nokey:   '책 찾기가 아직 준비되지 않았어요. 제목을 적어주세요.',
  badkey:  '책 찾기 열쇠가 맞지 않아요. 부모님께 말씀해 주세요.',
  quota:   '오늘 책 찾기를 너무 많이 했어요. 제목을 적어주세요.',
  http:    '책 정보를 받아오지 못했어요. 제목을 적어주세요.',
  blocked: '책 찾기에 연결하지 못했어요. 제목을 적어주세요.'
};
/* 서점 분류(예: 국내도서>어린이>그림책)를 우리 책장 종류로 */
function catFromShop(path){
  const cats = S.settings.cats && S.settings.cats.length ? S.settings.cats : DEFAULT_CATS;
  const has = c => cats.includes(c) ? c : '';
  const s = String(path || '');
  if (!s) return '';
  if (/외국도서|영어|English|원서|외국어/i.test(s)) return has('영어책');   // 영어 그림책·만화도 영어책으로
  if (/만화|코믹|학습만화/.test(s)) return has('만화');
  if (/그림책/.test(s)) return has('그림책');
  if (/동시|동요|>시(>|$)|시집/.test(s)) return has('시');
  if (/과학|지식|학습|사회|역사|수학|자연|인물|위인|백과/.test(s)) return has('지식책');
  if (/동화|명작|소설|옛이야기|전래/.test(s)) return has('동화책');
  return '';
}

// Open-Meteo WMO 코드 → 우리 아이콘
function wmoToWeather(code){
  if (code === 0) return WEATHERS[0];
  if (code <= 2) return WEATHERS[1];
  if (code === 3) return WEATHERS[2];
  if (code === 45 || code === 48) return WEATHERS[6];
  if (code >= 95) return WEATHERS[4];
  if (code >= 71 && code <= 77) return WEATHERS[5];
  if (code >= 51) return WEATHERS[3];
  return WEATHERS[1];
}
async function fetchWeatherAt(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=weather_code&timezone=auto`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('http');
  const j = await res.json();
  const code = j && j.current && j.current.weather_code;
  if (code == null) throw new Error('shape');
  return wmoToWeather(code);
}
function currentGeo(){
  const g = S.settings.geo;
  return (g && typeof g.lat === 'number') ? g : DEFAULT_GEO;
}
/* interactive=true 면 "지금 있는 곳"으로 바꾸려고 위치를 한 번 물어본다.
   거절하거나 실패해도 기본 좌표(동탄)로 계속 진행한다. */
async function autoWeather(interactive){
  let geo = currentGeo();
  if (interactive && navigator.geolocation){
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout:8000, maximumAge:600000 }));
      geo = { lat:pos.coords.latitude, lon:pos.coords.longitude, name:'지금 있는 곳' };
      await Store.saveSettings({ geo });
    } catch(e){ /* 거절 → 동탄 기본값 그대로 */ }
  }
  try {
    const w = await fetchWeatherAt(geo.lat, geo.lon);
    await Store.saveSettings({ weather:{ date:todayKey(), icon:w.icon, label:w.label, place:geo.name||'' } });
    return true;
  } catch(e){
    if (interactive) toast('날씨를 가져오지 못했어요. 창밖을 보고 직접 골라볼까요? ☀️');
    return false;
  }
}

   영어는 en-US → 다른 영어, 한국어는 ko-KR. 부모님이 고른 영어 목소리가 있으면 그걸 쓴다. */
const NOVELTY_VOICE = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i;
function voiceList(){ try { return (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch(e){ return []; } }
function voiceScore(v, lang){
  const L = String(v.lang || '').replace('_', '-'), nm = String(v.name || '');
  if (NOVELTY_VOICE.test(nm)) return -1;
  let s = 0;
  if (lang === 'ko'){ if (!/^ko/i.test(L)) return -1; s += 50; }
  else {
    if (/^en-US/i.test(L)) s += 50; else if (/^en-(GB|AU|CA|IE|NZ)/i.test(L)) s += 30; else if (/^en/i.test(L)) s += 10; else return -1;
  }
  if (/premium|enhanced|natural|neural|향상|고품질/i.test(nm)) s += 20;
  if (/Samantha|Ava|Allison|Nicky|Zoe|Susan|Google US English|Yuna|유나|Google 한국|Samsung|삼성/i.test(nm)) s += 10;
  // 안드로이드(갤럭시): 인터넷 목소리(-network)는 늦게 나오거나 끊겨서, 기기에 깔린 목소리(local)를 먼저
  if (v.localService) s += 8;
  if (/network/i.test(nm)) s -= 6;
  if (/-local$/i.test(nm)) s += 4;
  return s;
}
function pickVoice(lang){
  const all = voiceList();
  const want = lang === 'en' ? S.settings.ttVoice : '';
  if (want){ const v = all.find(x => x.voiceURI === want); if (v) return v; }
  // 한국어는 이 기기에서 고른 목소리(기기마다 깔린 목소리가 달라서 기기에 기억한다), 없으면 예전 가족 설정 이름
  const kn = lang === 'ko' ? String(lsGet('dolearn.koVoice') || S.settings.koVoiceName || '') : '';
  if (kn){ const v = all.find(x => x.name === kn && /^ko/i.test(String(x.lang || ''))); if (v) return v; }
  let best = null, bs = -1;
  for (const v of all){ const sc = voiceScore(v, lang); if (sc > bs){ bs = sc; best = v; } }
  return best;
}
/* 다른 나라 말 목소리 — 같은 지역(fr-FR)을 먼저, 없으면 같은 말(fr)로. 없으면 기기가 알아서 고른다 */
function pickVoiceFor(L){
  const want = String(L).toLowerCase().replace('_', '-'), base = want.split('-')[0];
  let best = null, bs = -1;
  for (const v of voiceList()){
    if (NOVELTY_VOICE.test(v.name)) continue;
    const vl = String(v.lang || '').toLowerCase().replace('_', '-');
    let sc = vl === want ? 50 : (vl.split('-')[0] === base ? 30 : -1);
    if (sc < 0) continue;
    if (/premium|enhanced|natural|neural/i.test(v.name)) sc += 10;
    if (v.localService) sc += 3;
    if (sc > bs){ bs = sc; best = v; }
  }
  return best;
}
try { if (window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged', () => {}); } } catch(e){}

/* 읽기 전에 글자 다듬기 — 이모지·물결(~)·따옴표·괄호는 소리 내어 읽지 않는다.
   (기기 목소리는 "🎉"를 "파티 폭죽"이라고 읽고, "~"를 "물결"이라고 읽어 어색했다)
   keepLen 이면 글자 수를 그대로 둔다 — 기기 목소리의 단어 위치(onword)로 불을 켜는 곳이 어긋나지 않게. */
const SPEECH_JUNK = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}\u{FE0F}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu;
const SPEECH_JUNK_JOSA = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}][\u{FE0F}\u{200D}\u{20E3}]*(?:으로|이랑|에서|까지|로|를|을|가|이|는|은|도|에|와|과|랑)(?=[\s,.!?]|$)/gu;
function speechText(t, keepLen){
  const sp = m => keepLen ? ' '.repeat(m.length) : ' ';
  let s = String(t || '').replace(SPEECH_JUNK_JOSA, sp)      // "🔊로 먼저" → "먼저" (조사만 덩그러니 남아 "로 먼저"라고 읽었다)
    .replace(SPEECH_JUNK, sp).replace(/[~～]/g, sp).replace(/[“”"«»]/g, sp).replace(/[()\[\]{}<>]/g, sp)
    .replace(/…/g, ',').replace(/\.{3}/g, keepLen ? ',  ' : ', ').replace(/·/g, ',').replace(/_{2,}/g, sp);
  if (!keepLen) s = s.replace(/\s{2,}/g, ' ').replace(/\s+([,.!?])/g, '$1').replace(/,(\s*,)+/g, ',').replace(/^[\s,]+|[\s,]+$/g, '');
  return s;
}
/* 한국어 속 숫자는 우리말로 바꿔 읽는다 — 목소리가 "3번"을 "쓰리번", "2개"를 "투개"처럼 영어로 읽었다.
   세는 말(개·명·마리·권·번·가지·장·살…) 앞은 한·두·세·네…, 나머지(분·초·점·단계·월·일…)는 일·이·삼… */
const KO_NATIVE1 = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉'], KO_NATIVE10 = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔'];
const KO_SINO = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
function koNative(n){ if (n <= 0 || n >= 100) return koSino(n); if (n === 20) return '스무'; return KO_NATIVE10[Math.floor(n / 10)] + KO_NATIVE1[n % 10]; }
function koSino(n){
  if (!n) return '영';
  if (n >= 100000000) return String(n);
  let out = '', rest = n;
  const big = [[10000, '만'], [1000, '천'], [100, '백'], [10, '십']];
  for (const [u, w] of big){ const d = Math.floor(rest / u); if (d){ out += (d === 1 ? '' : (u === 10000 ? koSino(d) : KO_SINO[d])) + w; rest %= u; } }
  return out + KO_SINO[rest];
}
const KO_MONTH = ['', '일월', '이월', '삼월', '사월', '오월', '유월', '칠월', '팔월', '구월', '시월', '십일월', '십이월'];
function koNumSpeak(t){
  return String(t || '')
    .replace(/(\d{1,2})월\s*(\d{1,2})일/g, (m, a, b) => (KO_MONTH[+a] || koSino(+a) + '월') + ' ' + koSino(+b) + '일')
    .replace(/(\d{1,2})월/g, (m, a) => KO_MONTH[+a] || koSino(+a) + '월')
    .replace(/(\d+)\s*(개|명|마리|권|번|가지|장|문장|살|시간|군데|곳|사람|송이|그루|켤레|잔|판)/g, (m, d, u) => `${koNative(+d)} ${u}`)
    .replace(/(\d+)\s*(분|초|점|단계|월|일|년|쪽|층|주|회|등|퍼센트|%)/g, (m, d, u) => `${koSino(+d)}${u === '%' ? ' 퍼센트' : ' ' + u}`)
    .replace(/\d+/g, d => d.length > 8 ? d : koSino(+d));
}
/* 말하기 — 끝나면 풀리는 Promise. onword(글자 위치)로 읽는 단어에 불을 켤 수 있다.

  if (voiceList().length || !window.speechSynthesis) return Promise.resolve();
  return new Promise(ok => {
    let fin = false; const go = () => { if (!fin){ fin = true; ok(); } };
    try { speechSynthesis.addEventListener('voiceschanged', go, { once:true }); } catch(e){}
    setTimeout(go, ms || 900);
  });

function say(text, opt){

function sayNow(text, { lang='en', rate, onword, onstart } = {}){
  return new Promise(done => {
    try {
      text = speechText(text, true);
      if (!window.speechSynthesis || !text.trim()){ done(false); return; }
      const u = new SpeechSynthesisUtterance(text);
      const other = lang !== 'ko' && lang !== 'en' && /^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(lang || '');   // 'fr-FR' 같은 다른 나라 말
      u.lang = other ? lang : (lang === 'ko' ? 'ko-KR' : 'en-US');
      const v = other ? pickVoiceFor(lang) : pickVoice(lang === 'ko' ? 'ko' : 'en');
      if (v){ u.voice = v; if (v.lang) u.lang = String(v.lang).replace('_', '-'); }   // 고른 목소리의 말 표시에 맞춘다(안드로이드는 ko_KR 처럼 온다)
      u.rate = rate || (lang === 'ko' ? 1 : 0.85);

      const end = ok => { if (fin) return; fin = true; clearTimeout(tm); if (SAY.u === u) SAY.u = null; done(ok); };
      u.onend = () => end(true);
      u.onerror = () => end(false);
      if (onword) u.onboundary = ev => { if (!ev.name || ev.name === 'word') onword(ev.charIndex); };

      SAY.u = u;                      // 사파리가 말하는 도중 버려서 onend 가 안 오는 일을 막는다
