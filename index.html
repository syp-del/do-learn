}
function dtGrade(expected, typed){
  const E = [...dtNorm(expected)], T = [...dtNorm(typed)];
  const ops = dtAlign(E, T);
  const em = E.map(c => ({ c, st:'ok' })), tm = T.map(c => ({ c, st:'ok' }));
  const errs = []; let lastE = -1;
  for (const [op, i, j] of ops){
    if (op === 'eq'){ lastE = i; continue; }
    if (op === 'sub'){
      lastE = i;
      const kind = (DT_PUNCT[E[i]] || DT_PUNCT[T[j]]) ? 'punct' : dtWhy(E[i], T[j]);
      em[i].st = 'bad'; tm[j].st = 'bad';
      errs.push({ kind, i, j, e:E[i], t:T[j] });
    } else if (op === 'del'){
      lastE = i;
      em[i].st = E[i] === ' ' ? 'sp' : 'miss';
      errs.push({ kind:E[i] === ' ' ? 'space' : (DT_PUNCT[E[i]] ? 'punct' : 'miss'), i, e:E[i] });
    } else {
      tm[j].st = 'bad';
      if (T[j] === ' ' && lastE >= 0) em[lastE].join = true;          // 여기는 붙여 써요
      errs.push({ kind:T[j] === ' ' ? 'join' : 'extra', j, t:T[j], after:lastE });
    }
  }
  // 낱말끼리 견주어 '소리 나는 대로' 쓴 건지 본다 (낱말 수가 같을 때)
  const tips = [], seen = new Set(), wordsDone = new Set();
  const ew = dtNorm(expected).split(' '), tw = dtNorm(typed).split(' ');
  if (ew.length === tw.length) ew.forEach((w, n) => {
    if (w === tw[n]) return;
    const core = s => s.replace(/[.,!?~]/g, '');
    const v = koVariants(core(w)).find(o => o.t === core(tw[n]));
    if (!v) return;
    wordsDone.add(n);
    if (v.why === 'sound') tips.push(`‘${core(tw[n])}’처럼 소리 나도 ‘${core(w)}’라고 써요.`);
    else if (v.why === 'batchim') tips.push(`받침을 한 번 더 봐요: ‘${core(w)}’`);
    else if (v.why === 'vowel') tips.push(`‘${core(w)}’의 모음을 봐요. ㅐ와 ㅔ는 소리가 비슷해요!`);
    else tips.push(`소리는 세게 나도 ‘${core(w)}’라고 써요.`);
  });
  const wordIdx = i => { let n = 0; for (let k = 0; k < i; k++) if (E[k] === ' ') n++; return n; };
  for (const x of errs){
    if (x.i != null && wordsDone.has(wordIdx(x.i)) && x.kind !== 'space' && x.kind !== 'punct') continue;
    let tip = '';
    if (x.kind === 'jong') tip = `받침이 헷갈렸어요: ‘${x.t}’ → ‘${x.e}’`;
    else if (x.kind === 'vowel') tip = `모음이 헷갈렸어요: ‘${x.t}’ → ‘${x.e}’`;
    else if (x.kind === 'cho') tip = `첫소리를 봐요: ‘${x.t}’ → ‘${x.e}’`;
    else if (x.kind === 'char') tip = `‘${x.t}’ 자리에는 ‘${x.e}’를 써요`;
    else if (x.kind === 'miss') tip = `빠진 글자가 있어요: ‘${x.e}’`;
    else if (x.kind === 'extra') tip = `‘${x.t}’는 없어도 돼요`;
    else if (x.kind === 'space'){
      let a = x.i - 1; while (a > 0 && E[a - 1] !== ' ') a--;
      let b = x.i + 1; while (b < E.length - 1 && E[b + 1] !== ' ') b++;
      tip = `‘${E.slice(a, x.i).join('')} ${E.slice(x.i + 1, b + 1).join('')}’처럼 띄어 써요`;
    }
    else if (x.kind === 'join') tip = x.after >= 0 ? `‘${dtWordAt(E, x.after)}’는 붙여 써요` : '앞에 빈칸은 없어도 돼요';
    else if (x.kind === 'punct') tip = DT_PUNCT[x.e] ? `${DT_PUNCT[x.e]}도 꼭 써요` : `‘${x.t}’는 없어도 돼요`;
    if (tip && !seen.has(tip)){ seen.add(tip); tips.push(tip); }
  }
  const ok = errs.length === 0;
  return { ok, stars:ok ? 3 : (errs.length <= 2 ? 2 : 1), em, tm, errs, tips:tips.slice(0, 3) };
}
function dtMarks(list, mine){
  return list.map(x => {
    const c = x.c === ' ' ? ' ' : esc(x.c);
    if (x.st === 'bad') return `<span class="dt-bad">${c}</span>`;
    if (x.st === 'miss') return `<span class="dt-miss">${c}</span>`;
    if (x.st === 'sp') return `<span class="dt-sp" aria-label="띄어 써요"> </span>`;
    return `<span>${c}</span>${!mine && x.join ? '<span class="dt-join" aria-label="붙여 써요"></span>' : ''}`;
  }).join('');
}

/* ---------- 받아쓰기 층 (화면 위에 따로 — 5초 동기화에 쓰던 글자가 지워지지 않게) ---------- */

  const saved = dprogOf(k.id, l.id);
  DT = { kidId:k.id, listId:l.id, title:l.title, lines:l.lines.slice(), mode:kind === 'note' ? 'note' : 'type', once:kind === 'once', wrongOnly,
    q, qi:0, step:'intro', res:[], marks:{}, fb:null, retried:false, confirm:false, mood:'happy', say:'', typed:'',
    prog:JSON.parse(JSON.stringify(saved || { kidId:k.id, listId:l.id, best:0, runs:0, items:{}, days:{} })), t0:Date.now() };
  DT.say = wrongOnly ? `오답 노트 시간! ${callName(k.name)}, 다시 쓰면 오래오래 기억나.`
    : DT.mode === 'note' ? `공책이랑 연필 준비됐지? 뚜뚜가 한 문장씩 두 번 읽어 줄게!`
    : DT.once ? `도전! 이번엔 딱 한 번만 읽어 줄게. ${callName(k.name)}, 집중해 볼까?`

function dtLayer(){

function dtMouth(on){ const s = document.querySelector('#dtLayer .tt'); if (s) s.classList.toggle('talk', !!on); }

function dtTalk(text){

function dtEar(on){ const e = document.getElementById('dtEar'); if (e) e.classList.toggle('on', !!on); }
/* 문장을 읽어 준다 — 두 번째는 조금 더 천천히 */
async function dtRead(times){
  const d = DT; if (!d) return;
  const text = d.lines[d.q[d.qi]]; if (!text) return;
  hush();
  const n = times || (d.once ? 1 : 2);
  d.reading = true; dtEar(true);
  for (let r = 0; r < n; r++){
    if (DT !== d) return;
    await voice(text, { lang:'ko', rate:r ? 0.72 : 0.8, style:'dict', onstart:() => { if (DT === d) dtMouth(true); } });
    if (DT !== d) return;
    dtMouth(false);
    if (r < n - 1) await new Promise(ok => setTimeout(ok, 1100));
  }
  if (DT === d){ d.reading = false; dtEar(false); }
}

/* 문장 하나를 마칠 때마다 진도에 쓴다 (한 번에 한 줄을 제자리에서 고친다) */
function dtRecord(i, ok){
  const d = DT, p = d.prog, now = Date.now(), dk = todayKey();
  p.items = p.items || {}; p.days = p.days || {};
  const it = p.items[i] || { ok:0, no:0 };
  it[ok ? 'ok' : 'no']++; it.last = ok; it.at = now; p.items[i] = it;
  const day = p.days[dk] || { n:0, ok:0 }; day.n++; if (ok) day.ok++; p.days[dk] = day;
  d.res.push({ i, ok });
  if (ok && d.mode === 'type') awardStars(1);
  dtSave(p);
}
const DT_PID = {};
async function dtSave(p){
  const key = p.kidId + '|' + p.listId;
  const { id:_x, ...data } = p;
  const keys = Object.keys(data.days || {}).sort();
  if (keys.length > 90) keys.slice(0, keys.length - 90).forEach(k => { delete data.days[k]; });   // 석 달 치만
  const id = DT_PID[key] || (dprogOf(p.kidId, p.listId) || {}).id;
  if (id){ DT_PID[key] = id; await Store.update('dprog', id, data); }
  else { const nid = uid(); DT_PID[key] = nid; await Store.add('dprog', data, nid); }
}
function dtFinish(){
  const d = DT, p = d.prog, n = d.res.length, ok = d.res.filter(r => r.ok).length;
  d.prevBest = p.runs ? (p.best || 0) : null;
  if (!d.wrongOnly && n === d.lines.length){ p.best = Math.max(p.best || 0, Math.round(ok / n * 100)); }
  p.runs = (p.runs || 0) + 1;
  p.last = { at:Date.now(), mode:d.mode, ok, n, wrongOnly:d.wrongOnly };
  const dk = todayKey(), day = p.days[dk] || { n:0, ok:0 }; day.runs = (day.runs || 0) + 1; p.days[dk] = day;
  dtSave(p);
  awardStars(d.mode === 'note' ? 2 : 1);
  d.step = 'done'; d.cheer = true; dtMood('cheer');
  d.say = ok === n ? `우와! ${n}문장 모두 맞았어! 받아쓰기 박사야!` : `${n}문장 중에 ${ok}문장 맞았어! 끝까지 한 게 제일 멋져.`;

}

/* ---------- 🔤 영어 철자 놀이 — 단어 가방·스피치 원고의 단어로 ----------
   🧩 글자 맞추기 · 🎧 듣고 쓰기 · ✏️ 빈칸 채우기. 맞히면 상자가 올라가고(1·2·4·7·14일 뒤 다시), 틀리면 내일 또. */
const SP_DAYS = [0, 1, 2, 4, 7, 14, 30];
function spRow(kidId){ return S.data.spell.find(r => r.kidId === kidId); }
function spPool(kidId){
  const seen = new Set(), out = [], mask = new Set(ttMaskWords().map(w => w.toLowerCase()));
  const add = (w, ko, emoji, src) => {
    const t = String(w || '').trim().toLowerCase();
    if (!/^[a-z]{2,12}$/.test(t) || seen.has(t) || mask.has(t)) return;
    seen.add(t); out.push({ w:t, ko:ko || '', emoji:emoji || '', src });
  };
  S.data.words.filter(x => x.kidId === kidId && x.lang !== 'ko').forEach(x => add(x.term, x.meaning, x.emoji, 'bag'));
  const sc = ttScript(kidId);
  if (sc) sc.sentences.forEach(s => {
    const cap = new Set((String(s.en || '').match(/\b[A-Z][a-z]+/g) || []).slice(1).map(w => w.toLowerCase()));   // 문장 가운데 대문자 = 이름일 수 있다
    (s.stress || []).concat((s.tricky || []).map(t => t.word)).forEach(w => { if (String(w).length >= 3 && !cap.has(String(w).toLowerCase())) add(w, '', s.cue, 'speech'); });
  });
  QZ_EN.forEach(([w, ko, e]) => add(w, ko, e, 'extra'));
  return out;
}
function spDue(kidId){
  const r = spRow(kidId), box = (r && r.w) || {}, now = Date.now();
  const pool = spPool(kidId);
  const due = pool.filter(x => { const b = box[x.w]; return !b || !b.next || b.next <= now; });
  return { pool, due, box };
}
function spCard(){
  const { pool, due } = spDue(S.kidId);

  return `<div class="card" style="background:linear-gradient(170deg,#FFFFFF,#E3EDFB)">
    <div class="row"><div class="grow"><h3 class="sub" style="margin:0">🔤 영어 철자 놀이</h3>
      <div class="muted" style="font-size:14px">${mine ? `내 단어 가방·스피치 원고의 단어 ${mine}개로 연습해요` : '단어 가방에 영어 단어를 담으면 그 단어로 연습해요'}${due.length ? ` · 오늘 ${Math.min(due.length, 8)}개` : ''}</div></div></div>
    <div class="tt-foot" style="margin-top:12px">
      <button class="btn ghost" data-act="spGo" data-arg="tiles">🧩 글자 맞추기</button>

      <button class="btn ghost" data-act="spGo" data-arg="blank">✏️ 빈칸 채우기</button>
    </div></div>`;
}
function spShuffle(a){ return qzShuffle(a); }
function spMakeTiles(w, careful, hideIdx){
  const need = hideIdx ? hideIdx.map(i => w[i]) : w.split('');
  const extra = careful ? 2 : (w.length <= 4 ? 1 : 0), abc = 'abcdefghijklmnopqrstuvwxyz';
  const tiles = need.slice();
  for (let n = 0; n < extra; n++){ let c; do { c = abc[Math.floor(Math.random() * 26)]; } while (w.includes(c)); tiles.push(c); }

}
function spStart(mode){

function spSetup(){

  return `<h3>${title}</h3>

        : `${Z.mode !== 'listen' ? '<button class="btn ghost grow" data-act="spUndo">↩ 지우기</button>' : ''}<button class="btn grow" data-act="spCheck">확인 ✔</button>`}

function spDiff(w, g){
  if (!g) return '천천히 한 글자씩 소리 내어 써 봐요.';

}
function spGiven(){
  const Z = S.view.sp, w = Z.list[Z.i].w;
  if (Z.mode === 'listen'){ const i = document.getElementById('spIn'); return String(i ? i.value : '').trim().toLowerCase(); }
  const letters = Z.slots.map(id => (Z.tiles.find(t => t.id === id) || {}).ch || '');

async function spCheck(){

  if (Z.quick && !Z.confirm){ Z.confirm = true; Z.draft = Z.mode === 'listen' ? g : ''; openModal(spSheet()); toast('한 번 더 읽어 보고 확인을 눌러요 🔍'); return; }

  Z.res.push({ w:it.w, ok:Z.ok });
  if (Z.ok){ ttChime(); } else if (!Z.retry.has(it.w)){ Z.retry.add(it.w); Z.list.push(it); }   // 틀린 단어는 끝에 한 번 더

async function spFinish(){

  const days = JSON.parse(JSON.stringify((r && r.days) || {})), dk = todayKey();

  }
  days[dk] = { n:((days[dk] || {}).n || 0) + Object.keys(first).length };
  const ok = Object.values(first).filter(Boolean).length;
  if (ok) awardStars(ok);
  const data = { kidId:k.id, w:box, days };
  if (r) await Store.update('spell', r.id, data); else await Store.add('spell', data);

        await Store.update('dprog', p.id, { items });

/* 사진을 줄여서(긴 쪽 1600px) 서버로 보낸다 — 위치 정보 같은 사진 속 정보는 다시 그리면서 사라진다 */
function imgShrink(file, max, q){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, (max || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : bad(new Error('shrink')), 'image/jpeg', q || 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('image')); };
    img.src = url;
  });
}
function blobB64(blob){ return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => bad(r.error); r.readAsDataURL(blob); }); }
async function dlPhoto(file){
  dlKeep(); const dr = S.view.dlDraft; if (!dr || !file) return;
  dr.busy = true; dr.msg = ''; openModal(parentSheet());
  try {
    const b = await imgShrink(file, 1600, 0.85);
    const j = await ttAsk({ task:'ocr', image:await blobB64(b), mime:'image/jpeg' }, 60000);
    const groups = (j.groups || []).filter(g => g && Array.isArray(g.lines) && g.lines.length);
    if (!groups.length) throw new Error('사진에서 문장을 찾지 못했어요. 글자가 잘 보이게 다시 찍어 주세요.');
    dr.groups = groups;
    if (!String(dr.text || '').trim()){ dr.text = groups[0].lines.join('\n'); if (groups[0].title && !dr.id) dr.title = groups[0].title; }
    else dr.text = String(dr.text).replace(/\s+$/, '') + '\n' + groups[0].lines.join('\n');
    dr.msg = groups.length > 1 ? `급수표 ${groups.length}개를 찾았어요. 첫 번째를 칸에 넣었어요. 아래 단추로 한꺼번에 넣을 수도 있어요. 꼭 한 번 확인해 주세요!`
      : `${groups[0].lines.length}문장을 읽었어요. 틀린 글자가 없는지 꼭 확인해 주세요!`;
    dr.msgOk = true;
  } catch(e){ dr.msg = (e && e.message) || '사진을 읽지 못했어요. 직접 적어 주세요.'; dr.msgOk = false; }
  dr.busy = false;
  if (S.view.dlDraft === dr) openModal(parentSheet());
}

function thDayNo(d){ const x = d || new Date(); return Math.floor((new Date(x.getFullYear(), x.getMonth(), x.getDate()) - new Date(2026, 0, 1)) / 86400000); }
function tqToday(){ const n = thDayNo(); return TQ[((n % TQ.length) + TQ.length) % TQ.length]; }
function tqAnswer(kidId, date){ return thinkOf(kidId, 'q').find(x => x.date === (date || todayKey())); }
function tqStreak(kidId){
  let n = 0; const d = new Date();
  if (!tqAnswer(kidId)) d.setDate(d.getDate() - 1);          // 오늘 아직이면 어제까지 센다
  for (let i = 0; i < 60; i++){ if (tqAnswer(kidId, todayKey(d))) n++; else break; d.setDate(d.getDate() - 1); }
  return n;
}

}

/* ---------- 🎨 그림일기 (그림판은 화면 위 층 — 5초 동기화에 그림이 지워지지 않게) ---------- */
const DY_COLORS = ['#6B4A52', '#E85C7C', '#FF8FA8', '#FFB36B', '#FFD98E', '#9BE0C8', '#3FA687', '#7FB2F0', '#B3A6EE', '#FFFFFF'];
const DY_SIZES = [4, 9, 18];
/* 아이들이 자주 헷갈리는 맞춤법 — 고칠 곳과 힌트만 알려 주고, 고치는 건 아이가 한다 */
const KO_OOPS = [
  ['됬', '받침을 다시 볼까요? ‘되었’을 줄이면?'], ['되요', '‘되어요’를 줄이면 어떻게 쓸까요?'], ['되서', '‘되어서’를 줄이면 어떻게 쓸까요?'],
  ['몇일', '‘며칠’이라고 써요'], ['어떻해', '‘어떡해’와 ‘어떻게’를 헷갈렸나 봐요'], ['금새', '‘금세’가 맞아요 (금시에)'],
  ['희안', '‘희한’이라고 써요'], ['설겆이', '‘설거지’라고 써요'], ['오랫만', '‘오랜만’이라고 써요'], ['오랜동안', '‘오랫동안’이라고 써요'],
  ['왠만', '‘웬만’이라고 써요'], ['웬지', '‘왠지’라고 써요 (왜인지)'], ['않해', '‘안 해’처럼 ‘안’으로 써요'], ['않했', '‘안 했’처럼 ‘안’으로 써요'],
  ['않하', '‘안 하’처럼 ‘안’으로 써요'], ['않가', '‘안 가’처럼 ‘안’으로 써요'], ['않먹', '‘안 먹’처럼 ‘안’으로 써요'],
  ['곰곰히', '‘곰곰이’라고 써요'], ['깨끗히', '‘깨끗이’라고 써요'], ['일일히', '‘일일이’라고 써요'], ['틈틈히', '‘틈틈이’라고 써요'],
  ['가르키', '가리킬 때는 ‘가리키’라고 써요'], ['역활', '‘역할’이라고 써요'], ['바램', '바라는 마음은 ‘바람’이에요'], ['설레임', '‘설렘’이라고 써요'],
  ['뭐에요', '‘뭐예요’라고 써요'], ['아니예요', '‘아니에요’라고 써요'], ['할려고', '‘하려고’라고 써요'], ['갈려고', '‘가려고’라고 써요'],
  ['볼려고', '‘보려고’라고 써요'], ['엇그제', '‘엊그제’라고 써요'], ['구지', '‘굳이’라고 써요'], ['어의없', '‘어이없’이라고 써요']
];
function koOops(text){
  const t = String(text || ''), out = [];
  for (const [w, hint] of KO_OOPS) if (t.includes(w)) out.push({ word:w, hint });
  // ㄹ 받침 다음 '께' → '게' (할께 → 할게, 먹을께 → 먹을게). ‘함께’처럼 다른 받침은 그대로.
  const chars = [...t];
  for (let i = 1; i < chars.length; i++){
    if (chars[i] !== '께') continue;
    const a = kjSplit(chars[i - 1]);
    if (a && a[2] === 8){ const w = chars[i - 1] + '께'; if (!out.some(o => o.word === w)) out.push({ word:w, hint:`‘${chars[i - 1]}게’처럼 ‘게’로 써요` }); }
  }
  return out.slice(0, 6);
}
let DY = null;
function dyOpen(){
  if (DY || TT || DT) return;
  const k = curKid(); if (!k) return;
  DY = { kidId:k.id, color:DY_COLORS[0], size:DY_SIZES[1], strokes:[], cur:null, weather:(todayWeather() || {}).icon || '', hints:null, busy:false, askQuit:false };
  kvClear('dy');
  const el = document.createElement('div');
  el.className = 'ttl'; el.id = 'dyLayer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', '그림일기');
  document.body.appendChild(el);
  DY.el = el; dyDraw(true);
}
function dyClose(){ if (!DY) return; DY.el.remove(); DY = null; render(); }
function dyDraw(first){
  const d = DY;
  const tools = `<div class="dy-tools">
    ${DY_COLORS.map(c => `<button class="dy-color" data-act="dyColor" data-arg="${c}" aria-pressed="${d.color === c}" style="background:${c}" aria-label="${c === '#FFFFFF' ? '지우개' : '색깔'}">${c === '#FFFFFF' ? '🧽' : ''}</button>`).join('')}
    <span class="dy-sep"></span>
    ${DY_SIZES.map(s => `<button class="dy-size" data-act="dySize" data-arg="${s}" aria-pressed="${d.size === s}" aria-label="굵기 ${s}"><i style="width:${s + 4}px;height:${s + 4}px"></i></button>`).join('')}
    <button class="btn ghost sm" data-act="dyUndo">↩</button><button class="btn ghost sm" data-act="dyClear">🗑</button></div>`;
  const hints = d.hints ? (d.hints.length
    ? `<div class="tt-tip" style="margin-top:8px"><span style="font-size:22px">🔍</span><div><b>다시 볼까요?</b>${d.hints.map(h => `‘${esc(h.word)}’ — ${esc(h.hint)}`).join('<br>')}<div style="font-size:13px;margin-top:4px">고치는 건 내가 직접! 할 수 있어요 💪</div></div></div>`
    : '<div class="banner info" style="margin-top:8px"><span>✅</span><span>헷갈리기 쉬운 낱말은 안 보여요. 멋지게 썼어요!</span></div>') : '';
  const body = d.askQuit
    ? `<div class="tt-card stack" style="text-align:center;border:3px solid var(--butter)"><div style="font-size:40px">🤔</div>
        <h3 class="sub" style="margin:0">그림일기를 그만할까요?</h3><p class="muted" style="margin:0">저장하지 않으면 그림이 사라져요.</p>
        <div class="tt-foot"><button class="btn" data-act="dyQuitNo">계속 그릴래</button><button class="btn ghost" data-act="dyQuitYes">그만할래</button></div></div>`
    : `<div class="tt-card stack" style="gap:10px">
        <div class="row" style="gap:8px;flex-wrap:wrap"><b style="font-family:var(--display);font-size:20px">${esc(dateLabel())}</b><span class="grow"></span>
          <div class="chips">${WEATHERS.slice(0, 6).map(w => `<button class="chip" data-act="dyWeather" data-arg="${w.icon}" aria-pressed="${d.weather === w.icon}" aria-label="${w.label}">${w.icon}</button>`).join('')}</div></div>
        <canvas id="dyCanvas" class="dy-canvas" width="800" height="560" aria-label="그림 그리는 곳"></canvas>
        ${tools}
        ${kvField('dyTitle', '제목 (예: 놀이터에서 논 날)', { max:40 })}
        ${kvField('dyText', '오늘 있었던 일을 써 봐요', { area:true, max:400, h:110 })}
        ${hints}
        <div class="tt-foot"><button class="btn ghost" data-act="dyCheck" ${d.busy ? 'disabled' : ''}>${d.busy ? '🔍 살펴보는 중…' : '🔍 맞춤법 살펴보기'}</button><button class="btn" data-act="dySave">저장하기 🎨</button></div>
      </div>`;
  d.el.innerHTML = `<div class="ttl-top"><button class="ttl-x" data-act="dyExit" aria-label="그만하기">✕</button>
    <div class="ttl-dots"><span class="ttl-chip" style="background:var(--berry-soft);color:var(--berry-deep)">🎨 그림일기</span></div></div>
    <div class="ttl-body">${body}</div>`;
  if (!d.askQuit) dyBind(first);
}
function dyCtx(){ const c = document.getElementById('dyCanvas'); return c ? c.getContext('2d') : null; }
function dyRepaint(){
  const g = dyCtx(); if (!g) return;
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, 800, 560);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const s of DY.strokes.concat(DY.cur ? [DY.cur] : [])){
    g.strokeStyle = s.c; g.lineWidth = s.w * 2; g.beginPath();
    s.p.forEach((pt, i) => { if (i) g.lineTo(pt[0], pt[1]); else g.moveTo(pt[0], pt[1]); });
    if (s.p.length === 1){ g.lineTo(s.p[0][0] + 0.1, s.p[0][1]); }
    g.stroke();
  }
}
function dyBind(){
  const c = document.getElementById('dyCanvas'); if (!c) return;
  dyRepaint();
  const at = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * 800, (ev.clientY - r.top) / r.height * 560]; };
  c.addEventListener('pointerdown', ev => { if (!DY) return; ev.preventDefault(); DY.cur = { c:DY.color, w:DY.size, p:[at(ev)] }; try { c.setPointerCapture(ev.pointerId); } catch(e){} dyRepaint(); });
  c.addEventListener('pointermove', ev => { if (!DY || !DY.cur) return; DY.cur.p.push(at(ev)); dyRepaint(); });
  const up = () => { if (DY && DY.cur){ DY.strokes.push(DY.cur); DY.cur = null; dyRepaint(); } };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
}
ACTS.dyOpen = () => { dyOpen(); };
ACTS.dyColor = (arg) => { if (DY){ DY.color = arg; dyDraw(); } };
ACTS.dySize = (arg) => { if (DY){ DY.size = +arg; dyDraw(); } };
ACTS.dyWeather = (arg) => { if (DY){ DY.weather = DY.weather === arg ? '' : arg; dyDraw(); } };
ACTS.dyUndo = () => { if (DY && DY.strokes.length){ DY.strokes.pop(); dyRepaint(); } };
ACTS.dyClear = () => { if (DY && DY.strokes.length){ DY.strokes = []; dyRepaint(); } };
ACTS.dyExit = () => { if (!DY) return; if (!DY.strokes.length && !kv('dyText').trim()){ dyClose(); return; } DY.askQuit = true; dyDraw(); };
ACTS.dyQuitNo = () => { if (DY){ DY.askQuit = false; dyDraw(); } };
ACTS.dyQuitYes = () => { kvClear('dy'); dyClose(); };
ACTS.dyCheck = async () => {
  const d = DY; if (!d || d.busy) return;
  const text = kv('dyText') + ' ' + kv('dyTitle');
  d.hints = koOops(text);
  if (thinkAiOn() && text.trim().length > 4){
    d.busy = true; dyDraw();
    try {
      const j = await ttAsk({ task:'diary', text:ttMask(text).slice(0, 500) }, 40000);
      for (const s of (j.spots || [])) if (s && s.word && !d.hints.some(h => h.word === s.word)) d.hints.push({ word:String(s.word).slice(0, 20), hint:String(s.hint || '다시 볼까요?').slice(0, 60) });
    } catch(e){}
    if (DY === d) d.busy = false;
  }
  if (DY === d) dyDraw();
};
ACTS.dySave = async () => {
  const d = DY; if (!d) return;
  const title = kv('dyTitle').trim(), text = kv('dyText').trim();
  if (!d.strokes.length && !text){ toast('그림을 그리거나 글을 써 볼까요? 🎨'); return; }

  await Store.add('think', { kidId:d.kidId, type:'diary', date:todayKey(), title:title.slice(0, 40), text:text.slice(0, 400), weather:d.weather, img, at:new Date().toISOString() });

};

/* 끝났을 때 한마디 — 비슷하게 맞히면 "시간 감각 최고!" */
function estLine(est, secs){
  if (!est) return '';
  const act = Math.max(1, Math.round(secs / 60)), gap = Math.abs(act - est);
  if (gap <= Math.max(2, est * 0.25)) return `예상 ${est}분 → 진짜 ${act}분! 딱 맞혔어요 🎯`;
  return act < est ? `예상 ${est}분 → 진짜 ${act}분! 생각보다 빨리 끝냈어요 ⚡` : `예상 ${est}분 → 진짜 ${act}분! 다음엔 조금 더 넉넉히 생각해 봐요 🌱`;
}
function estHit(est, secs){ if (!est) return false; const act = Math.max(1, Math.round(secs / 60)); return Math.abs(act - est) <= Math.max(2, est * 0.25); }

/* ---------- 📷 사진 — 비공개 저장소(가족만)에 올리고, 안 되면 이 기기에만 둔다 ----------
   폴더 이름은 가족 ID가 아니라 그 해시(SHA-256)라서, 사진 주소가 새어도 가족 기록 전체가 열리지 않는다.
   사진은 긴 쪽 1600px로 줄이면서 다시 그리므로 위치 같은 사진 속 정보(EXIF)가 사라진다. */
const PB = { hash:'', bucket:null, urls:new Map() };
const PhotoDB = {
  _db:null,
  open(){
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('dolearn-photos', 1);
        rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('p')) db.createObjectStore('p', { keyPath:'id' }); };
        rq.onsuccess = () => { this._db = rq.result; res(this._db); };
        rq.onerror = () => rej(rq.error);
      } catch(e){ rej(e); }
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('p', mode), st = t.objectStore('p'); let out;
      const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(rec){ return this.tx('readwrite', st => st.put(rec)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};
function blobBuf(blob){ return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(r.error); r.readAsArrayBuffer(blob); }); }
async function famHash(){
  if (PB.hash) return PB.hash;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(S.familyId)));
  PB.hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  return PB.hash;
}
/* 가족 사진 저장소가 있는지 한 번 살펴본다 — 저장소를 만들 때 함께 만든 memories_ready() 가 true 를 돌려준다
   (없는 저장소를 list 하면 오류 없이 빈 목록이 와서, 따로 물어본다) */
async function photoBucketOk(){
  if (PB.bucket != null) return PB.bucket;
  if (!S.sb){ PB.bucket = false; return false; }
  try { const r = await S.sb.rpc('memories_ready'); PB.bucket = !r.error && r.data === true; }
  catch(e){ PB.bucket = false; }
  return PB.bucket;
}
async function photoSave(blob, kind){
  if (await photoBucketOk()){
    try {
      const path = `${await famHash()}/${kind || 'p'}-${uid()}.jpg`;
      const up = await S.sb.storage.from('memories').upload(path, blob, { contentType:'image/jpeg', upsert:false });
      if (up.error) throw up.error;
      return 'sb:' + path;
    } catch(e){ console.warn('사진 올리기 실패 — 이 기기에 둔다', e); if (/bucket/i.test(String((e && e.message) || ''))) PB.bucket = false; }
  }
  const id = uid();
  await PhotoDB.put({ id, at:Date.now(), mime:'image/jpeg', data:await blobBuf(blob) });
  return 'dev:' + id;
}
async function photoUrl(ref){
  if (PB.urls.has(ref)) return PB.urls.get(ref);
  let url = '';
  if (ref.indexOf('sb:') === 0 && S.sb){
    const r = await S.sb.storage.from('memories').createSignedUrl(ref.slice(3), 86400);
    if (r && r.data && r.data.signedUrl) url = r.data.signedUrl;
  } else if (ref.indexOf('dev:') === 0){
    const rec = await PhotoDB.get(ref.slice(4));
    if (rec && rec.data) url = URL.createObjectURL(new Blob([rec.data], { type:rec.mime || 'image/jpeg' }));
  }
  if (url) PB.urls.set(ref, url);
  return url;
}
async function photoDel(ref){

/* 그린 화면의 <img data-photo="…">에 사진을 채운다 (다른 기기에만 있는 사진이면 안내 그림) */

const G = { ready:false, loading:false, error:false, canvas:null, ctx:null, W:0, rot:[127, 20], feats:[], proj:null, path:null, grat:null,
  drag:null, vel:[0, 0], spin:true, anim:0, raf:0, touched:false };

function worldMount(){

/* 나라 색 — 가 본 곳(혼자든 같이든)은 내 색 하나로 */
function globeColors(){
  const me = S.kidId;
  const mine = wVisited(me);
  const found = new Set(stampsOf(me, 'found').map(s => s.code)), learn = new Set(stampsOf(me, 'learn').map(s => s.code));
  const wish = new Set(wishesOf(me).map(w => w.code));

}
function globeDraw(){
  if (!G.ready || !G.canvas || !G.path) return;
  const g = G.ctx, W = G.W, r = W / 2 - 4, C = globeColors();
  G.proj.scale(r).translate([W / 2, W / 2]).rotate([-G.rot[0], -G.rot[1]]);
  g.clearRect(0, 0, W, W);
  const sea = g.createRadialGradient(W * 0.38, W * 0.32, r * 0.1, W / 2, W / 2, r);
  sea.addColorStop(0, '#EAF7FF'); sea.addColorStop(1, '#B7DDF4');

  g.beginPath(); G.path(G.grat); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 0.8; g.stroke();
  let selF = null;
  for (const f of G.feats){
    const a = f.a2, m = C.mine.has(a);
    let fill = '#FFF7EA';
    if (m) fill = C.cm;
    else if (C.found.has(a)) fill = '#E4D2F3'; else if (C.learn.has(a)) fill = '#EEE7FA';
    else if (a && a === C.today) fill = '#FFF1B8';
    g.beginPath(); G.path(f); g.fillStyle = fill; g.fill();
    g.strokeStyle = '#D9B994'; g.lineWidth = 0.6; g.stroke();
    if (C.wish.has(a) && !m){ g.save(); g.setLineDash([3, 3]); g.strokeStyle = '#E85C7C'; g.lineWidth = 1.4; g.stroke(); g.restore(); }
    if (a && a === C.sel) selF = f;

  // 핀 — 여행한 곳 📍, 오늘의 나라 ⭐, 고른 나라의 랜드마크, 지도에 안 나오는 작은 나라

}
function globePins(C){
  const out = [], seen = new Set();
  for (const t of tripsFor(S.kidId)) if (t.ll && t.ll.length === 2){ const k = t.ll.join(','); if (!seen.has(k)){ seen.add(k); out.push({ lat:t.ll[0], lon:t.ll[1], e:'📍', code:t.code, trip:t.id }); } }
  const td = wToday(); out.push({ lat:td.ll[0], lon:td.ll[1], e:'⭐', code:td.c, size:20 });
  const sel = C && C.sel ? wInfo(C.sel) : null;
  if (sel && sel.c !== td.c) out.push({ lat:sel.ll[0], lon:sel.ll[1], e:sel.le, code:sel.c, size:22 });
  for (const [a2, v] of Object.entries(WORLD_SMALL)){
    if ((C && (C.mine.has(a2) || C.wish.has(a2) || C.sel === a2)) || a2 === td.c) out.push({ lat:v[1], lon:v[2], e:(C && C.sel === a2) ? '🔴' : '🔸', code:a2, size:14 });
  }
  return out;
}
function globePick(x, y){
  const ll = G.proj.invert([x, y]);
  if (!ll || isNaN(ll[0]) || d3.geoDistance(ll, G.rot) > Math.PI / 2) return null;
  let best = null, bd = 22;
  for (const p of globePins(globeColors())){
    if (d3.geoDistance([p.lon, p.lat], G.rot) > Math.PI / 2) continue;
    const xy = G.proj([p.lon, p.lat]); if (!xy) continue;
    const d = Math.hypot(xy[0] - x, xy[1] - y + 8); if (d < bd){ bd = d; best = p.code; }
  }
  if (best) return best;
  const f = G.feats.find(ff => d3.geoContains(ff, ll));
  return f ? (f.a2 || null) : null;
}
function globeBind(c){
  c.style.touchAction = 'none';
  const pos = ev => { const r = c.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  c.addEventListener('pointerdown', ev => {
    ev.preventDefault(); G.touched = true; cancelAnimationFrame(G.raf); G.anim = 0;
    const p = pos(ev); G.drag = { x0:p[0], y0:p[1], x:p[0], y:p[1], t:performance.now(), moved:0 }; G.vel = [0, 0];
    try { c.setPointerCapture(ev.pointerId); } catch(e){}
  });
  c.addEventListener('pointermove', ev => {
    const d = G.drag; if (!d) return;
    const p = pos(ev), dx = p[0] - d.x, dy = p[1] - d.y, now = performance.now();
    const k = 180 / (Math.PI * (G.W / 2)) * 1.1;
    G.rot[0] -= dx * k; G.rot[1] = clamp(G.rot[1] + dy * k, -75, 75);
    const dt = Math.max(8, now - d.t); G.vel = [-dx * k / dt * 16, dy * k / dt * 16];
    d.x = p[0]; d.y = p[1]; d.t = now; d.moved += Math.abs(dx) + Math.abs(dy);
    globeDraw();
  });
  const up = ev => {
    const d = G.drag; G.drag = null; if (!d) return;
    if (d.moved < 8){ const code = globePick(d.x0, d.y0); if (code){ S.view.wSel = code; ttTone(784, 0, 0.12, 0.08); render(); } return; }
    // 손을 떼면 조금 더 굴러가다 멈춘다
    const glide = () => {
      if (G.drag || !G.canvas.isConnected) return;
      G.vel = [G.vel[0] * 0.92, G.vel[1] * 0.92];
      if (Math.abs(G.vel[0]) + Math.abs(G.vel[1]) < 0.03) return;
      G.rot[0] += G.vel[0]; G.rot[1] = clamp(G.rot[1] + G.vel[1], -75, 75);
      globeDraw(); G.raf = requestAnimationFrame(glide);
    };
    G.raf = requestAnimationFrame(glide);
  };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', () => { G.drag = null; });
}
/* 처음 열면 천천히 돈다 — 손대면 멈춘다 (1분 뒤에도 멈춘다) */
function globeSpin(){
  if (G.anim) return;
  G.anim = 1; const t0 = performance.now();
  const step = now => {
    if (!G.anim || G.touched || G.drag || S.tab !== 'world' || !G.canvas || !G.canvas.isConnected || document.hidden || now - t0 > 60000 || S.view.wSel){ G.anim = 0; return; }
    G.rot[0] += 0.12; globeDraw(); requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function globeFly(lat, lon){
  if (!G.ready) return;
  G.touched = true; G.anim = 0; cancelAnimationFrame(G.raf);
  const a0 = G.rot.slice(), dl = ((lon - a0[0] + 540) % 360) - 180, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 900), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    G.rot = [a0[0] + dl * e, a0[1] + (clamp(lat, -60, 60) - a0[1]) * e];
    globeDraw(); if (k < 1 && G.canvas && G.canvas.isConnected) G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);
}
function wCenter(a2){
  const i = wInfo(a2); if (i) return i.ll;
  if (WORLD_SMALL[a2]) return [WORLD_SMALL[a2][1], WORLD_SMALL[a2][2]];

}

/* ============================================================
   이벤트 배선
   ============================================================ */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-pick],[data-tick],[data-start],[data-stop],[data-deltodo],'+
    '[data-book],[data-mode],[data-say],[data-game],[data-mem],[data-ml],[data-mr],[data-cat],[data-stars],'+
    '[data-close],[data-pin],[data-pinclear],[data-pinback],[data-ptab],[data-addtodo],[data-parentdel],'+
    '[data-kidav],[data-kidcol],[data-grant],[data-relock],[data-approve],[data-deny],'+
    '[data-nday],[data-tday],[data-tglink],[data-bookedit],[data-bookdel],[data-bookshow],[data-becat],[data-bestar],'+
    '[data-weather],[data-cand],[data-ttword],[data-pz],[data-act],button');
  if (!t) return;
  const d = t.dataset;

  /* --- 첫 설정 --- */
  if (t.id === 'setupGo'){
    const n1 = ($('#setup1').value||'').trim();
    const n2 = ($('#setup2').value||'').trim();
    const pin = ($('#setupPin').value||'').trim();
    if (!n1){ toast('첫째 이름을 적어주세요'); $('#setup1').focus(); return; }
    if (!n2){ toast('둘째 이름도 적어주세요'); $('#setup2').focus(); return; }
    if (!/^\d{4}$/.test(pin)){ toast('부모님 비밀번호를 숫자 4자리로 정해주세요'); $('#setupPin').focus(); return; }
    await Store.saveSettings({ pin, pinSet:true });
    const now = new Date().toISOString();
    await Store.add('profiles', { name:n1, avatar:AVATARS[0], colorIdx:0, stars:0, createdAt:now });
    await Store.add('profiles', { name:n2, avatar:AVATARS[1], colorIdx:1, stars:0, createdAt:new Date(Date.now()+1).toISOString() });
    askConfirm({
      title:'예시를 넣어볼까요?', okLabel:'넣어주세요',
      note:'책·낱말·할 일 예시를 채워 화면이 어떻게 보이는지 보여드려요. 부모님 화면에서 언제든 지울 수 있어요.',
      onOk: async () => { await seedSample(); toast('예시를 넣었어요'); }
    });
    return;
  }

  /* --- 날씨 --- */
  if (t.id === 'pickWeather' || t.id === 'dateChip'){ openModal(weatherSheet()); return; }
  if (d.weather){
    const w = WEATHERS[+d.weather];
    setWeather(w.icon, w.label); closeModal(); return;
  }
  if (t.id === 'autoWeather' || t.id === 'hereWeather'){
    t.disabled = true; t.textContent = '가져오는 중…';
    const ok = await autoWeather(t.id === 'hereWeather');
    if (ok) closeModal(); else openModal(weatherSheet());
    return;
  }

  /* --- 프로필 --- */
  if (d.pick){ kidEnter(d.pick); return; }
  if (t.id === 'whoami' || t.id === 'homeBtn'){
    S.kidId = null; S.view.game = null; stopStars(); render(); return;
  }
  if (t.id === 'addKidHere'){
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose='parent'; S.view.parentTab='kids';
    openModal(pinSheet('부모님, 친구를 추가할까요?'));
    return;
  }
  if (t.id === 'openParent'){ S.view.pin=''; S.view.pinError=''; S.view.pinPurpose='parent'; openModal(pinSheet('부모님 화면')); return; }

  /* --- 새 기능 단추 (data-act) — 받아쓰기·철자·생각·세계 --- */
  if (d.act && ACTS[d.act]){ await ACTS[d.act](d.arg != null ? d.arg : '', t); return; }
  /* --- ✏️ 한붓그리기 층 --- */
  if (OL && OL.el.contains(t)){ olClick(t); return; }
  /* --- 🦜 뚜뚜 --- */
  if (TT && document.getElementById('ttLayer') && document.getElementById('ttLayer').contains(t)){
    await ttClick(t, d);
    return;
  }
  if (t.id === 'ttGo' || d.ttgo){ ttOpenLesson(); return; }
  if (d.ttone){ ttOpenLesson(false, +d.ttone); return; }
  if (t.id === 'ttStage'){ eccOpen(); return; }
  if (t.id === 'ttSample'){ await ttAddSample(); return; }
  if (t.id === 'ttRecs'){ ttRecsSheet(); return; }
  if (d.ttplay){ try { const r = await AudioBox.get(d.ttplay); if (r) playBlob(AudioBox.blob(r)); } catch(e){} return; }
  if (await ttParentClick(t, d)) return;
  if (quizClick(t, d)) return;
  if (d.kudo != null && d.kudo !== ''){
    const other = kids().find(k => k.id !== S.kidId), me = curKid();
    if (!other || !me || kudosToday(S.kidId) >= 3) return;
    await Store.add('kudos', { from:S.kidId, to:other.id, reason:KUDOS[+d.kudo] || KUDOS[4], at:new Date().toISOString() });
    cheerPopup({ emoji:'💌', title:'칭찬 스티커를 보냈어요!', sub:`고마운 마음을 전하는 ${me.name}, 정말 멋져요!` });
    return;
  }
  if (d.parentkudo){
    await Store.add('kudos', { from:'p:' + (S.parentId || 'owner'), to:d.parentkudo, reason:'😇 착한 일을 했어요', room:'family', at:new Date().toISOString() });
    toast('칭찬 스티커를 붙여줬어요 😇'); openModal(parentSheet()); return;
  }

  /* --- 탭 --- */
  if (d.tab){ S.tab = d.tab; if (d.tab!=='games'){ S.view.game=null; stopStars(); } render(); return; }

  /* --- 할 일 --- */
  if (d.tick){
    const key = todayKey(), s = sessionOf(S.kidId, d.tick, key);
    const td = S.data.todos.find(x => x.id === d.tick);
    if (td && td.kind === 'speech' && !(s && s.done) && ttScript(S.kidId)){
      toast('뚜뚜랑 오늘 미션을 끝내면 저절로 체크돼요! 🦜');
      ttOpenLesson();
      return;
    }
    if (s && s.done){ await Store.update('sessions', s.id, { done:false }); return; }   // 체크 해제는 응원 없이
    if (s) await Store.update('sessions', s.id, { done:true });
    else await Store.add('sessions', { kidId:S.kidId, todoId:d.tick, date:key, durationSec:0, done:true });
    cheerDone();
    return;
  }
  if (d.start){ openModal(estSheet(d.start)); return; }          // ⏱ 몇 분 걸릴지 먼저 생각해 본다
  if (d.stop){
    const dur = (Date.now() - S.running.startedAt)/1000, est = S.running.est || 0;
    S.running = null;
    const key = todayKey(), s = sessionOf(S.kidId, d.stop, key);
    const wasDone = !!(s && s.done);
    const extra = est ? { est, estHit:estHit(est, dur) } : {};
    if (s) await Store.update('sessions', s.id, { durationSec:(s.durationSec||0)+dur, done:true, ...extra });
    else await Store.add('sessions', { kidId:S.kidId, todoId:d.stop, date:key, durationSec:dur, done:true, ...extra });
    const line = estLine(est, dur);
    if (!wasDone) cheerDone(line); else if (line) toast(line);
    return;
  }
  if (d.deltodo){ await Store.update('todos', d.deltodo, { archived:true }); return; }
  if (t.id === 'addTodo'){
    askText({
      title:'무슨 일을 할까요?', note:'내가 하고 싶은 일을 적어요.',
      placeholder:'예: 그림 그리기', okLabel:'넣기',
      onOk: async (v) => {
        await Store.add('todos', { kidId:S.kidId, title:v, icon:'✨', repeatDays:[],
          createdBy:'kid', createdAt:new Date().toISOString() });
        toast('스스로 할 일을 정했네요! 할 수 있어요 💪');
      }
    });
    return;
  }

  /* --- 책 --- */
  if (t.id === 'addBook' || t.id === 'addBook2' || t.id === 'addToRead'){
    S.view.wiz = { step:'scan', category:(S.settings.cats||DEFAULT_CATS)[0], stars:3, words:[], status:t.id === 'addToRead' ? 'toread' : 'read' };
    openModal(bookWizard());
    startScanner();
    return;
  }
  if (t.id === 'wizManual'){
    stopScanner();
    S.view.wiz.step = 'info';
    S.view.wiz.guessNote = '책 제목을 적어주세요.';
    openModal(bookWizard());
    return;
  }
  if (d.cat){ keepWizTyping(); S.view.wiz.category = d.cat; openModal(bookWizard()); return; }
  if (d.stars){ keepWizTyping(); S.view.wiz.stars = +d.stars; openModal(bookWizard()); return; }
  if (t.id === 'wizSearchTitle'){
    const w = S.view.wiz;
    w.title = ($('#wizTitle').value||'').trim();
    if (!w.title){ toast('제목을 조금만 적어주면 찾아볼게요! 🔎'); return; }
    w.busy = true; openModal(bookWizard());
    const r = await bookSearch(w.title, 'title');
    w.busy = false;
    if (r.ok){ w.candidates = r.docs; w.guessNote = r.docs.length ? '맞는 책을 골라주세요.' : ''; }
    else { w.candidates = null; w.guessNote = BOOK_MSG[r.reason] || '지금은 찾을 수 없어요.'; }
    openModal(bookWizard());
    return;
  }
  if (d.cand){
    const w = S.view.wiz, c = (w.candidates||[])[+d.cand];
    if (c){ w.title = c.title; w.author = c.author; w.coverUrl = c.coverUrl; w.publisher = c.publisher;
      if (c.category) w.category = c.category;
      w.found = 'shop'; w.candidates = null; w.guessNote = '이 책으로 할게요!'; }
    openModal(bookWizard());
    return;
  }
  if (t.id === 'wizToCover'){
    const w = S.view.wiz;
    w.title = ($('#wizTitle').value||'').trim();
    w.author = ($('#wizAuthor').value||'').trim();
    w.ar = arParse(($('#wizAr') || {}).value);
    if (!w.title){ toast('책 제목을 적어줄래요? 📚'); return; }
    w.step = 'cover'; openModal(bookWizard()); return;
  }
  if (t.id === 'wizSkipCover' || t.id === 'wizSave'){ await saveBook(); return; }
  if (t.id === 'wizAddWord'){
    const inp = $('#wizWord'); const v = (inp.value||'').trim();
    if (v){ S.view.wiz.words.push(v); inp.value=''; openModal(bookWizard()); }
    return;
  }
  if (t.id === 'wizDone'){                                  // 느낌까지 다 썼어요
    const w = S.view.wiz, feel = kv('wizFeel').trim().slice(0, 80), b = w && S.data.books.find(x => x.id === w.savedId);
    if (b && feel){ await Store.update('books', b.id, { feel }); if (!b.feel) awardStars(1); }
    kvClear('wizFeel'); S.view.wiz = null;
    closeModal(); S.tab = 'shelf'; render();
    if (feel) toast('책에 내 느낌을 남겼어요 📖');
    return;
  }
  if (d.book){ showBook(d.book); return; }
  if (d.bookshow){ S.view.bookEdit = null; showBook(d.bookshow); return; }
  if (d.bookedit){ bookEditOpen(d.bookedit, ''); return; }
  if (d.becat){ keepBookEditTyping(); S.view.bookEdit.category = d.becat; openModal(bookEditSheet()); return; }
  if (d.bestar){ keepBookEditTyping(); S.view.bookEdit.stars = +d.bestar; openModal(bookEditSheet()); return; }
  if (t.id === 'beSave'){
    keepBookEditTyping();
    const e = S.view.bookEdit, b = S.data.books.find(x => x.id === e.id);
    if (!b){ closeModal(); return; }
    if (!e.title.trim()){ toast('책 제목을 적어줄래요? 📚'); $('#beTitle').focus(); return; }
    e.saving = true; openModal(bookEditSheet());
    const patch = { title:e.title.trim(), author:e.author.trim(), category:e.category, stars:e.stars, ar:arParse(e.ar), status:e.status === 'toread' ? 'toread' : 'read' };
    if (patch.status === 'read'){ patch.feel = String(e.feel || '').trim().slice(0, 80); if (!b.readAt) patch.readAt = new Date().toISOString(); }
    if (patch.status === 'toread'){ patch.readAt = null; if (!b.addedAt) patch.addedAt = new Date().toISOString(); }
    if (e.coverFile){
      const up = await uploadCover(e.coverFile);
      if (up){
        await removeCoverFile(b);                     // 예전에 찍은 사진은 지운다
        patch.coverUrl = up.coverUrl; patch.coverAssetId = up.coverAssetId;
      }
    }
    await Store.update('books', e.id, patch);
    S.view.bookEdit = null;
    toast('책을 고쳤어요 ✨');
    if (e.back === 'parent') openModal(parentSheet()); else showBook(b.id);
    return;
  }
  if (d.bookdel){
    const b = S.data.books.find(x => x.id === d.bookdel); if (!b) return;
    askConfirm({
      title:`「${b.title}」 책을 지울까요?`, danger:true, okLabel:'지우기',
      note:'책장에서 사라지고 되돌릴 수 없어요. 이 책에서 담은 낱말은 단어 가방에 그대로 남아요.',
      onOk: async () => {
        await removeCoverFile(b);
        await Store.remove('books', b.id);
        toast('책을 지웠어요');
      }
    });
    return;
  }

  /* --- 단어 --- */
  if (d.mode){ S.view.dictMode = d.mode; S.view.dictResult=null; render(); return; }
  if (d.say){ speak(d.say, d.lang); return; }
  if (t.id === 'micBtn'){
    const mode = S.view.dictMode === 'kk' ? 'kk' : 'en';
    listen(mode==='kk'?'ko':'en', txt => { S.view.dictQuery = txt; render(); doLookup(txt); });
    return;
  }
  if (t.id === 'dictGo'){
    const q = ($('#dictInput').value||'').trim();
    if (q) doLookup(q);
    return;
  }
  if (t.id === 'saveWord'){
    const r = S.view.dictResult; if (!r) return;
    await Store.add('words', {
      kidId:S.kidId, term:r.term, lang:(S.view.dictMode==='kk')?'ko':'en',
      meaning:r.meaning, meaningEn:r.meaningEn || '', example:r.example, emoji:r.emoji, box:1,
      nextReviewAt:new Date(Date.now()+86400000).toISOString(), createdAt:new Date().toISOString()
    });
    S.view.dictResult = null; S.view.dictQuery=''; render();
    return;
  }
  if (t.id === 'startReview'){ startReview(); return; }
  if (t.id === 'revKnow' || t.id === 'revAgain'){
    const st = S.view.review;
    const w = st.queue[st.i];
    if (w){
      const box = t.id === 'revKnow' ? Math.min(5,(w.box||1)+1) : 1;
      const days = [1,2,4,7,15][box-1];
      await Store.update('words', w.id, { box, nextReviewAt:new Date(Date.now()+days*86400000).toISOString() });
    }
    st.i++; st.show = false;
    if (st.i >= st.queue.length){ closeModal(); confetti(); cheerPopup({ emoji:'🫧', title:'복습 끝! 최고예요!', sub:'"아직이요" 한 낱말도 괜찮아요. 다음에 또 보면 기억날 거예요' }); }
    else openModal(reviewSheet());
    return;
  }
  if (t.id === 'revShow'){ S.view.review.show = true; openModal(reviewSheet()); return; }

  /* --- 게임 --- */
  if (t.id === 'askUnlock'){ await requestUnlock(); return; }
  if (t.id === 'cancelReq'){
    const mine = pendingRequests().find(r=>r.kidId===S.kidId);
    if (mine) await Store.remove('requests', mine.id);
    return;
  }
  if (t.id === 'pinHere'){
    const mine = pendingRequests().find(r=>r.kidId===S.kidId);
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose = mine ? 'approve:'+mine.id : 'unlock';
    openModal(pinSheet('부모님, 열어주세요', '오늘 할 일을 모두 마쳤어요!'));
    return;
  }
  if (d.approve){
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose = 'approve:'+d.approve;
    openModal(pinSheet('승인하시겠어요?', S.fromTelegram ? `텔레그램으로 연 승인은 대표 관리자 ${ownerNick()}의 비밀번호로만 돼요.` : '부모님 비밀번호를 눌러주세요.'));
    return;
  }
  if (d.deny){ denyRequest(d.deny); return; }
  if (d.game === 'memory'){ startMemory(); return; }
  if (d.game === 'stars'){ startStars(); return; }
  if (d.game === 'match'){ startMatch(); return; }
  if (d.game === 'sling'){ S.view.game = 'sling'; openSling(); return; }
  if (d.game === 'stack'){ startStack(); return; }
  if (d.game === 'pizza'){ startPizza(); return; }
  if (d.game === 'pattern'){ startPattern(); return; }
  if (d.game === 'oneline'){ S.view.game = 'oneline'; openOneline(); return; }
  if (d.game === 'itto'){ S.view.game = 'itto'; ittoOpen(); return; }
  if (d.game === 'bear'){ S.view.game = 'bear'; bearOpen(); return; }
  if (d.stk != null && d.stk !== ''){ stackTap(+d.stk); return; }
  if (t.id === 'stkNext'){ const st = S.view.stk; if (st){ st.q = stkMake(st.lv); st.pick = null; st.answered = false; render(); } return; }
  if (d.pz != null && d.pz !== ''){ pizzaTap(+d.pz); return; }
  if (t.id === 'pzGo'){ pizzaGo(); return; }
  if (t.id === 'pzReset'){ if (S.view.pz){ S.view.pz.sel = []; S.view.pz.msg = ''; render(); } return; }
  if (t.id === 'pzNext'){ const st = S.view.pz; if (st){ st.q = pzMake(st.lv); st.sel = []; st.done = false; st.msg = ''; st.tries = 0; render(); } return; }
  if (d.pt != null && d.pt !== ''){ patternTap(+d.pt); return; }
  if (t.id === 'ptNext'){ const st = S.view.pt; if (st){ st.q = ptMake(st.lv); st.pick = null; st.answered = false; render(); } return; }
  if (d.mem){ memTap(+d.mem); return; }
  if (d.ml){ matchTap('l', d.ml); return; }
  if (d.mr){ matchTap('r', d.mr); return; }
  if (t.id === 'quitGame'){ S.view.game = null; stopStars(); render(); return; }

  /* --- 모달/PIN --- */
  if (d.close){ closeModal(); return; }
  if (d.pin){
    S.view.pin = (S.view.pin||'') + d.pin;
    S.view.pinError = '';
    if (S.view.pin.length === 4) return checkPin();
    openModal(pinSheet(pinTitle()));
    return;
  }
  if (d.pinback){ S.view.pin = (S.view.pin||'').slice(0,-1); openModal(pinSheet(pinTitle())); return; }
  if (d.pinclear){ S.view.pin = ''; openModal(pinSheet(pinTitle())); return; }

  /* --- 부모 --- */
  if (d.ptab){
    S.view.parentTab = d.ptab;
    if (d.ptab === 'notify') S.view.tg = null;   // 알림 탭을 열 때마다 연결 상태를 새로 확인
    openModal(parentSheet()); return;
  }
  if (d.addtodo){
    const inp = document.querySelector(`[data-newtodo="${d.addtodo}"]`);
    const v = (inp && inp.value||'').trim();
    if (!v){ toast('할 일을 적어주세요'); if (inp) inp.focus(); return; }
    const days = (S.view.newTodoDays||{})[d.addtodo] || [];
    await Store.add('todos', { kidId:d.addtodo, title:v, icon:'📌',
      repeatDays:days.slice().sort(), createdBy:'parent', createdAt:new Date().toISOString() });
    if (S.view.newTodoDays) S.view.newTodoDays[d.addtodo] = [];
    if (S.view.newTodoText) S.view.newTodoText[d.addtodo] = '';
    openModal(parentSheet());
    toast('할 일을 넣었어요');
    return;
  }
  // 새 할 일의 요일 고르기
  if (d.nday){
    const [kidId, which] = d.nday.split('|');
    S.view.newTodoDays = S.view.newTodoDays || {};
    S.view.newTodoText = S.view.newTodoText || {};
    const inp = document.querySelector(`[data-newtodo="${kidId}"]`);
    if (inp) S.view.newTodoText[kidId] = inp.value;      // 다시 그려도 적던 글자가 남게
    const cur = S.view.newTodoDays[kidId] || [];
    if (which === 'all') S.view.newTodoDays[kidId] = [];
    else {
      const n = +which;
      S.view.newTodoDays[kidId] = cur.includes(n) ? cur.filter(x=>x!==n) : cur.concat(n).sort();
    }
    openModal(parentSheet());
    return;
  }
  // 이미 있는 할 일의 요일 바꾸기
  if (d.tday){
    const [todoId, which] = d.tday.split('|');
    const todo = S.data.todos.find(x=>x.id===todoId);
    if (!todo) return;
    const cur = Array.isArray(todo.repeatDays) ? todo.repeatDays : [];
    let next;
    if (which === 'all') next = [];
    else { const n = +which; next = cur.includes(n) ? cur.filter(x=>x!==n) : cur.concat(n).sort(); }
    await Store.update('todos', todoId, { repeatDays: next });
    openModal(parentSheet());
    return;
  }
  if (d.parentdel){ await Store.update('todos', d.parentdel, { archived:true }); openModal(parentSheet()); return; }
  if (d.kidav){ const [id,av] = d.kidav.split('|'); await Store.update('profiles', id, { avatar:av }); openModal(parentSheet()); return; }
  if (d.kidcol){ const [id,ci] = d.kidcol.split('|'); await Store.update('profiles', id, { colorIdx:+ci }); openModal(parentSheet()); return; }
  if (d.kidstyle){
    const [id, f, v] = d.kidstyle.split('|'), k = kid(id); if (!k) return;
    const st = kidStyle(k);
    if (f === 'strengths') st.strengths = st.strengths.includes(v) ? st.strengths.filter(x => x !== v) : st.strengths.concat(v);
    else st[f] = st[f] === v ? '' : v;                    // 한 번 더 누르면 비운다
    await Store.update('profiles', id, { style:st }); openModal(parentSheet()); return;
  }
  if (t.id === 'addKid'){
    askText({
      title:'새 친구 이름은?', placeholder:'이름', okLabel:'추가',
      onOk: async (n) => {
        const i = kids().length;
        await Store.add('profiles', { name:n, avatar:AVATARS[i%AVATARS.length],
          colorIdx:i%KID_COLORS.length, stars:0, createdAt:new Date().toISOString() });
        openModal(parentSheet());
      }
    });
    return;
  }
  if (d.grant){ grantUnlock(d.grant); openModal(parentSheet()); return; }
  if (d.relock){ relock(d.relock); openModal(parentSheet()); return; }
  if (t.id === 'setPin'){
    S.view.pinNext = 'parent';
    openModal(pinSetSheet());
    setTimeout(() => { const i = $('#newPin1'); if (i) i.focus(); }, 60);
    return;
  }
  if (t.id === 'savePin'){
    const a = ($('#newPin1').value||'').trim(), b = ($('#newPin2').value||'').trim();
    const msg = $('#newPinMsg');
    const say = s => { if (msg){ msg.textContent = s; msg.style.color = 'var(--berry-deep)'; } };
    if (!/^\d{4}$/.test(a)){ say('숫자 4자리로 적어주세요.'); $('#newPin1').focus(); return; }
    if (a === '1234'){ say('처음 비밀번호와 같아요. 다른 숫자로 정해주세요.'); $('#newPin1').focus(); return; }
    if (a !== b){ say('두 번 적은 숫자가 달라요. 다시 확인해 주세요.'); $('#newPin2').focus(); return; }
    const pid = S.parentId || 'owner';
    if (paPinTaken(a, pid)){ say('다른 부모님 비밀번호와 같아요. 다른 숫자로 정해 주세요.'); $('#newPin1').focus(); return; }
    if (pid === 'owner') await Store.saveSettings({ pin:a, pinSet:true });
    else await Store.saveSettings({ parents:(S.settings.parents || []).map(x => x.id === pid ? Object.assign({}, x, { pinHash:parentPinHash(pid, a) }) : x) });
    const next = S.view.pinNext || 'parent';
    S.view.pinNext = null;
    toast('새 비밀번호를 정했어요');
    if (next === 'parent'){ S.view.parentTab = S.view.parentTab || 'settings'; openModal(parentSheet()); }
    else continueAfterPin(next);
    return;
  }
  /* --- 텔레그램 알림 --- */
  if (t.id === 'tgCheck'){ await tgRefresh(true); return; }
  if (t.id === 'tgTest'){ await tgSendTest(false); return; }
  if (t.id === 'tgUnlink'){
    askConfirm({
      title:'텔레그램 연결을 끊을까요?', danger:true, okLabel:'끊기',
      note:'끊으면 아이가 놀이를 요청해도 알림이 가지 않아요. 언제든 다시 연결할 수 있어요.',
      onOk: async () => {
        await Store.saveSettings({ telegram:null });
        S.view.tg = null; S.view.parentTab = 'notify';
        openModal(parentSheet()); toast('연결을 끊었어요');
      }
    });
    return;
  }
  if (d.tglink){
    const [id, ...rest] = d.tglink.split('|');
    await Store.saveSettings({ telegram:{ chatId:String(id), name:rest.join('|'), linkedAt:new Date().toISOString() } });
    openModal(parentSheet());
    tgSendTest(true);
    return;
  }

  /* --- 가족 주소 공유 --- */
  if (t.id === 'shareFamily' || t.id === 'copyFamily'){
    const link = familyLink();
    if (t.id === 'shareFamily' && navigator.share){
      try { await navigator.share({ title:'Do-Learn Do-Learn', text:'우리 가족 Do-Learn 주소', url:link }); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(link); toast('주소를 복사했어요'); }
    catch(e){ const ta = $('#familyLink'); if (ta){ ta.focus(); ta.select(); } toast('주소를 길게 눌러 복사해 주세요'); }
    return;
  }

  if (t.id === 'netTest'){ await netTest(); return; }
  if (t.id === 'exportData'){ exportData(); return; }
  if (t.id === 'seedSample'){
    t.disabled = true; t.textContent = '넣는 중…';
    await seedSample(); openModal(parentSheet()); return;
  }
  if (t.id === 'clearSample'){
    askConfirm({
      title:'샘플 데이터를 지울까요?', danger:true, okLabel:'지우기',
      note:'예시로 넣은 책·낱말·할 일만 지웁니다. 아이가 직접 넣은 기록은 그대로 있어요.',
      onOk: async () => { await clearSample(); openModal(parentSheet()); toast('샘플을 지웠어요'); }
    });
    return;
  }
  if (t.id === 'askOk'){
    const v = ($('#askInput').value||'').trim();
    if (!v){ toast('내용을 적어주세요'); return; }
    const cb = S.view.askCb; S.view.askCb = null;
    closeModal();
    if (cb) await cb(v);
    return;
  }
  if (t.id === 'clearNote'){ await Store.saveSettings({ parentNote:null }); toast('예전 쪽지를 뗐어요'); openModal(parentSheet()); return; }
  if (t.id === 'confirmOk'){
    const cb = S.view.confirmCb; S.view.confirmCb = null;
    closeModal();
    if (cb) await cb();
    return;
  }
});

/* 새 기능의 입력칸 — 칠 때마다 담아 둔다 (data-keep). 나라 찾기 칸은 아래 목록만 바꾼다(한글 조합이 끊기지 않게) */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.keep) return;
  kvSet(el.dataset.keep, el.value);
  if (el.dataset.keep === 'wtQ' || el.dataset.keep === 'wwQ'){
    const pre = el.dataset.keep.slice(0, 2), box = document.getElementById(pre + 'QList');
    if (box) box.innerHTML = wPickerChips(pre);
  }
});
/* 뚜뚜 원고 고치는 칸 — 칠 때마다 임시 원고에 담아 둔다 (창을 다시 그려도 글자가 남게) */
document.addEventListener('input', (e) => {
  const el = e.target, dr = S.view.ttDraft;
  if (!dr) return;
  if (el.id === 'ttTitle') dr.title = el.value;
  if (el.id === 'ttText') dr.text = el.value;
  if (el.id === 'ttDate') dr.contestDate = el.value;
  if (el.id === 'ttLimit') dr.limitText = el.value;
  if (el.dataset && el.dataset.ttf){
    const [i, f] = el.dataset.ttf.split('|');
    if (dr.sentences[+i]) dr.sentences[+i][f] = el.value;
  }
});

/* 부모 설정 입력값 저장 */
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.keep) kvSet(el.dataset.keep, el.value);
  if (el.id === 'dlPhoto' && el.files && el.files[0]){ await dlPhoto(el.files[0]); el.value = ''; return; }
  if (el.id === 'wtPhoto' && el.files && el.files.length){ await wTripPhotos(el.files); return; }
  if (el.id === 'ttVoice'){ await Store.saveSettings({ ttVoice: el.value || '' }); say('Hello, everyone!', { lang:'en' }); }
  if (el.id === 'koVoiceSel'){ lsSet('dolearn.koVoice', el.value || ''); say('안녕! 나는 뚜뚜야. 오늘도 같이 해볼까?', { lang:'ko' }); }
  if (el.id === 'ttMaskIn') await Store.saveSettings({ ttMask: el.value.trim().slice(0, 200) });
  if (el.id === 'ttDate' && S.view.ttDraft) S.view.ttDraft.contestDate = el.value;
  if (el.id === 'setGameMin') await Store.saveSettings({ gameMinutes: clamp(+el.value||20, 5, 120) });
  if (el.id === 'setGoal') await Store.saveSettings({ weeklyGoal: clamp(+el.value||20, 2, 200) });
  if (el.id === 'setCats'){
    const cats = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    if (cats.length) await Store.saveSettings({ cats });
  }
  if (el.id === 'setKakao') await Store.saveSettings({ kakaoKey: el.value.trim() });
  if (el.id === 'setNote'){
    const text = el.value.trim().slice(0, 60);
    await Store.saveSettings({ parentNote: text ? { text, at:new Date().toISOString() } : null });
    toast(text ? '쪽지를 붙였어요 💌' : '쪽지를 뗐어요');
  }
  if (el.dataset.kidname) await Store.update('profiles', el.dataset.kidname, { name: el.value.trim() || '이름' });
  if (el.dataset && el.dataset.kidnameen){ await Store.update('profiles', el.dataset.kidnameen, { nameEn:el.value.trim().replace(/[^A-Za-z .'-]/g, '').slice(0, 20) }); toast('영어 이름을 넣었어요 🔤'); }
  if (el.dataset && el.dataset.kidstars){ await Store.update('profiles', el.dataset.kidstars, { stars:clamp(Math.round(+el.value || 0), 0, 99999) }); toast('별 개수를 고쳤어요 ⭐'); }
  if (el.dataset && el.dataset.kidar){
    const v = arParse(el.value);
    await Store.update('profiles', el.dataset.kidar, { arScore:v, arAt:v ? new Date().toISOString() : null });
    toast(v ? `AR 점수 ${v}을 적었어요 📘` : 'AR 점수를 지웠어요');
  }
  if (el.id === 'coverInput' && el.files && el.files[0]) await handleCover(el.files[0]);
  if (el.id === 'beCover' && el.files && el.files[0] && S.view.bookEdit){
    keepBookEditTyping();
    S.view.bookEdit.coverFile = el.files[0];
    S.view.bookEdit.coverPreview = URL.createObjectURL(el.files[0]);
    openModal(bookEditSheet());
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.isComposing || e.keyCode === 229) return;       // 한글을 조합하는 중에 누른 엔터는 글자 확정용
  if (e.target.id === 'dictInput'){ e.preventDefault(); const q=(e.target.value||'').trim(); if (q) doLookup(q); }
  if (e.target.id === 'dtIn'){ e.preventDefault(); ACTS.dtCheck(); }
  if (e.target.id === 'spIn'){ e.preventDefault(); spCheck(); }
  if (e.target.id === 'wizWord'){ e.preventDefault(); const b=$('#wizAddWord'); if (b) b.click(); }
  if (e.target.id === 'askInput'){ e.preventDefault(); const b=$('#askOk'); if (b) b.click(); }
  if (e.target.id === 'newPin1'){ e.preventDefault(); const n=$('#newPin2'); if (n) n.focus(); }
  if (e.target.id === 'newPin2'){ e.preventDefault(); const b=$('#savePin'); if (b) b.click(); }
  if (e.target.id === 'setupPin'){ e.preventDefault(); const b=$('#setupGo'); if (b) b.click(); }
  if (e.target.dataset && e.target.dataset.newtodo){
    e.preventDefault();
    const b = document.querySelector(`[data-addtodo="${e.target.dataset.newtodo}"]`);
    if (b) b.click();
  }
});

    else if (purpose.startsWith('approve:')){

/* ---------- 한글 자모 — 헷갈리는 맞춤법 보기 만들기 ----------
   초성 ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ(0~18) · 중성 ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ(0~20)
   종성 없음ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ(0~27) */
function kjSplit(ch){ const c = ch.charCodeAt(0) - 0xAC00; return (c >= 0 && c <= 11171) ? [Math.floor(c / 588), Math.floor(c % 588 / 28), c % 28] : null; }
function kjJoin(a, b, c){ return String.fromCharCode(0xAC00 + a * 588 + b * 28 + c); }
// 받침이 뒤 글자 'ㅇ' 자리로 넘어갈 때 [남는 받침, 넘어가는 첫소리] — 놀이→노리, 읽어→일거, 많이→마니
const KJ_MOVE = { 1:[0,0], 2:[0,1], 4:[0,2], 7:[0,3], 8:[0,5], 16:[0,6], 17:[0,7], 19:[0,9], 20:[0,10], 22:[0,12], 23:[0,14],
  24:[0,15], 25:[0,16], 26:[0,17], 3:[1,9], 5:[4,12], 6:[0,2], 9:[8,0], 10:[8,6], 11:[8,7], 12:[8,9], 13:[8,16], 14:[8,17], 15:[0,5], 18:[17,9] };
// 받침 대표 소리 — 옷→옫, 부엌→부억, 닭→닥, 여덟→여덜
const KJ_REP = { 2:1, 24:1, 3:1, 9:1, 19:7, 20:7, 22:7, 23:7, 25:7, 27:7, 26:17, 14:17, 18:17, 5:4, 6:4, 11:8, 12:8, 13:8, 15:8, 10:16 };
const KJ_VOWEL = { 1:5, 5:1, 3:7, 7:3, 11:10, 10:11, 15:10, 19:20 };      // ㅐ↔ㅔ, ㅒ↔ㅖ, ㅚ↔ㅙ, ㅞ→ㅙ, ㅢ→ㅣ
function koVariants(word){
  const chars = [...String(word || '')], out = [];
  const add = (arr, why) => { const t = arr.join(''); if (t !== word && !out.some(o => o.t === t)) out.push({ t, why }); };
  const G = [1, 2, 3, 9, 24], D = [7, 19, 20, 22, 23, 25, 27], B = [17, 18, 26, 14];
  for (let i = 0; i < chars.length; i++){
    const a = kjSplit(chars[i]); if (!a) continue;
    const b = i + 1 < chars.length ? kjSplit(chars[i + 1]) : null;
    const set = (i1, v1, i2, v2) => { const c = chars.slice(); c[i1] = v1; if (i2 != null) c[i2] = v2; return c; };
    const c0 = a[0], j0 = a[1], f0 = a[2];
    if (f0 && b){
      const c1 = b[0], j1 = b[1], f1 = b[2];
      if (c1 === 11){                                                    // 뒤 글자가 'ㅇ'으로 시작
        if ((f0 === 7 || f0 === 25) && j1 === 20) add(set(i, kjJoin(c0, j0, 0), i + 1, kjJoin(f0 === 7 ? 12 : 14, j1, f1)), 'sound');   // 같이→가치
        else if (f0 === 27) add(set(i, kjJoin(c0, j0, 0)), 'sound');                                                                   // 좋아→조아
        else if (KJ_MOVE[f0] && f0 !== 21){ const m = KJ_MOVE[f0]; add(set(i, kjJoin(c0, j0, m[0]), i + 1, kjJoin(m[1], j1, f1)), 'sound'); }   // 놀이→노리
        if (f0 === 8) add(set(i + 1, kjJoin(5, j1, f1)), 'sound');                                                                     // 놀이→놀리, 얼음→얼름
        if (KJ_REP[f0] != null) add(set(i, kjJoin(c0, j0, KJ_REP[f0])), 'batchim');                                                   // 같이→갇이, 많이→만이
      } else {
        if ((c1 === 2 || c1 === 6) && (G.includes(f0) || D.includes(f0) || B.includes(f0)))
          add(set(i, kjJoin(c0, j0, G.includes(f0) ? 21 : (D.includes(f0) ? 4 : 16))), 'sound');                                        // 국물→궁물
        if ([27, 6, 15].includes(f0) && [0, 3, 12].includes(c1))
          add(set(i, kjJoin(c0, j0, f0 === 27 ? 0 : (f0 === 6 ? 4 : 8)), i + 1, kjJoin({ 0:15, 3:16, 12:14 }[c1], j1, f1)), 'sound');   // 좋다→조타
        if (c1 === 18 && [1, 7, 17].includes(f0))
          add(set(i, kjJoin(c0, j0, 0), i + 1, kjJoin({ 1:15, 7:16, 17:17 }[f0], j1, f1)), 'sound');                                   // 축하→추카
        if (f0 === 4 && c1 === 5) add(set(i, kjJoin(c0, j0, 8)), 'sound');                                                              // 신라→실라
        if (f0 === 8 && c1 === 2) add(set(i + 1, kjJoin(5, j1, f1)), 'sound');                                                         // 칼날→칼랄
        const T = { 0:1, 3:4, 7:8, 9:10, 12:13 };
        if (T[c1] != null && (G.includes(f0) || D.includes(f0) || B.includes(f0))) add(set(i + 1, kjJoin(T[c1], j1, f1)), 'tense');   // 학교→학꾜
        if (KJ_REP[f0] != null) add(set(i, kjJoin(c0, j0, KJ_REP[f0])), 'batchim');                                                   // 꽃밭→꼳밭
      }
    } else if (f0 && !b && KJ_REP[f0] != null) add(set(i, kjJoin(c0, j0, KJ_REP[f0])), 'batchim');                                     // 부엌→부억
    if (KJ_VOWEL[j0] != null) add(set(i, kjJoin(c0, KJ_VOWEL[j0], f0)), 'vowel');                                                      // 개→게
  }
  const order = { sound:0, batchim:1, vowel:2, tense:3 };
  out.sort((x, y) => order[x.why] - order[y.why]);
  for (let i = chars.length - 1; i >= 0 && out.length < 2; i--){                                    // 그래도 모자라면 받침을 빼거나 넣어 본다
    const a = kjSplit(chars[i]); if (!a) continue;
    const c = chars.slice(); c[i] = kjJoin(a[0], a[1], a[2] ? 0 : 4);
    const t = c.join(''); if (t !== word && !out.some(o => o.t === t)) out.push({ t, why:'batchim' });
  }
  return out;
}

/* ---------- 문제 만들기 ---------- */
function quizPool(){
  const mine = S.data.words.filter(w => w.kidId === S.kidId && w.term && w.meaning);
  const pick = w => ({ id:w.id, term:w.term, meaning:w.meaning, emoji:w.emoji || '', example:w.example || '', qz:w.qz });
  return {
    en: mine.filter(w => w.lang !== 'ko' && /[a-z]/i.test(w.term) && !/[가-힣]/.test(w.term)).map(pick),
    ko: mine.filter(w => w.lang === 'ko' && /[가-힣]/.test(w.term)).map(pick),
    enX: QZ_EN.map(([term, meaning, emoji, example]) => ({ id:'', term, meaning, emoji, example })),
    koX: QZ_KO.map(([term, meaning, emoji]) => ({ id:'', term, meaning, emoji, example:'' }))
  };
}
function qzShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function qzWeight(w){ const q = w.qz || {}; return (q.no || 0) * 2 - (q.ok || 0) + Math.random() * 1.5; }   // 틀렸던 낱말이 먼저
function qzTop(list, n){ return list.slice().sort((a, b) => qzWeight(b) - qzWeight(a)).slice(0, n); }
function qzOptions(right, pool, key, n){
  const seen = new Set([String(right[key]).toLowerCase()]), others = [];
  for (const x of qzShuffle(pool)){ const v = String(x[key]); if (!seen.has(v.toLowerCase())){ seen.add(v.toLowerCase()); others.push(v); } if (others.length >= n - 1) break; }
  return qzShuffle([right[key]].concat(others)).map(t => ({ t, ok:t === right[key] }));
}
function quizBuild(type, n){
  n = n || 8;
  const P = quizPool();
  const enAll = P.en.concat(P.en.length < 4 ? P.enX.filter(x => !P.en.some(y => y.term.toLowerCase() === x.term)) : []);
  const koAll = P.ko.concat(P.ko.length < 4 ? P.koX.filter(x => !P.ko.some(y => y.term === x.term)) : []);
  const kinds = type === 'mix' ? ['blank', 'e2k', 'k2e', 'spell'] : [type];
  const nOpt = kidStyle(curKid()).pace === 'careful' ? 4 : 3;           // 꼼꼼한 아이는 보기 하나 더
  const qs = [], used = new Set();
  for (let guard = 0; qs.length < n && guard < 80; guard++){
    const kind = kinds[guard % kinds.length];
    if (kind === 'spell'){
      const cand = qzTop(koAll.filter(w => !used.has(w)), 8).find(w => koVariants(w.term).length >= 2);
      if (!cand){ if (type === 'spell') break; continue; }
      used.add(cand);
      const vars = koVariants(cand.term).slice(0, nOpt - 1);
      qs.push({ kind, word:cand, prompt:`${cand.emoji || '✏️'} ${cand.meaning}`, sub:'바르게 쓴 낱말은 무엇일까요?', answer:cand.term,
        options:qzShuffle([{ t:cand.term, ok:true }].concat(vars.map(v => ({ t:v.t, ok:false, why:v.why })))) });
      continue;
    }
    const w = qzTop(enAll.filter(x => !used.has(x)), 5)[0];
    if (!w){ if (type !== 'mix') break; continue; }
    used.add(w);
    if (kind === 'e2k') qs.push({ kind, word:w, prompt:w.term, say:w.term, sub:'무슨 뜻일까요?', options:qzOptions(w, enAll, 'meaning', 4), answer:w.meaning });
    else if (kind === 'k2e') qs.push({ kind, word:w, prompt:`${w.emoji || ''} ${w.meaning}`.trim(), sub:'영어로 뭘까요?', options:qzOptions(w, enAll, 'term', 4), answer:w.term });
    else {                                  // 빈칸 — 예문이 있으면 문장 속 빈칸, 없으면 글자 하나 빈칸
      const re = new RegExp(`\\b${w.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
      if (w.example && re.test(w.example)){
        qs.push({ kind, word:w, prompt:w.example.replace(re, '＿＿＿'), sub:`${w.meaning} — 빈칸에 들어갈 단어는?`, say:w.example,
          options:qzOptions(w, enAll, 'term', 4), answer:w.term });
      } else {
        const letters = [...w.term], vow = letters.map((c, i) => /[aeiou]/i.test(c) && i > 0 ? i : -1).filter(i => i > 0);
        const at = vow.length ? vow[Math.floor(Math.random() * vow.length)] : Math.min(1, letters.length - 1);
        const right = letters[at].toLowerCase();
        const pool = 'aeioursltnm'.split('').filter(c => c !== right);
        qs.push({ kind, word:w, prompt:letters.map((c, i) => i === at ? '＿' : c).join(''), sub:`${w.meaning} — 빈칸에 들어갈 글자는?`,
          say:w.term, full:w.term, answer:right, options:qzShuffle([right].concat(qzShuffle(pool).slice(0, 3))).map(t => ({ t, ok:t === right })) });
      }
    }
  }
  return qzShuffle(qs).slice(0, n);
}

/* ---------- 화면 ---------- */
function quizMenu(){
  const P = quizPool();
  return `<h3>🧩 단어 퀴즈</h3>
    <p class="muted" style="margin:0 0 12px">단어 가방에 담은 낱말로 문제를 내요.
      ${P.en.length < 4 || P.ko.length < 4 ? '낱말이 아직 적은 쪽은 뚜뚜 추천 낱말도 섞을게요. ' : ''}틀려도 괜찮아요!</p>

    <p class="muted" style="margin:10px 0 0;font-size:13px">내 단어 가방 — 영어 ${P.en.length}개 · 한글 ${P.ko.length}개</p>`;
}
function qzCheer(k){
  const l = ['딩동댕! 정답이에요!', '우와, 맞았어요! 최고!', '척척박사네요!', '멋져요! 너무 잘하고 있어요!'];
  return l[Math.floor(Math.random() * l.length)] + (kidStyle(k).pace === 'quick' ? ' 한 번 더 확인한 덕분이에요!' : '');
}
function qzGentle(q, picked){
  if (q.kind === 'blank' && q.full) return `괜찮아요! ‘${q.full}’ — 빈칸에는 ‘${q.answer}’가 들어가요. 틀린 낱말은 다음에 또 나와서 더 잘 기억나요!`;
  let s = `괜찮아요! 정답은 ‘${q.answer}’${hasJong(q.answer) ? '이에요' : '예요'}.`;
  if (q.kind === 'spell' && picked && picked.why) s += ` ${QZ_WHY[picked.why]}`;
  return s + ' 틀린 낱말은 다음에 또 나와서 더 잘 기억나요!';
}
function quizSheet(){
  const Z = S.view.quiz;
  if (Z.done) return quizDone();
  const q = Z.qs[Z.i], k = curKid(), quick = kidStyle(k).pace === 'quick', shown = Z.answered;
  const picked = Z.pick != null ? q.options[Z.pick] : null;
  const big = q.kind === 'e2k' || (q.kind === 'blank' && q.full);
  const opt = (o, i) => {
    let st = '';
    if (shown){ if (o.ok) st = 'background:var(--mint-soft);border-color:var(--mint-deep)'; else if (Z.pick === i) st = 'background:var(--berry-soft);border-color:var(--berry)'; }
    else if (Z.pick === i) st = 'background:var(--butter);border-color:var(--butter-deep)';
    return `<button class="matchbtn" data-qz="${i}" style="${st};font-size:${q.kind === 'e2k' ? 16 : 20}px" ${shown ? 'disabled' : ''}>${shown && o.ok ? '✅ ' : ''}${esc(o.t)}</button>`;
  };
  return `<div class="row" style="margin-bottom:8px;padding-right:48px"><h3 class="grow" style="margin:0">🧩 ${Z.i + 1} / ${Z.qs.length}</h3><span class="muted">⭐ ${Z.ok}</span></div>
    <div class="card" style="text-align:center;margin-bottom:12px">
      <div style="font-family:var(--display);font-size:${big ? 36 : 24}px;line-height:1.3;word-break:keep-all">${esc(q.prompt)}</div>
      <div class="muted" style="margin-top:6px">${esc(q.sub)}</div>
      ${q.say ? `<button class="btn ghost sm" data-say="${esc(q.say)}" data-lang="en" style="margin-top:8px">🔊 들어보기</button>` : ''}
    </div>
    <div style="display:grid;grid-template-columns:${q.options.length > 3 ? '1fr 1fr' : '1fr'};gap:9px">${q.options.map(opt).join('')}</div>
    ${shown ? `<div class="banner ${picked && picked.ok ? 'info' : 'warn'}" style="margin-top:12px"><span>${picked && picked.ok ? '🎉' : '🤗'}</span>
        <span>${esc(picked && picked.ok ? qzCheer(k) : qzGentle(q, picked))}</span></div>
      <button class="btn wide" id="qzNext" style="margin-top:12px">${Z.i + 1 >= Z.qs.length ? '결과 보기 🎉' : '다음 문제 ▶'}</button>`
    : (quick && Z.pick != null ? `<p class="muted" style="text-align:center;margin:12px 0 6px">한 번 더 확인해 볼까요? 🔍</p>
        <button class="btn mint wide" id="qzOk">✔ 이걸로 할래요</button>` : '')}`;
}
function quizDone(){
  const Z = S.view.quiz, n = Z.qs.length, ok = Z.ok, wrong = Z.results.filter(r => !r.ok).length;
  return `<div style="text-align:center">
    <div style="font-size:54px">${ok === n ? '🏆' : '🎉'}</div>
    <h3>${n}문제 중 ${ok}개 맞혔어요!</h3>
    <div class="tt-stars" style="font-size:34px">${'⭐'.repeat(Math.max(1, Math.min(5, ok)))}</div>
    <p class="muted" style="margin:6px 0 14px">${ok === n ? '완벽해요! 척척박사 인정! 🎓' : '끝까지 푼 게 제일 멋져요. 틀린 낱말은 다음에 또 만나요!'}</p>
    <div class="stack" style="gap:9px">
      ${wrong ? '<button class="btn wide" id="qzAgainWrong">🔁 틀린 것만 다시 풀기</button>' : ''}
      <button class="btn ghost wide" id="qzMenu">🧩 다른 퀴즈</button>
      <button class="btn ghost wide sm" data-close="1">끝내기</button>
    </div></div>`;
}
function quizStart(type, qs){
  qs = qs || quizBuild(type);
  if (!qs.length){ toast('문제를 만들 낱말이 아직 없어요. 사전에서 낱말을 담아볼까요?'); return; }
  S.view.quiz = { type, qs, i:0, pick:null, answered:false, ok:0, results:[], done:false };
  openModal(quizSheet());
  if (qs[0].kind === 'e2k') speak(qs[0].say, 'en');
}
function quizReveal(){
  const Z = S.view.quiz, q = Z.qs[Z.i], o = q.options[Z.pick];
  Z.answered = true;
  const ok = !!(o && o.ok);
  if (ok){ Z.ok++; ttChime(); }
  Z.results.push({ q, ok });
  openModal(quizSheet());
  if (q.kind !== 'spell') speak(q.full || q.word.term, 'en');            // 정답 낱말을 한 번 들려준다
}
async function quizFinish(){
  const Z = S.view.quiz; Z.done = true;
  openModal(quizSheet()); confetti();
  if (Z.ok) awardStars(Z.ok);
  const per = {};
  for (const r of Z.results){ const id = r.q.word.id; if (!id) continue; per[id] = per[id] || { ok:0, no:0 }; per[id][r.ok ? 'ok' : 'no']++; }
  for (const [id, v] of Object.entries(per)){
    const w = S.data.words.find(x => x.id === id); if (!w) continue;
    const q = w.qz || {};
    await Store.update('words', id, { qz:{ ok:(q.ok || 0) + v.ok, no:(q.no || 0) + v.no, at:new Date().toISOString() } });
  }
}
/* 퀴즈 단추 — 처리했으면 true */
function quizClick(t, d){
  if (t.id === 'quizGo' || t.id === 'qzMenu'){ nvUnlock(); openModal(quizMenu()); return true; }
  if (d.qztype){ nvUnlock(); quizStart(d.qztype); return true; }
  const Z = S.view.quiz; if (!Z) return false;
  if (d.qz != null && d.qz !== '' && !Z.answered){
    const i = +d.qz;
    if (kidStyle(curKid()).pace === 'quick' && Z.pick !== i){ Z.pick = i; openModal(quizSheet()); return true; }   // 한 번 더 확인
    Z.pick = i; quizReveal(); return true;
  }
  if (t.id === 'qzOk' && Z.pick != null && !Z.answered){ quizReveal(); return true; }
  if (t.id === 'qzNext'){
    Z.i++; Z.pick = null; Z.answered = false;
    if (Z.i >= Z.qs.length){ quizFinish(); return true; }
    openModal(quizSheet());
    const q = Z.qs[Z.i]; if (q.kind === 'e2k') speak(q.say, 'en');
    return true;
  }
  if (t.id === 'qzAgainWrong'){
    quizStart(Z.type, qzShuffle(Z.results.filter(r => !r.ok).map(r => ({ ...r.q, options:qzShuffle(r.q.options) }))));
    return true;
  }
  return false;
}

async function handleCover(file){

/* 표지 사진 올리기 — 버셀은 수파베이스 저장소, claude.ai는 Artifact 저장소 */
async function uploadCover(file){
  if (S.sb){
    try {
      const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      const path = `${S.familyId}/${uid()}.${ext}`;
      const up = await S.sb.storage.from('covers').upload(path, file, { contentType:file.type, upsert:false });
      if (up.error) throw up.error;
      return { coverUrl:S.sb.storage.from('covers').getPublicUrl(path).data.publicUrl, coverAssetId:'' };
    } catch(e){ console.warn('표지 올리기 실패', e); toast('사진을 올리지 못했어요. 괜찮아요, 사진 없이도 책장에 들어가요!'); return null; }
  }
  if (S.assets){
    try { const r = await S.assets.upload(file); return { coverUrl:'', coverAssetId:r.id }; }
    catch(e){ console.warn('표지 올리기 실패', e); toast('사진을 올리지 못했어요. 괜찮아요, 사진 없이도 책장에 들어가요!'); return null; }
  }
  return null;
}
/* 우리 저장소에 올린 표지면 지운다 (알라딘 표지 주소는 건드리지 않는다) */
async function removeCoverFile(b){
  try {
    const m = S.sb && b.coverUrl && b.coverUrl.match(/\/storage\/v1\/object\/public\/covers\/(.+)$/);
    if (m) await S.sb.storage.from('covers').remove([decodeURIComponent(m[1])]);
    if (!S.sb && S.assets && b.coverAssetId) await S.assets.delete(b.coverAssetId);
  } catch(e){ console.warn('표지 파일 지우기 실패', e); }
}

async function saveBook(){
  const w = S.view.wiz;
  if (!w.title){ toast('책 제목을 적어줄래요? 📚'); return; }
  w.uploading = !!w.coverFile;
  openModal(bookWizard());

  let coverAssetId = '', coverUrl = w.coverUrl || '';
  if (w.coverFile){
    const up = await uploadCover(w.coverFile);
    if (up){ coverUrl = up.coverUrl || coverUrl; coverAssetId = up.coverAssetId || ''; }
  }
  const toread = w.status === 'toread', now = new Date().toISOString();
  const base = { title:w.title, author:w.author||'', category:w.category||(S.settings.cats||DEFAULT_CATS)[0], ar:w.ar || null };
  let id = w.existing && S.data.books.find(b => b.id === w.existing) ? w.existing : '';
  if (id){                                                   // 읽을 책장에 있던 책 → 다 읽었어요
    const patch = { ...base, status:toread ? 'toread' : 'read', readAt:toread ? null : now, stars:toread ? null : (w.stars || 3) };
    if (coverUrl || coverAssetId){ patch.coverUrl = coverUrl; patch.coverAssetId = coverAssetId; }
    await Store.update('books', id, patch);
  } else {
    id = await Store.add('books', {
      kidId:S.kidId, isbn:w.isbn||'', ...base,
      // 직접 찍은 사진이 있으면 그 주소를 저장한다(예전에는 올린 사진 대신 w.coverUrl을 넣어 사진이 사라졌다)
      coverAssetId, coverUrl, stars:toread ? null : (w.stars || 3),
      status:toread ? 'toread' : 'read', addedAt:now, readAt:toread ? null : now,
      source: w.found || 'manual'
    });
  }
  S.freshBookId = id;
  w.savedId = id;
  w.uploading = false;
  if (toread){                                               // 읽을 책은 낱말·느낌을 묻지 않는다
    closeModal(); S.view.wiz = null; S.tab = 'shelf'; render();
    cheerPopup({ emoji:'📘', title:'읽을 책장에 꽂았어요!', sub:'다 읽으면 책을 누르고 “다 읽었어요!”를 눌러요. 기대된다!' });
    return;
  }
  w.step = 'words';
  openModal(bookWizard());
  confetti();
}

const SAMPLE_WORDS = [
  ['rainbow','비 온 뒤 하늘에 뜨는 일곱 빛깔 다리','🌈','en'],
  ['brave','무서워도 씩씩하게 하는 마음','🦁','en'],

];

async function seedSample(){
  const ks = kids();
  if (!ks.length) return;
  if (S.settings.sampleLoaded) return;          // 두 번 넣어 겹치지 않도록
  const now = Date.now();

  for (const k of ks){
    for (const t of SAMPLE_TODOS){
      await Store.add('todos', { kidId:k.id, title:t.title, icon:t.icon, repeatDays:[],
        createdBy:'parent', sample:true, createdAt:new Date().toISOString() });
    }
  }
  SAMPLE_BOOKS.forEach((b, i) => {
    const k = ks[i % ks.length];
    Store.add('books', { kidId:k.id, isbn:'', title:b[0], author:b[1], category:b[2],
      coverAssetId:'', coverUrl:'', stars:1 + (i % 3), sample:true,
      readAt:new Date(now - i * 26 * 3600000).toISOString(), source:'manual' });
  });
  SAMPLE_WORDS.forEach((w, i) => {
    const k = ks[i % ks.length];
    Store.add('words', { kidId:k.id, term:w[0], meaning:w[1], emoji:w[2], lang:w[3],
      example:'', box:1 + (i % 3), sample:true,
      nextReviewAt:new Date(now + 86400000).toISOString(),
      createdAt:new Date(now - i * 7200000).toISOString() });
  });
  // 어제까지의 할 일을 몇 개 해둔 것으로 — 주간 스트립이 비어 보이지 않게
  for (const k of ks){
    const mine = S.data.todos.filter(x => x.kidId === k.id && x.sample);
    for (let back = 1; back <= 3; back++){
      const d = new Date(); d.setDate(d.getDate() - back);
      mine.forEach(t => Store.add('sessions', {
        kidId:k.id, todoId:t.id, date:todayKey(d), durationSec:600 + back * 120, done:true, sample:true
      }));
    }
  }
  await Store.saveSettings({ sampleLoaded:true });
}

async function clearSample(){
  for (const coll of ['todos','books','words','sessions','scripts','dlists']){
    for (const r of S.data[coll].filter(x => x.sample)) await Store.remove(coll, r.id);
  }
  const aliveL = new Set(S.data.dlists.map(x => x.id));
  for (const p of S.data.dprog.filter(x => !aliveL.has(x.listId))) await Store.remove('dprog', p.id);
  // 예시 원고로 한 진도도 함께
  const alive = new Set(S.data.scripts.map(x => x.id));
  for (const p of S.data.speech.filter(x => !alive.has(x.scriptId))) await Store.remove('speech', p.id);
  await Store.saveSettings({ sampleLoaded:false });
}

async function netTest(){
  const box = $('#netResult');
  box.innerHTML = '<p class="muted">확인 중…</p>';
  const targets = [
    ['카카오 책 검색','https://dapi.kakao.com/v3/search/book?target=isbn&query=9788934972464'],
    ['국립중앙도서관','https://seoji.nl.go.kr/landingPage/SearchApi.do?cert_key=TEST&result_style=json&page_no=1&page_size=1&isbn=9788934972464'],
    ['날씨(Open-Meteo)','https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=weather_code']
  ];
  const out = [];
  for (const [name,url] of targets){
    try { const r = await fetch(url); out.push(`✅ ${name} — 연결됨 (HTTP ${r.status})`); }
    catch(e){ out.push(`🚫 ${name} — 차단됨`); }
  }
  box.innerHTML = `<div class="banner info"><span>🌐</span><span>${out.map(esc).join('<br>')}<br>
    <b>모두 차단됨이면</b> 카카오 키를 넣어도 소용없어요. 사진 찍기로 등록하면 됩니다.</span></div>`;
}
function exportData(){
  const dump = JSON.stringify({ exportedAt:new Date().toISOString(), settings:S.settings, data:S.data }, null, 2);
  $('#exportBox').innerHTML = `<p class="muted" style="margin:8px 0 4px">아래 글자를 모두 복사해서 안전한 곳에 보관하세요.</p>
    <textarea class="field" style="min-height:150px;font-size:12px" readonly>${esc(dump)}</textarea>`;
  const ta = $('#exportBox textarea');
  if (ta){ ta.focus(); ta.select(); }
  if (S.downloads){
    S.downloads.save({ filename:`Do-Learn-백업-${todayKey()}.json`, data:dump }).catch(()=>{});
  }
}

   타이머 틱 (1초마다 화면의 숫자만 갱신 — 전체 재렌더 안 함)
   ============================================================ */
setInterval(() => {
  if (S.running){
    const el = document.querySelector(`[data-live="${S.running.todoId}"]`);
    if (el) el.textContent = fmtClock((Date.now()-S.running.startedAt)/1000);
    const tt = document.getElementById('todayTime');
    if (tt) tt.textContent = fmtDur(todaySeconds(S.kidId));
  }
  const un = S.kidId && activeUnlock(S.kidId);
  const left = document.getElementById('unlockLeft');
  if (left && un) left.textContent = fmtClock((new Date(un.expiresAt).getTime()-Date.now())/1000);

  if (sling){
    if (!activeUnlock(sling.kidId)) slingTimeOver();
    else slingTimer();
  }
  if (OL && !activeUnlock(OL.kidId)) closeOneline('놀이 시간이 끝났어요. 내일 또 해요! 👋');
  if (IT && !activeUnlock(IT.kidId)) ittoClose('놀이 시간이 끝났어요. 친구들이 버블에서 기다릴게요! 👋');
  if (BH && !activeUnlock(BH.kidId) && !(BH.vs && VS && VS.solo)) { if (BH.vs) vsClose('놀이 시간이 끝났어요. 또 같이 놀아요! 👋'); else bearClose('놀이 시간이 끝났어요. 곰돌이가 또 놀자고 기다릴게요! 👋'); }
  if (VS && !VS.solo && VS.phase === 'play' && !activeUnlock(VS.kidId)) vsClose('놀이 시간이 끝났어요. 또 같이 놀아요! 👋');
  if (VS && VS.solo && VS.phase === 'play' && !activeUnlock(VS.kidId)) vsClose('놀이 시간이 끝났어요. 내일 또 해요! 👋');

  // 기다리던 쪽지·칭찬 카드 (응원 팝업이 닫힌 뒤 등) — 3초마다 한 번 살펴본다
  if (S.kidId && Date.now() % 3000 < 1000) notiCheck();

  // 부모님이 다른 기기에서 승인해 주면 여기서 알아채고 축하해 준다
  if (un && S.celebrated !== un.id){ S.celebrated = un.id; confetti(); render(); }
  if (!un) S.celebrated = null;

  if (S.tab === 'games' && S.kidId && !un && S.view.game){
    S.view.game = null; stopStars(); render();     // 시간이 끝나면 자동으로 잠김
  }
}, 1000);

document.addEventListener('visibilitychange', () => { if (document.hidden && (DT || DY)) hush(); });
/* 다른 앱으로 가거나 화면이 꺼지면 녹음과 뚜뚜 목소리를 멈춘다 */
document.addEventListener('visibilitychange', () => {
  if (!TT) return;
  if (document.visibilityState === 'hidden'){
    if (TT.step === 'rec' || TT.step === 'run' || TT.step === 'count'){
      recCancel(); clearInterval(TT.tick); clearInterval(TT.cd);
      if (TT.kind === 'ecc'){ eccSrAbort(TT); TT.live = null; }
      TT.step = TT.kind === 'stage' ? 'ready' : (TT.kind === 'ecc' ? 'ready' : 'speak');
      TT.say = '잠깐 쉬었다 왔구나! 괜찮아, 다시 해보자.';
    }
    hush(); playStop(); ttMouth(false); ttLayer();
  } else wakeOn();
});

try {
