// Open-Meteo WMO 코드 → 우리 아이콘
function wmoToWeather(code){
  if (code === 0) return WEATHERS[0];
  if (code <= 2) return WEATHERS[1];
  if (code === 3) return WEATHERS[2];
  if (code === 45 || code === 48) return WEATHERS[6];
  if (code >= 95) return WEATHERS[4];
  if (code >= 71 && code <= 77) return WEATHERS[5];
  if (code >= 51) return WEATHERS[3];
  return WEATHERS[1];
}
async function fetchWeatherAt(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=weather_code&timezone=auto`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('http');
  const j = await res.json();
  const code = j && j.current && j.current.weather_code;
  if (code == null) throw new Error('shape');
  return wmoToWeather(code);
}
function currentGeo(){
  const g = S.settings.geo;
  return (g && typeof g.lat === 'number') ? g : DEFAULT_GEO;
}
/* interactive=true 면 "지금 있는 곳"으로 바꾸려고 위치를 한 번 물어본다.
   거절하거나 실패해도 기본 좌표(동탄)로 계속 진행한다. */
async function autoWeather(interactive){
  let geo = currentGeo();
  if (interactive && navigator.geolocation){
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout:8000, maximumAge:600000 }));
      geo = { lat:pos.coords.latitude, lon:pos.coords.longitude, name:'지금 있는 곳' };
      await Store.saveSettings({ geo });
    } catch(e){ /* 거절 → 동탄 기본값 그대로 */ }
  }
  try {
    const w = await fetchWeatherAt(geo.lat, geo.lon);
    await Store.saveSettings({ weather:{ date:todayKey(), icon:w.icon, label:w.label, place:geo.name||'' } });
    return true;
  } catch(e){
    if (interactive) toast('날씨를 가져오지 못했어요. 직접 골라주세요');
    return false;
  }
}

function speak(text, lang){
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e){}
}
/* 마이크로 듣고 → 글자로 적어준다 (브라우저 내장 음성인식). */
function listen(lang, onResult){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    S.view.dictError = '이 기기에서는 말로 찾기를 쓸 수 없어요. 글자로 적어주세요.';
    render(); return;
  }
  try {
    const r = new SR();
    r.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
    r.interimResults = false; r.maxAlternatives = 1;
    S.view.listening = true; S.view.dictError = ''; render();
    const stop = () => { S.view.listening = false; render(); };
    r.onresult = e => { stop(); onResult(String(e.results[0][0].transcript||'').trim()); };
    r.onerror = ev => {
      stop();
      S.view.dictError = (ev && ev.error === 'not-allowed')
        ? '마이크를 쓰려면 “허용”을 눌러주세요.'
        : '잘 못 들었어요. 한 번 더 말해볼까요?';
      render();
    };
    r.onend = stop;
    r.start();
  } catch(e){ S.view.listening = false; render(); }
}

   바코드 스캐너
   ============================================================ */
/* 바코드 스캐너
   - 안드로이드 크롬처럼 브라우저가 바코드를 직접 읽을 수 있으면 그걸 쓴다(빠르고 정확).
   - 아이패드 사파리처럼 못 읽으면 Quagga2로 읽는다. 둥둥 도서관에서 이 기기로 잘 되던 설정
     (후면 카메라 1280×720, EAN 판독기)을 그대로 쓴다.
   - 책 바코드는 978/979로 시작하는 ISBN-13뿐이라 그것만 받고, 끝자리 검증 숫자를 확인한다.
     Quagga는 가끔 한 자리를 잘못 읽으므로 같은 번호가 두 번 연달아 나와야 받는다. */
let scanState = { stream:null, raf:0, stopped:false, quagga:false, last:'', hits:0 };

function validIsbn13(code){
  if (!/^97[89]\d{10}$/.test(code)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+code[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +code[12];
}
function acceptScan(raw, needed){
  if (scanState.stopped) return;
  const code = String(raw || '').replace(/\D/g, '');
  if (!validIsbn13(code)) return;
  if (code === scanState.last) scanState.hits++;
  else { scanState.last = code; scanState.hits = 1; }
  if (scanState.hits >= needed) onIsbn(code);
}
function onQuagga(data){
  const c = data && data.codeResult && data.codeResult.code;
  if (c) acceptScan(c, 2);
}

async function startScanner(){
  scanState = { stream:null, raf:0, stopped:false, quagga:false, last:'', hits:0 };
  const box = document.getElementById('scanView');
  if (!box) return;

  let native = false;
  if ('BarcodeDetector' in window){
    try { native = (await window.BarcodeDetector.getSupportedFormats()).includes('ean_13'); } catch(e){}
  }

  if (native){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false
      });
      if (scanState.stopped){ stream.getTracks().forEach(t => t.stop()); return; }
      scanState.stream = stream;
      const v = document.createElement('video');
      v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = stream;
      box.prepend(v);
      await v.play().catch(()=>{});
      setScanMsg('바코드를 네모 안에 비춰주세요');
      const det = new window.BarcodeDetector({ formats:['ean_13'] });
      const tick = async () => {
        if (scanState.stopped) return;
        try {
          const codes = await det.detect(v);
          for (const c of codes || []) acceptScan(c.rawValue, 1);
        } catch(e){}
        if (!scanState.stopped) scanState.raf = requestAnimationFrame(tick);
      };
      scanState.raf = requestAnimationFrame(tick);
    } catch(err){
      setScanMsg('카메라를 켤 수 없어요. 아래에서 직접 적어주세요.');
    }
    return;
  }

  if (window.Quagga){
    window.Quagga.init({
      inputStream:{
        name:'Live', type:'LiveStream', target:box,
        constraints:{ facingMode:'environment', width:1280, height:720 }
      },
      locate:true,
      decoder:{ readers:['ean_reader'] }
    }, (err) => {
      if (err){ setScanMsg('카메라를 켤 수 없어요. 아래에서 직접 적어주세요.'); return; }
      if (scanState.stopped){ try { window.Quagga.stop(); } catch(e){} return; }   // 켜지는 사이 창을 닫은 경우
      window.Quagga.onDetected(onQuagga);
      window.Quagga.start();
      scanState.quagga = true;
      setScanMsg('바코드를 네모 안에 비춰주세요');
    });
    return;
  }

  setScanMsg('이 기기에서는 바코드를 못 읽어요. 아래에서 직접 적어주세요.');
}
function setScanMsg(msg){
  if (S.view.wiz) S.view.wiz.msg = msg;
  const el = document.getElementById('scanMsg');
  if (el) el.textContent = msg;
}
function stopScanner(){
  scanState.stopped = true;
  if (scanState.raf) cancelAnimationFrame(scanState.raf);
  if (window.Quagga){
    try { window.Quagga.offDetected(onQuagga); } catch(e){}
    if (scanState.quagga){ try { window.Quagga.stop(); } catch(e){} scanState.quagga = false; }
  }
  if (scanState.stream){ scanState.stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} }); scanState.stream = null; }
}

async function onIsbn(raw){
  const isbn = String(raw||'').replace(/[^0-9Xx]/g,'');
  stopScanner();
  const w = S.view.wiz;
  w.isbn = isbn; w.step = 'info'; w.busy = true;
  openModal(bookWizard());

  // 1순위: 서점 책 정보 (알라딘 → 카카오)
  const k = await bookSearch(isbn, 'isbn');
  if (k.ok && k.docs.length){
    const d = k.docs[0];
    w.title = d.title; w.author = d.author; w.coverUrl = d.coverUrl; w.publisher = d.publisher;
    if (d.category) w.category = d.category;
    w.found = k.provider || 'shop';
    w.guessNote = '책을 찾았어요! 맞는지 봐주세요.';
  } else {
    // 2순위: Claude에게 물어보기
    const g = await guessBook(isbn);
    if (g){
      w.title = g.title; w.author = g.author || '';
      if (g.category && (S.settings.cats||DEFAULT_CATS).includes(g.category)) w.category = g.category;
      w.found = 'ai';

      w.found = 'manual';
      w.guessNote = k.ok ? '그 바코드로는 책을 못 찾았어요. 표지를 보고 적어줄래요?'
                         : (BOOK_MSG[k.reason] || '책 이름을 못 찾았어요.');
    }
  }
  w.busy = false;
  openModal(bookWizard());
}

let starGame = null;
function startStars(){
  S.view.game = 'stars';
  render();
  requestAnimationFrame(() => {
    const cv = document.getElementById('starcanvas');
    if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = cv.getBoundingClientRect();
    cv.width = rect.width * dpr; cv.height = rect.height * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    const g = { basket:W/2, stars:[], score:0, t:0, alive:true, speed:1 };
    starGame = g;

    const move = e => {
      const r = cv.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      g.basket = clamp(x, 26, W-26);
    };
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerdown', move);

    const loop = () => {
      if (!g.alive || S.view.game !== 'stars') return;
      g.t++;
      g.speed = 1 + g.t/2600;
      if (g.t % Math.max(22, 48 - Math.floor(g.t/90)) === 0){
        g.stars.push({ x: 24 + Math.random()*(W-48), y:-14, v: (1.4 + Math.random()*1.1)*g.speed, r: 11 });
      }
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#FFF3F6'; ctx.fillRect(0,0,W,H);

      for (let i=g.stars.length-1;i>=0;i--){
        const s = g.stars[i];
        s.y += s.v;
        drawStar(ctx, s.x, s.y, s.r, '#FFD98E', '#D99A2B');
        if (s.y > H-42 && s.y < H-8 && Math.abs(s.x - g.basket) < 34){
          g.stars.splice(i,1); g.score++;
          const el = document.getElementById('starScore');
          if (el) el.textContent = g.score + '개';
          continue;
        }
        if (s.y > H + 20) g.stars.splice(i,1);
      }
      // 바구니
      ctx.fillStyle = '#FF8FA8';
      ctx.beginPath();
      ctx.moveTo(g.basket-32, H-34); ctx.lineTo(g.basket+32, H-34);
      ctx.lineTo(g.basket+24, H-8); ctx.lineTo(g.basket-24, H-8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E85C7C';
      ctx.fillRect(g.basket-34, H-38, 68, 7);

      requestAnimationFrame(loop);
    };
    loop();
  });
}
function drawStar(ctx, cx, cy, r, fill, stroke){
  ctx.beginPath();
  for (let i=0;i<10;i++){
    const rad = i % 2 === 0 ? r : r/2.3;
    const a = Math.PI/5 * i - Math.PI/2;
    ctx[i?'lineTo':'moveTo'](cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke();
}
function stopStars(){ if (starGame) starGame.alive = false; starGame = null; }

/* ---------- 효과음 (Web Audio로 만든다, 파일 없음) ---------- */
function slingSound(){
  const s = { ctx:null, on:true, osc:null, gain:null };
  const ready = () => {
    if (!s.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (A) s.ctx = new A(); }
    if (s.ctx && s.ctx.state === 'suspended') s.ctx.resume();
    return s.on && s.ctx;
  };
  const beep = (f1, f2, dur, vol, type) => {
    if (!ready()) return;
    const t = s.ctx.currentTime, o = s.ctx.createOscillator(), g = s.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(s.ctx.destination); o.start(t); o.stop(t + dur + 0.01);
  };
  s.pinch   = () => beep(540, 880, 0.08, 0.18);
  s.release = () => { s.stop(); beep(650, 140, 0.16, 0.3); };
  s.hit     = kind => beep(kind === 'bonus' ? 1200 : kind === 'boom' ? 160 : 880, (kind === 'bonus' ? 1200 : 880) * 1.4, 0.22, 0.26);
  s.win     = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.3, 0.18), i * 120));
  s.stretch = k => {
    if (!s.on || k <= 0.05){ s.stop(); return; }
    if (!ready()) return;
    const t = s.ctx.currentTime, f = 180 + k * 400;
    if (!s.osc){
      s.osc = s.ctx.createOscillator(); s.gain = s.ctx.createGain(); s.osc.type = 'triangle';
      s.osc.frequency.setValueAtTime(f, t);
      s.gain.gain.setValueAtTime(0.01, t); s.gain.gain.linearRampToValueAtTime(0.1, t + 0.05);
      s.osc.connect(s.gain); s.gain.connect(s.ctx.destination); s.osc.start(t);
    } else s.osc.frequency.setTargetAtTime(f, t, 0.03);
  };
  s.stop = () => {
    if (s.osc && s.gain && s.ctx){
      const o = s.osc;
      s.gain.gain.linearRampToValueAtTime(0.001, s.ctx.currentTime + 0.04);
      setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 50);
    }
    s.osc = null; s.gain = null;
  };
  s.close = () => { s.stop(); try { s.ctx && s.ctx.close(); } catch(e){} };
  return s;
}

function slingFit(){
  if (!sling) return;
  const box = sling.layer.querySelector('#slStageBox');
  const bw = box.clientWidth, bh = box.clientHeight;
  const scale = Math.max(0.2, Math.min(bw / SLING_W, bh / SLING_H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  sling.canvas.style.width = Math.floor(SLING_W * scale) + 'px';
  sling.canvas.style.height = Math.floor(SLING_H * scale) + 'px';
  sling.canvas.width = Math.round(SLING_W * dpr); sling.canvas.height = Math.round(SLING_H * dpr);
  sling.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function slingLoad(idx){
  const s = sling, L = SLING_LEVELS[idx % SLING_LEVELS.length];
  s.level = idx; s.ammo = L.ammo; s.pouch = { ...SLING_ANCHOR }; s.aiming = null;
  s.shots = []; s.sparks = []; s.texts = []; s.cleared = false; s.failAt = 0; s.failed = false;
  s.targets = L.targets.map(t => ({ ...t, max:t.hp, dead:false, cool:0 }));
  s.blocks  = L.blocks.map(b => ({ ...b, max:b.hp, dead:false, cool:0 }));
  s.layer.querySelector('#slStage').textContent = `${idx + 1}단계 · ${L.name}`;
  s.layer.querySelector('#slClear').hidden = true;
  s.layer.querySelector('#slFail').hidden = true;
  slingCoach(idx === 0 ? '주머니를 손가락으로 꾹 잡고, 뒤로 당겼다가 놓아요!'
    : L.wind ? `바람이 ${L.wind > 0 ? '앞으로' : '뒤로'} 불어요. 조금 더 세게 당겨봐요!` : '모든 과녁을 맞히면 통과예요!');
  slingHud();
}
function slingCoach(msg){ const el = sling && sling.layer.querySelector('#slCoach'); if (el) el.textContent = msg; }
function slingHud(){
  const s = sling; if (!s) return;
  const L = SLING_LEVELS[s.level % SLING_LEVELS.length];
  const left = s.targets.filter(t => !t.dead).length;
  s.layer.querySelector('#slScore').textContent = s.score.toLocaleString();
  s.layer.querySelector('#slBest').textContent = Math.max(s.best, s.score).toLocaleString();
  s.layer.querySelector('#slLeft').textContent = `남은 과녁 ${left}`;
  s.layer.querySelector('#slAmmo').innerHTML = Array.from({ length:L.ammo }, (_, i) =>
    `<i class="${i < s.ammo ? 'on' : ''}"></i>`).join('');
}
function slingTimer(){
  if (!sling) return;
  const un = sling.kidId && activeUnlock(sling.kidId);
  const el = sling.layer.querySelector('#slTime');
  if (el) el.textContent = un ? `⏱ ${fmtClock((new Date(un.expiresAt).getTime() - Date.now())/1000)}` : '';
}

/* ---------- 버튼 ---------- */
function slingClick(e){
  const b = e.target.closest('button'); if (!b || !sling) return;
  const s = sling;
  if (b.id === 'slExit'){ closeSling(); return; }
  if (b.id === 'slRestart' || b.id === 'slReplay' || b.id === 'slRetry'){ slingLoad(s.level); return; }
  if (b.id === 'slNext'){ slingLoad(s.level + 1); return; }
  if (b.id === 'slSound'){ s.sound.on = !s.sound.on; if (!s.sound.on) s.sound.stop(); b.textContent = s.sound.on ? '🔊' : '🔇'; return; }
  if (b.id === 'slHand'){ s.hand ? slingStopHand(s, true) : slingStartHand(); return; }
  if (b.dataset.slw){
    s.weapon = b.dataset.slw;
    s.layer.querySelectorAll('[data-slw]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }
}

/* ---------- 손가락으로 당기기 ---------- */
function slingPoint(canvas, e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (SLING_W / r.width), y:(e.clientY - r.top) * (SLING_H / r.height) };
}
function slingAimTo(x, y){
  const s = sling, dx = x - SLING_ANCHOR.x, dy = y - SLING_ANCHOR.y, d = Math.hypot(dx, dy);
  if (d > SLING_PULL){ s.pouch.x = SLING_ANCHOR.x + dx / d * SLING_PULL; s.pouch.y = SLING_ANCHOR.y + dy / d * SLING_PULL; }
  else { s.pouch.x = x; s.pouch.y = y; }
  s.sound.stretch(Math.min(d, SLING_PULL) / SLING_PULL);
}
function slingBindPointer(canvas){
  canvas.addEventListener('pointerdown', e => {
    const s = sling; if (!s || s.cleared || s.ammo <= 0) return;
    const p = slingPoint(canvas, e);
    // 주머니 근처, 새총 근처, 또는 화면 왼쪽 1/3 어디든 잡을 수 있게 넉넉하게
    if (Math.hypot(p.x - s.pouch.x, p.y - s.pouch.y) < 90 || Math.hypot(p.x - SLING_ANCHOR.x, p.y - SLING_ANCHOR.y) < 120 || p.x < 360){
      s.aiming = 'touch'; s.sound.pinch();
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      slingAimTo(p.x, p.y);
      e.preventDefault();
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!sling || sling.aiming !== 'touch') return;
    const p = slingPoint(canvas, e); slingAimTo(p.x, p.y); e.preventDefault();
  });
  const up = () => { if (sling && sling.aiming === 'touch') slingFire(); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
}

function slingFire(){
  const s = sling;
  const dx = SLING_ANCHOR.x - s.pouch.x, dy = SLING_ANCHOR.y - s.pouch.y, d = Math.hypot(dx, dy);
  s.aiming = null;
  if (d < 18 || s.ammo <= 0){ s.pouch = { ...SLING_ANCHOR }; s.sound.stop(); return; }
  const pw = Math.min(d, SLING_PULL) * 0.23, ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * pw, vy = Math.sin(ang) * pw;
  const W = SLING_WEAPONS[s.weapon];
  s.sound.release();
  s.ammo--; slingHud();
  const shot = (o) => ({ x:s.pouch.x, y:s.pouch.y, vx, vy, r:14, kind:s.weapon, color:W.color, glow:W.glow, trail:[], on:true, ...o });
  if (s.weapon === 'TWIN'){
    s.shots.push(shot({ y:s.pouch.y - 10, vy:vy - 1.2, r:12, color:'#9BE0C8' }),
                 shot({ y:s.pouch.y + 10, vy:vy + 1.2, r:12, color:'#B3A6EE' }));
  } else if (s.weapon === 'BOMB'){
    s.shots.push(shot({ r:18 }));
  } else if (s.weapon === 'PIERCE'){
    s.shots.push(shot({ vx:vx * 1.25, vy:vy * 1.25, r:13 }));
  } else s.shots.push(shot({}));
  s.pouch = { ...SLING_ANCHOR };
  if (s.ammo === 1) slingCoach('마지막 별이에요. 잘 조준해요!');
}

function slingPoints(pts, x, y){
  const s = sling;
  s.score += pts;
  s.texts.push({ t:`+${pts}`, x, y, a:1 });
  slingHud();
}
function slingBurst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = Math.random() * 6 + 2;
    sling.sparks.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, c:color, r:Math.random()*3 + 2, a:1, d:Math.random()*.03 + .02 });
  }
}

/* ---------- 그리기 도우미 ---------- */
function slingFace(ctx, x, y, r, happy){
  ctx.fillStyle = '#4A3036';
  ctx.beginPath(); ctx.arc(x - r*.32, y - r*.12, r*.11, 0, Math.PI*2); ctx.arc(x + r*.32, y - r*.12, r*.11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,143,168,.65)';
  ctx.beginPath(); ctx.ellipse(x - r*.52, y + r*.16, r*.16, r*.1, 0, 0, Math.PI*2); ctx.ellipse(x + r*.52, y + r*.16, r*.16, r*.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#4A3036'; ctx.lineWidth = Math.max(1.6, r*.08); ctx.lineCap = 'round';
  ctx.beginPath();
  if (happy) ctx.arc(x, y + r*.08, r*.22, .15*Math.PI, .85*Math.PI);
  else { ctx.moveTo(x - r*.18, y + r*.3); ctx.lineTo(x + r*.18, y + r*.3); }
  ctx.stroke();
}

/* ---------- 60fps 게임 루프 ---------- */
function slingLoop(){
  const s = sling; if (!s || !s.alive) return;
  const ctx = s.ctx, L = SLING_LEVELS[s.level % SLING_LEVELS.length], G = SLING_GROUND, A = SLING_ANCHOR;
  const now = performance.now();

  ctx.save();
  if (s.shake > 0){ ctx.translate((Math.random() - .5) * s.shake, (Math.random() - .5) * s.shake); s.shake = Math.max(0, s.shake - .6); }

  // 밤하늘
  const bg = ctx.createLinearGradient(0, 0, 0, SLING_H);
  bg.addColorStop(0, '#221d3f'); bg.addColorStop(1, '#3a2d58');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, SLING_W + 40, SLING_H + 40);
  for (const st of s.sky){
    st.x -= st.v; if (st.x < 0) st.x = SLING_W;
    ctx.globalAlpha = st.a * (.75 + .25 * Math.sin(now * .002 + st.y));
    ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 땅
  ctx.fillStyle = '#2d2448'; ctx.fillRect(-20, G, SLING_W + 40, SLING_H - G + 20);
  ctx.strokeStyle = 'rgba(155,224,200,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, G); ctx.lineTo(SLING_W, G); ctx.stroke();

  // 새총
  const fl = { x:A.x - 24, y:A.y - 50 }, fr = { x:A.x + 24, y:A.y - 45 };
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a6a55'; ctx.lineWidth = 13; ctx.beginPath(); ctx.moveTo(A.x, G); ctx.lineTo(A.x, A.y); ctx.stroke();
  ctx.strokeStyle = '#a47e63'; ctx.lineWidth = 10; ctx.beginPath();
  ctx.moveTo(A.x, A.y); ctx.lineTo(fl.x, fl.y); ctx.moveTo(A.x, A.y); ctx.lineTo(fr.x, fr.y); ctx.stroke();
  ctx.strokeStyle = '#FF8FA8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(s.pouch.x - 8, s.pouch.y); ctx.stroke();

  // 날아갈 길 미리 보기
  if (s.aiming){
    const dx = A.x - s.pouch.x, dy = A.y - s.pouch.y, d = Math.hypot(dx, dy);
    if (d > 18){
      const pw = Math.min(d, SLING_PULL) * 0.23, ang = Math.atan2(dy, dx);
      let vx = Math.cos(ang) * pw * (s.weapon === 'PIERCE' ? 1.25 : 1), vy = Math.sin(ang) * pw * (s.weapon === 'PIERCE' ? 1.25 : 1);
      let x = s.pouch.x, y = s.pouch.y;
      for (let i = 0; i < 36; i++){
        vx += L.wind; vy += L.gravity; x += vx; y += vy;
        if (y > G || x > SLING_W) break;
        const k = 1 - i / 36;
        ctx.globalAlpha = k * .8; ctx.fillStyle = '#FFE3EA';
        ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, 4.5 * k), 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // 주머니 속 별
  if (s.ammo > 0 || s.aiming){
    const W = SLING_WEAPONS[s.weapon];
    ctx.save(); ctx.shadowColor = W.glow; ctx.shadowBlur = 12;
    drawStar(ctx, s.pouch.x, s.pouch.y, 15, W.color, '#6B4A52'); ctx.restore();
  }
  ctx.strokeStyle = '#FF8FA8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(fr.x, fr.y); ctx.lineTo(s.pouch.x + 8, s.pouch.y); ctx.stroke();
  ctx.fillStyle = '#6B4A52'; ctx.strokeStyle = '#FFE3EA'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(s.pouch.x, s.pouch.y + 13, 12, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // 벽돌
  for (const b of s.blocks){
    if (b.dead) continue;
    if (b.cool > 0) b.cool--;
    const c = SLING_BLOCK_COLOR[b.type];
    ctx.fillStyle = c.fill; ctx.strokeStyle = c.line; ctx.lineWidth = 2.5;
    const x = b.x - b.w/2, y = b.y - b.h/2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, b.w, b.h, 6) : ctx.rect(x, y, b.w, b.h); ctx.fill(); ctx.stroke();
    if (b.type !== 'steel' && b.hp < b.max){ ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + b.w*.2, y + b.h*.3); ctx.lineTo(x + b.w*.6, y + b.h*.55); ctx.lineTo(x + b.w*.4, y + b.h*.8); ctx.stroke(); }
  }

  // 과녁 (얼굴 있는 동그라미)
  for (const t of s.targets){
    if (t.dead) continue;
    if (t.cool > 0) t.cool--;
    const r = t.r + Math.sin(now * .005 + t.x) * 2;
    ctx.save();
    ctx.shadowColor = SLING_TARGET_COLOR[t.type]; ctx.shadowBlur = 16;
    ctx.fillStyle = t.type === 'heavy' && t.hp === 1 ? '#FFC2CE' : SLING_TARGET_COLOR[t.type];
    if (t.type === 'bonus') drawStar(ctx, t.x, t.y, r * 1.15, '#FFD98E', '#6B4A52');
    else { ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#6B4A52'; ctx.lineWidth = 2.5; ctx.stroke(); }
    ctx.restore();
    slingFace(ctx, t.x, t.y + (t.type === 'bonus' ? 2 : 0), r * (t.type === 'bonus' ? .8 : 1), true);
    if (t.type === 'boom'){ ctx.fillStyle = '#6B4A52'; ctx.font = `bold ${Math.round(r*.7)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('💥', t.x, t.y - r - 4); }
  }

  // 날아가는 별
  for (const p of s.shots){
    p.trail.unshift({ x:p.x, y:p.y }); if (p.trail.length > 14) p.trail.pop();
    p.vx += L.wind; p.vy += L.gravity; p.x += p.vx; p.y += p.vy;
    p.trail.forEach((q, i) => { const k = 1 - i / p.trail.length;
      ctx.globalAlpha = k * .45; ctx.fillStyle = p.glow; ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, p.r * k), 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = p.glow; ctx.shadowBlur = 14;
    if (p.kind === 'BOMB'){ ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
    else drawStar(ctx, p.x, p.y, p.r * 1.15, p.color, '#6B4A52');
    ctx.restore();

    if (p.y + p.r >= G){
      p.y = G - p.r; p.vy = -p.vy * .45; p.vx *= .7;
      slingBurst(p.x, G, '#9BE0C8', 5);
      if (Math.abs(p.vx) < .6 && Math.abs(p.vy) < .8) p.on = false;
    }
    for (const b of s.blocks){
      if (b.dead || !p.on || b.cool > 0) continue;
      const cx = Math.max(b.x - b.w/2, Math.min(p.x, b.x + b.w/2)), cy = Math.max(b.y - b.h/2, Math.min(p.y, b.y + b.h/2));
      if (Math.hypot(p.x - cx, p.y - cy) < p.r){
        b.cool = 8;                                      // 한 번 부딪힌 것을 여러 번 세지 않도록
        s.sound.hit('block'); s.shake = Math.min(s.shake + 4, 10);
        if (p.kind !== 'PIERCE'){ if (Math.abs(p.x - cx) > Math.abs(p.y - cy)) p.vx = -p.vx * .65; else p.vy = -p.vy * .65; }
        if (b.type !== 'steel'){
          b.hp -= p.kind === 'BOMB' ? 3 : 1; slingBurst(cx, cy, '#CBDDF7', 10);
          if (b.hp <= 0){ b.dead = true; slingPoints(50, b.x, b.y); }
        }
      }
    }
    for (const t of s.targets){
      if (t.dead || !p.on || t.cool > 0) continue;
      if (Math.hypot(p.x - t.x, p.y - t.y) < p.r + t.r){
        t.cool = 8;
        s.sound.hit(t.type); s.shake = Math.min(s.shake + 8, 16);
        t.hp -= p.kind === 'BOMB' ? 3 : 1;
        if (t.hp <= 0){
          t.dead = true; slingPoints(t.pts, t.x, t.y); slingBurst(t.x, t.y, SLING_TARGET_COLOR[t.type], 24);
          if (t.type === 'boom'){
            for (const n of s.targets){
              if (!n.dead && Math.hypot(n.x - t.x, n.y - t.y) < 140){ n.dead = true; slingPoints(n.pts * 2, n.x, n.y); slingBurst(n.x, n.y, '#FFB36B', 18); }
            }
          }
        }
        if (p.kind === 'BOMB'){ p.on = false; slingBurst(p.x, p.y, '#FFB36B', 32); }
        else if (p.kind !== 'PIERCE'){ p.vx = -p.vx * .4; p.vy = -p.vy * .4; }
      }
    }
    if (p.x < -100 || p.x > SLING_W + 100 || p.y > SLING_H + 50) p.on = false;
  }
  s.shots = s.shots.filter(p => p.on);

  // 불꽃·점수 글자
  for (let i = s.sparks.length - 1; i >= 0; i--){
    const q = s.sparks[i]; q.x += q.vx; q.y += q.vy; q.vy += .12; q.a -= q.d;
    if (q.a <= 0){ s.sparks.splice(i, 1); continue; }
    ctx.globalAlpha = q.a; ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (let i = s.texts.length - 1; i >= 0; i--){
    const f = s.texts[i]; f.y -= 1.2; f.a -= .02;
    if (f.a <= 0){ s.texts.splice(i, 1); continue; }
    ctx.globalAlpha = f.a; ctx.fillStyle = '#FFE79C'; ctx.font = "bold 20px 'Gaegu', sans-serif"; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 손 제스처 조준점
  if (s.hand && s.hand.present){
    ctx.strokeStyle = s.hand.pinch ? '#FFD98E' : 'rgba(255,227,234,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.hand.x * SLING_W, s.hand.y * SLING_H, s.hand.pinch ? 17 : 12, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  // 통과 / 실패
  const left = s.targets.filter(t => !t.dead).length;
  if (!s.cleared && left === 0){
    s.cleared = true; s.aiming = null;
    const bonus = s.ammo * 300;
    s.score += bonus;                                    // 원래 코드는 보너스를 보여만 주고 더하지 않았다
    s.sound.win(); confetti();
    s.layer.querySelector('#slClearScore').textContent = `점수 ${s.score.toLocaleString()} · 남은 별 보너스 +${bonus.toLocaleString()} · ⭐ 3개 받았어요`;
    s.layer.querySelector('#slClear').hidden = false;
    const who = kid(s.kidId);
    if (who){
      const patch = { stars:(who.stars || 0) + 3 };
      if (s.score > s.best){ s.best = s.score; patch.slingBest = s.score; }
      Store.update('profiles', who.id, patch);
    }
    slingHud();
  } else if (!s.cleared && !s.failed && s.ammo <= 0 && s.shots.length === 0 && left > 0){
    if (!s.failAt) s.failAt = now + 800;
    else if (now >= s.failAt){ s.failed = true; s.layer.querySelector('#slFail').hidden = false; }
  }

  s.raf = requestAnimationFrame(slingLoop);
}

/* ---------- ✋ 손 제스처 (필요할 때만 불러온다) ---------- */
const MP_HANDS = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
const MP_CAMERA = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js';
function loadScriptOnce(src){
  return new Promise((ok, bad) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = document.createElement('script'); el.src = src; el.crossOrigin = 'anonymous';
    el.onload = () => ok(); el.onerror = () => bad(new Error('load ' + src));
    document.head.appendChild(el);
  });
}
async function slingStartHand(){
  const s = sling; if (!s) return;
  const btn = s.layer.querySelector('#slHand'), cam = s.layer.querySelector('#slCam'), badge = s.layer.querySelector('#slCamBadge');
  btn.disabled = true; btn.textContent = '준비 중…';
  try {
    await loadScriptOnce(MP_CAMERA);
    await loadScriptOnce(MP_HANDS + 'hands.js');
    if (!sling || sling !== s) return;
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.muted = true;
    const hands = new window.Hands({ locateFile: f => MP_HANDS + f });
    hands.setOptions({ maxNumHands:1, modelComplexity:0, minDetectionConfidence:.6, minTrackingConfidence:.6 });
    const camCtx = s.layer.querySelector('#slCamCanvas').getContext('2d');
    s.hand = { present:false, pinch:false, x:.5, y:.5, hands, camera:null, video };
    hands.onResults(res => {
      if (!sling || !s.hand) return;
      camCtx.save(); camCtx.translate(160, 0); camCtx.scale(-1, 1);
      camCtx.drawImage(video, 0, 0, 160, 120); camCtx.restore();
      const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];
      if (!lm){
        s.hand.present = false; badge.textContent = '손을 비춰주세요 🖐️';
        if (s.aiming === 'hand') slingFire();
        return;
      }
      const th = lm[4], ix = lm[8];
      const pinch = Math.hypot(th.x - ix.x, th.y - ix.y) < 0.085;
      const px = 1 - (th.x + ix.x) / 2, py = (th.y + ix.y) / 2;        // 거울처럼 좌우를 뒤집는다
      s.hand.present = true; s.hand.pinch = pinch;
      s.hand.x = s.hand.x * .4 + px * .6; s.hand.y = s.hand.y * .4 + py * .6;
      badge.textContent = pinch ? '잡았어요! 당겨요 🏹' : '엄지와 검지를 모아요 🤏';
      const hx = s.hand.x * SLING_W, hy = s.hand.y * SLING_H;
      if (pinch){
        if (!s.aiming && !s.cleared && s.ammo > 0 && (Math.hypot(hx - SLING_ANCHOR.x, hy - SLING_ANCHOR.y) < 220 || hx < 360)){
          s.aiming = 'hand'; s.sound.pinch();
        }
        if (s.aiming === 'hand') slingAimTo(hx, hy);
      } else if (s.aiming === 'hand') slingFire();
    });
    const camera = new window.Camera(video, {
      onFrame: async () => { if (sling === s && s.hand) await hands.send({ image:video }); },
      width:640, height:480, facingMode:'user'
    });
    s.hand.camera = camera;
    await camera.start();
    cam.hidden = false;
    btn.disabled = false; btn.textContent = '✋ 끄기';
    slingCoach('엄지와 검지를 붙여 새총을 잡고, 뒤로 당긴 뒤 손을 쫙 펴면 날아가요!');
  } catch(err){
    console.warn('hand tracking', err);
    slingStopHand(s);
    if (sling === s){
      btn.disabled = false; btn.textContent = '✋ 손으로';
      toast('카메라를 켤 수 없어요. 손가락으로 해볼까요?');
    }
  }
}
function slingStopHand(s, byUser){
  if (!s || !s.hand) return;
  const h = s.hand; s.hand = null;
  try { h.camera && h.camera.stop(); } catch(e){}
  try { h.video && h.video.srcObject && h.video.srcObject.getTracks().forEach(t => t.stop()); } catch(e){}
  try { h.hands && h.hands.close(); } catch(e){}
  if (s.aiming === 'hand'){ s.aiming = null; s.pouch = { ...SLING_ANCHOR }; }
  if (byUser && s.layer){
    s.layer.querySelector('#slCam').hidden = true;
    s.layer.querySelector('#slHand').textContent = '✋ 손으로';
    slingCoach('손가락으로 주머니를 당겨요!');
  }
}

   잠금 해제
   ============================================================ */
/* 아이가 요청을 올린다 → db를 통해 부모님 기기(같은 계정으로 연 모든 화면)에 몇 초 안에 뜬다.
   카카오톡 알림이나 휴대폰 푸시는 이 페이지에서 보낼 수 없다 — 서버가 있어야 한다.
   나중에 카카오를 붙이려면 이 함수와 approveRequest()만 바꾸면 된다. */
async function requestUnlock(){
  const k = curKid(); if (!k) return;
  if (pendingRequests().some(r=>r.kidId===k.id)) return;
  const minutes = S.settings.gameMinutes || 20;
  await Store.add('requests', {
    kidId:k.id, kidName:k.name, status:'pending',
    minutes, createdAt:new Date().toISOString()
  });
  // 부모님 텔레그램으로 알림 (서버에 봇 설정이 없으면 조용히 넘어간다)
  if (!window.claude){
    fetch('/api/notify', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ kidName:k.name, minutes, familyId:S.familyId,
        chatId:(S.settings.telegram && S.settings.telegram.chatId) || '' })
    }).catch(()=>{});
  }
}
function approveRequest(reqId){
  const r = S.data.requests.find(x=>x.id===reqId);
  if (!r) return;
  grantUnlock(r.kidId, r.minutes);
  Store.update('requests', reqId, { status:'approved', decidedAt:new Date().toISOString() });
}
function denyRequest(reqId){
  Store.update('requests', reqId, { status:'denied', decidedAt:new Date().toISOString() });
}
function grantUnlock(kidId, minutes){
  const mins = minutes || S.settings.gameMinutes || 20;
  Store.add('unlocks', {
    kidId,
    grantedAt: new Date().toISOString(),
    expiresAt: new Date(Date.now() + mins*60000).toISOString(),
    minutes: mins
  });
}
function relock(kidId){
  S.data.unlocks.filter(u=>u.kidId===kidId).forEach(u=>Store.remove('unlocks', u.id));
  if (kidId === S.kidId){ S.view.game = null; stopStars(); }
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-pick],[data-tick],[data-start],[data-stop],[data-deltodo],'+
    '[data-book],[data-mode],[data-say],[data-game],[data-mem],[data-ml],[data-mr],[data-cat],[data-stars],'+
    '[data-close],[data-pin],[data-pinclear],[data-pinback],[data-ptab],[data-addtodo],[data-parentdel],'+
    '[data-kidav],[data-kidcol],[data-grant],[data-relock],[data-approve],[data-deny],'+
    '[data-nday],[data-tday],[data-tglink],[data-bookedit],[data-bookdel],[data-bookshow],[data-becat],[data-bestar],'+
    '[data-weather],[data-cand],button');

  const d = t.dataset;

  /* --- 첫 설정 --- */
  if (t.id === 'setupGo'){
    const n1 = ($('#setup1').value||'').trim();
    const n2 = ($('#setup2').value||'').trim();
    const pin = ($('#setupPin').value||'').trim();
    if (!n1){ toast('첫째 이름을 적어주세요'); $('#setup1').focus(); return; }
    if (!n2){ toast('둘째 이름도 적어주세요'); $('#setup2').focus(); return; }
    if (!/^\d{4}$/.test(pin)){ toast('부모님 비밀번호를 숫자 4자리로 정해주세요'); $('#setupPin').focus(); return; }
    await Store.saveSettings({ pin, pinSet:true });
    const now = new Date().toISOString();
    await Store.add('profiles', { name:n1, avatar:AVATARS[0], colorIdx:0, stars:0, createdAt:now });
    await Store.add('profiles', { name:n2, avatar:AVATARS[1], colorIdx:1, stars:0, createdAt:new Date(Date.now()+1).toISOString() });
    askConfirm({
      title:'예시를 넣어볼까요?', okLabel:'넣어주세요',
      note:'책·낱말·할 일 예시를 채워 화면이 어떻게 보이는지 보여드려요. 부모님 화면에서 언제든 지울 수 있어요.',
      onOk: async () => { await seedSample(); toast('예시를 넣었어요'); }
    });
    return;
  }

  /* --- 날씨 --- */
  if (t.id === 'pickWeather' || t.id === 'dateChip'){ openModal(weatherSheet()); return; }
  if (d.weather){
    const w = WEATHERS[+d.weather];
    setWeather(w.icon, w.label); closeModal(); return;
  }
  if (t.id === 'autoWeather' || t.id === 'hereWeather'){
    t.disabled = true; t.textContent = '가져오는 중…';
    const ok = await autoWeather(t.id === 'hereWeather');
    if (ok) closeModal(); else openModal(weatherSheet());
    return;
  }

  /* --- 프로필 --- */
  if (d.pick){ S.kidId = d.pick; lsSet('dolearn.kid', d.pick); S.tab='today'; render(); return; }
  if (t.id === 'whoami' || t.id === 'homeBtn'){
    S.kidId = null; S.view.game = null; stopStars(); render(); return;
  }
  if (t.id === 'addKidHere'){
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose='parent'; S.view.parentTab='kids';
    openModal(pinSheet('부모님, 친구를 추가할까요?'));
    return;
  }
  if (t.id === 'openParent'){ S.view.pin=''; S.view.pinError=''; S.view.pinPurpose='parent'; openModal(pinSheet('부모님 화면')); return; }

  /* --- 탭 --- */
  if (d.tab){ S.tab = d.tab; if (d.tab!=='games'){ S.view.game=null; stopStars(); } render(); return; }

  /* --- 할 일 --- */
  if (d.tick){
    const key = todayKey(), s = sessionOf(S.kidId, d.tick, key);
    if (s && s.done){ await Store.update('sessions', s.id, { done:false }); return; }   // 체크 해제는 응원 없이
    if (s) await Store.update('sessions', s.id, { done:true });
    else await Store.add('sessions', { kidId:S.kidId, todoId:d.tick, date:key, durationSec:0, done:true });
    cheerDone();
    return;
  }
  if (d.start){ S.running = { todoId:d.start, startedAt:Date.now() }; render(); return; }
  if (d.stop){
    const dur = (Date.now() - S.running.startedAt)/1000;
    S.running = null;
    const key = todayKey(), s = sessionOf(S.kidId, d.stop, key);
    const wasDone = !!(s && s.done);
    if (s) await Store.update('sessions', s.id, { durationSec:(s.durationSec||0)+dur, done:true });
    else await Store.add('sessions', { kidId:S.kidId, todoId:d.stop, date:key, durationSec:dur, done:true });
    if (!wasDone) cheerDone();
    return;
  }
  if (d.deltodo){ await Store.update('todos', d.deltodo, { archived:true }); return; }
  if (t.id === 'addTodo'){
    askText({
      title:'무슨 일을 할까요?', note:'내가 하고 싶은 일을 적어요.',
      placeholder:'예: 그림 그리기', okLabel:'넣기',
      onOk: async (v) => {
        await Store.add('todos', { kidId:S.kidId, title:v, icon:'✨', repeatDays:[],
          createdBy:'kid', createdAt:new Date().toISOString() });
        toast('할 일을 넣었어요');
      }
    });
    return;
  }
  if (t.id === 'goGames'){ S.tab='games'; render(); return; }

  /* --- 책 --- */
  if (t.id === 'addBook' || t.id === 'addBook2'){
    S.view.wiz = { step:'scan', category:(S.settings.cats||DEFAULT_CATS)[0], stars:3, words:[] };
    openModal(bookWizard());
    startScanner();
    return;
  }
  if (t.id === 'wizManual'){
    stopScanner();
    S.view.wiz.step = 'info';
    S.view.wiz.guessNote = '책 제목을 적어주세요.';
    openModal(bookWizard());
    return;
  }
  if (d.cat){ S.view.wiz.category = d.cat; openModal(bookWizard()); return; }
  if (d.stars){ S.view.wiz.stars = +d.stars; openModal(bookWizard()); return; }
  if (t.id === 'wizSearchTitle'){
    const w = S.view.wiz;
    w.title = ($('#wizTitle').value||'').trim();
    if (!w.title){ toast('먼저 제목을 조금 적어주세요'); return; }
    w.busy = true; openModal(bookWizard());
    const r = await bookSearch(w.title, 'title');
    w.busy = false;
    if (r.ok){ w.candidates = r.docs; w.guessNote = r.docs.length ? '맞는 책을 골라주세요.' : ''; }
    else { w.candidates = null; w.guessNote = BOOK_MSG[r.reason] || '지금은 찾을 수 없어요.'; }
    openModal(bookWizard());
    return;
  }
  if (d.cand){
    const w = S.view.wiz, c = (w.candidates||[])[+d.cand];
    if (c){ w.title = c.title; w.author = c.author; w.coverUrl = c.coverUrl; w.publisher = c.publisher;
      if (c.category) w.category = c.category;
      w.found = 'shop'; w.candidates = null; w.guessNote = '이 책으로 할게요!'; }
    openModal(bookWizard());
    return;
  }
  if (t.id === 'wizToCover'){
    const w = S.view.wiz;
    w.title = ($('#wizTitle').value||'').trim();
    w.author = ($('#wizAuthor').value||'').trim();
    if (!w.title){ toast('책 제목을 적어주세요'); return; }
    w.step = 'cover'; openModal(bookWizard()); return;
  }
  if (t.id === 'wizSkipCover' || t.id === 'wizSave'){ await saveBook(); return; }
  if (t.id === 'wizAddWord'){
    const inp = $('#wizWord'); const v = (inp.value||'').trim();
    if (v){ S.view.wiz.words.push(v); inp.value=''; openModal(bookWizard()); }
    return;
  }
  if (t.id === 'wizDone'){
    const w = S.view.wiz;
    for (const term of (w.words||[])){
      await Store.add('words', {
        kidId:S.kidId, term, lang:/^[a-zA-Z\s'-]+$/.test(term)?'en':'ko',
        meaning:'', fromBookId:w.savedId||'', box:1,
        nextReviewAt:new Date().toISOString(), createdAt:new Date().toISOString()
      });
    }
    closeModal(); S.tab = 'shelf'; render(); return;
  }
  if (d.book){ showBook(d.book); return; }
  if (d.bookshow){ S.view.bookEdit = null; showBook(d.bookshow); return; }
  if (d.bookedit){
    const b = S.data.books.find(x => x.id === d.bookedit); if (!b) return;
    S.view.bookEdit = { id:b.id, title:b.title || '', author:b.author || '', category:b.category,
      stars:b.stars || 3, coverUrl:b.coverUrl || '', coverAssetId:b.coverAssetId || '', coverFile:null, coverPreview:'' };
    openModal(bookEditSheet());
    return;
  }
  if (d.becat){ keepBookEditTyping(); S.view.bookEdit.category = d.becat; openModal(bookEditSheet()); return; }
  if (d.bestar){ keepBookEditTyping(); S.view.bookEdit.stars = +d.bestar; openModal(bookEditSheet()); return; }
  if (t.id === 'beSave'){
    keepBookEditTyping();
    const e = S.view.bookEdit, b = S.data.books.find(x => x.id === e.id);
    if (!b){ closeModal(); return; }
    if (!e.title.trim()){ toast('책 제목을 적어주세요'); $('#beTitle').focus(); return; }
    e.saving = true; openModal(bookEditSheet());
    const patch = { title:e.title.trim(), author:e.author.trim(), category:e.category, stars:e.stars };
    if (e.coverFile){
      const up = await uploadCover(e.coverFile);
      if (up){
        await removeCoverFile(b);                     // 예전에 찍은 사진은 지운다
        patch.coverUrl = up.coverUrl; patch.coverAssetId = up.coverAssetId;
      }
    }
    await Store.update('books', e.id, patch);
    S.view.bookEdit = null;
    toast('책을 고쳤어요');
    showBook(b.id);
    return;
  }
  if (d.bookdel){
    const b = S.data.books.find(x => x.id === d.bookdel); if (!b) return;
    askConfirm({
      title:`「${b.title}」 책을 지울까요?`, danger:true, okLabel:'지우기',
      note:'책장에서 사라지고 되돌릴 수 없어요. 이 책에서 담은 낱말은 단어 가방에 그대로 남아요.',
      onOk: async () => {
        await removeCoverFile(b);
        await Store.remove('books', b.id);
        toast('책을 지웠어요');
      }
    });
    return;
  }

  /* --- 단어 --- */
  if (d.mode){ S.view.dictMode = d.mode; S.view.dictResult=null; render(); return; }
  if (d.say){ speak(d.say, d.lang); return; }
  if (t.id === 'micBtn'){
    const mode = S.view.dictMode || 'ek';
    listen(mode==='kk'?'ko':'en', txt => { S.view.dictQuery = txt; render(); doLookup(txt); });
    return;
  }
  if (t.id === 'dictGo'){
    const q = ($('#dictInput').value||'').trim();
    if (q) doLookup(q);
    return;
  }
  if (t.id === 'saveWord'){
    const r = S.view.dictResult; if (!r) return;
    await Store.add('words', {
      kidId:S.kidId, term:r.term, lang:(S.view.dictMode==='kk')?'ko':'en',
      meaning:r.meaning, example:r.example, emoji:r.emoji, box:1,
      nextReviewAt:new Date(Date.now()+86400000).toISOString(), createdAt:new Date().toISOString()
    });
    S.view.dictResult = null; S.view.dictQuery=''; render();
    return;
  }
  if (t.id === 'startReview'){ startReview(); return; }
  if (t.id === 'revKnow' || t.id === 'revAgain'){
    const st = S.view.review;
    const w = st.queue[st.i];
    if (w){
      const box = t.id === 'revKnow' ? Math.min(5,(w.box||1)+1) : 1;
      const days = [1,2,4,7,15][box-1];
      await Store.update('words', w.id, { box, nextReviewAt:new Date(Date.now()+days*86400000).toISOString() });
    }
    st.i++; st.show = false;
    if (st.i >= st.queue.length){ closeModal(); confetti(); }
    else openModal(reviewSheet());
    return;
  }
  if (t.id === 'revShow'){ S.view.review.show = true; openModal(reviewSheet()); return; }

  /* --- 게임 --- */
  if (t.id === 'askUnlock'){ await requestUnlock(); return; }
  if (t.id === 'cancelReq'){
    const mine = pendingRequests().find(r=>r.kidId===S.kidId);
    if (mine) await Store.remove('requests', mine.id);
    return;
  }
  if (t.id === 'pinHere'){
    const mine = pendingRequests().find(r=>r.kidId===S.kidId);
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose = mine ? 'approve:'+mine.id : 'unlock';
    openModal(pinSheet('부모님, 열어주세요', '오늘 할 일을 모두 마쳤어요!'));
    return;
  }
  if (d.approve){
    S.view.pin=''; S.view.pinError=''; S.view.pinPurpose = 'approve:'+d.approve;
    openModal(pinSheet('승인하시겠어요?', '부모님 비밀번호를 눌러주세요.'));
    return;
  }
  if (d.deny){ denyRequest(d.deny); return; }
  if (d.game === 'memory'){ startMemory(); return; }
  if (d.game === 'stars'){ startStars(); return; }
  if (d.game === 'match'){ startMatch(); return; }
  if (d.game === 'sling'){ S.view.game = 'sling'; openSling(); return; }
  if (d.mem){ memTap(+d.mem); return; }
  if (d.ml){ matchTap('l', d.ml); return; }
  if (d.mr){ matchTap('r', d.mr); return; }
  if (t.id === 'quitGame'){ S.view.game = null; stopStars(); render(); return; }

  /* --- 모달/PIN --- */
  if (d.close){ closeModal(); return; }
  if (d.pin){
    S.view.pin = (S.view.pin||'') + d.pin;
    S.view.pinError = '';
    if (S.view.pin.length === 4) return checkPin();
    openModal(pinSheet(pinTitle()));
    return;
  }
  if (d.pinback){ S.view.pin = (S.view.pin||'').slice(0,-1); openModal(pinSheet(pinTitle())); return; }
  if (d.pinclear){ S.view.pin = ''; openModal(pinSheet(pinTitle())); return; }

  /* --- 부모 --- */
  if (d.ptab){
    S.view.parentTab = d.ptab;
    if (d.ptab === 'notify') S.view.tg = null;   // 알림 탭을 열 때마다 연결 상태를 새로 확인
    openModal(parentSheet()); return;
  }
  if (d.addtodo){
    const inp = document.querySelector(`[data-newtodo="${d.addtodo}"]`);
    const v = (inp && inp.value||'').trim();
    if (!v){ toast('할 일을 적어주세요'); if (inp) inp.focus(); return; }
    const days = (S.view.newTodoDays||{})[d.addtodo] || [];
    await Store.add('todos', { kidId:d.addtodo, title:v, icon:'📌',
      repeatDays:days.slice().sort(), createdBy:'parent', createdAt:new Date().toISOString() });
    if (S.view.newTodoDays) S.view.newTodoDays[d.addtodo] = [];
    if (S.view.newTodoText) S.view.newTodoText[d.addtodo] = '';
    openModal(parentSheet());
    toast('할 일을 넣었어요');
    return;
  }
  // 새 할 일의 요일 고르기
  if (d.nday){
    const [kidId, which] = d.nday.split('|');
    S.view.newTodoDays = S.view.newTodoDays || {};
    S.view.newTodoText = S.view.newTodoText || {};
    const inp = document.querySelector(`[data-newtodo="${kidId}"]`);
    if (inp) S.view.newTodoText[kidId] = inp.value;      // 다시 그려도 적던 글자가 남게
    const cur = S.view.newTodoDays[kidId] || [];
    if (which === 'all') S.view.newTodoDays[kidId] = [];
    else {
      const n = +which;
      S.view.newTodoDays[kidId] = cur.includes(n) ? cur.filter(x=>x!==n) : cur.concat(n).sort();
    }
    openModal(parentSheet());
    return;
  }
  // 이미 있는 할 일의 요일 바꾸기
  if (d.tday){
    const [todoId, which] = d.tday.split('|');
    const todo = S.data.todos.find(x=>x.id===todoId);
    if (!todo) return;
    const cur = Array.isArray(todo.repeatDays) ? todo.repeatDays : [];
    let next;
    if (which === 'all') next = [];
    else { const n = +which; next = cur.includes(n) ? cur.filter(x=>x!==n) : cur.concat(n).sort(); }
    await Store.update('todos', todoId, { repeatDays: next });
    openModal(parentSheet());
    return;
  }
  if (d.parentdel){ await Store.update('todos', d.parentdel, { archived:true }); openModal(parentSheet()); return; }
  if (d.kidav){ const [id,av] = d.kidav.split('|'); await Store.update('profiles', id, { avatar:av }); openModal(parentSheet()); return; }
  if (d.kidcol){ const [id,ci] = d.kidcol.split('|'); await Store.update('profiles', id, { colorIdx:+ci }); openModal(parentSheet()); return; }
  if (t.id === 'addKid'){
    askText({
      title:'새 친구 이름은?', placeholder:'이름', okLabel:'추가',
      onOk: async (n) => {
        const i = kids().length;
        await Store.add('profiles', { name:n, avatar:AVATARS[i%AVATARS.length],
          colorIdx:i%KID_COLORS.length, stars:0, createdAt:new Date().toISOString() });
        openModal(parentSheet());
      }
    });
    return;
  }
  if (d.grant){ grantUnlock(d.grant); openModal(parentSheet()); return; }
  if (d.relock){ relock(d.relock); openModal(parentSheet()); return; }
  if (t.id === 'setPin'){
    S.view.pinNext = 'parent';
    openModal(pinSetSheet());
    setTimeout(() => { const i = $('#newPin1'); if (i) i.focus(); }, 60);
    return;
  }
  if (t.id === 'savePin'){
    const a = ($('#newPin1').value||'').trim(), b = ($('#newPin2').value||'').trim();
    const msg = $('#newPinMsg');
    const say = s => { if (msg){ msg.textContent = s; msg.style.color = 'var(--berry-deep)'; } };
    if (!/^\d{4}$/.test(a)){ say('숫자 4자리로 적어주세요.'); $('#newPin1').focus(); return; }
    if (a === '1234'){ say('처음 비밀번호와 같아요. 다른 숫자로 정해주세요.'); $('#newPin1').focus(); return; }
    if (a !== b){ say('두 번 적은 숫자가 달라요. 다시 확인해 주세요.'); $('#newPin2').focus(); return; }
    await Store.saveSettings({ pin:a, pinSet:true });
    const next = S.view.pinNext || 'parent';
    S.view.pinNext = null;
    toast('새 비밀번호를 정했어요');
    if (next === 'parent'){ S.view.parentTab = S.view.parentTab || 'settings'; openModal(parentSheet()); }
    else continueAfterPin(next);
    return;
  }
  /* --- 텔레그램 알림 --- */
  if (t.id === 'tgCheck'){ await tgRefresh(true); return; }
  if (t.id === 'tgTest'){ await tgSendTest(false); return; }
  if (t.id === 'tgUnlink'){
    askConfirm({
      title:'텔레그램 연결을 끊을까요?', danger:true, okLabel:'끊기',
      note:'끊으면 아이가 게임을 요청해도 알림이 가지 않아요. 언제든 다시 연결할 수 있어요.',
      onOk: async () => {
        await Store.saveSettings({ telegram:null });
        S.view.tg = null; S.view.parentTab = 'notify';
        openModal(parentSheet()); toast('연결을 끊었어요');
      }
    });
    return;
  }
  if (d.tglink){
    const [id, ...rest] = d.tglink.split('|');
    await Store.saveSettings({ telegram:{ chatId:String(id), name:rest.join('|'), linkedAt:new Date().toISOString() } });
    openModal(parentSheet());
    tgSendTest(true);
    return;
  }

  /* --- 가족 주소 공유 --- */
  if (t.id === 'shareFamily' || t.id === 'copyFamily'){
    const link = familyLink();
    if (t.id === 'shareFamily' && navigator.share){
      try { await navigator.share({ title:'Do-Learn Do-Learn', text:'우리 가족 Do-Learn 주소', url:link }); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(link); toast('주소를 복사했어요'); }
    catch(e){ const ta = $('#familyLink'); if (ta){ ta.focus(); ta.select(); } toast('주소를 길게 눌러 복사해 주세요'); }
    return;
  }

  if (t.id === 'netTest'){ await netTest(); return; }
  if (t.id === 'exportData'){ exportData(); return; }
  if (t.id === 'seedSample'){
    t.disabled = true; t.textContent = '넣는 중…';
    await seedSample(); openModal(parentSheet()); return;
  }
  if (t.id === 'clearSample'){
    askConfirm({
      title:'샘플 데이터를 지울까요?', danger:true, okLabel:'지우기',
      note:'예시로 넣은 책·낱말·할 일만 지웁니다. 아이가 직접 넣은 기록은 그대로 있어요.',
      onOk: async () => { await clearSample(); openModal(parentSheet()); toast('샘플을 지웠어요'); }
    });
    return;
  }
  if (t.id === 'askOk'){
    const v = ($('#askInput').value||'').trim();
    if (!v){ toast('내용을 적어주세요'); return; }
    const cb = S.view.askCb; S.view.askCb = null;
    closeModal();
    if (cb) await cb(v);
    return;
  }
  if (t.id === 'confirmOk'){
    const cb = S.view.confirmCb; S.view.confirmCb = null;
    closeModal();
    if (cb) await cb();
    return;
  }
});

function continueAfterPin(purpose){

    approveRequest(purpose.slice(8)); closeModal(); confetti(); render();

    grantUnlock(S.kidId); closeModal(); confetti(); render();
  } else {
    S.view.parentTab = S.view.parentTab || 'todos'; openModal(parentSheet());
  }
}

function checkPin(){
  if (S.view.pin === String(S.settings.pin || '1234')){
    const purpose = S.view.pinPurpose || '';
    S.view.pin = '';
    if (needsNewPin()){
      S.view.pinNext = purpose;
      openModal(pinSetSheet('처음 비밀번호는 누구나 알 수 있어요. 아이들이 모르는 숫자로 바꿔야 들어갈 수 있어요.'));
      setTimeout(() => { const i = $('#newPin1'); if (i) i.focus(); }, 60);

    }
    if (purpose.startsWith('approve:')){
      approveRequest(purpose.slice(8)); closeModal(); confetti(); render();

      grantUnlock(S.kidId); closeModal(); confetti(); render();
    } else { S.view.parentTab = S.view.parentTab || 'todos'; openModal(parentSheet()); }
  } else {
    S.view.pin = ''; S.view.pinError = '비밀번호가 달라요';
    openModal(pinSheet(pinTitle()));
  }
}

async function doLookup(q){
  S.view.dictQuery = q; S.view.dictBusy = true; S.view.dictError=''; S.view.dictResult=null;

  try {

      ? '사전을 쓰려면 화면에 뜬 “허용”을 눌러주세요.'

  S.view.dictBusy = false;

async function handleCover(file){

/* 표지 사진 올리기 — 버셀은 수파베이스 저장소, claude.ai는 Artifact 저장소 */
async function uploadCover(file){
  if (S.sb){
    try {
      const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      const path = `${S.familyId}/${uid()}.${ext}`;
      const up = await S.sb.storage.from('covers').upload(path, file, { contentType:file.type, upsert:false });
      if (up.error) throw up.error;
      return { coverUrl:S.sb.storage.from('covers').getPublicUrl(path).data.publicUrl, coverAssetId:'' };
    } catch(e){ console.warn('표지 올리기 실패', e); toast('사진을 올리지 못했어요'); return null; }
  }
  if (S.assets){
    try { const r = await S.assets.upload(file); return { coverUrl:'', coverAssetId:r.id }; }
    catch(e){ console.warn('표지 올리기 실패', e); toast('사진을 올리지 못했어요'); return null; }
  }
  return null;
}
/* 우리 저장소에 올린 표지면 지운다 (알라딘 표지 주소는 건드리지 않는다) */
async function removeCoverFile(b){
  try {
    const m = S.sb && b.coverUrl && b.coverUrl.match(/\/storage\/v1\/object\/public\/covers\/(.+)$/);
    if (m) await S.sb.storage.from('covers').remove([decodeURIComponent(m[1])]);
    if (!S.sb && S.assets && b.coverAssetId) await S.assets.delete(b.coverAssetId);
  } catch(e){ console.warn('표지 파일 지우기 실패', e); }
}

async function saveBook(){
  const w = S.view.wiz;
  if (!w.title){ toast('책 제목을 적어주세요'); return; }
  w.uploading = !!w.coverFile;
  openModal(bookWizard());

  let coverAssetId = '', coverUrl = w.coverUrl || '';
  if (w.coverFile){
    const up = await uploadCover(w.coverFile);
    if (up){ coverUrl = up.coverUrl || coverUrl; coverAssetId = up.coverAssetId || ''; }
  }
  const id = await Store.add('books', {
    kidId:S.kidId, isbn:w.isbn||'', title:w.title, author:w.author||'',
    category:w.category||(S.settings.cats||DEFAULT_CATS)[0],
    // 직접 찍은 사진이 있으면 그 주소를 저장한다(예전에는 올린 사진 대신 w.coverUrl을 넣어 사진이 사라졌다)
    coverAssetId, coverUrl, stars:w.stars||3,
    readAt:new Date().toISOString(),
    source: w.found || 'manual'
  });
  S.freshBookId = id;
  w.savedId = id;
  w.uploading = false;
  w.step = 'words';
  openModal(bookWizard());
  confetti();
}

async function seedSample(){
  const ks = kids();
  if (!ks.length) return;
  if (S.settings.sampleLoaded) return;          // 두 번 넣어 겹치지 않도록
  const now = Date.now();

  for (const k of ks){
    for (const t of SAMPLE_TODOS){
      await Store.add('todos', { kidId:k.id, title:t.title, icon:t.icon, repeatDays:[],
        createdBy:'parent', sample:true, createdAt:new Date().toISOString() });
    }
  }
  SAMPLE_BOOKS.forEach((b, i) => {
    const k = ks[i % ks.length];
    Store.add('books', { kidId:k.id, isbn:'', title:b[0], author:b[1], category:b[2],
      coverAssetId:'', coverUrl:'', stars:1 + (i % 3), sample:true,
      readAt:new Date(now - i * 26 * 3600000).toISOString(), source:'manual' });
  });
  SAMPLE_WORDS.forEach((w, i) => {
    const k = ks[i % ks.length];
    Store.add('words', { kidId:k.id, term:w[0], meaning:w[1], emoji:w[2], lang:w[3],
      example:'', box:1 + (i % 3), sample:true,
      nextReviewAt:new Date(now + 86400000).toISOString(),
      createdAt:new Date(now - i * 7200000).toISOString() });
  });
  // 어제까지의 할 일을 몇 개 해둔 것으로 — 주간 스트립이 비어 보이지 않게
  for (const k of ks){
    const mine = S.data.todos.filter(x => x.kidId === k.id && x.sample);
    for (let back = 1; back <= 3; back++){
      const d = new Date(); d.setDate(d.getDate() - back);
      mine.forEach(t => Store.add('sessions', {
        kidId:k.id, todoId:t.id, date:todayKey(d), durationSec:600 + back * 120, done:true, sample:true
      }));
    }
  }
  await Store.saveSettings({ sampleLoaded:true });
}

async function clearSample(){
  for (const coll of ['todos','books','words','sessions']){
    for (const r of S.data[coll].filter(x => x.sample)) await Store.remove(coll, r.id);
  }
  await Store.saveSettings({ sampleLoaded:false });
}

/* ---------- 연결 테스트 / 내보내기 ---------- */
async function netTest(){
  const box = $('#netResult');
  box.innerHTML = '<p class="muted">확인 중…</p>';
  const targets = [
    ['카카오 책 검색','https://dapi.kakao.com/v3/search/book?target=isbn&query=9788934972464'],
    ['국립중앙도서관','https://seoji.nl.go.kr/landingPage/SearchApi.do?cert_key=TEST&result_style=json&page_no=1&page_size=1&isbn=9788934972464'],
    ['날씨(Open-Meteo)','https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=weather_code']
  ];
  const out = [];
  for (const [name,url] of targets){
    try { const r = await fetch(url); out.push(`✅ ${name} — 연결됨 (HTTP ${r.status})`); }
    catch(e){ out.push(`🚫 ${name} — 차단됨`); }
  }
  box.innerHTML = `<div class="banner info"><span>🌐</span><span>${out.map(esc).join('<br>')}<br>
    <b>모두 차단됨이면</b> 카카오 키를 넣어도 소용없어요. 사진 찍기로 등록하면 됩니다.</span></div>`;
}
function exportData(){
  const dump = JSON.stringify({ exportedAt:new Date().toISOString(), settings:S.settings, data:S.data }, null, 2);
  $('#exportBox').innerHTML = `<p class="muted" style="margin:8px 0 4px">아래 글자를 모두 복사해서 안전한 곳에 보관하세요.</p>
    <textarea class="field" style="min-height:150px;font-size:12px" readonly>${esc(dump)}</textarea>`;
  const ta = $('#exportBox textarea');
  if (ta){ ta.focus(); ta.select(); }
  if (S.downloads){
    S.downloads.save({ filename:`Do-Learn-백업-${todayKey()}.json`, data:dump }).catch(()=>{});
  }
}

/* ============================================================
   타이머 틱 (1초마다 화면의 숫자만 갱신 — 전체 재렌더 안 함)
   ============================================================ */
setInterval(() => {
  if (S.running){
    const el = document.querySelector(`[data-live="${S.running.todoId}"]`);
    if (el) el.textContent = fmtClock((Date.now()-S.running.startedAt)/1000);
    const tt = document.getElementById('todayTime');
    if (tt) tt.textContent = fmtDur(todaySeconds(S.kidId));
  }
  const un = S.kidId && activeUnlock(S.kidId);
  const left = document.getElementById('unlockLeft');
  if (left && un) left.textContent = fmtClock((new Date(un.expiresAt).getTime()-Date.now())/1000);

  if (sling){
    if (!activeUnlock(sling.kidId)) closeSling('게임 시간이 끝났어요. 내일 또 해요! 👋');
    else slingTimer();
  }

  // 부모님이 다른 기기에서 승인해 주면 여기서 알아채고 축하해 준다
  if (un && S.celebrated !== un.id){ S.celebrated = un.id; confetti(); render(); }
  if (!un) S.celebrated = null;

  if (S.tab === 'games' && S.kidId && !un && S.view.game){
    S.view.game = null; stopStars(); render();     // 시간이 끝나면 자동으로 잠김
  }
}, 1000);

/* ============================================================
   시작
   ============================================================ */
function start(){
  S.familyId = resolveFamilyId();
  // 앱을 열면 항상 메인 홈(시작 화면)부터. 누가 공부할지는 매번 고른다.
  S.kidId = null;
  render();
  connect().then(() => {
    // 오늘 날씨를 조용히 채운다. 기본은 화성시 동탄이라 위치 권한을 묻지 않는다.
    // 막히거나 실패하면 아무 일도 일어나지 않고 아이가 직접 고르면 된다.
    if (!todayWeather()) autoWeather(false);
  });
}
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(() => ({ tab:S.tab, kidId:S.kidId }));
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready((d) => { if (d){ if (d.tab) S.tab=d.tab; if (d.kidId) S.kidId=d.kidId; } start(); });
  } else start();
} catch(e){ start(); }
</script>
