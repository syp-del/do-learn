function speak(text, lang){ nvUnlock(); voice(text, { lang: lang === 'ko' ? 'ko' : 'en' }); }   // 🔊 단추들이 쓰는 예전 이름
function hush(){
  nvStop();
  try { if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); } catch(e){}
  SAY.u = null; SAY.at = Date.now();

/* ---------- 🦜 뚜뚜의 자연스러운 목소리 (Gemini 음성 합성) ----------
   뚜뚜가 할 말만 서버(/api/coach)로 보내 사람처럼 자연스러운 목소리로 받는다. 아이 목소리는 보내지 않는다.
   같은 말은 한 번 만들어 이 기기(IndexedDB)에 저장하고 다시 쓴다. 안 되면 기기 목소리로 바로 넘어간다. */
const NV_VOICES = [['Sulafat','따뜻한'], ['Achernar','부드러운'], ['Vindemiatrix','다정한'], ['Leda','앳된'], ['Aoede','산뜻한'], ['Autonoe','밝은']];
const NV = { el:null, unlocked:false, fails:0, offUntil:0, mem:new Map(), cur:null, curEnd:null, silent:'' };
function nvOn(){ return S.settings.ttNatural !== false && !window.claude && location.protocol.startsWith('http') && !(NV.offUntil > Date.now()); }
function nvVoice(){ const v = S.settings.ttNvVoice; return NV_VOICES.some(x => x[0] === v) ? v : 'Sulafat'; }
function nvEl(){ if (!NV.el){ NV.el = new Audio(); NV.el.setAttribute('playsinline', ''); NV.el.preload = 'auto'; } return NV.el; }
/* 누른 순간에 한 번 — 아이패드가 나중에(목소리를 받아 온 뒤에) 소리를 내도록 허락받는다 */
function nvUnlock(){
  if (NV.needFresh){                                          // 녹음 뒤 — 칸을 새로 만들고, 기기 목소리도 비운다
    NV.needFresh = false; NV.unlocked = false;
    if (NV.el){ try { NV.el.pause(); NV.el.removeAttribute('src'); NV.el.load(); } catch(e){} NV.el = null; }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  }
  try { if (window.speechSynthesis && !SAY.primed){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); SAY.primed = true; } } catch(e){}
  if (NV.unlocked) return;
  const a = nvEl();
  if (!NV.silent) NV.silent = 'data:audio/wav;base64,' + wavBase64(new Float32Array(800), 16000);
  try { a.src = NV.silent; const p = a.play(); if (p && p.then) p.then(() => { NV.unlocked = true; }).catch(() => {}); else NV.unlocked = true; } catch(e){}
}
async function nvFetch(text, style){
  // 한국어(ko·dict)는 아나운서 말투로 바꿨다(v2) — 예전에 받아 둔 한국어 목소리는 다시 쓰지 않는다. 영어는 그대로라 예전 것을 쓴다
  const k = `${style === 'ko' || style === 'dict' ? 'v2|' : ''}${nvVoice()}|${style}|${text}`;
  if (NV.mem.has(k)) return NV.mem.get(k);
  try { const hit = await AudioBox.ttsGet(k); if (hit && hit.data){ const b = new Blob([hit.data], { type:'audio/wav' }); NV.mem.set(k, b); return b; } } catch(e){}
  const j = await ttAsk({ task:'tts', text, voice:nvVoice(), style }, 20000);
  const bin = atob(j.audio || ''), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

  const blob = new Blob([u8], { type:'audio/wav' });
  NV.mem.set(k, blob); if (NV.mem.size > 40) NV.mem.delete(NV.mem.keys().next().value);
  AudioBox.ttsPut({ k, at:Date.now(), data:u8.buffer }).catch(() => {});
  return blob;
}
/* 문장을 열면 미리 받아 둔다 — 누르면 바로 들린다. 한 번에 하나씩, 이미 있으면 그냥 넘어간다 */
const NVQ = { q:[], busy:false, seen:new Set() };
function nvStyleFor(lang, rate, style){ return style || (lang === 'ko' ? (rate && rate <= 0.85 ? 'dict' : 'ko') : (rate && rate <= 0.65 ? 'slow' : (rate >= 1 ? 'speech' : 'en'))); }
function nvPrefetch(text, lang, rate){
  const clean = speechText(text);
  if (!clean || !nvOn() || (lang === 'ko' && S.settings.koVoice !== 'ai') || (lang !== 'ko' && ttHasName(clean))) return;
  const style = nvStyleFor(lang, rate), key = style + '|' + clean;
  if (NVQ.seen.has(key)) return; NVQ.seen.add(key);
  NVQ.q.push([clean, style]); nvPrefetchRun();
}
async function nvPrefetchRun(){
  if (NVQ.busy) return; NVQ.busy = true;
  while (NVQ.q.length && nvOn()){ const [text, style] = NVQ.q.shift(); try { await nvFetch(text, style); } catch(e){ break; } }
  NVQ.busy = false;
}
/* 끝나면 true, 못 하면 false (그때는 기기 목소리로) */
function nvPlay(text, { style = 'en', rate = 1, onstart, onprogress } = {}){
  if (NV.curEnd) NV.curEnd(true);                     // 하던 말은 끝낸 걸로
  const me = {}; NV.cur = me;
  return new Promise(async done => {
    let fin = false, url = '';
    const a = nvEl();
    const end = ok => {
      if (fin) return; fin = true;
      if (NV.cur === me){ a.onended = a.onerror = a.ontimeupdate = null; NV.cur = null; NV.curEnd = null; }
      if (url) { try { URL.revokeObjectURL(url); } catch(e){} }

    NV.curEnd = end;
    let blob;

      // 6초가 넘게 걸리면 이번엔 기기 목소리로 — 받아 오던 목소리는 다음에 쓴다
      const job = nvFetch(text, style); job.catch(() => {});
      blob = await Promise.race([job, new Promise(ok => setTimeout(() => ok(null), 6000))]);

    }
    catch(e){

  });
}
function nvStop(){ const e = NV.curEnd; NV.cur = null; NV.curEnd = null; if (NV.el){ try { NV.el.pause(); } catch(x){} } if (e) e(true); }

async function voice(text, { lang = 'en', rate, onword, onprogress, onstart, style, nvRate } = {}){
  if (lang === 'ko') text = koNumSpeak(text);                 // 한국어 속 숫자는 우리말로
  const clean = speechText(text);
  if (!clean) return false;
  // 한국어는 기본으로 기기의 서울말 목소리 하나로 읽는다. AI 목소리는 만들 때마다 억양이 달라지고(이름이 든 말은 아이마다 따로 만든다),
  // 무료 한도가 차면 기기 목소리로 바뀌어서 아이마다 말투가 달리 들렸다. 부모님이 'ai'를 고르면 한국어도 자연스러운 목소리로.
  const koDevice = (lang === 'ko' && S.settings.koVoice !== 'ai') || (lang !== 'ko' && ttHasName(clean));
  if (nvOn() && !koDevice){
    // 한국어를 천천히(받아쓰기) 읽을 때는 'dict', 그 나라 인사말은 부르는 쪽이 style:'hello'
    const st = nvStyleFor(lang, rate, style);
    if (await nvPlay(clean, { style:st, rate:nvRate || 1, onstart, onprogress })) return true;
  }
  return say(text, { lang, rate, onword, onstart });
}

/* 아이패드 — 녹음하는 동안 기기가 '녹음+재생' 모드로 바뀐다. 끝난 뒤에도 그대로면 뚜뚜 목소리·내 목소리가
   안 나거나 수화기 쪽으로 아주 작게 났다(녹음 전에는 잘 되고 녹음 뒤에만 안 됨). 끝나면 '재생' 모드로 되돌리고,
   소리 크기를 재던 오디오 엔진도 닫고, 뚜뚜 목소리 칸은 다음에 누를 때 새로 만든다(nvUnlock). */
function audioSessionRecord(){ try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch(e){} }
function audioSessionPlay(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  NV.needFresh = true; SAY.primed = false;
}
async function recStart(opts = {}){
  if (REC.mr) return false;
  audioSessionRecord();
  const ctx = audioCtx();                         // 누른 순간에 깨워 둔다 (아이패드)
  const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  REC.stream = stream; REC.mime = recMime(); REC.chunks = [];
  const mo = {}; if (REC.mime) mo.mimeType = REC.mime; if (opts.bps) mo.audioBitsPerSecond = opts.bps;
  let mr; try { mr = new MediaRecorder(stream, mo); } catch(e){ mr = new MediaRecorder(stream, REC.mime ? { mimeType:REC.mime } : undefined); }
  REC.mr = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  mr.onstop = () => {
    const blob = new Blob(REC.chunks, { type:(mr.mimeType || REC.mime || 'audio/mp4') });
    const r = REC.resolve; REC.resolve = null;
    recRelease();
    if (r) r(blob);
  };
  REC.heard = false; REC.quiet = 0; REC.floor = null; REC.counting = !!opts.onCount; REC.t0 = performance.now();
  if (!REC.counting) mr.start(250);
  if (ctx){
    try {
      REC.src = ctx.createMediaStreamSource(stream); REC.ctxUsed = true;
      REC.an = ctx.createAnalyser(); REC.an.fftSize = 1024;
      REC.src.connect(REC.an);
      const buf = new Float32Array(REC.an.fftSize);
      const silenceMs = opts.silenceMs || 1300, maxMs = (opts.maxSec || 15) * 1000;
      const tick = () => {
        if (!REC.mr || !REC.an) return;
        REC.an.getFloatTimeDomainData(buf);
        let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const lv = clamp((20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-9) + 60) / 50, 0, 1);   // -60dB→0, -10dB→1
        // 주변 소음 높이를 천천히 따라가서, 그보다 확실히 클 때만 "말하는 중"으로 본다
        REC.floor = REC.floor == null ? lv : (lv < REC.floor ? lv : REC.floor + (lv - REC.floor) * 0.003);
        if (opts.onLevel) opts.onLevel(lv);
        if (REC.counting){ REC.raf = requestAnimationFrame(tick); return; }   // 3·2·1 동안은 소리 크기만 보여 준다
        const now = performance.now();
        if (lv > Math.max(0.28, REC.floor + 0.18)){ REC.heard = true; REC.quiet = 0; }
        else if (REC.heard && lv < REC.floor + 0.1){
          if (!REC.quiet) REC.quiet = now;
          else if (opts.onAuto && now - REC.quiet > silenceMs){ opts.onAuto(); return; }
        }
        if (now - REC.t0 > maxMs){ if (opts.onAuto) opts.onAuto(); return; }
        REC.raf = requestAnimationFrame(tick);
      };
      REC.raf = requestAnimationFrame(tick);
    } catch(e){}
  }
  if (REC.counting){                                         // 3 · 2 · 1 → 말해요!
    for (let n = 3; n >= 1; n--){
      if (REC.mr !== mr) return false;
      opts.onCount(n); try { ttTone(660, 0, 0.1, 0.06); } catch(e){}
      await new Promise(ok => setTimeout(ok, 700));
    }
    if (REC.mr !== mr) return false;
    REC.counting = false; REC.t0 = performance.now();
    try { mr.start(250); } catch(e){}
    opts.onCount(0);
  }
  return true;
}
function recStop(){
  return new Promise(res => {
    if (!REC.mr){ res(null); return; }
    if (REC.counting){ recCancel(); res(null); return; }       // 3·2·1 사이에 멈추면 녹음한 게 없다
    REC.resolve = res;
    try { if (REC.mr.state !== 'inactive') REC.mr.stop(); else { REC.resolve = null; recRelease(); res(null); } }
    catch(e){ REC.resolve = null; recRelease(); res(null); }
  });
}
function recRelease(){
  cancelAnimationFrame(REC.raf);
  try { REC.src && REC.src.disconnect(); } catch(e){}
  try { REC.stream && REC.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  const had = !!(REC.stream || REC.mr);
  REC.stream = null; REC.mr = null; REC.src = null; REC.an = null;
  if (REC.ctxUsed){ REC.ctxUsed = false; try { if (AC && AC.state !== 'closed') AC.close(); } catch(e){} AC = null; }   // 마이크를 물고 있던 엔진은 닫는다
  if (had) audioSessionPlay();
}
function recCancel(){
  if (REC.mr){ REC.resolve = null; try { REC.mr.onstop = null; if (REC.mr.state !== 'inactive') REC.mr.stop(); } catch(e){} }
  recRelease();
}

/* ---------- 녹음 다시 듣기 ---------- */
const PLAY = { el:null, url:'' };
function playBlob(blob){
  playStop();
  if (!blob) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  const a = new Audio(); a.setAttribute('playsinline', ''); a.volume = 1;
  PLAY.url = URL.createObjectURL(blob); a.src = PLAY.url; PLAY.el = a;
  a.onended = () => playStop();
  a.play().catch(() => {});
}
function playStop(){
  if (PLAY.el){ try { PLAY.el.pause(); } catch(e){} PLAY.el = null; }
  if (PLAY.url){ try { URL.revokeObjectURL(PLAY.url); } catch(e){} PLAY.url = ''; }
}
/* 수업 중에는 화면이 꺼지지 않게 */
let WAKE = null;
async function wakeOn(){

}

/* ---------- 기기 안에서 목소리 살펴보기 (서버로 보내지 않는다) ----------
   녹음 → 한 채널 → 16kHz → 소리 크기·말한 시간·쉰 곳·음높이(높낮이) */
async function decodeAudio(blob){
  const ctx = audioCtx(); if (!ctx) throw new Error('no audio');
  const ab = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => {
    try { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); } catch(e){ rej(e); }
  });
  const ch = buf.numberOfChannels, n = buf.length, mono = new Float32Array(n);
  for (let c = 0; c < ch; c++){ const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
  return { pcm:mono, rate:buf.sampleRate };
}
function resample(pcm, from, to){
  if (from === to) return pcm;
  const ratio = from / to, n = Math.floor(pcm.length / ratio), out = new Float32Array(n);
  const half = Math.max(0, Math.floor(ratio / 2));
  for (let i = 0; i < n; i++){
    const c = Math.floor(i * ratio); let s = 0, k = 0;
    for (let j = c - half; j <= c + half; j++){ if (j >= 0 && j < pcm.length){ s += pcm[j]; k++; } }
    out[i] = k ? s / k : 0;
  }
  return out;
}
function analyzeVoice(x, rate){
  const F = Math.round(rate * 0.032), H = Math.round(rate * 0.016);   // 32ms 창, 16ms 간격
  const db = [];
  for (let i = 0; i + F <= x.length; i += H){ let s = 0; for (let j = i; j < i + F; j++) s += x[j] * x[j]; db.push(10 * Math.log10(s / F + 1e-10)); }
  const empty = { silent:true, secs:0, pauses:0, longest:0, loudDb:-99, s0:0, s1:0, contour:[], endPitch:'flat', range:0 };
  if (db.length < 4) return empty;
  const sorted = db.slice().sort((a, b) => a - b);
  const floor = sorted[Math.floor(sorted.length * 0.1)], peak = sorted[Math.floor(sorted.length * 0.97)];
  if (peak < -58 || peak - floor < 8) return empty;
  const thr = Math.max(floor + 9, peak - 28, -56);
  const on = db.map(v => v > thr);
  const first = on.indexOf(true), last = on.lastIndexOf(true);
  if (first < 0 || (last - first + 1) * H / rate < 0.25) return empty;
  let pauses = 0, run = 0, longest = 0;
  for (let i = first; i <= last; i++){
    if (!on[i]) run++;
    else { const t = run * H / rate; if (t >= 0.35){ pauses++; longest = Math.max(longest, t); } run = 0; }
  }
  const sp = db.filter((v, i) => on[i]).sort((a, b) => a - b);
  const s0 = Math.max(0, first * H - Math.round(rate * 0.25)), s1 = Math.min(x.length, (last + 1) * H + F + Math.round(rate * 0.25));
  return { silent:false, secs:(last - first + 1) * H / rate, pauses, longest, loudDb:sp[Math.floor(sp.length / 2)], s0, s1,
           ...pitchTrack(x, rate, first * H, (last + 1) * H + F) };
}
/* 음높이 — 8kHz로 줄인 뒤 자기상관(30~40ms 창). 아이 목소리 120~600Hz */
function pitchTrack(x, rate, a0, a1){
  const step = Math.max(1, Math.round(rate / 8000)), r = rate / step;
  const n = Math.max(0, Math.floor((Math.min(a1, x.length) - a0) / step));
  const y = new Float32Array(n);
  for (let i = 0; i < n; i++){ let s = 0; for (let j = 0; j < step; j++) s += x[a0 + i * step + j] || 0; y[i] = s / step; }
  const W = Math.round(r * 0.035), Hp = Math.round(r * 0.01);
  const minLag = Math.floor(r / 600), maxLag = Math.ceil(r / 120);
  const f0 = [], corr = new Float32Array(maxLag + 1);
  for (let i = 0; i + W + maxLag <= n; i += Hp){
    let e0 = 0; for (let j = 0; j < W; j++) e0 += y[i + j] * y[i + j];
    if (e0 / W < 2e-6){ f0.push(0); continue; }
    let best = 0;
    for (let lag = minLag; lag <= maxLag; lag++){
      let c = 0, e1 = 0;
      for (let j = 0; j < W; j++){ const a = y[i + j], b = y[i + j + lag]; c += a * b; e1 += b * b; }
      corr[lag] = c / Math.sqrt(e0 * e1 + 1e-12);
      if (corr[lag] > best) best = corr[lag];
    }
    // 한 옥타브 아래로 잘못 잡지 않도록, 최고값에 가까운 것 중 가장 짧은 주기를 고른다
    let pick = 0;
    for (let lag = minLag + 1; lag < maxLag; lag++){
      if (corr[lag] >= best * 0.92 && corr[lag] >= corr[lag - 1] && corr[lag] >= corr[lag + 1]){ pick = lag; break; }
    }
    f0.push(best > 0.55 && pick ? r / pick : 0);
  }
  const sm = f0.map((v, i) => {
    if (!v) return 0;
    const w = f0.slice(Math.max(0, i - 2), i + 3).filter(Boolean).sort((p, q) => p - q);
    return w[Math.floor(w.length / 2)];
  });
  const voiced = sm.filter(Boolean);
  if (voiced.length < 6) return { contour:[], endPitch:'flat', range:0 };
  const med = voiced.slice().sort((p, q) => p - q)[Math.floor(voiced.length / 2)];
  const st = sm.map(v => v ? 12 * Math.log2(v / med) : null);                 // 반음 단위
  const vals = st.filter(v => v !== null);
  const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
  const range = Math.sqrt(vals.reduce((s, v) => s + (v - mean) * (v - mean), 0) / vals.length);
  // 문장 끝 — 소리 난 부분의 뒤쪽 40%에서 앞 1/3과 뒤 1/3을 비교한다
  const idx = st.map((v, i) => v !== null ? i : -1).filter(i => i >= 0);
  const tail = idx.slice(Math.floor(idx.length * 0.6));
  const k = Math.max(1, Math.floor(tail.length / 3));
  const avg = list => list.reduce((s, i) => s + st[i], 0) / list.length;
  const d = avg(tail.slice(-k)) - avg(tail.slice(0, k));
  const contour = [];
  const B = 60;
  for (let b = 0; b < B; b++){
    const lo = Math.floor(b * st.length / B), hi = Math.max(lo + 1, Math.floor((b + 1) * st.length / B));
    const part = st.slice(lo, hi).filter(v => v !== null);
    contour.push(part.length ? part.reduce((s, v) => s + v, 0) / part.length : null);
  }
  return { contour, endPitch: d > 1.5 ? 'rise' : (d < -1.5 ? 'fall' : 'flat'), range };
}
/* WAV(16비트 한 채널)로 싸서 base64 — 조용하게 녹음돼도 AI가 잘 듣도록 크기를 맞춘다 */
function wavBase64(pcm, rate){
  const n = pcm.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  let peak = 0; for (let i = 0; i < n; i++){ const a = Math.abs(pcm[i]); if (a > peak) peak = a; }
  const g = peak > 0 ? Math.min(8, 0.9 / peak) : 1;
  for (let i = 0; i < n; i++){ const s = clamp(pcm[i] * g, -1, 1); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
  return bytesBase64(new Uint8Array(buf));
}
function bytesBase64(bytes){
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* ---------- 녹음함 — 이 기기(IndexedDB)에만 둔다 ----------
   owner = "아이|원고|문장번호" (리허설은 -1). 문장마다 최근 3개, 리허설은 최근 10개 + 첫 리허설은 계속 */
const AudioBox = {
  _db:null,
  open(){
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('dolearn-audio', 2);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains('clips')) db.createObjectStore('clips', { keyPath:'id' }).createIndex('owner', 'owner');
          if (!db.objectStoreNames.contains('tts')) db.createObjectStore('tts', { keyPath:'k' });   // 뚜뚜 목소리 저장
        };
        rq.onsuccess = () => { this._db = rq.result; res(this._db); };
        rq.onerror = () => rej(rq.error);
      } catch(e){ rej(e); }
    });
  },
  async tx(mode, fn, store = 'clips'){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), st = t.objectStore(store);
      let out; const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(rec){ return this.tx('readwrite', st => st.put(rec)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  async list(owner){ return ((await this.tx('readonly', st => st.index('owner').getAll(owner))) || []).sort((a, b) => b.at - a.at); },
  async keep(owner, n){ const all = await this.list(owner); for (const r of all.filter(r => !r.pinned).slice(n)) await this.del(r.id); },
  blob(rec){ return rec ? new Blob([rec.data], { type:rec.mime || 'audio/mp4' }) : null; },
  ttsGet(k){ return this.tx('readonly', st => st.get(k), 'tts'); },
  async ttsPut(rec){
    await this.tx('readwrite', st => st.put(rec), 'tts');
    // 250개가 넘으면 오래된 것부터 지운다
    const keys = (await this.tx('readonly', st => st.getAllKeys(), 'tts')) || [];
    if (keys.length > 250){
      const all = (await this.tx('readonly', st => st.getAll(), 'tts')) || [];
      all.sort((a, b) => a.at - b.at);
      for (const r of all.slice(0, all.length - 220)) await this.tx('readwrite', st => st.delete(r.k), 'tts');
    }
  }
};
/* 마이크로 듣고 → 글자로 적어준다 (브라우저 내장 음성인식). */
function listen(lang, onResult){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    S.view.dictError = '이 기기에서는 말로 찾기를 쓸 수 없어요. 글자로 적어주세요.';
    render(); return;
  }
  try {
    const r = new SR();
    r.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
    r.interimResults = false; r.maxAlternatives = 1;
    S.view.listening = true; S.view.dictError = ''; render();
    const stop = () => { S.view.listening = false; render(); };
    r.onresult = e => { stop(); onResult(String(e.results[0][0].transcript||'').trim()); };
    r.onerror = ev => {
      stop();
      S.view.dictError = (ev && ev.error === 'not-allowed')
        ? '마이크를 쓰려면 “허용”을 눌러주세요.'
        : '앗, 잘 못 들었어요. 괜찮아요, 한 번 더 말해볼까요?';
      render();
    };
    r.onend = stop;
    r.start();
  } catch(e){ S.view.listening = false; render(); }
}

/* ============================================================
   바코드 스캐너
   ============================================================ */
/* 바코드 스캐너
   - 안드로이드 크롬처럼 브라우저가 바코드를 직접 읽을 수 있으면 그걸 쓴다(빠르고 정확).
   - 아이패드 사파리처럼 못 읽으면 Quagga2로 읽는다. 둥둥 도서관에서 이 기기로 잘 되던 설정
     (후면 카메라 1280×720, EAN 판독기)을 그대로 쓴다.
   - 책 바코드는 978/979로 시작하는 ISBN-13뿐이라 그것만 받고, 끝자리 검증 숫자를 확인한다.
     Quagga는 가끔 한 자리를 잘못 읽으므로 같은 번호가 두 번 연달아 나와야 받는다. */
let scanState = { stream:null, raf:0, stopped:false, quagga:false, last:'', hits:0 };

function validIsbn13(code){
  if (!/^97[89]\d{10}$/.test(code)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+code[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +code[12];
}
function acceptScan(raw, needed){
  if (scanState.stopped) return;
  const code = String(raw || '').replace(/\D/g, '');
  if (!validIsbn13(code)) return;
  if (code === scanState.last) scanState.hits++;
  else { scanState.last = code; scanState.hits = 1; }
  if (scanState.hits >= needed) onIsbn(code);
}
function onQuagga(data){
  const c = data && data.codeResult && data.codeResult.code;
  if (c) acceptScan(c, 2);
}

async function startScanner(){
  scanState = { stream:null, raf:0, stopped:false, quagga:false, last:'', hits:0 };
  const box = document.getElementById('scanView');
  if (!box) return;

  let native = false;
  if ('BarcodeDetector' in window){
    try { native = (await window.BarcodeDetector.getSupportedFormats()).includes('ean_13'); } catch(e){}
  }

  if (native){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false
      });
      if (scanState.stopped){ stream.getTracks().forEach(t => t.stop()); return; }
      scanState.stream = stream;
      const v = document.createElement('video');
      v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = stream;
      box.prepend(v);
      await v.play().catch(()=>{});
      setScanMsg('바코드를 네모 안에 비춰주세요');
      const det = new window.BarcodeDetector({ formats:['ean_13'] });
      const tick = async () => {
        if (scanState.stopped) return;
        try {
          const codes = await det.detect(v);
          for (const c of codes || []) acceptScan(c.rawValue, 1);
        } catch(e){}
        if (!scanState.stopped) scanState.raf = requestAnimationFrame(tick);
      };
      scanState.raf = requestAnimationFrame(tick);
    } catch(err){
      setScanMsg('카메라를 켤 수 없어요. 아래에서 직접 적어주세요.');
    }
    return;
  }

  if (window.Quagga){
    window.Quagga.init({
      inputStream:{
        name:'Live', type:'LiveStream', target:box,
        constraints:{ facingMode:'environment', width:1280, height:720 }
      },
      locate:true,

  } else {

    const g = await guessBook(isbn);
    if (g){
      w.title = g.title; w.author = g.author || '';
      if (g.category && (S.settings.cats||DEFAULT_CATS).includes(g.category)) w.category = g.category;
      w.found = 'ai';
      w.guessNote = '이 책인 것 같아요. 다르면 고쳐주세요!';
    } else {
      w.found = 'manual';
      w.guessNote = k.ok ? '그 바코드로는 책을 못 찾았어요. 표지를 보고 적어줄래요?'

  }
  w.busy = false;
  openModal(bookWizard());

let starGame = null;
function startStars(){
  S.view.game = 'stars';
  render();
  requestAnimationFrame(() => {
    const cv = document.getElementById('starcanvas');
    if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = cv.getBoundingClientRect();
    cv.width = rect.width * dpr; cv.height = rect.height * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    /* 시간 기준으로 움직인다 — 60Hz 패드와 120Hz 패드에서 같은 속도.
       예전에는 1프레임에 1.4~2.5px씩 떨어져 화면을 내려오는 데 5초쯤 걸렸다. */
    const g = { basket:W/2, stars:[], pops:[], score:0, alive:true,
                t0:performance.now(), last:performance.now(), nextSpawn:0.2 };
    starGame = g;
    const BASKET_Y = H - 34;

    const move = e => {
      const r = cv.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      g.basket = clamp(x, 26, W-26);
    };
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerdown', move);

    const loop = (now) => {
      if (!g.alive || S.view.game !== 'stars') return;
      const dt = Math.min(0.05, Math.max(0, (now - g.last) / 1000));   // 탭을 잠깐 떠났다 와도 한꺼번에 튀지 않게
      g.last = now;
      const el = (now - g.t0) / 1000;
      const speed = Math.min(2.1, 1 + el / 40);                          // 40초에 걸쳐 2배쯤까지 빨라진다

      g.nextSpawn -= dt;
      if (g.nextSpawn <= 0){
        const gold = Math.random() < 0.12;                               // 가끔 황금 별 (+3)
        g.stars.push({ x: 24 + Math.random()*(W-48), y:-16,
          v: (0.42 + Math.random()*0.28) * H * speed,                    // 1초에 화면 높이의 0.42~0.7배
          r: gold ? 15 : 12, gold });
        g.nextSpawn = Math.max(0.3, 0.7 - el / 90) * (0.8 + Math.random() * 0.4);
      }

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#FFF3F6'; ctx.fillRect(0,0,W,H);

      for (let i = g.stars.length-1; i >= 0; i--){
        const s = g.stars[i];
        const prevY = s.y;
        s.y += s.v * dt;
        // 빠른 별이 바구니 줄을 건너뛰지 않도록, 이번 프레임에 그 줄을 지났는지로 판정한다
        if (prevY < BASKET_Y && s.y >= BASKET_Y - 6 && Math.abs(s.x - g.basket) < 36){
          g.stars.splice(i,1);
          const add = s.gold ? 3 : 1;
          g.score += add;
          g.pops.push({ x:s.x, y:BASKET_Y - 16, a:1, t:'+' + add, gold:s.gold });
          const sc = document.getElementById('starScore');
          if (sc) sc.textContent = g.score + '개';
          continue;
        }
        if (s.y > H + 20){ g.stars.splice(i,1); continue; }
        if (s.gold){ ctx.save(); ctx.shadowColor = '#FFD98E'; ctx.shadowBlur = 14; }
        drawStar(ctx, s.x, s.y, s.r, s.gold ? '#FFE79C' : '#FFD98E', s.gold ? '#E85C7C' : '#D99A2B');
        if (s.gold) ctx.restore();
      }

      // 받았을 때 +1 / +3 이 떠오른다
      ctx.textAlign = 'center';
      for (let i = g.pops.length-1; i >= 0; i--){
        const q = g.pops[i]; q.y -= 60 * dt; q.a -= 1.6 * dt;
        if (q.a <= 0){ g.pops.splice(i,1); continue; }
        ctx.globalAlpha = q.a; ctx.fillStyle = q.gold ? '#E85C7C' : '#D99A2B';
        ctx.font = "bold 20px 'Gaegu', sans-serif"; ctx.fillText(q.t, q.x, q.y);
      }
      ctx.globalAlpha = 1;

      // 바구니
      ctx.fillStyle = '#FF8FA8';
      ctx.beginPath();
      ctx.moveTo(g.basket-34, H-34); ctx.lineTo(g.basket+34, H-34);
      ctx.lineTo(g.basket+25, H-8); ctx.lineTo(g.basket-25, H-8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E85C7C';
      ctx.fillRect(g.basket-36, H-38, 72, 7);

      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
function drawStar(ctx, cx, cy, r, fill, stroke){
  ctx.beginPath();
  for (let i=0;i<10;i++){
    const rad = i % 2 === 0 ? r : r/2.3;
    const a = Math.PI/5 * i - Math.PI/2;
    ctx[i?'lineTo':'moveTo'](cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke();
}

/* ---------- 효과음 (Web Audio로 만든다, 파일 없음) ---------- */
function slingSound(){
  const s = { ctx:null, on:true, osc:null, gain:null };
  const ready = () => {
    if (!s.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (A) s.ctx = new A(); }
    if (s.ctx && s.ctx.state === 'suspended') s.ctx.resume();
    return s.on && s.ctx;
  };
  const beep = (f1, f2, dur, vol, type) => {
    if (!ready()) return;
    const t = s.ctx.currentTime, o = s.ctx.createOscillator(), g = s.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(s.ctx.destination); o.start(t); o.stop(t + dur + 0.01);
  };
  s.pinch   = () => beep(540, 880, 0.08, 0.18);
  s.release = () => { s.stop(); beep(650, 140, 0.16, 0.3); };
  s.hit     = kind => beep(kind === 'bonus' ? 1200 : kind === 'boom' ? 160 : 880, (kind === 'bonus' ? 1200 : 880) * 1.4, 0.22, 0.26);
  s.win     = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.3, 0.18), i * 120));
  s.stretch = k => {
    if (!s.on || k <= 0.05){ s.stop(); return; }
    if (!ready()) return;
    const t = s.ctx.currentTime, f = 180 + k * 400;
    if (!s.osc){
      s.osc = s.ctx.createOscillator(); s.gain = s.ctx.createGain(); s.osc.type = 'triangle';
      s.osc.frequency.setValueAtTime(f, t);
      s.gain.gain.setValueAtTime(0.01, t); s.gain.gain.linearRampToValueAtTime(0.1, t + 0.05);
      s.osc.connect(s.gain); s.gain.connect(s.ctx.destination); s.osc.start(t);
    } else s.osc.frequency.setTargetAtTime(f, t, 0.03);
  };
  s.stop = () => {
    if (s.osc && s.gain && s.ctx){
      const o = s.osc;
      s.gain.gain.linearRampToValueAtTime(0.001, s.ctx.currentTime + 0.04);
      setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 50);
    }
    s.osc = null; s.gain = null;
  };
  s.close = () => { s.stop(); try { s.ctx && s.ctx.close(); } catch(e){} };
  return s;
}

      c:['#FFFFFF','#FFE3EA','#E2F7EF','#FFF1D6'][Math.floor(Math.random()*4)] })),
    sound:slingSound(), hand:null
  };

  slingFit();
  sling.onResize = () => slingFit();
  addEventListener('resize', sling.onResize);
  slingBindPointer(canvas);
  layer.addEventListener('click', slingClick);
  // 같은 게임 시간 안에 다시 들어오면 하던 단계·점수부터 이어서 한다
  const un = activeUnlock(sling.kidId);
  const saved = (S.view.slingSave || {})[sling.kidId];
  if (saved && un && saved.unlockId === un.id){
    sling.score = saved.score;
    slingLoad(saved.level);
    slingCoach(`${saved.level + 1}단계부터 이어서 해요! 점수도 그대로예요 ⭐`);
  } else slingLoad(0);
  slingTimer();
  sling.raf = requestAnimationFrame(slingLoop);
}

/* 멈추기 · 이어 하기 */
function slingPause(on){
  if (!sling) return;
  sling.paused = on;
  if (on){ sling.aiming = null; sling.pouch = { ...SLING_ANCHOR }; sling.sound.stop(); }
}
function slingSaveProgress(){
  const s = sling; if (!s) return;
  const un = activeUnlock(s.kidId); if (!un) return;
  S.view.slingSave = S.view.slingSave || {};
  // 통과한 단계면 다음 단계부터
  S.view.slingSave[s.kidId] = { unlockId:un.id, level:s.cleared ? s.level + 1 : s.level, score:s.score };
}
function slingAskQuit(){
  const s = sling; if (!s) return;
  if (!s.layer.querySelector('#slOver').hidden) return;          // 시간 끝 카드가 떠 있으면 그대로
  slingPause(true);
  s.layer.querySelector('#slAskInfo').textContent =
    `지금 ${s.level + 1}단계, 점수 ${s.score.toLocaleString()}점이에요. 놀이 시간 안에 다시 들어오면 여기서부터 이어서 할 수 있어요.`;
  s.layer.querySelector('#slAsk').hidden = false;
  setTimeout(() => { const b = s.layer.querySelector('#slKeep'); if (b) b.focus(); }, 50);
}
function slingTimeOver(){
  const s = sling; if (!s || s.over) return;
  s.over = true;
  slingPause(true);
  s.layer.querySelector('#slAsk').hidden = true;
  s.layer.querySelector('#slOverInfo').textContent =
    `오늘 ${s.level + 1}단계까지 왔고 점수는 ${s.score.toLocaleString()}점이에요. 내일 또 해요! 👋`;
  s.layer.querySelector('#slOver').hidden = false;
  s.overTimer = setTimeout(() => closeSling(), 12000);           // 안 눌러도 12초 뒤 닫힌다
}

function closeSling(msg){
  if (!sling) return;
  slingSaveProgress();
  const s = sling; sling = null;
  clearTimeout(s.overTimer);
  s.alive = false;
  cancelAnimationFrame(s.raf);
  removeEventListener('resize', s.onResize);
  s.sound.close();
  slingStopHand(s);
  s.layer.remove();
  if (S.view.game === 'sling') S.view.game = null;
  render();
  if (msg) toast(msg);
}

/* 캔버스를 5:3 비율로 화면에 꽉 차게 (레티나에서도 선명하게) */
function slingFit(){
  if (!sling) return;
  const box = sling.layer.querySelector('#slStageBox');
  const bw = box.clientWidth, bh = box.clientHeight;
  const scale = Math.max(0.2, Math.min(bw / SLING_W, bh / SLING_H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  sling.canvas.style.width = Math.floor(SLING_W * scale) + 'px';
  sling.canvas.style.height = Math.floor(SLING_H * scale) + 'px';
  sling.canvas.width = Math.round(SLING_W * dpr); sling.canvas.height = Math.round(SLING_H * dpr);
  sling.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function slingLoad(idx){
  const s = sling, L = SLING_LEVELS[idx % SLING_LEVELS.length];
  s.level = idx; s.ammo = L.ammo; s.pouch = { ...SLING_ANCHOR }; s.aiming = null;
  s.shots = []; s.sparks = []; s.texts = []; s.cleared = false; s.failAt = 0; s.failed = false;
  s.targets = L.targets.map(t => ({ ...t, max:t.hp, dead:false, cool:0 }));
  s.blocks  = L.blocks.map(b => ({ ...b, max:b.hp, dead:false, cool:0 }));
  s.layer.querySelector('#slStage').textContent = `${idx + 1}단계 · ${L.name}`;
  s.layer.querySelector('#slClear').hidden = true;
  s.layer.querySelector('#slFail').hidden = true;
  slingCoach(idx === 0 ? '주머니를 손가락으로 꾹 잡고, 뒤로 당겼다가 놓아요!'
    : L.wind ? `바람이 ${L.wind > 0 ? '앞으로' : '뒤로'} 불어요. 조금 더 세게 당겨봐요!` : '모든 과녁을 맞히면 통과예요!');
  slingHud();
}
function slingCoach(msg){ const el = sling && sling.layer.querySelector('#slCoach'); if (el) el.textContent = msg; }
function slingHud(){
  const s = sling; if (!s) return;
  const L = SLING_LEVELS[s.level % SLING_LEVELS.length];
  const left = s.targets.filter(t => !t.dead).length;
  s.layer.querySelector('#slScore').textContent = s.score.toLocaleString();
  s.layer.querySelector('#slBest').textContent = Math.max(s.best, s.score).toLocaleString();
  s.layer.querySelector('#slLeft').textContent = `남은 과녁 ${left}`;
  s.layer.querySelector('#slAmmo').innerHTML = Array.from({ length:L.ammo }, (_, i) =>
    `<i class="${i < s.ammo ? 'on' : ''}"></i>`).join('');
}
function slingTimer(){
  if (!sling) return;
  const un = sling.kidId && activeUnlock(sling.kidId);
  const el = sling.layer.querySelector('#slTime');
  if (el) el.textContent = un ? `⏱ ${fmtClock((new Date(un.expiresAt).getTime() - Date.now())/1000)}` : '';
}

/* ---------- 버튼 ---------- */
function slingClick(e){
  const b = e.target.closest('button'); if (!b || !sling) return;
  const s = sling;
  if (b.id === 'slExit'){ slingAskQuit(); return; }
  if (b.id === 'slKeep'){ s.layer.querySelector('#slAsk').hidden = true; slingPause(false); return; }
  if (b.id === 'slQuit' || b.id === 'slOverOk'){ closeSling(); return; }
  if (b.id === 'slRestart' || b.id === 'slReplay' || b.id === 'slRetry'){ slingLoad(s.level); return; }
  if (b.id === 'slNext'){ slingLoad(s.level + 1); return; }
  if (b.id === 'slSound'){ s.sound.on = !s.sound.on; if (!s.sound.on) s.sound.stop(); b.textContent = s.sound.on ? '🔊' : '🔇'; return; }
  if (b.id === 'slHand'){ s.hand ? slingStopHand(s, true) : slingStartHand(); return; }
  if (b.dataset.slw){
    s.weapon = b.dataset.slw;
    s.layer.querySelectorAll('[data-slw]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }
}

/* ---------- 손가락으로 당기기 ---------- */
function slingPoint(canvas, e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (SLING_W / r.width), y:(e.clientY - r.top) * (SLING_H / r.height) };
}
function slingAimTo(x, y){
  const s = sling, dx = x - SLING_ANCHOR.x, dy = y - SLING_ANCHOR.y, d = Math.hypot(dx, dy);
  if (d > SLING_PULL){ s.pouch.x = SLING_ANCHOR.x + dx / d * SLING_PULL; s.pouch.y = SLING_ANCHOR.y + dy / d * SLING_PULL; }
  else { s.pouch.x = x; s.pouch.y = y; }
  s.sound.stretch(Math.min(d, SLING_PULL) / SLING_PULL);
}
function slingBindPointer(canvas){
  canvas.addEventListener('pointerdown', e => {
    const s = sling; if (!s || s.paused || s.cleared || s.ammo <= 0) return;
    const p = slingPoint(canvas, e);
    // 주머니 근처, 새총 근처, 또는 화면 왼쪽 1/3 어디든 잡을 수 있게 넉넉하게
    if (Math.hypot(p.x - s.pouch.x, p.y - s.pouch.y) < 90 || Math.hypot(p.x - SLING_ANCHOR.x, p.y - SLING_ANCHOR.y) < 120 || p.x < 360){
      s.aiming = 'touch'; s.sound.pinch();
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      slingAimTo(p.x, p.y);
      e.preventDefault();
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!sling || sling.aiming !== 'touch') return;
    const p = slingPoint(canvas, e); slingAimTo(p.x, p.y); e.preventDefault();
  });
  const up = () => { if (sling && sling.aiming === 'touch') slingFire(); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
}

function slingFire(){
  const s = sling;
  const dx = SLING_ANCHOR.x - s.pouch.x, dy = SLING_ANCHOR.y - s.pouch.y, d = Math.hypot(dx, dy);
  s.aiming = null;
  if (d < 18 || s.ammo <= 0){ s.pouch = { ...SLING_ANCHOR }; s.sound.stop(); return; }
  const pw = Math.min(d, SLING_PULL) * SLING_POWER, ang = Math.atan2(dy, dx);
  const vx = Math.cos(ang) * pw, vy = Math.sin(ang) * pw;
  const W = SLING_WEAPONS[s.weapon];
  s.sound.release();
  s.ammo--; slingHud();
  const shot = (o) => ({ x:s.pouch.x, y:s.pouch.y, vx, vy, r:SLING_SHOT_R, kind:s.weapon, color:W.color, glow:W.glow, trail:[], on:true, ...o });
  if (s.weapon === 'TWIN'){
    s.shots.push(shot({ y:s.pouch.y - 10, vy:vy - 1, r:14, color:'#9BE0C8' }),
                 shot({ y:s.pouch.y + 10, vy:vy + 1, r:14, color:'#B3A6EE' }));
  } else if (s.weapon === 'BOMB'){
    s.shots.push(shot({ r:20 }));
  } else if (s.weapon === 'PIERCE'){
    s.shots.push(shot({ vx:vx * 1.2, vy:vy * 1.2, r:15 }));
  } else s.shots.push(shot({}));
  s.pouch = { ...SLING_ANCHOR };
  if (s.ammo === 1) slingCoach('마지막 별이에요. 잘 조준해요!');
}

function slingPoints(pts, x, y){
  const s = sling;
  s.score += pts;
  s.texts.push({ t:`+${pts}`, x, y, a:1 });
  slingHud();
}
function slingBurst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = Math.random() * 6 + 2;
    sling.sparks.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, c:color, r:Math.random()*3 + 2, a:1, d:Math.random()*.03 + .02 });
  }
}

/* ---------- 그리기 도우미 ---------- */
function slingFace(ctx, x, y, r, happy){
  ctx.fillStyle = '#4A3036';
  ctx.beginPath(); ctx.arc(x - r*.32, y - r*.12, r*.11, 0, Math.PI*2); ctx.arc(x + r*.32, y - r*.12, r*.11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,143,168,.65)';
  ctx.beginPath(); ctx.ellipse(x - r*.52, y + r*.16, r*.16, r*.1, 0, 0, Math.PI*2); ctx.ellipse(x + r*.52, y + r*.16, r*.16, r*.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#4A3036'; ctx.lineWidth = Math.max(1.6, r*.08); ctx.lineCap = 'round';
  ctx.beginPath();
  if (happy) ctx.arc(x, y + r*.08, r*.22, .15*Math.PI, .85*Math.PI);
  else { ctx.moveTo(x - r*.18, y + r*.3); ctx.lineTo(x + r*.18, y + r*.3); }
  ctx.stroke();
}

/* ---------- 60fps 게임 루프 ---------- */
function slingLoop(){
  const s = sling; if (!s || !s.alive) return;
  if (s.paused){ s.raf = requestAnimationFrame(slingLoop); return; }
  const ctx = s.ctx, L = SLING_LEVELS[s.level % SLING_LEVELS.length], G = SLING_GROUND, A = SLING_ANCHOR;
  const now = performance.now();

  ctx.save();
  if (s.shake > 0){ ctx.translate((Math.random() - .5) * s.shake, (Math.random() - .5) * s.shake); s.shake = Math.max(0, s.shake - .6); }

  // 밤하늘
  const bg = ctx.createLinearGradient(0, 0, 0, SLING_H);
  bg.addColorStop(0, '#221d3f'); bg.addColorStop(1, '#3a2d58');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, SLING_W + 40, SLING_H + 40);
  for (const st of s.sky){
    st.x -= st.v; if (st.x < 0) st.x = SLING_W;
    ctx.globalAlpha = st.a * (.75 + .25 * Math.sin(now * .002 + st.y));
    ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 땅
  ctx.fillStyle = '#2d2448'; ctx.fillRect(-20, G, SLING_W + 40, SLING_H - G + 20);
  ctx.strokeStyle = 'rgba(155,224,200,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, G); ctx.lineTo(SLING_W, G); ctx.stroke();

  // 새총
  const fl = { x:A.x - 24, y:A.y - 50 }, fr = { x:A.x + 24, y:A.y - 45 };
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8a6a55'; ctx.lineWidth = 13; ctx.beginPath(); ctx.moveTo(A.x, G); ctx.lineTo(A.x, A.y); ctx.stroke();
  ctx.strokeStyle = '#a47e63'; ctx.lineWidth = 10; ctx.beginPath();
  ctx.moveTo(A.x, A.y); ctx.lineTo(fl.x, fl.y); ctx.moveTo(A.x, A.y); ctx.lineTo(fr.x, fr.y); ctx.stroke();
  ctx.strokeStyle = '#FF8FA8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(s.pouch.x - 8, s.pouch.y); ctx.stroke();

  // 날아갈 길 미리 보기 — 끝까지 길게 보여주고, 과녁에 맞을 길이면 초록색으로 바꿔 그 과녁을 반짝인다
  s.aimTarget = null;
  if (s.aiming){
    const dx = A.x - s.pouch.x, dy = A.y - s.pouch.y, d = Math.hypot(dx, dy);
    if (d > 18){
      const k0 = s.weapon === 'PIERCE' ? 1.2 : 1;
      const pw = Math.min(d, SLING_PULL) * SLING_POWER, ang = Math.atan2(dy, dx);
      let vx = Math.cos(ang) * pw * k0, vy = Math.sin(ang) * pw * k0, x = s.pouch.x, y = s.pouch.y;
      const pts = [];
      for (let i = 0; i < 160; i++){
        vx += L.wind; vy += L.gravity; x += vx; y += vy;
        if (y + SLING_SHOT_R > G || x > SLING_W + 20 || x < -20) break;
        if (s.weapon !== 'PIERCE' && s.blocks.some(b => !b.dead && Math.abs(x - b.x) < b.w/2 + SLING_SHOT_R && Math.abs(y - b.y) < b.h/2 + SLING_SHOT_R)){ pts.push([x, y]); break; }
        pts.push([x, y]);
        const hitT = s.targets.find(t => !t.dead && Math.hypot(x - t.x, y - t.y) < SLING_SHOT_R + t.r + SLING_EASE);
        if (hitT){ s.aimTarget = hitT; break; }
      }
      const good = !!s.aimTarget;
      pts.forEach(([px, py], i) => {
        if (i % 2) return;                                   // 점을 하나 건너 하나씩
        const k = 1 - i / (pts.length + 8);
        ctx.globalAlpha = .35 + .6 * k;
        ctx.fillStyle = good ? '#9BE0C8' : '#FFE3EA';
        ctx.beginPath(); ctx.arc(px, py, good ? 5 : 4, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
  }

  // 주머니 속 별
  if (s.ammo > 0 || s.aiming){
    const W = SLING_WEAPONS[s.weapon];
    ctx.save(); ctx.shadowColor = W.glow; ctx.shadowBlur = 12;
    drawStar(ctx, s.pouch.x, s.pouch.y, 15, W.color, '#6B4A52'); ctx.restore();
  }
  ctx.strokeStyle = '#FF8FA8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(fr.x, fr.y); ctx.lineTo(s.pouch.x + 8, s.pouch.y); ctx.stroke();
  ctx.fillStyle = '#6B4A52'; ctx.strokeStyle = '#FFE3EA'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(s.pouch.x, s.pouch.y + 13, 12, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // 벽돌
  for (const b of s.blocks){
    if (b.dead) continue;
    if (b.cool > 0) b.cool--;
    const c = SLING_BLOCK_COLOR[b.type];
    ctx.fillStyle = c.fill; ctx.strokeStyle = c.line; ctx.lineWidth = 2.5;
    const x = b.x - b.w/2, y = b.y - b.h/2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, b.w, b.h, 6) : ctx.rect(x, y, b.w, b.h); ctx.fill(); ctx.stroke();
    if (b.type !== 'steel' && b.hp < b.max){ ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + b.w*.2, y + b.h*.3); ctx.lineTo(x + b.w*.6, y + b.h*.55); ctx.lineTo(x + b.w*.4, y + b.h*.8); ctx.stroke(); }
  }

  // 과녁 (얼굴 있는 동그라미)
  for (const t of s.targets){
    if (t.dead) continue;
    if (t.cool > 0) t.cool--;
    const r = t.r + Math.sin(now * .005 + t.x) * 2;
    ctx.save();
    ctx.shadowColor = SLING_TARGET_COLOR[t.type]; ctx.shadowBlur = 16;
    ctx.fillStyle = t.type === 'heavy' && t.hp === 1 ? '#FFC2CE' : SLING_TARGET_COLOR[t.type];
    if (t.type === 'bonus') drawStar(ctx, t.x, t.y, r * 1.15, '#FFD98E', '#6B4A52');
    else { ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#6B4A52'; ctx.lineWidth = 2.5; ctx.stroke(); }
    ctx.restore();
    slingFace(ctx, t.x, t.y + (t.type === 'bonus' ? 2 : 0), r * (t.type === 'bonus' ? .8 : 1), true);
    if (s.aimTarget === t){
      ctx.strokeStyle = '#9BE0C8'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(t.x, t.y, r + 12 + Math.sin(now * .012) * 3, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (t.type === 'boom'){ ctx.fillStyle = '#6B4A52'; ctx.font = `bold ${Math.round(r*.7)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('💥', t.x, t.y - r - 4); }
  }

  // 날아가는 별
  for (const p of s.shots){
    p.trail.unshift({ x:p.x, y:p.y }); if (p.trail.length > 14) p.trail.pop();
    p.vx += L.wind; p.vy += L.gravity; p.x += p.vx; p.y += p.vy;
    p.trail.forEach((q, i) => { const k = 1 - i / p.trail.length;
      ctx.globalAlpha = k * .45; ctx.fillStyle = p.glow; ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, p.r * k), 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = p.glow; ctx.shadowBlur = 14;
    if (p.kind === 'BOMB'){ ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
    else drawStar(ctx, p.x, p.y, p.r * 1.15, p.color, '#6B4A52');
    ctx.restore();

    if (p.y + p.r >= G){
      p.y = G - p.r; p.vy = -p.vy * .45; p.vx *= .7;
      slingBurst(p.x, G, '#9BE0C8', 5);
      if (Math.abs(p.vx) < .6 && Math.abs(p.vy) < .8) p.on = false;
    }
    for (const b of s.blocks){
      if (b.dead || !p.on || b.cool > 0) continue;
      const cx = Math.max(b.x - b.w/2, Math.min(p.x, b.x + b.w/2)), cy = Math.max(b.y - b.h/2, Math.min(p.y, b.y + b.h/2));
      if (Math.hypot(p.x - cx, p.y - cy) < p.r){
        b.cool = 8;                                      // 한 번 부딪힌 것을 여러 번 세지 않도록
        s.sound.hit('block'); s.shake = Math.min(s.shake + 4, 10);
        if (p.kind !== 'PIERCE'){ if (Math.abs(p.x - cx) > Math.abs(p.y - cy)) p.vx = -p.vx * .65; else p.vy = -p.vy * .65; }
        if (b.type !== 'steel'){
          b.hp -= p.kind === 'BOMB' ? 3 : 1; slingBurst(cx, cy, '#CBDDF7', 10);
          if (b.hp <= 0){ b.dead = true; slingPoints(50, b.x, b.y); }
        }
      }
    }
    for (const t of s.targets){
      if (t.dead || !p.on || t.cool > 0) continue;
      if (Math.hypot(p.x - t.x, p.y - t.y) < p.r + t.r + SLING_EASE){
        t.cool = 8;
        s.sound.hit(t.type); s.shake = Math.min(s.shake + 8, 16);
        t.hp -= p.kind === 'BOMB' ? 3 : 1;
        if (t.hp <= 0){
          t.dead = true; slingPoints(t.pts, t.x, t.y); slingBurst(t.x, t.y, SLING_TARGET_COLOR[t.type], 24);
          if (t.type === 'boom'){
            for (const n of s.targets){
              if (!n.dead && Math.hypot(n.x - t.x, n.y - t.y) < 140){ n.dead = true; slingPoints(n.pts * 2, n.x, n.y); slingBurst(n.x, n.y, '#FFB36B', 18); }
            }
          }
        }
        if (p.kind === 'BOMB'){ p.on = false; slingBurst(p.x, p.y, '#FFB36B', 32); }
        else if (p.kind !== 'PIERCE'){ p.vx = -p.vx * .4; p.vy = -p.vy * .4; }
      }
    }
    if (p.x < -100 || p.x > SLING_W + 100 || p.y > SLING_H + 50) p.on = false;
  }
  s.shots = s.shots.filter(p => p.on);

  // 불꽃·점수 글자
  for (let i = s.sparks.length - 1; i >= 0; i--){
    const q = s.sparks[i]; q.x += q.vx; q.y += q.vy; q.vy += .12; q.a -= q.d;
    if (q.a <= 0){ s.sparks.splice(i, 1); continue; }
    ctx.globalAlpha = q.a; ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (let i = s.texts.length - 1; i >= 0; i--){
    const f = s.texts[i]; f.y -= 1.2; f.a -= .02;
    if (f.a <= 0){ s.texts.splice(i, 1); continue; }
    ctx.globalAlpha = f.a; ctx.fillStyle = '#FFE79C'; ctx.font = "bold 20px 'Gaegu', sans-serif"; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 손 제스처 조준점
  if (s.hand && s.hand.present){
    ctx.strokeStyle = s.hand.pinch ? '#FFD98E' : 'rgba(255,227,234,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.hand.x * SLING_W, s.hand.y * SLING_H, s.hand.pinch ? 17 : 12, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  // 통과 / 실패
  const left = s.targets.filter(t => !t.dead).length;
  if (!s.cleared && left === 0){
    s.cleared = true; s.aiming = null;
    const bonus = s.ammo * 300;
    s.score += bonus;                                    // 원래 코드는 보너스를 보여만 주고 더하지 않았다
    s.sound.win(); confetti();
    s.layer.querySelector('#slClearScore').textContent = `점수 ${s.score.toLocaleString()} · 남은 별 보너스 +${bonus.toLocaleString()} · ⭐ 3개 받았어요`;
    s.layer.querySelector('#slClear').hidden = false;
    const who = kid(s.kidId);
    if (who){
      const patch = { stars:(who.stars || 0) + 3 };
      if (s.score > s.best){ s.best = s.score; patch.slingBest = s.score; }
      Store.update('profiles', who.id, patch);
    }
    slingHud();
  } else if (!s.cleared && !s.failed && s.ammo <= 0 && s.shots.length === 0 && left > 0){
    if (!s.failAt) s.failAt = now + 800;
    else if (now >= s.failAt){ s.failed = true; s.layer.querySelector('#slFail').hidden = false; }
  }

  s.raf = requestAnimationFrame(slingLoop);
}

/* ---------- ✋ 손 제스처 (필요할 때만 불러온다) ---------- */
const MP_HANDS = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
const MP_CAMERA = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js';
const SCRIPT_P = {};
function loadScriptOnce(src){
  if (SCRIPT_P[src]) return SCRIPT_P[src];          // 불러오는 중에 또 부르면 같은 약속을 돌려준다
  SCRIPT_P[src] = new Promise((ok, bad) => {
    const el = document.createElement('script'); el.src = src; el.crossOrigin = 'anonymous';
    el.onload = () => ok();
    el.onerror = () => { delete SCRIPT_P[src]; el.remove(); bad(new Error('load ' + src)); };
    document.head.appendChild(el);
  });
  return SCRIPT_P[src];
}
async function slingStartHand(){
  const s = sling; if (!s) return;
  const btn = s.layer.querySelector('#slHand'), cam = s.layer.querySelector('#slCam'), badge = s.layer.querySelector('#slCamBadge');
  btn.disabled = true; btn.textContent = '준비 중…';
  try {
    await loadScriptOnce(MP_CAMERA);
    await loadScriptOnce(MP_HANDS + 'hands.js');
    if (!sling || sling !== s) return;
    const video = document.createElement('video');
    video.setAttribute('playsinline', ''); video.muted = true;
    const hands = new window.Hands({ locateFile: f => MP_HANDS + f });
    hands.setOptions({ maxNumHands:1, modelComplexity:0, minDetectionConfidence:.6, minTrackingConfidence:.6 });
    const camCtx = s.layer.querySelector('#slCamCanvas').getContext('2d');
    s.hand = { present:false, pinch:false, x:.5, y:.5, hands, camera:null, video };
    hands.onResults(res => {
      if (!sling || !s.hand || s.paused) return;
      camCtx.save(); camCtx.translate(160, 0); camCtx.scale(-1, 1);
      camCtx.drawImage(video, 0, 0, 160, 120); camCtx.restore();
      const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];
      if (!lm){
        s.hand.present = false; badge.textContent = '손을 비춰주세요 🖐️';
        if (s.aiming === 'hand') slingFire();
        return;
      }
      const th = lm[4], ix = lm[8];
      const pinch = Math.hypot(th.x - ix.x, th.y - ix.y) < 0.085;
      const px = 1 - (th.x + ix.x) / 2, py = (th.y + ix.y) / 2;        // 거울처럼 좌우를 뒤집는다
      s.hand.present = true; s.hand.pinch = pinch;
      s.hand.x = s.hand.x * .4 + px * .6; s.hand.y = s.hand.y * .4 + py * .6;
      badge.textContent = pinch ? '잡았어요! 당겨요 🏹' : '엄지와 검지를 모아요 🤏';
      const hx = s.hand.x * SLING_W, hy = s.hand.y * SLING_H;
      if (pinch){
        if (!s.aiming && !s.cleared && s.ammo > 0 && (Math.hypot(hx - SLING_ANCHOR.x, hy - SLING_ANCHOR.y) < 220 || hx < 360)){
          s.aiming = 'hand'; s.sound.pinch();
        }
        if (s.aiming === 'hand') slingAimTo(hx, hy);
      } else if (s.aiming === 'hand') slingFire();
    });
    const camera = new window.Camera(video, {
      onFrame: async () => { if (sling === s && s.hand) await hands.send({ image:video }); },
      width:640, height:480, facingMode:'user'
    });
    s.hand.camera = camera;
    await camera.start();
    cam.hidden = false;
    btn.disabled = false; btn.textContent = '✋ 끄기';
    slingCoach('엄지와 검지를 붙여 새총을 잡고, 뒤로 당긴 뒤 손을 쫙 펴면 날아가요!');
  } catch(err){
    console.warn('hand tracking', err);
    slingStopHand(s);
    if (sling === s){
      btn.disabled = false; btn.textContent = '✋ 손으로';
      toast('카메라를 켤 수 없어요. 손가락으로 해볼까요?');
    }
  }
}
function slingStopHand(s, byUser){
  if (!s || !s.hand) return;
  const h = s.hand; s.hand = null;
  try { h.camera && h.camera.stop(); } catch(e){}
  try { h.video && h.video.srcObject && h.video.srcObject.getTracks().forEach(t => t.stop()); } catch(e){}
  try { h.hands && h.hands.close(); } catch(e){}
  if (s.aiming === 'hand'){ s.aiming = null; s.pouch = { ...SLING_ANCHOR }; }
  if (byUser && s.layer){
    s.layer.querySelector('#slCam').hidden = true;
    s.layer.querySelector('#slHand').textContent = '✋ 손으로';
    slingCoach('손가락으로 주머니를 당겨요!');
  }
}

/* 아이가 요청을 올린다 → db를 통해 부모님 기기(같은 계정으로 연 모든 화면)에 몇 초 안에 뜬다.
   카카오톡 알림이나 휴대폰 푸시는 이 페이지에서 보낼 수 없다 — 서버가 있어야 한다.
   나중에 카카오를 붙이려면 이 함수와 approveRequest()만 바꾸면 된다. */
async function requestUnlock(){
  const k = curKid(); if (!k) return;
  if (pendingRequests().some(r=>r.kidId===k.id)) return;
  const minutes = S.settings.gameMinutes || 20;
  await Store.add('requests', {
    kidId:k.id, kidName:k.name, status:'pending',
    minutes, createdAt:new Date().toISOString()
  });
  // 부모님 텔레그램으로 알림 (서버에 봇 설정이 없으면 조용히 넘어간다)
  if (!window.claude){
    fetch('/api/notify', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ kidName:k.name, minutes, familyId:S.familyId,
        chatId:(S.settings.telegram && S.settings.telegram.chatId) || '' })
    }).catch(()=>{});
  }
}
function approveRequest(reqId){
  const r = S.data.requests.find(x=>x.id===reqId);
  if (!r) return;
  grantUnlock(r.kidId, r.minutes);
  Store.update('requests', reqId, { status:'approved', decidedAt:new Date().toISOString() });
}
function denyRequest(reqId){
  Store.update('requests', reqId, { status:'denied', decidedAt:new Date().toISOString() });
}
function grantUnlock(kidId, minutes){
  const mins = minutes || S.settings.gameMinutes || 20;
  Store.add('unlocks', {
    kidId,
    grantedAt: new Date().toISOString(),
    expiresAt: new Date(Date.now() + mins*60000).toISOString(),
    minutes: mins
  });
}
function relock(kidId){
  S.data.unlocks.filter(u=>u.kidId===kidId).forEach(u=>Store.remove('unlocks', u.id));
  if (kidId === S.kidId){ S.view.game = null; stopStars(); }
}

/* 진도는 통째로 저장한다 (Store.update 는 서버에 받은 모양 그대로 남긴다) */
async function ttSaveProg(p){
  const key = p.kidId + '|' + p.scriptId;
  const { id:_x, ...data } = p;
  const keys = Object.keys(data.days || {}).sort();
  if (keys.length > 60) keys.slice(0, keys.length - 60).forEach(k => { delete data.days[k]; });   // 두 달 치만
  const id = TT_PID[key] || (S.data.speech.find(r => r.kidId === p.kidId && r.scriptId === p.scriptId) || {}).id;
  if (id){ TT_PID[key] = id; await Store.update('speech', id, data); }
  else { const nid = uid(); TT_PID[key] = nid; await Store.add('speech', data, nid); }
}
function ttDaysLeft(script){
  if (!script || !script.contestDate) return null;
  return Math.round((new Date(script.contestDate + 'T00:00:00') - new Date(todayKey() + 'T00:00:00')) / 86400000);
}

/* 오늘의 미션 — 대회 날짜와 남은 문장으로. 마지막 며칠은 실전 무대 위주 */
function ttPlan(script, prog){
  const sents = ttSents(script, prog), n = sents.length, now = Date.now();
  const day = (prog && prog.days && prog.days[todayKey()]) || { learn:0, review:0, chain:0, runs:0, rec:0, secs:0, stars:0 };
  const learned = sents.filter(s => s.lv >= 4).length;
  const dleft = ttDaysLeft(script);
  const learnDays = dleft == null ? 7 : Math.max(1, dleft - 2);
  const startLeft = (n - learned) + (day.learn || 0);                      // 오늘 시작할 때 남아 있던 문장
  const newGoal = startLeft > 0 ? Math.min(startLeft, Math.max(1, Math.ceil(startLeft / learnDays))) : 0;
  const due = sents.map((s, i) => ({ s, i }))
    .filter(x => x.s.lv >= 4 && x.s.nextAt && new Date(x.s.nextAt).getTime() <= now).map(x => x.i);
  const reviewGoal = Math.min(6, due.length + (day.review || 0));
  const late = dleft != null && dleft <= 3;
  const runGoal = (learned === n || late) ? (late && dleft >= 0 ? 2 : 1) : 0;
  const done = (day.learn || 0) >= newGoal && (day.review || 0) >= reviewGoal && (day.runs || 0) >= runGoal;
  return { n, sents, learned, dleft, newGoal, reviewGoal, runGoal, due, day, done };
}
function ttQueue(script, prog){
  const plan = ttPlan(script, prog), q = [];
  const reviews = plan.due.slice(0, Math.max(0, plan.reviewGoal - (plan.day.review || 0)));
  reviews.slice(0, 2).forEach(i => q.push({ type:'review', i }));
  const newLeft = Math.max(0, plan.newGoal - (plan.day.learn || 0));
  const fresh = plan.sents.map((s, i) => ({ s, i })).filter(x => x.s.lv < 4).slice(0, newLeft).map(x => x.i);
  fresh.forEach(i => q.push({ type:'new', i }));
  reviews.slice(2).forEach(i => q.push({ type:'review', i }));
  const last = fresh.length ? fresh[fresh.length - 1] : -1;       // 눈덩이 — 오늘 배운 문장을 앞 문장들과 이어서
  if (last >= 1) q.push({ type:'chain', from:Math.max(0, last - 2), to:last });
  return q;
}
function ttExtraQueue(script, prog){
  const sents = ttSents(script, prog), q = [];
  const next = sents.findIndex(s => s.lv < 4);
  if (next >= 0) q.push({ type:'new', i:next });
  sents.map((s, i) => ({ s, i })).filter(x => x.s.lv >= 4).map(x => x.i)
    .sort(() => Math.random() - 0.5).slice(0, 3).forEach(i => q.push({ type:'review', i }));
  if (!q.length && sents.length) q.push({ type:'new', i:0 });
  return q;
}
function ttPassed(stars, tries, type){
  if (type === 'review' || type === 'chain') return stars >= 2;
  return stars >= 3 || (stars >= 2 && tries >= 1);                 // 두 번째부터는 별 두 개도 통과
}
/* 할 일과 연결 — 오늘 미션을 다 하면 '뚜뚜랑 스피치 연습' 할 일이 저절로 체크된다 */
function ttMarkMission(kidId, script, prog){
  const plan = ttPlan(script, prog);
  if (!plan.done) return false;
  const key = todayKey();
  let newly = false;
  for (const td of todosFor(kidId).filter(x => x.kind === 'speech')){
    const s = sessionOf(kidId, td.id, key);
    if (s && s.done) continue;
    newly = true;
    const secs = plan.day.secs || 0;
    if (s) Store.update('sessions', s.id, { done:true, durationSec:Math.max(s.durationSec || 0, secs) });
    else Store.add('sessions', { kidId, todoId:td.id, date:key, durationSec:secs, done:true });
  }
  return newly;
}
function ttEnsureTodos(kidIds){
  for (const kidId of kidIds){
    if (S.data.todos.some(t => t.kidId === kidId && t.kind === 'speech' && !t.archived)) continue;
    Store.add('todos', { kidId, title:'뚜뚜랑 스피치 연습', icon:'🦜', repeatDays:[], kind:'speech',
      createdBy:'parent', createdAt:new Date().toISOString() });
  }
}

function ttAiOn(){ return S.settings.ttAi === true && !window.claude && location.protocol.startsWith('http') && navigator.onLine !== false; }
function ttMaskWords(){
  const extra = String(S.settings.ttMask || '').split(/[,，\n]/).map(w => w.trim()).filter(Boolean);
  return kids().map(k => k.name).concat(kids().map(k => ttKidName(k)), extra).filter(w => w && w.length >= 2);
}
function ttHasName(text){ const t = String(text || '').toLowerCase(); return ttMaskWords().some(w => t.includes(w.toLowerCase())); }
function ttMask(text){
  let out = String(text || '');
  for (const w of ttMaskWords()) out = out.split(w).join('[NAME]').replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '[NAME]');
  return out;
}
/* AI가 바쁘면(429) 10분 쉬고, 연결이 두 번 연달아 끊기면 이번 수업은 기기 분석으로만 */
function ttAiReady(){ return ttAiOn() && TT && !(TT.aiOffUntil > Date.now()); }
function ttAiFail(e){
  if (!TT) return;
  if (e && e.code === 'busy') TT.aiOffUntil = Date.now() + 10 * 60000;
  else if (!e || !e.code || e.code === 'network'){ TT.aiFails = (TT.aiFails || 0) + 1; if (TT.aiFails >= 2) TT.aiOffUntil = Date.now() + 36e5; }
}

/* 서버의 뚜뚜에게 묻는다 — 우리 가족 주소(가족 ID)로만 동작한다 */
async function ttAsk(body, ms){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 45000);
  let r = null;
  try {
    r = await fetch('/api/coach', { method:'POST', signal:ctl.signal,
      headers:{ 'content-type':'application/json', 'x-family-id':S.familyId }, body:JSON.stringify(body) });
  } catch(e){ r = null; } finally { clearTimeout(tm); }
  if (!r) throw new Error('뚜뚜랑 연결이 잠깐 끊겼어. 괜찮아, 이번엔 뚜뚜 귀로 들은 만큼 알려줄게!');
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.error){ const e = new Error((j && j.message) || '뚜뚜가 잠깐 쉬고 있어요.'); e.code = j && j.error; throw e; }
  return j;
}

/* ---------- 글자 다루기 ---------- */
function ttNorm(s){
  return String(s || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/)
    .map(w => w.replace(/^'+|'+$/g, '')).filter(Boolean);
}
function ttLev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({ length:a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* 목표 문장의 단어마다 뚜뚜가 들었는지(true) 못 들었는지(false) — LCS 로 맞춘다 */
function ttAlign(target, heard){ return ttAlignTok(ttNorm(target), ttNorm(heard)); }
function ttAlignTok(a, b){
  const eq = (x, y) => x === y || x.replace(/'/g, '') === y.replace(/'/g, '') || (x.length >= 4 && ttLev(x, y) <= 1);
  const L = Array.from({ length:a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    L[i][j] = eq(a[i], b[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const marks = new Array(a.length).fill(false);
  let i = 0, j = 0;
  while (i < a.length && j < b.length){
    if (eq(a[i], b[j])){ marks[i] = true; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return marks;
}
function ttWordOffsets(text){ const out = [], re = /[A-Za-z0-9’'-]+/g; let m; while ((m = re.exec(text))) out.push(m.index); return out; }
/* 영어 문장을 단어 칸으로 — stage 1 은 하나 건너 가리기, 2 는 첫 글자만. marks 가 있으면 들은/못 들은 단어 색 */
function ttWords(en, { stage = 0, stress = [], marks = null, missAct = '', plain = false } = {}){
  const st = new Set((stress || []).map(w => String(w).toLowerCase()));
  let wi = 0;
  return String(en || '').split(/(\s+)/).map(tok => {
    if (!tok || /^\s+$/.test(tok)) return tok;
    const m = tok.match(/^([^A-Za-z0-9’']*)([A-Za-z0-9’'-]+)(.*)$/);
    if (!m) return esc(tok);
    const pre = m[1], w = m[2], post = m[3], i = wi++;
    let cls = 'w', txt = esc(w);
    if (stage === 1 && i % 2 === 1 && w.length > 1){ cls += ' hide'; txt = '＿'.repeat(Math.min(6, Math.max(2, w.length - 1))); }
    else if (stage === 2) txt = `${esc(w[0])}<span class="hide">${'_'.repeat(Math.min(6, Math.max(1, w.length - 1)))}</span>`;
    if (stage === 0 && !marks && st.has(w.toLowerCase())) cls += ' st';
    let extra = '';
    if (marks){
      if (marks[i] === true) cls += ' ok';
      else if (marks[i] === false){ cls += ' miss'; extra = plain ? '' : (missAct ? ` data-act="${missAct}" data-arg="${i}" role="button" tabindex="0"` : ` data-ttword="${esc(w)}" role="button" tabindex="0"`); }
    }
    return `${esc(pre)}<span class="${cls}"${extra}>${txt}</span>${esc(post)}`;
  }).join('');
}
/* 원고를 문장으로 — 줄바꿈과 . ! ? 로 나눈다. Mr. 같은 줄임말에서는 나누지 않는다 */
function ttSplit(text){
  const abbr = /\b(Mr|Mrs|Ms|Dr|St|Jr|Sr|vs|etc)\.$/i;
  const out = [];
  let lastLine = [];                                                      // 바로 위 영어 줄에서 나온 문장 번호들
  const cut = t => t.replace(/([.!?…]+["'”’)]?)\s+/g, '$1\u0001').split('\u0001').map(x => x.trim()).filter(Boolean);
  String(text || '').replace(/\r/g, '').split(/\n+/).forEach(line => {
    line = line.replace(/\s+/g, ' ').trim().replace(/^(\d{1,2}[.)]|[-•*·▶])\s*/, '');
    if (!line) return;
    if (/[가-힣]/.test(line) && !/[A-Za-z]{2,}/.test(line)){              // 한국어 해석 줄
      if (!out.length) return;
      const ko = cut(line), idx = lastLine.length ? lastLine : [out.length - 1];
      const put = (i, k) => { const cur = out[i]; out[i] = typeof cur === 'object' ? { ...cur, ko:(cur.ko ? cur.ko + ' ' : '') + k } : { en:cur, ko:k }; };
      if (ko.length === idx.length) idx.forEach((i, n) => put(i, ko[n]));
      else put(idx[idx.length - 1], line);
      lastLine = [];
      return;
    }
    const before = out.length;
    let buf = '';
    line.replace(/([.!?…]+["'”’)]?)\s+(?=["'“‘(]?[A-Z0-9])/g, '$1\u0001').split('\u0001').forEach(p => {
      buf = buf ? buf + ' ' + p : p;
      if (!abbr.test(buf)){ out.push(buf.trim()); buf = ''; }
    });
    if (buf) out.push(buf.trim());
    lastLine = Array.from({ length:out.length - before }, (_, n) => before + n);
  });
  return out.filter(Boolean).slice(0, 80).map(x => typeof x === 'object' ? x : { en:x, ko:'' });
}
function ttParseLimit(v){
  const s = String(v || '').trim();
  if (!s) return 0;
  const m = s.match(/^(\d{1,2})\s*[:분]\s*(\d{1,2})?/);
  if (m) return (+m[1]) * 60 + (+(m[2] || 0));
  const n = +s.replace(/[^\d]/g, '');
  if (!n) return 0;
  return n <= 10 ? n * 60 : n;                    // 10 이하면 분, 그보다 크면 초
}
/* AI 없이 채우는 기본 힌트 — 그림 힌트(낱말 → 이모지, 없으면 번호), 힘줄 단어(긴 낱말), 끝 억양, 발음 팁 */
const TT_CUES = { hello:'👋', hi:'👋', everyone:'👋', name:'📛', family:'👨‍👩‍👧', mom:'👩', mother:'👩', dad:'👨', father:'👨',
  sister:'👧', brother:'👦', twin:'👯', friend:'🧑‍🤝‍🧑', friends:'🧑‍🤝‍🧑', school:'🏫', teacher:'🧑‍🏫', book:'📚', books:'📚', read:'📖',
  love:'❤️', like:'💗', happy:'😊', dream:'💭', future:'🔭', dog:'🐶', cat:'🐱', rabbit:'🐰', bird:'🐦', tree:'🌳', flower:'🌸',
  sun:'☀️', moon:'🌙', night:'🌙', star:'⭐', world:'🌏', earth:'🌍', travel:'✈️', sea:'🌊', eat:'🍽', food:'🍽', apple:'🍎',
  play:'⚽', game:'🎮', sing:'🎤', song:'🎵', music:'🎵', draw:'🎨', paint:'🎨', thank:'🙏', thanks:'🙏', listening:'👂',
  today:'📅', big:'🐘', small:'🐭', grow:'🌱', help:'🤝', together:'🤝', smile:'😄', heart:'💖', home:'🏠', house:'🏠' };
const TT_STOP = new Set('a an the i you he she it we they my your our is am are was were be to of in on at for and or but with this that do does did have has can will'.split(' '));
const TT_TIPS = [[/th/i, '혀끝을 윗니에 살짝 대고 바람을 후~'], [/f/i, '윗니로 아랫입술을 살짝 물고 ㅍ~'],
  [/v/i, '윗니로 아랫입술을 살짝 물고 부르르~'], [/^r/i, '입술을 동그랗게, 혀는 뒤로 살짝'], [/l/i, '혀끝을 윗니 뒤에 딱 붙여요'], [/z/i, '벌처럼 즈으~']];
function ttLocalPrep(s, i){
  const words = ttNorm(s.en);
  if (!s.stress || !s.stress.length){
    const raw = String(s.en || '').match(/[A-Za-z’'-]+/g) || [];
    s.stress = raw.filter(w => !TT_STOP.has(w.toLowerCase())).sort((a, b) => b.length - a.length).slice(0, 2);
  }
  if (!s.cue){
    const hit = s.stress.map(w => TT_CUES[w.toLowerCase()]).find(Boolean) || words.map(w => TT_CUES[w]).find(Boolean);
    s.cue = hit || (i < 10 ? ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'][i] : '💬');
  }
  if (!s.end) s.end = /\?\s*["”’']?$/.test(s.en) && /^(do|does|did|is|are|am|was|were|can|could|will|would|should|have|has|may)\b/i.test(s.en) ? 'rise' : 'fall';
  if (!s.tricky || !s.tricky.length){
    const out = [];
    for (const w of (String(s.en || '').match(/[A-Za-z’'-]+/g) || []).filter(w => !TT_STOP.has(w.toLowerCase()))){
      const tip = TT_TIPS.find(([re]) => re.test(w));
      if (tip && !out.some(x => x.word.toLowerCase() === w.toLowerCase())) out.push({ word:w, tipKo:tip[1] });
      if (out.length >= 2) break;
    }
    s.tricky = out;
  }
  return s;
}
/* 원고를 고쳐 문장이 바뀌어도, 같은 문장은 진도를 그대로 이어 간다 */
function ttRemap(oldS, newS, sents){
  const key = s => ttNorm(s.en).join(' ');
  const used = new Set();
  return newS.map(ns => {
    const k = key(ns);
    const oi = oldS.findIndex((os, i) => !used.has(i) && key(os) === k);
    if (oi >= 0){ used.add(oi); return sents[oi] || {}; }
    return {};
  });
}

/* ---------- 효과음 (파일 없이) ---------- */
function ttTone(f, at, dur, vol){
  const c = audioCtx(); if (!c) return;
  const t0 = c.currentTime + (at || 0), o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(vol || 0.14, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + (dur || 0.25));
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + (dur || 0.25) + 0.02);
}
function ttChime(){ [523, 659, 784, 1047].forEach((f, i) => ttTone(f, i * 0.1, 0.3, 0.12)); }

/* 뚜뚜가 한국어로 말한다 — 말풍선 + 부리 움직임. 누른 순간에 부르면 아이패드에서도 바로 소리가 난다 */
function ttTalk(text){

  TT.say = text;
  const b = document.getElementById('ttBubble'); if (b) b.textContent = text;
  if (TT.quiet) return Promise.resolve();

/* 뚜뚜가 영어 문장을 읽는다 — 읽는 단어에 불이 켜진다 */
function ttModel(text, rate){
  hush();
  const spans = [...document.querySelectorAll('#ttLayer .tt-en .w')];
  const offs = ttWordOffsets(text);
  const me = TT;
  const lit = wi => spans.forEach((s, i) => s.classList.toggle('on', i === wi));
  // 자연스러운 목소리는 단어 위치를 알려주지 않아서, 낱말 길이로 어림해 불을 켠다
  const words = (text.match(/[A-Za-z0-9’'-]+/g) || []), wsum = words.reduce((s, w) => s + w.length + 2, 0);
  const onprogress = f => { let acc = 0, wi = 0; for (let i = 0; i < words.length; i++){ acc += words[i].length + 2; if (acc / wsum > f){ wi = i; break; } wi = i; } lit(wi); };
  return voice(text, { lang:'en', rate:rate || (TT && TT.rate) || 0.8,
    onstart:() => { if (TT === me) ttMouth(true); }, onprogress,
    onword: ci => { let wi = 0; for (let i = 0; i < offs.length; i++) if (offs[i] <= ci) wi = i; lit(wi); }
  }).then(() => { if (TT === me) ttMouth(false); spans.forEach(s => s.classList.remove('on')); });
}

function ttItem(){ return TT && TT.queue[TT.qi]; }
function ttItemSentence(it){
  const ss = TT.script.sentences;
  if (it.type === 'chain'){
    const part = ss.slice(it.from, it.to + 1);
    return { en:part.map(s => ttNameFill(s.en, kid(TT.kidId))).join(' '), ko:part.map(s => s.ko || '').join(' '), cue:part.map(s => s.cue || '').join(' '),
             stress:[], end:(part[part.length - 1] || {}).end || 'fall', tricky:[], label:`${it.from + 1}~${it.to + 1}번 이어 말하기` };
  }

  return { en:ttNameFill(s.en || '', kid(TT.kidId)), ko:s.ko || '', cue:s.cue || '', stress:s.stress || [], end:s.end || 'fall', tricky:s.tricky || [], label:`${it.i + 1}번 문장` };
}
function ttChainReady(it){ const s = ttSents(TT.script, TT.prog); return s.slice(it.from, it.to + 1).every(x => x.lv >= 4); }
function ttEnterItem(){
  const t = TT, it = ttItem(), k = kid(t.kidId);

  } else if (it.type === 'review'){ t.stage = 4; t.step = 'speak'; ttMood('happy'); t.say = ttPick('review'); }
  else { t.stage = 4; t.step = 'speak'; ttMood('happy'); t.say = ttPick('chain'); }

function ttAdvance(){
  const t = TT;
  t.qi++;
  while (t.qi < t.queue.length && t.queue[t.qi].type === 'chain' && !ttChainReady(t.queue[t.qi])) t.qi++;

function ttFinish(){

/* 한 번 말할 때마다 진도에 반영한다 */
function ttApply(stars){
  const t = TT, it = ttItem(), p = t.prog, day = ttDay(p), now = new Date();
  p.sents = ttSents(t.script, p);
  day.stars = (day.stars || 0) + stars;
  day.rec = (day.rec || 0) + 1;
  day.secs = (day.secs || 0) + Math.round((Date.now() - t.lastSave) / 1000); t.lastSave = Date.now();
  const pass = ttPassed(stars, t.tries, it.type);
  if (it.type === 'new'){
    const st = p.sents[it.i];
    st.best = Math.max(st.best || 0, stars); st.lastAt = now.toISOString();
    if (pass){
      st.lv = Math.max(st.lv || 0, t.stage + 1);
      if (st.lv >= 4 && !it.learned){
        st.lv = 4; st.reps = 0; st.nextAt = new Date(Date.now() + 86400000).toISOString();
        day.learn = (day.learn || 0) + 1; it.learned = true;
      }
    }
  } else if (it.type === 'review'){
    const st = p.sents[it.i];
    st.lastAt = now.toISOString();
    if (pass){
      st.reps = (st.reps || 0) + 1;
      st.nextAt = new Date(Date.now() + TT_REVIEW_DAYS[Math.min(st.reps, TT_REVIEW_DAYS.length - 1)] * 86400000).toISOString();
      if (!it.counted){ day.review = (day.review || 0) + 1; it.counted = true; }
    } else if (t.tries >= 1 && !it.counted){
      st.lv = 2; st.nextAt = '';                   // 한 번 더 어려우면 첫 글자 단계부터 다시 — 괜찮아, 금방 돌아와요
      day.review = (day.review || 0) + 1; it.counted = true;
    }
  } else if (it.type === 'chain' && pass && !it.counted){ day.chain = (day.chain || 0) + 1; it.counted = true; }

}
function ttKeepClip(owner, blob, stars, secs, pinned){
  if (!blob || !blob.size) return;
  blob.arrayBuffer()
    .then(buf => AudioBox.put({ id:uid(), owner, at:Date.now(), mime:(blob.type || 'audio/mp4'), data:buf, secs:Math.round(secs || 0), stars, pinned:!!pinned }))
    .then(() => AudioBox.keep(owner, owner.endsWith('|-1') ? 10 : 3)).catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
}
/* 기기 분석만으로 주는 피드백 (AI가 꺼져 있거나 바쁠 때) */
function ttLocalFb(m, s){
  const words = Math.max(1, ttNorm(s.en).length);
  let stars = 3, tip = '';
  if (!m || m.silent || m.secs < 0.4){ stars = 1; tip = '목소리가 잘 안 들렸어요. 마이크 가까이에서 크게 말해볼까?'; }
  else {
    const per = m.secs / words, want = s.end === 'rise' ? 'rise' : 'fall';
    if (m.loudDb < -40){ stars--; tip = tip || '목소리를 조금 더 크게! 뒤에 있는 친구도 들리게 말해보자.'; }
    if (per < 0.18){ stars--; tip = tip || '조금만 천천히, 또박또박 말해볼까?'; }
    else if (per > 1.2 || m.pauses > Math.max(2, Math.floor(words / 4))){ stars--; tip = tip || '중간에 쉬지 않고 이어서 말해보자!'; }
    if (!tip && m.contour && m.contour.length && m.endPitch !== want)
      tip = want === 'rise' ? '문장 끝을 살짝 올려볼까? ↗' : '문장 끝을 살짝 내려서 말하면 더 멋져요 ↘';
    if (!tip && s.stress && s.stress.length) tip = `‘${s.stress[0]}’에 힘을 꼭 주면 더 멋져요!`;
  }
  stars = clamp(stars, 1, 3);
  return { stars, praise: stars >= 3 ? '또박또박 잘 말했어!' : (stars === 2 ? '좋아, 잘하고 있어!' : '괜찮아, 할 수 있어!'),
           tip, words:[], heard:'', local:m, source:'local' };
}
function ttMerge(ai, m){
  return { stars:ai.stars || 2, praise:ai.praise || '잘했어!', tip:ai.tip || '', words:ai.words || [], heard:ai.heard || '',
           fluency:ai.fluency, intonation:ai.intonation, missing:ai.missing || [], skipped:ai.skipped || [], local:m, source:'ai' };
}
function ttMetrics(m){
  return m ? { secs:+(m.secs || 0).toFixed(1), pauses:m.pauses || 0, loud:m.loudDb < -40 ? '작음' : '좋음',
               endPitch:m.endPitch === 'rise' ? '올림' : (m.endPitch === 'fall' ? '내림' : '평평') } : {};
}
async function ttMicStart(){
  const t = TT; if (!t || t.step !== 'speak') return;

  hush(); playStop();

  try {
    await recStart({
      onCount:n => { if (TT !== t) return; t.count = n; const c = document.getElementById('recCount'); if (n && c) c.textContent = String(n); else ttLayer(); },
      maxSec: it0.type === 'chain' ? 40 : 15,
      silenceMs: (it0.type !== 'new' || t.stage >= 3) ? 2300 : 1400,
      onLevel: lv => { const el = document.querySelector('#ttLevel span'); if (el) el.style.width = Math.round(lv * 100) + '%'; },
      onAuto: () => ttMicStop()

  } catch(e){

    t.say = nm === 'NotAllowedError' ? '마이크를 쓰려면 “허용”을 눌러줘! 안 되면 부모님께 설정 → Safari → 마이크 → 허용을 부탁해 봐.'
      : nm === 'NotReadableError' ? '다른 앱이 마이크를 쓰고 있나 봐. 괜찮아, 잠깐 뒤에 다시 눌러볼까?'
      : nm === 'NotFoundError' ? '이 기기에는 마이크가 없나 봐. 괜찮아, 소리 내어 말해 보고 아래 단추를 눌러도 돼!'
      : (nm === 'SecurityError' || !window.isSecureContext) ? '녹음은 https 주소(버셀)에서 열었을 때만 돼. 괜찮아, 소리 내어 말해 봐도 돼!'
      : '마이크를 켜지 못했어. 괜찮아, 소리 내어 말해 보고 아래 단추를 눌러도 돼!';
    ttLayer(); ttTalk(t.say);
  }
}
async function ttMicStop(){
  const t = TT; if (!t || t.step !== 'rec') return;
  t.step = 'think'; ttMood('think'); t.say = ttPick('think'); ttLayer();
  const blob = await recStop();
  if (TT !== t) return;
  if (!blob || !blob.size){ t.step = 'speak'; ttMood('happy'); t.say = '앗, 녹음이 안 됐어. 괜찮아, 다시 눌러볼까?'; ttLayer(); ttTalk(t.say); return; }
  await ttReview(blob);
}
async function ttReview(blob){
  const t = TT, it = ttItem(), s = ttItemSentence(it);
  let m = null, x = null;
  try { const d = await decodeAudio(blob); x = resample(d.pcm, d.rate, 16000); m = analyzeVoice(x, 16000); } catch(e){ m = null; }
  let fb = null;
  if (ttAiReady() && !(m && m.silent) && !ttHasName(s.en)){
    try {
      let audio, mime = 'audio/wav';
      if (x && m) audio = wavBase64(x.subarray(m.s0, m.s1), 16000);
      else { audio = bytesBase64(new Uint8Array(await blob.arrayBuffer())); mime = (blob.type || 'audio/mp4').split(';')[0]; }
      const ai = await ttAsk({ task:'speech', kind:it.type === 'chain' ? 'chain' : 'sentence', sentence:s.en, audio, mime,
        stage:t.stage, stress:s.stress, end:s.end, metrics:ttMetrics(m) });
      fb = ttMerge(ai, m);
      if (TT) TT.aiFails = 0;
      // 들은 말이 목표 문장을 그대로 베낀 것처럼 보여도, 말한 시간이 너무 짧으면 별 셋은 아껴 둔다
      if (m && fb.stars >= 3 && m.secs < Math.max(1, ttNorm(s.en).length) * 0.15) fb.stars = 2;
    } catch(e){
      ttAiFail(e);
      fb = ttLocalFb(m, s);
      fb.aiNote = `${e.message || '뚜뚜가 잠깐 쉬고 있어요.'} 이번엔 소리 크기·빠르기·높낮이만 봤어요.`;
    }

  ttKeepClip(`${t.kidId}|${t.script.id}|${it.type === 'chain' ? 'c' + it.to : it.i}`, blob, fb.stars, m ? m.secs : 0);
  ttApply(fb.stars);
  const pass = ttPassed(fb.stars, t.tries, it.type), k = kid(t.kidId);
  t.step = 'fb'; ttMood(fb.stars >= 3 ? 'cheer' : 'happy');
  const style = kidStyle(k);
  t.say = ttFill(ttPick(pass ? (fb.stars >= 3 ? 'pass3' : 'pass2') : 'retry'), k);
  if (pass && fb.stars >= 3 && style.pace === 'quick' && Math.random() < 0.6) t.say = ttStyleLine('quickPass', k);
  if (pass && fb.stars >= 3 && style.pace === 'careful' && Math.random() < 0.5) t.say = ttStyleLine('carefulPass', k);
  ttLayer();
  if (fb.stars >= 3) ttChime();
  ttTalk(t.say + (fb.tip ? ' ' + fb.tip : ''));
}
function ttSelfDone(){                   // 녹음을 못 할 때 — 말해 봤다고 스스로 알려준다

function ttNext(){

    const jump = kidStyle(k).pace === 'careful' && t.stage === 0 && t.fb.stars >= 3 && t.tries === 0;
    t.stage = Math.min(3, t.stage + (jump ? 2 : 1)); t.tries = 0; t.fb = null; t.clip = null; t.peek = false;
    if (jump){ t.prog.sents = ttSents(t.script, t.prog); t.prog.sents[it.i].lv = Math.max(t.prog.sents[it.i].lv || 0, 2); ttSaveProg(t.prog); }

/* 기기가 잰 것 — 잘한 건 초록, 다음에 해볼 건 분홍 (틀렸다가 아니라 "해볼까?") */
function ttBadges(f, s){

  if (f.intonation && f.intonation.noteKo) out.push(`<span class="tt-badge${f.intonation.level < 3 ? ' try' : ''}">🎢 ${esc(f.intonation.noteKo)}</span>`);
  if (!m) return out.join('');
  if (m.silent) return out.concat('<span class="tt-badge try">🤫 소리가 작았어요</span>').join('');
  const words = Math.max(1, ttNorm(s.en).length), per = m.secs / words;
  out.push(m.loudDb < -40 ? '<span class="tt-badge try">📣 조금 더 크게</span>' : '<span class="tt-badge">📣 목소리 좋아요</span>');
  if (!f.fluency){
    out.push(per < 0.18 ? '<span class="tt-badge try">🐢 조금 천천히</span>'
      : (per > 1.2 ? '<span class="tt-badge try">🐇 조금 더 이어서</span>' : '<span class="tt-badge">🎵 빠르기 딱 좋아요</span>'));
  }
  if (m.pauses > Math.max(1, Math.floor(words / 5))) out.push(`<span class="tt-badge try">🫧 쉰 곳 ${m.pauses}번</span>`);
  if (m.contour && m.contour.length){
    const want = s.end === 'rise' ? 'rise' : 'fall';
    out.push(m.endPitch === want ? `<span class="tt-badge">${want === 'rise' ? '↗' : '↘'} 끝 높낮이 좋아요</span>`
      : `<span class="tt-badge try">${want === 'rise' ? '↗ 끝을 살짝 올려요' : '↘ 끝을 살짝 내려요'}</span>`);
  }
  return out.join('');
}
