<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="두런두런">
<meta name="description" content="쌍둥이 자매의 읽기·낱말·할 일 다이어리">
<title>Do-Learn Do-Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
  :root{
    --cream:#FFF9F5;
    --surface:#FFFFFF;
    --berry:#FF8FA8;
    --berry-deep:#E85C7C;
    --berry-soft:#FFE3EA;
    --mint:#9BE0C8;
    --mint-deep:#3FA687;
    --mint-soft:#E2F7EF;
    --butter:#FFD98E;
    --butter-deep:#D99A2B;
    --cocoa:#6B4A52;
    --cocoa-soft:#A5858D;
    --blush:#F3DDE2;
    --shadow:0 6px 18px rgba(214,150,166,.16);
    --shadow-lift:0 12px 30px rgba(214,150,166,.26);
    --r-lg:22px; --r-md:16px; --r-sm:11px;
    --display:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --body:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
  }

  html,body{height:100%;}
  body{
    margin:0; background:var(--cream); color:var(--cocoa);
    font-family:var(--body); font-size:16px; line-height:1.55;
    -webkit-text-size-adjust:100%; overscroll-behavior-y:contain;
    /* 한국어는 낱말 중간이 아니라 띄어쓰기에서 줄을 바꾼다 ("사 / 람만" 방지) */
    word-break:keep-all; overflow-wrap:break-word;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  img{max-width:100%;}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
  input,select,textarea{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--berry-deep);outline-offset:2px;border-radius:6px;}
  .hz{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- shell ---------- */
  #app{height:100%;display:flex;flex-direction:column;}
  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .wrap{max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:18px 26px;}

  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:10px 16px calc(10px) 16px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--cream);position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--blush);
  }
  .topbar .tb-right{grid-column:3;justify-self:end;}
  /* 제목 — 쌍둥이 둘이라 두 단어를 딸기색·민트색으로 */
  .topbar .logo{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;
    font-size:clamp(22px,4.6vw,32px);letter-spacing:.01em;white-space:nowrap;}
  .logo .t1{color:var(--berry-deep);}
  .logo .t2{color:var(--mint-deep);}
  .logo-sub{display:none;}
  /* 홈 화면에서는 로고처럼 크게 */
  .topbar.home{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:12px;}
  .topbar.home .logo{font-size:clamp(34px,8.4vw,54px);
    text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,
                0 5px 10px rgba(214,150,166,.30);}
  .topbar.home .logo-sub{display:block;font-family:var(--display);font-size:16px;
    letter-spacing:.14em;color:var(--cocoa-soft);margin:3px 0 0 .14em;white-space:nowrap;}
  .topbar.home .datechip{display:none;}      /* 홈에서는 인사 카드에 날짜·날씨가 이미 있다 */
  @media (max-width:430px){
    .whoami b{display:none;}                /* 좁은 화면에서는 아바타만 — 제목이 가운데에 남도록 */
    .whoami{padding:5px;}
  }
  .homebtn{width:48px;height:48px;border-radius:50%;background:var(--surface);
    border:2px solid var(--blush);box-shadow:var(--shadow);font-size:22px;
    display:grid;place-items:center;flex:none;transition:transform .12s;}
  .homebtn:active{transform:scale(.9);}
  .kidcard.addkid{border:3px dashed var(--blush);box-shadow:none;background:transparent;}
  .kidcard.addkid .av{font-family:var(--display);font-size:38px;color:var(--cocoa-soft);}
  .whoami{display:flex;align-items:center;gap:8px;background:var(--surface);
    border:2px solid var(--blush);border-radius:999px;padding:5px 13px 5px 6px;box-shadow:var(--shadow);min-height:44px;}
  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;}
  .whoami b{font-family:var(--display);font-size:19px;font-weight:700;}

  nav.tabs{
    display:flex;background:var(--surface);border-top:2px solid var(--blush);
    padding-bottom:env(safe-area-inset-bottom,0px);z-index:30;
  }
  nav.tabs button{
    flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-family:var(--display);font-size:16px;font-weight:700;color:var(--cocoa-soft);
    border-top:4px solid transparent;margin-top:-2px;padding:6px 2px;
  }
  nav.tabs button .ico{font-size:21px;line-height:1;}
  nav.tabs button[aria-current="true"]{color:var(--berry-deep);border-top-color:var(--berry);}

  /* ---------- pieces ---------- */
  .card{background:var(--surface);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--shadow);}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .grow{flex:1;min-width:0;}
  h2.sec{font-family:var(--display);font-size:24px;margin:2px 0 10px;}
  h3.sub{font-family:var(--display);font-size:20px;margin:0 0 8px;}
  .muted{color:var(--cocoa-soft);font-size:14px;}
  .big{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums;}

  .btn{
    min-height:52px;padding:0 20px;border-radius:999px;background:var(--berry);color:#fff;
    font-family:var(--display);font-size:20px;font-weight:700;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s;
  }
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--surface);color:var(--cocoa);border:2px solid var(--blush);box-shadow:none;}
  .btn.mint{background:var(--mint-deep);}
  .btn.wide{width:100%;}
  .btn.sm{min-height:42px;font-size:17px;padding:0 15px;}
  .btn[disabled]{opacity:.45;box-shadow:none;}

  .chip{
    min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--blush);
    background:var(--surface);font-family:var(--display);font-size:18px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--berry-soft);border-color:var(--berry);color:var(--berry-deep);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}

  .field{width:100%;min-height:52px;border-radius:var(--r-md);border:2px solid var(--blush);
    background:var(--surface);padding:10px 14px;font-size:17px;}
  .field:focus{border-color:var(--berry);}

  .banner{border-radius:var(--r-md);padding:11px 14px;font-size:14px;display:flex;gap:9px;align-items:flex-start;}
  .banner.warn{background:var(--butter);color:#6a4a10;}
  .banner.info{background:var(--mint-soft);color:#215a49;}

  .empty{text-align:center;padding:30px 16px;}
  .empty .face{font-size:44px;}
  .empty p{margin:8px 0 14px;color:var(--cocoa-soft);}

  /* ---------- today ---------- */
  .todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--blush);}
  .todo:last-child{border-bottom:0;}
  .tick{width:46px;height:46px;border-radius:50%;border:3px solid var(--blush);background:var(--surface);
    display:grid;place-items:center;font-size:23px;flex:none;transition:transform .15s;}
  .tick[aria-pressed="true"]{background:var(--mint);border-color:var(--mint-deep);}
  .tick:active{transform:scale(.9);}
  .todo .name{font-size:17px;}
  .todo.done .name{color:var(--cocoa-soft);text-decoration:line-through;}
  .timer{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;color:var(--berry-deep);min-width:52px;text-align:right;}

  .weekstrip{display:flex;gap:6px;justify-content:space-between;}
  .weekstrip div{flex:1;text-align:center;}
  .weekstrip .dot{height:38px;border-radius:12px;background:var(--blush);display:grid;place-items:center;font-size:19px;}
  .weekstrip .dot.on{background:var(--berry-soft);}
  .weekstrip .dot.today{outline:3px solid var(--berry);outline-offset:1px;}
  .weekstrip small{font-size:12px;color:var(--cocoa-soft);}

  /* ---------- shelf ---------- */
  /* 책탑은 좌우로 밀지 않고 한 화면에 모두 보이도록 줄바꿈 격자 */
  .towers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;align-items:end;}
  @media (max-width:430px){ .towers{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:1120px){ .towers{grid-template-columns:repeat(6,1fr);} }
  .tower{display:flex;flex-direction:column;justify-content:flex-end;min-width:0;}
  .tower .spines{display:flex;flex-direction:column-reverse;gap:3px;min-height:76px;justify-content:flex-start;}
  .spine{
    border-radius:5px 7px 7px 5px;display:flex;align-items:center;justify-content:center;
    padding:0 9px;color:#4A3036;cursor:pointer;overflow:hidden;
    box-shadow:inset 3px 0 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(90,50,60,.10);
  }
  /* 제목은 가운데 정렬. 길면 글자 크기를 줄여 책등 안에 딱 맞춘다(fitSpines) */
  .spine .t{
    display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-align:center;font-size:13px;line-height:1.2;letter-spacing:-.01em;
  }
  .spine.fresh{animation:drop .55s cubic-bezier(.3,1.5,.5,1);}
  @keyframes drop{from{transform:translateY(-52px);opacity:0}to{transform:none;opacity:1}}
  .ribbon{height:7px;border-radius:4px;background:var(--butter);
    box-shadow:inset 0 -2px 0 rgba(150,100,10,.18);}
  .tower .ghostbox{border:2px dashed var(--blush);border-radius:8px;height:64px;
    display:grid;place-items:center;font-size:13px;color:var(--cocoa-soft);}
  .plank{height:12px;border-radius:0 0 7px 7px;background:linear-gradient(180deg,#F0D3D9,#E4BFC7);
    box-shadow:0 5px 10px rgba(198,150,162,.30);margin-top:4px;}
  .tower .label{font-family:var(--display);font-size:19px;text-align:center;margin-top:8px;}
  .tower .count{font-size:13px;color:var(--cocoa-soft);text-align:center;}

  .covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
  .cover{aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--blush);
    display:grid;place-items:center;text-align:center;font-size:12px;padding:6px;box-shadow:var(--shadow);}
  .cover img{width:100%;height:100%;object-fit:cover;}

  /* ---------- words ---------- */
  .wordcard{border:2px solid var(--blush);border-radius:var(--r-md);padding:13px 14px;}
  .wordcard .term{font-family:var(--display);font-size:27px;line-height:1.1;}
  .boxdots{display:flex;gap:3px;}
  .boxdots i{width:8px;height:8px;border-radius:50%;background:var(--blush);display:block;}
  .boxdots i.on{background:var(--berry);}
  .flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;}
  .flash .term{font-family:var(--display);font-size:42px;}

  /* ---------- versus ---------- */
  .vsrow{display:grid;grid-template-columns:1fr 66px 1fr;align-items:center;gap:9px;margin-bottom:13px;}
  .bar{height:30px;border-radius:999px;background:var(--blush);overflow:hidden;display:flex;}
  .bar.l{justify-content:flex-end;}
  .bar span{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.3,1.2,.5,1);}
  .vslabel{font-family:var(--display);font-size:17px;text-align:center;color:var(--cocoa-soft);}
  .vsnum{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;}
  .badge{border-radius:var(--r-md);padding:11px;text-align:center;background:var(--butter);}
  .badge .b{font-family:var(--display);font-size:19px;}
  .gauge{height:26px;border-radius:999px;background:var(--blush);overflow:hidden;}
  .gauge span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--butter),var(--berry));}

  /* ---------- games ---------- */
  .lock{text-align:center;padding:26px 16px;}
  .lock .big-lock{font-size:60px;}
  .memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:420px;margin:0 auto;}
  .memcard{aspect-ratio:1;border-radius:var(--r-sm);background:var(--berry);display:grid;place-items:center;
    font-size:30px;box-shadow:var(--shadow);transition:transform .2s;}
  .memcard.flipped{background:var(--surface);border:2px solid var(--blush);}
  .memcard.matched{background:var(--mint-soft);border:2px solid var(--mint-deep);}
  .memcard:active{transform:scale(.94);}
  #starcanvas{width:100%;max-width:460px;aspect-ratio:3/4;border-radius:var(--r-md);background:#FFF3F6;
    display:block;margin:0 auto;touch-action:none;box-shadow:var(--shadow);}
  .matchcol{display:flex;flex-direction:column;gap:8px;}
  .matchbtn{min-height:54px;border-radius:var(--r-md);border:2px solid var(--blush);background:var(--surface);
    padding:6px 10px;font-size:15px;text-align:center;}
  .matchbtn[aria-pressed="true"]{background:var(--berry-soft);border-color:var(--berry);}
  .matchbtn.gone{opacity:.25;}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(74,48,54,.45);z-index:60;display:flex;
    align-items:flex-end;justify-content:center;padding:0;}
  .sheet{background:var(--cream);width:100%;max-width:640px;border-radius:26px 26px 0 0;
    padding:18px 17px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;
    animation:up .26s cubic-bezier(.2,1.1,.4,1);}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  /* 패드처럼 넓은 화면에서는 아래 시트가 아니라 한가운데 카드로 */
  @media (min-width:700px){
    .modal{align-items:center;padding:24px;}
    .sheet{border-radius:24px;max-width:500px;max-height:78vh;padding:18px 18px 18px;}
  }
  /* 창 안은 한 단계 촘촘하게 — 부모님 관리처럼 내용이 많은 창이 덜 커 보이도록 */
  .sheet h3{font-size:22px;}
  .sheet .card{padding:13px 14px;border-radius:18px;box-shadow:0 3px 10px rgba(214,150,166,.12);}
  .sheet .sub{font-size:18px;}
  .sheet .chip{min-height:38px;font-size:16px;padding:0 12px;}
  .sheet .field{min-height:46px;font-size:16px;}
  .sheet .btn{min-height:46px;font-size:18px;}
  .sheet .btn.sm{min-height:38px;font-size:16px;}
  .sheet .daypick button{width:36px;height:36px;font-size:15px;}
  .sheet .pinpad button{min-height:54px;}
  .sheet h3{font-family:var(--display);font-size:25px;margin:0 0 4px;}
  .sheet .close{position:absolute;right:14px;top:10px;}
  .scanview{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-md);
    overflow:hidden;background:#2b2226;}
  .scanview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .scanview canvas{display:none;}               /* Quagga가 그리는 판독 보조 화면은 숨긴다 */
  .scanframe{position:absolute;left:12%;right:12%;top:30%;bottom:30%;z-index:2;
    border:3px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 0 0 999px rgba(43,34,38,.35);}
  .scanframe i{position:absolute;left:6%;right:6%;top:50%;height:3px;border-radius:2px;
    background:var(--berry);box-shadow:0 0 10px var(--berry);animation:scanline 1.6s ease-in-out infinite;}
  @keyframes scanline{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto;}
  .pinpad button{min-height:60px;border-radius:var(--r-md);background:var(--surface);
    border:2px solid var(--blush);font-family:var(--display);font-size:27px;}
  .pindots{display:flex;gap:11px;justify-content:center;margin:12px 0;}
  .pindots i{width:16px;height:16px;border-radius:50%;background:var(--blush);display:block;}
  .pindots i.on{background:var(--berry);}

  /* ---------- 시작 화면 ---------- */
  .gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:26px 16px;}

  /* 다꾸 컨셉 — 연분홍 모눈종이 위에 스티커가 붙어 있다 */
  .gatebg{position:relative;min-height:100%;overflow:hidden;
    background-color:var(--cream);
    background-image:
      linear-gradient(rgba(255,143,168,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,143,168,.13) 1px, transparent 1px);
    background-size:26px 26px;background-position:-1px -1px;}
  .gatebg > .gate{position:relative;z-index:1;}
  .decor{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .stk{position:absolute;overflow:visible;
    transform:translate(-50%,-50%) rotate(var(--r,0deg));
    /* 흰 테두리 다이컷 스티커 + 살짝 뜬 그림자 */
    filter:
      drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff)
      drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)
      drop-shadow(0 5px 6px rgba(190,120,140,.28));}
  .stk.bob{animation:stk-bob 6s ease-in-out infinite;will-change:transform;}
  @keyframes stk-bob{
    0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg))}
    50%{transform:translate(-50%,calc(-50% - 7px)) rotate(calc(var(--r,0deg) + 4deg))}}
  .stk{font-family:var(--display);}          /* 스티커 속 글자(D, 그림책)도 손글씨체로 */
  .stk.keyring{transform-origin:50% 12%;}    /* 키링은 고리를 축으로 흔들린다 */
  @media (max-width:700px){
    .stk{width:calc(var(--s) * .64) !important;height:calc(var(--s) * .64) !important;}
    .stk.keyring{height:calc(var(--s) * .832) !important;}
    .stk.wide{display:none;}
  }

  /* ---------- 홈 화면 아래에 늘 붙어 있는 부모님 관리 버튼 ---------- */
  .gatebg{padding-bottom:96px;}                 /* 버튼에 가려지지 않게 */
  .parentbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, rgba(255,249,245,.98) 62%, rgba(255,249,245,0));}
  .parentbtn{width:100%;max-width:440px;min-height:62px;display:flex;align-items:center;gap:12px;
    background:var(--surface);border:3px solid var(--berry);border-radius:999px;
    padding:8px 18px 8px 9px;box-shadow:var(--shadow-lift);text-align:left;transition:transform .12s;}
  .parentbtn:active{transform:scale(.97);}
  .pb-lock{width:44px;height:44px;border-radius:50%;background:var(--berry-soft);
    display:grid;place-items:center;font-size:21px;flex:none;}
  .pb-text{flex:1;display:flex;flex-direction:column;line-height:1.25;}
  .pb-text b{font-family:var(--display);font-size:21px;}
  .pb-text small{font-size:13px;color:var(--cocoa-soft);}
  .pb-go{font-family:var(--display);font-size:30px;color:var(--berry-deep);line-height:1;}

  /* ---------- (이전) 홈 하단 부모님 관리 ---------- */
  .parentpanel{width:100%;max-width:620px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;
    background:rgba(255,255,255,.92);border:2px dashed var(--blush);border-radius:22px;
    padding:14px 16px;margin-top:6px;}
  .pp-lock{width:48px;height:48px;border-radius:50%;background:var(--blush);display:grid;place-items:center;
    font-size:22px;flex:none;}
  .pp-title{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;}
  .pp-sub{font-size:13px;color:var(--cocoa-soft);}
  @media (max-width:430px){ .parentpanel .btn{width:100%;} }

  /* 알림 연결 단계 */
  .tgstep{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--blush);}
  .tgstep:first-of-type{border-top:0;}
  .tgnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--berry);color:#fff;
    font-family:var(--display);font-weight:700;display:grid;place-items:center;}
  .qrbox{width:180px;max-width:100%;margin:10px auto 0;background:#fff;border-radius:14px;padding:8px;
    border:2px solid var(--blush);}
  .qrbox svg{display:block;width:100%;height:auto;}

  /* ---------- 다꾸 메모지 — 오늘의 응원 ---------- */
  .memo{position:relative;width:100%;max-width:440px;margin-top:-4px;
    transform:rotate(-1.6deg);border-radius:6px 6px 16px 6px;
    padding:22px 46px 16px 46px;text-align:center;
    background-color:#FFFDF6;
    background-image:
      linear-gradient(90deg, transparent 32px, rgba(255,143,168,.45) 32px, rgba(255,143,168,.45) 34px, transparent 34px),
      repeating-linear-gradient(transparent 0 29px, rgba(157,187,234,.35) 29px 30px);
    background-position:0 0, 0 14px;
    box-shadow:0 10px 24px rgba(190,120,140,.20), 0 1px 0 rgba(255,255,255,.9) inset;}
  .memo::before{content:'';position:absolute;top:-13px;left:50%;width:108px;height:26px;
    transform:translateX(-50%) rotate(3deg);border-radius:3px;opacity:.9;
    background:repeating-linear-gradient(90deg,#FFE79C 0 10px,#FFF1D6 10px 20px);
    box-shadow:0 2px 4px rgba(150,100,110,.12);}
  .memo::after{content:'';position:absolute;right:0;bottom:0;width:26px;height:26px;
    background:linear-gradient(135deg,#FFFDF6 50%,#F3DDE2 50%);border-radius:0 0 16px 0;
    box-shadow:-2px -2px 3px rgba(150,100,110,.08);}
  .memo-head{font-family:var(--display);font-size:17px;color:var(--berry-deep);line-height:30px;}
  .memo-text{font-family:var(--display);font-size:25px;line-height:30px;margin:0;color:var(--cocoa);
    text-wrap:balance;}
  .memo-sign{font-family:var(--display);font-size:17px;color:var(--cocoa-soft);text-align:center;
    line-height:30px;margin-top:2px;}

  /* 인사 카드를 붙여둔 마스킹테이프 */
  .hero{position:relative;}
  .hero::before,.hero::after{content:'';position:absolute;top:-11px;width:74px;height:22px;z-index:2;
    border-radius:3px;opacity:.88;box-shadow:0 2px 4px rgba(150,100,110,.12);}
  .hero::before{left:16px;transform:rotate(-8deg);
    background:repeating-linear-gradient(45deg,#FFC2CE 0 8px,#FFE3EA 8px 16px);}
  .hero::after{right:16px;transform:rotate(7deg);
    background:repeating-linear-gradient(-45deg,#BFE7D2 0 8px,#E2F7EF 8px 16px);}
  .hero{width:100%;max-width:440px;text-align:center;}
  .hero .sky{
    border-radius:26px;padding:16px 18px 14px;position:relative;overflow:hidden;
    background:linear-gradient(170deg,#FFE9F0 0%,#FFF4E8 55%,#E9F8F1 100%);
    box-shadow:var(--shadow-lift);
  }
  .hero .sky::after{
    content:'';position:absolute;inset:auto -30px -60px -30px;height:120px;border-radius:50%;
    background:rgba(255,255,255,.55);
  }
  .hero .datewrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;}
  .hero .dateline{font-family:var(--display);font-size:16px;color:var(--cocoa);}
  .wbtn{border-radius:999px;background:rgba(255,255,255,.8);border:2px solid rgba(255,255,255,.9);
    padding:2px 11px 2px 8px;font-family:var(--display);font-size:15px;min-height:32px;display:inline-flex;align-items:center;gap:4px;}
  .hero .greet{position:relative;z-index:1;font-family:var(--display);font-size:24px;line-height:1.2;margin:6px 0 2px;}
  .hero .cheer{position:relative;z-index:1;font-size:16px;color:#7B5760;margin:0;}
  .hero .doodle{position:relative;z-index:1;font-size:24px;margin-top:4px;}

  .kidpick{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .kidcard{width:168px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-lift);
    padding:20px 12px 16px;text-align:center;transition:transform .15s;border:3px solid transparent;}
  .kidcard:active{transform:scale(.95);}
  .kidcard .av{width:76px;height:76px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;font-size:40px;}
  .kidcard .nm{font-family:var(--display);font-size:25px;}
  .kidcard .mini{display:flex;justify-content:center;gap:10px;margin-top:7px;font-size:13px;color:var(--cocoa-soft);}
  .kidcard .ring{height:8px;border-radius:999px;background:var(--blush);margin-top:10px;overflow:hidden;}
  .kidcard .ring span{display:block;height:100%;border-radius:999px;}

  .weatherpick{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  .weatherpick button{width:82px;height:82px;border-radius:22px;border:2px solid var(--blush);
    background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:30px;}
  .weatherpick button span{font-size:13px;font-family:var(--display);}
  .weatherpick button[aria-pressed="true"]{background:var(--berry-soft);border-color:var(--berry);}

  /* 승인 요청 알림 */
  .askcard{border-radius:22px;padding:15px 16px;background:var(--butter);color:#67480C;
    box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;}
  .askcard .bell{font-size:30px;animation:ring 1.6s ease-in-out infinite;}
  @keyframes ring{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(13deg)}90%{transform:rotate(-13deg)}}
  .dot-badge{display:inline-block;min-width:20px;height:20px;border-radius:999px;background:var(--berry-deep);
    color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px;margin-left:5px;}
  .waiting{display:flex;gap:5px;justify-content:center;margin:10px 0;}
  .waiting i{width:11px;height:11px;border-radius:50%;background:var(--berry);animation:bob 1.1s infinite;}
  .waiting i:nth-child(2){animation-delay:.15s} .waiting i:nth-child(3){animation-delay:.3s}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}

  /* 상단 날짜 칩 */
  .topbar .stack-t{grid-column:2;display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:2px;min-width:0;}
  .datechip{justify-content:center;}
  .datechip{font-size:13px;color:var(--cocoa-soft);display:inline-flex;align-items:center;gap:4px;
    background:none;padding:0;text-align:left;}

  /* ---------- 🎯 반짝 새총 (전체 화면) ---------- */
  .newtag{font-size:12px;font-family:var(--body);font-weight:700;color:#fff;background:var(--berry);
    border-radius:999px;padding:1px 8px;margin-left:4px;}
  .sling{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;gap:8px;
    background:#1b1733;color:#FFF1F4;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));
    touch-action:none;user-select:none;-webkit-user-select:none;}
  .sl-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:58px;}
  /* 오른쪽 위에 늘 있는 ✕ — 누르면 바로 끝나지 않고 한 번 묻는다 */
  .sl-x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:5;
    width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.35);color:#fff;font-size:22px;font-weight:700;
    display:grid;place-items:center;line-height:1;}
  .sl-x:active{transform:scale(.92);}
  .sl-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;}
  .sl-title b{font-family:var(--display);font-size:21px;}
  .sl-title span{font-size:13px;color:#cdbfe0;}
  .sl-score{font-family:var(--display);font-size:22px;display:flex;align-items:baseline;gap:6px;}
  .sl-score small{font-family:var(--body);font-size:12px;color:#cdbfe0;}
  .sl-time{font-family:var(--display);font-size:18px;color:#FFE79C;font-variant-numeric:tabular-nums;}
  .sl-btn{min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);
    border:1.5px solid rgba(255,255,255,.22);color:#fff;font-family:var(--display);font-size:16px;font-weight:700;}
  .sl-btn:active{transform:scale(.95);}
  .sl-btn[disabled]{opacity:.5;}
  .sl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;
    background:rgba(255,255,255,.07);border-radius:16px;padding:7px 9px;}
  .sl-ammo{display:flex;gap:5px;}
  .sl-ammo i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.14);display:block;}
  .sl-ammo i.on{background:#FFD98E;box-shadow:0 0 8px #FFE79C;}
  .sl-weapons{display:flex;gap:5px;flex-wrap:wrap;}
  .sl-w{min-height:38px;padding:0 10px;border-radius:999px;background:transparent;color:#e7dcf3;
    border:1.5px solid rgba(255,255,255,.18);font-size:14px;font-weight:700;}
  .sl-w[aria-pressed="true"]{background:#FF8FA8;border-color:#FF8FA8;color:#fff;}
  .sl-tools{display:flex;gap:6px;}
  .sl-coach{font-size:14px;color:#FFE3EA;text-align:center;min-height:20px;}
  .sl-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;}
  #slCanvas{display:block;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);touch-action:none;}
  .sl-cam{position:absolute;top:8px;right:8px;width:150px;background:rgba(20,16,40,.85);border-radius:12px;
    padding:5px;border:1.5px solid rgba(255,255,255,.2);}
  .sl-cam canvas{width:100%;height:auto;display:block;border-radius:8px;background:#000;}
  .sl-cam span{display:block;font-size:11px;text-align:center;margin-top:3px;color:#FFE3EA;}
  .sl-card{position:absolute;inset:0;margin:auto;width:min(340px,90%);height:fit-content;
    background:var(--cream);color:var(--cocoa);border-radius:24px;padding:20px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.4);animation:cp-in .45s cubic-bezier(.2,1.6,.4,1) both;}
  .sl-card h3{font-family:var(--display);font-size:28px;margin:4px 0;}
  .sl-card p{margin:0 0 14px;font-size:15px;}
  @media (max-width:600px){
    .sl-weapons{order:3;width:100%;justify-content:center;}
    .sl-w{font-size:13px;padding:0 8px;}
    .sl-title b{font-size:18px;}
  }

  /* ---------- 할 일 완료 응원 팝업 ---------- */
  .cheer-pop{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
    pointer-events:none;padding:0 16px;}
  .cp-card{pointer-events:auto;position:relative;background:var(--surface);border:4px solid var(--berry);
    border-radius:30px;padding:20px 28px 18px;text-align:center;max-width:340px;width:100%;
    box-shadow:0 18px 40px rgba(214,120,146,.35);animation:cp-in .5s cubic-bezier(.2,1.6,.4,1) both;}
  .cheer-pop.finale .cp-card{border-color:var(--mint-deep);background:linear-gradient(170deg,#FFFFFF,#E9F8F1);}
  .cheer-pop.out .cp-card{animation:cp-out .3s ease-in both;}
  .cp-emoji{font-size:58px;line-height:1;display:inline-block;animation:cp-bounce .9s ease-in-out infinite;}
  .cheer-pop.finale .cp-emoji{font-size:70px;}
  .cp-title{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.2;margin-top:8px;color:var(--berry-deep);}
  .cheer-pop.finale .cp-title{color:var(--mint-deep);font-size:32px;}
  .cp-sub{font-size:16px;color:var(--cocoa);margin-top:6px;}
  .cp-dots{display:flex;gap:6px;justify-content:center;margin-top:11px;}
  .cp-dots i{width:13px;height:13px;border-radius:50%;background:var(--blush);display:block;}
  .cp-dots i.on{background:var(--berry);}
  .cheer-pop.finale .cp-dots i.on{background:var(--mint-deep);}
  .cp-spark{position:absolute;left:50%;top:38%;font-size:20px;pointer-events:none;
    animation:cp-spark .9s ease-out forwards;}
  @keyframes cp-in{from{transform:scale(.4) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  @keyframes cp-out{to{transform:scale(.85) translateY(-14px);opacity:0}}
  @keyframes cp-bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
  @keyframes cp-spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1);opacity:0}}

  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;
    background:var(--cocoa);color:#fff;padding:12px 20px;border-radius:999px;
    font-size:15px;box-shadow:var(--shadow-lift);animation:up .24s ease;max-width:90vw;text-align:center;}

  .daypick{display:flex;gap:5px;flex-wrap:wrap;}
  .daypick button{width:40px;height:40px;border-radius:50%;border:2px solid var(--blush);
    background:var(--surface);font-family:var(--display);font-size:17px;font-weight:700;
    display:grid;place-items:center;padding:0;}
  .daypick button[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:#fff;}
  .daypick .all{width:auto;padding:0 13px;border-radius:999px;font-size:16px;}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
  .confetti i{position:absolute;width:10px;height:14px;border-radius:2px;animation:fall 1.7s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(640deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
  @media (max-width:420px){
    .tower{width:144px;}
    nav.tabs button{font-size:14px;}
  }

  /* ---------- 🦜 뚜뚜 스피치 교실 ---------- */
  .tt{display:block;overflow:visible;animation:tt-bob 3.2s ease-in-out infinite;}
  @keyframes tt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .tt .tt-eyes-happy,.tt .tt-eyes-up,.tt .tt-listen,.tt .tt-think,.tt .tt-cheer{display:none;}
  .tt[data-mood="happy"] .tt-eyes-open,.tt[data-mood="cheer"] .tt-eyes-open,.tt[data-mood="think"] .tt-eyes-open{display:none;}
  .tt[data-mood="happy"] .tt-eyes-happy,.tt[data-mood="cheer"] .tt-eyes-happy{display:inline;}
  .tt[data-mood="think"] .tt-eyes-up,.tt[data-mood="think"] .tt-think{display:inline;}
  .tt[data-mood="listen"] .tt-listen{display:inline;}
  .tt[data-mood="cheer"] .tt-cheer{display:inline;}
  .tt .tt-wing-l,.tt .tt-wing-r{transition:transform .35s cubic-bezier(.3,1.4,.5,1);}
  .tt[data-mood="cheer"] .tt-wing-l{transform:rotate(110deg);}
  .tt[data-mood="cheer"] .tt-wing-r{transform:rotate(-110deg);}
  .tt.talk .tt-jaw{animation:tt-jaw .16s ease-in-out infinite alternate;}
  @keyframes tt-jaw{from{transform:scaleY(1)}to{transform:scaleY(1.9)}}
  .tt[data-mood="listen"] .tt-listen path{animation:tt-wave 1s ease-in-out infinite;}
  @keyframes tt-wave{0%,100%{opacity:.25}50%{opacity:1}}

  /* 수업 화면 — 5초 동기화에 지워지지 않도록 화면 위에 따로 띄운다 (새총 게임과 같은 방식) */
  .ttl{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
    background-color:var(--cream);
    background-image:linear-gradient(rgba(255,143,168,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,143,168,.10) 1px,transparent 1px);
    background-size:26px 26px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .ttl-top{display:flex;align-items:center;gap:10px;max-width:680px;width:100%;margin:0 auto;}
  .ttl-x{width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--blush);
    font-size:20px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow);}
  .ttl-dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
  .ttl-dots i{width:12px;height:12px;border-radius:50%;background:var(--blush);display:block;transition:transform .2s;}
  .ttl-dots i.on{background:var(--mint-deep);}
  .ttl-dots i.now{background:var(--berry);transform:scale(1.3);}
  .ttl-chip{font-family:var(--display);font-size:17px;font-weight:700;background:var(--butter);color:#6a4a10;
    border-radius:999px;padding:4px 12px;white-space:nowrap;}
  .ttl-body{flex:1;width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:8px;}
  .tt-teach{display:flex;align-items:flex-end;gap:8px;}
  .tt-teach .tt{width:112px;height:112px;flex:none;}
  .tt-bubble{position:relative;flex:1;background:var(--surface);border:3px solid var(--mint);
    border-radius:22px 22px 22px 6px;padding:12px 15px;font-family:var(--display);font-size:22px;line-height:1.3;
    box-shadow:var(--shadow);margin-bottom:24px;}
  .tt-bubble::before{content:'';position:absolute;left:-15px;bottom:8px;border:8px solid transparent;border-right:12px solid var(--mint);}
  .tt-card{background:var(--surface);border-radius:26px;padding:18px 18px 16px;box-shadow:var(--shadow-lift);}
  .tt-num{font-family:var(--display);font-size:16px;color:var(--cocoa-soft);}
  .tt-en{font-size:clamp(24px,5.4vw,34px);font-weight:700;line-height:1.4;color:var(--cocoa);margin:6px 0 4px;
    letter-spacing:-.01em;word-break:normal;}
  .tt-en .w{border-radius:6px;padding:0 1px;transition:background .15s;}
  .tt-en .w.on{background:var(--butter);}
  .tt-en .st{color:var(--berry-deep);}
  .tt-en .hide{color:#E7C9D0;letter-spacing:.04em;}
  .tt-en .miss{background:#FFEBC9;border-bottom:3px dotted var(--butter-deep);cursor:pointer;}
  .tt-en .ok{color:var(--mint-deep);}
  .tt-ko{font-size:19px;color:var(--cocoa);margin:2px 0 0;}
  .tt-cue{font-size:46px;line-height:1.1;margin:4px 0;}
  .tt-stage{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:17px;font-weight:700;
    border-radius:999px;background:var(--mint-soft);color:#215a49;padding:4px 12px;}
  .tt-mic{width:112px;height:112px;border-radius:50%;background:var(--berry);color:#fff;font-size:46px;
    display:grid;place-items:center;margin:8px auto 4px;box-shadow:0 10px 24px rgba(232,92,124,.35);transition:transform .12s;}
  .tt-mic:active{transform:scale(.94);}
  .tt-mic.rec{background:var(--berry-deep);animation:tt-pulse 1.1s ease-in-out infinite;}
  @keyframes tt-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,92,124,.45)}50%{box-shadow:0 0 0 18px rgba(232,92,124,0)}}
  .tt-level{height:12px;border-radius:999px;background:var(--blush);overflow:hidden;max-width:260px;margin:8px auto 0;}
  .tt-level span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--butter),var(--berry));
    transition:width .08s;}
  .tt-stars{display:flex;gap:6px;justify-content:center;font-size:48px;line-height:1;margin:2px 0 6px;}
  .tt-stars span{animation:tt-star .5s cubic-bezier(.2,1.6,.4,1) both;}
  .tt-stars span:nth-child(2){animation-delay:.12s} .tt-stars span:nth-child(3){animation-delay:.24s}
  .tt-stars span.off{filter:grayscale(1);opacity:.28;}
  @keyframes tt-star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
  .tt-tip{background:var(--butter);color:#5d3f0c;border-radius:18px;padding:12px 14px;font-size:17px;
    display:flex;gap:9px;align-items:flex-start;text-align:left;}
  .tt-tip b{font-family:var(--display);font-size:19px;display:block;}
  .tt-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .tt-badge{font-size:14px;border-radius:999px;padding:5px 11px;background:var(--mint-soft);color:#215a49;font-weight:700;}
  .tt-badge.try{background:var(--berry-soft);color:var(--berry-deep);}
  .tt-wave{width:100%;height:74px;display:block;background:#FFFDF6;border-radius:14px;border:2px solid var(--blush);}
  .tt-heard{font-size:15px;color:var(--cocoa-soft);margin:0;}
  .tt-foot{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
  .tt-foot .btn{flex:1 1 150px;}
  .tt-speed{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .tt-big-time{font-family:var(--display);font-size:64px;text-align:center;font-variant-numeric:tabular-nums;line-height:1;}
  .tt-cuestrip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tt-cuestrip span{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--cocoa-soft);}
  .tt-cuestrip span b{font-size:30px;font-weight:400;line-height:1.1;}
  .tt-mini{display:flex;align-items:center;gap:12px;}
  .tt-mini .tt{width:76px;height:76px;flex:none;}
  .tt-mission{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px;}
  .tt-mission span{font-size:14px;border-radius:999px;padding:4px 10px;background:var(--blush);}
  .tt-mission span.ok{background:var(--mint-soft);color:#215a49;}
  .tt-sent{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--blush);}
  .tt-sent:last-child{border-bottom:0;}
  .tt-sent .row .field{min-height:42px;font-size:15px;padding:8px 11px;}
  .tt-count{font-family:var(--display);font-size:120px;text-align:center;line-height:1;color:var(--berry-deep);
    animation:tt-star .5s cubic-bezier(.2,1.6,.4,1) both;}
  @media (min-width:900px){ .ttl-body{max-width:760px;} .tt-teach .tt{width:132px;height:132px;} }
  @media (max-width:430px){
    .tt-teach .tt{width:88px;height:88px;}
    .tt-bubble{font-size:19px;padding:10px 12px;}
    .tt-mic{width:98px;height:98px;font-size:40px;}
  }
</style>

function uid(){
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  // 구형 브라우저용 UUID v4 대체
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
  if (h) return `${h}시간 ${m}분`;
  if (m) return `${m}분`;
  return `${sec}초`;
}

/* 이름 뒤 조사를 받침에 맞춰 붙인다 — "하윤이가" / "나리가" */
function hasJong(name){
  const s = String(name||'').trim();
  if (!s) return false;
  const c = s.charCodeAt(s.length-1);
  if (c < 0xAC00 || c > 0xD7A3) return false;     // 한글이 아니면 받침 없는 걸로
  return (c - 0xAC00) % 28 > 0;
}
const subj = name => `${name}${hasJong(name) ? '이가' : '가'}`;   // ~이/가
const topic = name => `${name}${hasJong(name) ? '이는' : '는'}`;  // ~이/는

/* ---------- 할 일 하나 끝낼 때마다 응원 ----------
   {call} = 서윤아, {subj} = 서윤이가, {done} = 끝낸 개수. 같은 말이 연달아 나오지 않게 한다. */
const CHEER_LINES = [

let lastCheer = -1;

function cheerDone(){
  const k = curKid(); if (!k) return;
  const list = todosFor(S.kidId);
  const done = doneCount(S.kidId, todayKey());
  const left = list.length - done;
  const fill = s => s.replace(/\{call\}/g, callName(k.name)).replace(/\{subj\}/g, subj(k.name)).replace(/\{done\}/g, done);
  const dots = list.length <= 10
    ? `<div class="cp-dots">${list.map((_,i)=>`<i class="${i<done?'on':''}"></i>`).join('')}</div>` : '';

  if (list.length && left === 0){
    cheerPopup({
      emoji:'🏆', finale:true,
      title:'오늘 할 일 모두 끝!',
      sub:`${callName(k.name)}, 정말 대단해! 놀이를 열어달라고 해볼까?`,
      dots
    });
    confetti();
    return;
  }

  let i;
  do { i = Math.floor(Math.random() * CHEER_LINES.length); } while (i === lastCheer && CHEER_LINES.length > 1);
  lastCheer = i;
  const c = CHEER_LINES[i];
  cheerPopup({
    emoji:c.e, title:fill(c.t),
    sub:`${fill(c.s)}${left > 0 ? ` · 이제 ${left}개 남았어요` : ''}`,
    dots
  });
}

function cheerPopup({ emoji, title, sub, dots, finale }){
  document.querySelectorAll('.cheer-pop').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'cheer-pop' + (finale ? ' finale' : '');
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  const sparks = ['⭐','✨','💗','🌟','💖','✨'].map((s, n) => {
    const a = (n / 6) * Math.PI * 2, r = 120 + (n % 2) * 30;
    return `<span class="cp-spark" style="--dx:${Math.round(Math.cos(a)*r)}px;--dy:${Math.round(Math.sin(a)*r)}px;animation-delay:${n*40}ms">${s}</span>`;
  }).join('');
  el.innerHTML = `<div class="cp-card">${sparks}
    <div class="cp-emoji">${emoji}</div>
    <div class="cp-title">${esc(title)}</div>
    ${sub ? `<div class="cp-sub">${esc(sub)}</div>` : ''}
    ${dots || ''}
  </div>`;
  const close = () => {
    if (!el.isConnected) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  };
  el.querySelector('.cp-card').addEventListener('click', close);   // 눌러서 바로 닫기
  document.body.appendChild(el);
  setTimeout(close, finale ? 3400 : 2000);
}

   13px에서 시작해 0.5px씩 줄이고, 9px보다 작아지면 멈추고 말줄임표로 넘긴다. */
function fitSpines(){
  document.querySelectorAll('.spine .t').forEach(el => {
    const avail = el.parentElement.clientWidth - 18;   // 좌우 패딩 9px씩
    if (avail <= 0) return;
    let size = 13;
    el.style.fontSize = size + 'px';
    while (size > 9 && el.scrollWidth > avail){
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
  });
}

/* 가족 ID — 주소(#f=...)에 있으면 그걸 쓰고, 없으면 이 기기에 저장된 걸,
   그것도 없으면 새로 만든다. 주소를 아는 사람만 같은 기록을 본다. */
function resolveFamilyId(){
  const fromUrl = new URLSearchParams(location.hash.slice(1)).get('f')
               || new URLSearchParams(location.search).get('f');
  const re = /^[0-9a-f-]{36}$/i;
  let id = (fromUrl && re.test(fromUrl)) ? fromUrl : null;
  if (!id){ const saved = lsGet('dolearn.family'); if (saved && re.test(saved)) id = saved; }
  if (!id) id = uid();
  lsSet('dolearn.family', id);
  if (location.protocol.startsWith('http') && !fromUrl){
    try { history.replaceState(null, '', `${location.pathname}#f=${id}`); } catch(e){}
  }
  return id;
}
function familyLink(){
  return location.protocol.startsWith('http')
    ? `${location.origin}${location.pathname}#f=${S.familyId}`
    : `(주소는 인터넷에 올린 뒤에 생겨요) #f=${S.familyId}`;
}

const Store = {
  async add(coll, data, presetId){
    const id = presetId || uid();
    S.data[coll].push({id, ...data});
    render();
    if (S.sb){
      try { await S.sb.from('items').insert({ id, family_id:S.familyId, coll, data }); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).set(data); } catch(e){ warnWrite(e); }
    }
    return id;
  },
  async update(coll, id, patch){
    const rec = S.data[coll].find(r=>r.id===id);
    if (rec) Object.assign(rec, patch);
    render();
    if (S.sb){
      const { id:_drop, ...data } = rec || patch;
      try { await S.sb.from('items').update({ data, updated_at:new Date().toISOString() }).eq('id', id); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).update(patch); } catch(e){ warnWrite(e); }
    }
  },
  async remove(coll, id){
    S.data[coll] = S.data[coll].filter(r=>r.id!==id);
    render();
    if (S.sb){
      try { await S.sb.from('items').delete().eq('id', id); } catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.collection(coll).doc(id).delete(); } catch(e){ warnWrite(e); }
    }
  },
  async saveSettings(patch){
    Object.assign(S.settings, patch);
    render();
    if (S.sb){
      try { await S.sb.from('settings')
        .upsert({ family_id:S.familyId, data:S.settings, updated_at:new Date().toISOString() }); }
      catch(e){ warnWrite(e); }
    } else if (S.db){
      try { await S.db.doc('settings/app').set({...S.settings}); } catch(e){ warnWrite(e); }
    }
  }
};

/* 서버는 한 번에 1000줄까지만 돌려준다. 기록이 쌓여도 빠지지 않도록 1000줄씩 나눠 끝까지 읽는다. */
async function sbAllItems(){
  const all = [];
  for (let from = 0; from < 50000; from += 1000){
    const r = await S.sb.from('items').select('id,coll,data').order('id').range(from, from + 999);
    if (r.error) throw r.error;
    const rows = r.data || [];
    all.push(...rows);
    if (rows.length < 1000) break;
  }
  return { data:[...new Map(all.map(r => [r.id, r])).values()] };
}

/* 수파베이스에서 전체를 한 번 읽어 화면 상태를 갈아끼운다.
   실시간 구독 대신 5초 폴링 — 코드가 단순하고 RLS 헤더 방식과도 잘 맞는다. */
async function sbPull(){
  if (!S.sb) return;
  try {
    const [items, st] = await Promise.all([
      sbAllItems(),
      S.sb.from('settings').select('data').eq('family_id', S.familyId).maybeSingle()
    ]);
    // 바뀐 게 없으면 화면을 다시 그리지 않는다.
    // 매번 다시 그리면 입력칸이 새로 만들어져 쓰던 글자가 5초마다 지워진다(첫 화면의 아이 이름 등).
    const rows = (items.data || []).slice().sort((a, b) => a.id < b.id ? -1 : 1);
    const sig = JSON.stringify(rows) + '|' + JSON.stringify((st && st.data && st.data.data) || null);
    const firstLoad = !S.persistent;
    if (sig === S.lastPullSig && !firstLoad) return;
    S.lastPullSig = sig;
    const next = Object.fromEntries(COLLS.map(c=>[c,[]]));
    for (const row of (items.data||[])){
      if (!next[row.coll]) next[row.coll] = [];
      next[row.coll].push({ id:row.id, ...(row.data||{}) });
    }
    S.data = next;
    if (st && st.data && st.data.data){
      S.settings = { ...S.settings, ...st.data.data };
      if (!Array.isArray(S.settings.cats) || !S.settings.cats.length) S.settings.cats = DEFAULT_CATS.slice();
    }
    S.persistent = true;
    render({ keepInputs:true });      // 다른 기기에서 바뀐 걸 반영하되, 쓰던 글자는 지킨다
  } catch(e){ warnWrite(e); }
}
let writeWarned = false;
function warnWrite(e){
  if (writeWarned) return;
  writeWarned = true;
  S.persistent = false;
  console.warn('db write failed', e);
  render();
}

/* ---------- 기능(capability) 연결 ---------- */
async function connect(){
  // 1순위: 수파베이스 (버셀 등 일반 웹에서 연 경우)
  if (!window.claude && window.supabase && location.protocol.startsWith('http')){
    try {
      S.sb = window.supabase.createClient(SB_URL, SB_KEY, {
        auth: { persistSession:false },
        global: { headers: { 'x-family-id': S.familyId } }
      });
      await sbPull();
      S.capsResolved = true;
      setInterval(() => { if (document.visibilityState === 'visible') sbPull(); }, 5000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') sbPull();
      });
      render();
      return;
    } catch(e){ S.sb = null; console.warn('supabase 연결 실패', e); }
  }

  // 2순위: claude.ai Artifact 기능
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ S.capsResolved = true; render(); return; }
  const grab = async n => { try { return await c.use(n); } catch(e){ return null; } };
  const [db, sample, assets, downloads] = await Promise.all(
    ['db','sample','assets','downloads'].map(grab)
  );
  S.sample = sample; S.assets = assets; S.downloads = downloads;
  S.capsResolved = true;

  if (db){
    S.db = db; S.persistent = true;
    for (const coll of COLLS){
      try {
        db.collection(coll).onSnapshot(snap => {
          S.data[coll] = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
          render({ keepInputs:true });
        }, err => { console.warn('snapshot', coll, err); });
      } catch(e){ console.warn('subscribe failed', coll, e); }
    }
    try {
      db.doc('settings/app').onSnapshot(snap => {
        if (snap.exists){
          const d = snap.data()||{};
          S.settings = {...S.settings, ...d};
          if (!Array.isArray(S.settings.cats) || !S.settings.cats.length) S.settings.cats = DEFAULT_CATS.slice();
        }
        render({ keepInputs:true });
      });
    } catch(e){}
  }
  render();
}

const kids = () => S.data.profiles.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
const kid = id => S.data.profiles.find(p=>p.id===id);
const curKid = () => kid(S.kidId);

function todosFor(kidId, date=new Date()){
  const dow = date.getDay();
  return S.data.todos.filter(t =>
    t.kidId === kidId && !t.archived &&
    (!Array.isArray(t.repeatDays) || t.repeatDays.length === 0 || t.repeatDays.includes(dow))
  );
}
function sessionOf(kidId, todoId, dateKey){
  return S.data.sessions.find(s => s.kidId===kidId && s.todoId===todoId && s.date===dateKey);
}
function doneCount(kidId, dateKey){
  const list = todosFor(kidId, new Date(dateKey + 'T12:00:00'));
  return list.filter(t => { const s = sessionOf(kidId, t.id, dateKey); return s && s.done; }).length;
}
function todaySeconds(kidId){
  const k = todayKey();
  let sum = S.data.sessions.filter(s=>s.kidId===kidId && s.date===k)
    .reduce((a,s)=>a+(s.durationSec||0),0);
  if (S.running && S.kidId===kidId) sum += (Date.now()-S.running.startedAt)/1000;
  return sum;
}
function allDoneToday(kidId){
  const list = todosFor(kidId);
  return list.length > 0 && list.every(t => { const s = sessionOf(kidId, t.id, todayKey()); return s && s.done; });
}
function activeUnlock(kidId){
  const now = Date.now();
  return S.data.unlocks.find(u => u.kidId===kidId && new Date(u.expiresAt).getTime() > now);
}
/* 한 주의 기록 — back 0 이번 주, 1 지난주. 노력은 공부한 시간(분) + 뚜뚜에게 말해 본 횟수, 착한 일은 받은 칭찬 스티커 */
function weekStatsAt(kidId, back){
  const s0 = weekStart(); s0.setDate(s0.getDate() - 7 * (back || 0));
  const start = s0.getTime(), end = start + 7 * 86400000, inWeek = t => t >= start && t < end;
  const books = S.data.books.filter(b => b.kidId === kidId && inWeek(new Date(b.readAt || 0).getTime())).length;
  const words = S.data.words.filter(w => w.kidId === kidId && inWeek(new Date(w.createdAt || 0).getTime())).length;
  let sched = 0, done = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(s0); d.setDate(d.getDate() + i);
    if (d > new Date()) break;
    const key = todayKey(d), list = todosFor(kidId, d);
    sched += list.length;
    done += list.filter(t => { const s = sessionOf(kidId, t.id, key); return s && s.done; }).length;
  }
  const secs = S.data.sessions.filter(x => x.kidId === kidId && inWeek(new Date(x.date + 'T12:00:00').getTime()))
    .reduce((n, x) => n + (x.durationSec || 0), 0);
  let speech = 0;
  for (const p of S.data.speech.filter(x => x.kidId === kidId))
    for (const [dk, v] of Object.entries(p.days || {})) if (inWeek(new Date(dk + 'T12:00:00').getTime())) speech += (v.rec || 0);
  const kind = S.data.kudos.filter(x => x.to === kidId && inWeek(new Date(x.at || 0).getTime())).length;
  const mins = Math.round(secs / 60);
  return { books, words, done, sched, rate: sched ? Math.round(done / sched * 100) : 0, speech, mins, effort: mins + speech, kind };
}
function weekStats(kidId){ return weekStatsAt(kidId, 0); }

let renderQueued = false, renderKeep = true;
/* opts.keepInputs — 다른 기기에서 온 변경으로 다시 그릴 때, 화면의 입력칸에 쓰던 글자와 커서를 지킨다.
   사용자가 직접 한 동작(저장 뒤 칸 비우기 등)으로 그릴 때는 지키지 않는다. */
function render(opts){
  const keep = !!(opts && opts.keepInputs);
  if (renderQueued){ renderKeep = renderKeep && keep; return; }
  renderQueued = true; renderKeep = keep;
  // 숨겨진 탭(뒤에서 열린 알림 링크 등)에서는 requestAnimationFrame이 멈추므로 setTimeout으로 그린다
  const schedule = document.hidden ? (fn => setTimeout(fn, 0)) : requestAnimationFrame;
  schedule(() => {
    renderQueued = false;
    const root = $('#screen');
    const snap = renderKeep ? snapshotInputs(root) : null;
    draw();
    if (snap) restoreInputs(root, snap);
  });
}
function snapshotInputs(root){
  const vals = {};
  root.querySelectorAll('input[id], textarea[id]').forEach(el => {
    if (el.type !== 'file' && el.type !== 'checkbox') vals[el.id] = el.value;
  });
  const a = document.activeElement;
  const focus = (a && root.contains(a) && a.id)
    ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null;
  return { vals, focus };
}
function restoreInputs(root, snap){
  for (const id in snap.vals){
    const el = document.getElementById(id);
    if (el && root.contains(el) && el.value !== snap.vals[id]) el.value = snap.vals[id];
  }
  if (snap.focus){
    const el = document.getElementById(snap.focus.id);
    if (el && root.contains(el)){
      el.focus({ preventScroll:true });
      try { el.setSelectionRange(snap.focus.s, snap.focus.e); } catch(e){}
    }
  }
}

function draw(){
  const screen = $('#screen'), tabs = $('#tabs'), who = $('#whoami'), home = $('#homeBtn');
  const onHome = !S.data.profiles.length || !S.kidId || !curKid();
  $('#topbar').classList.toggle('home', onHome);

  const w = todayWeather();
  $('#dateChip').innerHTML = `${esc(dateLabel())} <span style="font-size:15px">${w ? w.icon : '＋'}</span>`;
  $('#dateChip').setAttribute('aria-label', w ? `오늘 날씨 ${w.label}, 눌러서 바꾸기` : '오늘 날씨 고르기');

  // 아직 아무 프로필도 없음 → 첫 설정
  if (!S.data.profiles.length){
    tabs.hidden = true; who.hidden = true; home.hidden = true;
    screen.innerHTML = viewSetup();
    return;
  }
  // 프로필 미선택 → 시작 화면
  if (!S.kidId || !curKid()){
    tabs.hidden = true; who.hidden = true; home.hidden = true;
    screen.innerHTML = viewGate();
    return;
  }

  const k = curKid(), col = kidColor(k);
  who.hidden = false; home.hidden = false;
  who.innerHTML = `<span class="avatar" style="background:${col.bg}">${esc(k.avatar||'🐰')}</span><b>${esc(k.name)}</b>`;

  tabs.hidden = false;
  const items = [
    ['today','오늘','🌤'], ['shelf','책장','📚'], ['words','단어장','🫧'], ['speech','스피치','🦜'],
    ['versus','배움기록','📒'], ['games','놀이','🎈']
  ];
  tabs.innerHTML = items.map(([id,label,ico]) =>
    `<button data-tab="${id}" aria-current="${S.tab===id}"><span class="ico">${ico}</span>${label}</button>`
  ).join('');

  // 다른 아이가 올린 승인 요청은 어느 화면에서든 보이게 한다 (부모님 폰에서 바로 승인)
  const others = pendingRequests().filter(r => r.kidId !== S.kidId);

  const views = { today:viewToday, shelf:viewShelf, words:viewWords, speech:viewSpeech, versus:viewVersus, games:viewGames };
  screen.innerHTML = `<div class="wrap stack">${storageBanner()}${others.map(askCard).join('')}${(views[S.tab]||viewToday)()}</div>`;

  if (S.tab === 'shelf') requestAnimationFrame(fitSpines);
}

function storageBanner(){
  if (!S.capsResolved) return '';
  if (S.persistent) return '';
  return `<div class="banner warn"><span>⚠️</span><span><b>기록이 저장되지 않아요.</b>
    이 화면을 닫으면 오늘 넣은 내용이 사라집니다. 인터넷 연결을 확인하거나,
    앱 주소(http로 시작하는 주소)로 열어주세요.</span></div>`;
}

/* 시작 화면 배경 스티커 — [스티커, 가로%, 세로%, 크기px, 기울기°, 옵션]
   좌우 여백과 위아래 띠에 붙인다. 'wide'는 폰처럼 좁은 화면에서 숨기고, 'bob'은 살랑살랑 움직인다. */
const DECOR = [
  // 위쪽 띠
  ['st-key-berry',     6,  5,  88, -14, 'bob'],
  ['st-ribbon',       30,  3,  72,   8, 'wide'],
  ['st-candy',        66,  4,  66, -10, 'wide'],
  ['st-plush-bear',   92,  6, 108,  10, ''],
  // 왼쪽 여백
  ['st-book-stack',    6, 25,  98,   7, 'wide'],
  ['st-key-heart',     5, 44,  78, -12, 'wide bob'],
  ['st-plush-bunny',   7, 63, 102,  -6, 'wide'],
  ['st-pencils',       5, 81,  84,  14, 'wide'],
  // 오른쪽 여백
  ['st-milk',         94, 24,  86,  -9, 'wide'],
  ['st-key-cat',      95, 43,  84,  12, 'wide bob'],
  ['st-slime',        93, 62,  80,  -8, 'wide'],
  ['st-book-cover',   94, 80,  90,  10, 'wide'],
  // 아래쪽 띠
  ['st-mochi',        10, 95,  80,  -6, ''],
  ['st-bracelet',     33, 96,  70,  12, 'wide'],
  ['st-book-open',    58, 95,  94,  -4, 'wide'],
  ['st-key-d',        78, 96,  72,  -12, 'wide bob'],
  ['st-plush-penguin',93, 93,  96,   8, '']
];
function decorLayer(){
  return `<div class="decor" aria-hidden="true">${DECOR.map(([id, x, y, s, r, cls]) => {
    const delay = `animation-delay:${(x*7+y*3)%5}s`;
    // 키꾸 — 키캡은 키링 고리를 달아 매단 모양으로 (위로 36만큼 늘린 캔버스)
    if (id.startsWith('st-key-')){
      const h = Math.round(s * 156 / 120);
      return `<svg class="stk keyring ${cls}" viewBox="0 -36 120 156"
        style="left:${x}%;top:${y}%;width:${s}px;height:${h}px;--s:${s}px;--r:${r}deg;${delay}"
        ><use href="#st-keyring" x="0" y="-36" width="120" height="60"/><use href="#${id}" width="120" height="120"/></svg>`;
    }
    return `<svg class="stk ${cls}" viewBox="0 0 120 120"
      style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--s:${s}px;--r:${r}deg;${delay}"
      ><use href="#${id}"/></svg>`;
  }).join('')}</div>`;
}

function pendingRequests(){

/* ============================================================
   화면: 오늘
   ============================================================ */
function viewToday(){
  const k = curKid(), col = kidColor(k);
  const list = todosFor(S.kidId), key = todayKey();
  const done = doneCount(S.kidId, key);
  const all = list.length > 0 && done === list.length;

  const strip = Array.from({length:7}, (_,i) => {
    const d = new Date(weekStart()); d.setDate(d.getDate()+i);
    const dk = todayKey(d), isToday = dk === key, future = d > new Date();
    const tl = todosFor(S.kidId, d);
    const ok = tl.length > 0 && doneCount(S.kidId, dk) === tl.length;
    return `<div><div class="dot ${ok?'on':''} ${isToday?'today':''}">${ok?'🍓':(future?'':'·')}</div>
      <small>${DAYNAMES[d.getDay()]}</small></div>`;
  }).join('');

  const pct = list.length ? done/list.length*100 : 0;
  return `
  <div class="card">
    <div class="row" style="align-items:flex-end">
      <div class="grow">
        <div class="muted">오늘 할 일</div>
        <div class="big" style="color:${col.ink}">${done}<span style="font-size:24px">/${list.length}</span></div>
      </div>
      <div class="muted" style="text-align:right">${
        all ? '다 했어요! 🎉' : (list.length ? `${list.length-done}개 남았어요` : '오늘은 쉬는 날')}</div>
    </div>
    <div class="gauge" style="margin-top:10px;height:16px">
      <span style="width:${pct}%;background:${col.bar}"></span></div>
  </div>

  <div class="card">
    <h3 class="sub">이번 주</h3>
    <div class="weekstrip">${strip}</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h3 class="sub grow" style="margin:0">오늘 할 일</h3>
      <button class="btn ghost sm" id="addTodo">+ 추가</button>
    </div>
    ${list.length ? list.map(t=>todoRow(t,key)).join('') : `
      <div class="empty"><div class="face">🧺</div>
        <p>아직 할 일이 없어요.<br>오늘 해보고 싶은 걸 직접 적어볼까요? ✨</p></div>`}
  </div>

  ${all ? `<div class="card" style="text-align:center;background:var(--mint-soft)">
      <div style="font-size:40px">🎉</div>
      <h3 class="sub">오늘 할 일을 다 했어요!</h3>
      <button class="btn mint" id="goGames">놀이 열어달라고 하기</button>
    </div>` : ''}
  `;
}

function todoRow(t, key){
  const s = sessionOf(S.kidId, t.id, key);
  const done = !!(s && s.done);
  const running = S.running && S.running.todoId === t.id;
  const secs = (s && s.durationSec) || 0;
  if (t.kind === 'speech'){
    const note = ttTodoNote(S.kidId);
    return `<div class="todo ${done?'done':''}">
      <button class="tick" data-tick="${t.id}" aria-pressed="${done}" aria-label="${esc(t.title)} 완료">${done?'✓':''}</button>
      <div class="grow">
        <div class="name">${esc(t.icon||'')} ${esc(t.title)}</div>
        <div class="muted">${done ? '오늘 미션 완료! 멋져요 🎉' : (note ? esc(note) : '뚜뚜 선생님이 기다려요')}</div>
      </div>
      ${done ? '' : `<button class="btn sm" data-ttgo="1">🦜 하러 가기</button>`}
    </div>`;
  }
  return `<div class="todo ${done?'done':''}">
    <button class="tick" data-tick="${t.id}" aria-pressed="${done}" aria-label="${esc(t.title)} 완료">${done?'✓':''}</button>
    <div class="grow">
      <div class="name">${esc(t.icon||'')} ${esc(t.title)}</div>
      ${secs ? `<div class="muted">${fmtDur(secs)} 했어요</div>` : ''}
    </div>
    ${running
      ? `<span class="timer" data-live="${t.id}">${fmtClock((Date.now()-S.running.startedAt)/1000)}</span>
         <button class="btn sm" data-stop="${t.id}">끝</button>`
      : (done ? '' : `<button class="btn ghost sm" data-start="${t.id}">시작</button>`)}
    ${t.createdBy === 'kid' ? `<button class="btn ghost sm" data-deltodo="${t.id}" aria-label="지우기">🗑</button>` : ''}
  </div>`;
}

/* ============================================================
   화면: 책장
   ============================================================ */
function viewShelf(){
  const mine = S.data.books.filter(b=>b.kidId===S.kidId)
    .sort((a,b)=>String(a.readAt).localeCompare(String(b.readAt)));
  const cats = S.settings.cats && S.settings.cats.length ? S.settings.cats : DEFAULT_CATS;

  const towers = cats.map(cat=>{
    const bs = mine.filter(b=>b.category===cat);
    const shown = bs.slice(-14);
    const spines = shown.map((b,i)=>{
      const nth = bs.length - shown.length + i + 1;
      const ribbon = (nth % 10 === 0) ? `<div class="ribbon" title="${nth}권째!"></div>` : '';
      return `<div class="spine ${b.id===S.freshBookId?'fresh':''}" data-book="${b.id}"
        style="background:${spineColor(b.id)};height:${spineHeight(b.id)}px"
        ><span class="t">${esc(b.title||'제목 없는 책')}</span></div>${ribbon}`;
    }).join('');
    return `<div class="tower">
      <div class="spines">${spines || '<div class="ghostbox">여기에 쌓아요</div>'}</div>
      <div class="plank"></div>
      <div class="label">${esc(cat)}</div>
      <div class="count">${bs.length}권</div>
    </div>`;
  }).join('');

  const withCovers = mine.filter(b=>b.coverAssetId || b.coverUrl).slice().reverse();

  return `
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <div class="grow">
        <h3 class="sub" style="margin:0">내 책탑</h3>
        <div class="muted">모두 ${mine.length}권 읽었어요</div>
      </div>
      <button class="btn" id="addBook">📷 책 등록</button>
    </div>
    <div class="towers">${towers}</div>
  </div>

  ${withCovers.length ? `<div class="card">
    <h3 class="sub">표지 모음</h3>
    <div class="covers">${withCovers.map(b=>`
      <button class="cover" data-book="${b.id}">
        ${b.coverAssetId ? `<img src="/_blob/${esc(b.coverAssetId)}" alt="${esc(b.title)}">`
          : (b.coverUrl ? `<img src="${esc(b.coverUrl)}" alt="${esc(b.title)}">` : esc(b.title))}
      </button>`).join('')}</div>
  </div>` : ''}

  ${!mine.length ? `<div class="card empty">
    <div class="face">📚</div>
    <p>첫 책을 등록해 볼까요?<br>책 뒤쪽 바코드를 찍으면 돼요.</p>
    <button class="btn" id="addBook2">📷 책 등록하기</button>
  </div>` : ''}
  `;
}

/* 반짝 왕관 — 한 아이가 왕관을 다 가져가지 않으면서도, 정말 잘한 건 정직하게.
   실력 왕관(책·단어·성실·연습): 앞선 아이가 받는다. 비기면 둘 다.
     한 아이가 절반보다 많이 앞서면, 차이가 작은 것부터 '둘이 함께' 왕관이 된다(빼앗아 주지 않는다).
   개인 왕관(노력·착한·성장): 형제끼리 겨루지 않고, 기준을 넘으면 둘 다 받는다. */
function crownPlan(sa, sb, pa, pb){
  const head = [
    { id:'books',  ico:'📚', title:'책왕',   va:sa.books,  vb:sb.books,  unit:'권' },
    { id:'words',  ico:'🫧', title:'단어왕', va:sa.words,  vb:sb.words,  unit:'개' },
    { id:'rate',   ico:'⏰', title:'성실왕', va:sa.rate,   vb:sb.rate,   unit:'%' }
  ];
  if (S.data.scripts.length) head.push({ id:'speech', ico:'🦜', title:'연습왕', va:sa.speech, vb:sb.speech, unit:'번' });
  const out = { a:[], b:[], both:[] };
  const live = head.filter(c => c.va > 0 || c.vb > 0);
  live.filter(c => c.va === c.vb).forEach(c => out.both.push(c));
  const won = live.filter(c => c.va !== c.vb).map(c => ({ ...c, lead:c.va > c.vb ? 'a' : 'b', gap:Math.abs(c.va - c.vb) / Math.max(c.va, c.vb) }));
  const cap = Math.ceil(won.length / 2);
  for (const who of ['a', 'b']){
    const mine = won.filter(c => c.lead === who).sort((x, y) => y.gap - x.gap);
    mine.slice(0, cap).forEach(c => out[who].push(c));
    mine.slice(cap).forEach(c => out.both.push(c));                  // 넘치는 건 함께
  }
  // 개인 왕관 — 둘 다 받을 수 있다
  const grew = (s, p) => ['books', 'words', 'speech', 'mins', 'kind'].filter(k => (s[k] || 0) > (p[k] || 0)).length;
  const mine = (s, p, who) => {
    const list = [];
    if (s.effort >= 20) list.push({ id:'effort', ico:'💪', title:'노력왕', unit:'점', ['v' + who]:s.effort });
    if (s.kind >= 1) list.push({ id:'kind', ico:'😇', title:'착한왕', unit:'개', ['v' + who]:s.kind });
    if (grew(s, p) >= 2) list.push({ id:'grow', ico:'🌱', title:'성장왕', unit:'' });
    return list;
  };
  out.a.push(...mine(sa, pa, 'a'));
  out.b.push(...mine(sb, pb, 'b'));
  return out;
}
const KUDOS = ['🤝 도와줘서 고마워', '🎁 양보해줘서 고마워', '🎈 같이 놀아줘서 고마워', '📣 응원해줘서 고마워', '💖 그냥 좋아서!'];

          data-mem="${i}">${open?c:''}</button>`;

        <h3 class="sub grow" style="margin:0">별똥별 받기</h3>
        <span class="muted" id="starScore">0개</span>

      return `<div class="card empty"><div class="face">🫧</div>
        <p>단어 가방에 낱말이 4개는 있어야 해요.<br>책을 읽고 단어를 담아보세요!</p></div>`;
    }
    return `<div class="card">
      <div class="row" style="margin-bottom:10px">

        <span class="muted">${st.solved.length}/${st.pairs.length}</span>
      </div>

        <div class="matchcol">${st.left.map(p=>`
          <button class="matchbtn ${st.solved.includes(p.id)?'gone':''}" data-ml="${p.id}"
            aria-pressed="${st.pick===p.id}" ${st.solved.includes(p.id)?'disabled':''}>${esc(p.term)}</button>`).join('')}</div>
        <div class="matchcol">${st.right.map(p=>`
          <button class="matchbtn ${st.solved.includes(p.id)?'gone':''}" data-mr="${p.id}"

    </div>`;
  }
  return '';

  const open = root.querySelector('.sheet');

    // 이미 열려 있으면 안쪽만 갈아끼운다.
    // 창을 통째로 다시 만들면 열림 애니메이션이 매번 돌아 깜빡인다(비밀번호 누를 때처럼).
    const y = open.scrollTop;
    open.innerHTML = inner;
    open.scrollTop = y;
    return;
  }
  root.innerHTML = `<div class="modal" id="modal"><div class="sheet" style="position:relative">${inner}</div></div>`;
}

/* ---------- QR ---------- */
function qrSvg(text){
  try {
    if (!window.qrcode || !text) return '';
    const q = window.qrcode(0, 'M');
    q.addData(text); q.make();
    return q.createSvgTag({ cellSize:4, margin:2, scalable:true, alt:'QR 코드' });
  } catch(e){ return ''; }
}

/* ---------- 부모님 관리 → 알림 (텔레그램) ----------
   흐름: QR을 폰으로 찍거나 버튼 → 텔레그램에서 봇 열림 → 시작(START) → 여기서 '연결 확인'
   서버가 "/start <가족ID>" 메시지를 찾아 대화방 번호를 돌려주면 가족 설정에 저장한다. */

    <p class="muted" style="margin:0 0 12px">아이가 놀이를 요청하면 부모님 폰 텔레그램으로 알림이 가요.</p>

        텔레그램에서 @${esc(d.bot.username)} 열기</a>

    <div class="tgstep"><span class="tgnum">2</span><div class="grow">
      <b>텔레그램에서 <u>시작</u>(START) 누르기</b>
      <p style="margin:4px 0 0">화면 아래 파란 <b>시작</b> 버튼을 누르세요. 봇이 대답하지 않아도 괜찮아요.</p>
    </div></div>

    <div class="tgstep"><span class="tgnum">3</span><div class="grow">
      <b>여기로 돌아와서 연결 확인</b>
      <button class="btn mint wide" id="tgCheck" style="margin-top:8px">연결 확인</button>

        텔레그램에서 시작을 누른 뒤 다시 확인해 주세요.</p>` : ''}

    ${(d.candidates||[]).length ? `<div style="margin-top:12px">
      <p class="muted" style="margin:0 0 6px">QR 없이 봇에게 직접 말을 거셨나요? 부모님 계정을 고르세요.</p>

        style="margin-top:6px">${esc(c.name || '이름 없음')} 계정으로 연결</button>`).join('')}
    </div>` : ''}
  </div>`;
}

async function tgRefresh(userAsked){
  S.view.tg = { ...(S.view.tg || {}), loading:true };
  if (S.view.parentTab === 'notify') openModal(parentSheet());
  let next;
  try {
    const r = await fetch(`/api/telegram-link?familyId=${encodeURIComponent(S.familyId)}`);
    const j = await r.json();
    next = { loading:false, data:j };
    if (j.ok && j.chat){
      const cur = S.settings.telegram;
      if (!cur || String(cur.chatId) !== String(j.chat.id)){
        await Store.saveSettings({ telegram:{ chatId:String(j.chat.id), name:j.chat.name || '', linkedAt:new Date().toISOString() } });
        tgSendTest(true);
      }
    } else if (j.ok && userAsked){
      next.checkedEmpty = true;
    }
  } catch(e){
    next = { loading:false, error:'알림 연결 상태를 불러오지 못했어요. 인터넷을 확인해 주세요.' };
  }
  S.view.tg = next;
  if (S.view.parentTab === 'notify' && $('#modalRoot .sheet')) openModal(parentSheet());
}

async function tgSendTest(afterLink){
  const chatId = S.settings.telegram && S.settings.telegram.chatId;
  if (!chatId) return;
  try {
    const r = await fetch('/api/telegram-link', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ action:'test', chatId })
    });
    const j = await r.json();
    toast(j.ok ? (afterLink ? '연결됐어요! 텔레그램을 확인해 보세요 📨' : '텔레그램으로 보냈어요 📨')
               : (j.message || '보내지 못했어요'));
  } catch(e){ toast('보내지 못했어요. 인터넷을 확인해 주세요'); }
}

async function lookupWord(term, mode){
  const key = `${mode}:${term.trim().toLowerCase()}`;
  const cached = S.data.dict.find(d => d.key === key);
  if (cached) return cached.value;

  const m = DICT_MODES[mode] || DICT_MODES.ek;

  // 웹(버셀)에서는 서버 함수가 Claude API를 대신 부른다 — 키가 브라우저에 노출되지 않는다.
  if (!S.sample){
    const res = await fetch('/api/dict', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ term, mode })
    }).catch(() => null);
    if (!res) throw new Error('사전에 연결하지 못했어요. 인터넷을 확인해 주세요.');
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || out.error){
      throw new Error((out && out.message) || '지금은 사전을 쓸 수 없어요.');
    }
    const val = normalizeDict(out, term);
    Store.add('dict', { key, value: val, createdAt:new Date().toISOString() });
    return val;
  }

  const prompt = `너는 초등학교 1학년 아이에게 낱말을 알려주는 다정한 선생님이야.
낱말: "${term}"
사전 종류: ${m.label}. ${m.instruct}

아래 JSON 하나만 출력해. 설명도 마크다운도 코드펜스도 쓰지 마.
{"term":"","reading":"","meaning":"","meaningEn":"","example":"","exampleKo":"","emoji":""}

규칙:
- meaning은 15자 안팎의 한 문장. 어려운 한자어와 전문 용어를 쓰지 마.
- meaningEn: 영어 단어면 아주 쉬운 영어 풀이 한 문장, 한국어 낱말이면 빈 문자열.
- reading: 영어 단어면 한글로 읽는 법(예: 레인보우), 한국어 낱말이면 빈 문자열.
- emoji: 낱말이 떠오르는 이모지 딱 한 개.
- 그런 낱말을 모르면 meaning에 "잘 모르겠어요"라고만 써.`;

  const out = await S.sample.json(prompt, { modelTier:'quick', cache:true });
  const val = normalizeDict(out, term);
  Store.add('dict', { key, value: val, createdAt:new Date().toISOString() });
  return val;
}

function normalizeDict(out, term){
  return {
    term: (out && out.term) || term,
    reading: (out && out.reading) || '',
    meaning: (out && out.meaning) || '',
    example: (out && out.example) || '',
    exampleKo: (out && out.exampleKo) || '',
    meaningEn: (out && out.meaningEn) || '',
    emoji: (out && out.emoji) || '📖'
  };
}

/* ---------- 카카오 책 검색 ----------
   GET https://dapi.kakao.com/v3/search/book
     ?target=isbn|title &query=<검색어> &size=<개수>
     헤더: Authorization: KakaoAK <REST API 키>
   응답 documents[]: title, authors[], publisher, thumbnail, isbn, contents
   키는 부모님 화면 → 설정에서 넣는다(코드에 박아두지 않는다).       */
const KAKAO_URL = 'https://dapi.kakao.com/v3/search/book';

async function bookSearch(query, target){
  // 웹(버셀)에서는 서버 함수가 알라딘 → 카카오 순으로 찾아준다. 키는 서버에만 있다.
  if (!window.claude){
    try {
      const q = target === 'isbn' ? `isbn=${encodeURIComponent(query)}` : `title=${encodeURIComponent(query)}`;
      const r = await fetch(`/api/book?${q}`);
      if (!r.ok) return { ok:false, reason:'http' };
      const j = await r.json();
      const docs = (j.docs || []).map(d => ({
        title:d.title || '', author:d.author || '', publisher:d.publisher || '',
        coverUrl:d.cover || '', isbn:d.isbn || '', category:catFromShop(d.category || '')
      }));
      if (!docs.length && !j.provider && (j.tried || []).length && /열쇠/.test(j.message || '')) return { ok:false, reason:'nokey' };
      return { ok:true, docs, provider:j.provider || '' };
    } catch(e){ return { ok:false, reason:'blocked' }; }
  }

  // Artifact에서 열었을 때는 브라우저가 직접 카카오를 부른다(CSP에 막힐 수 있음).
  const key = (S.settings.kakaoKey||'').trim();
  if (!key) return { ok:false, reason:'nokey' };
  try {
    const url = `${KAKAO_URL}?target=${target}&query=${encodeURIComponent(query)}&size=${target==='isbn'?1:6}`;
    const res = await fetch(url, { headers: { Authorization: 'KakaoAK ' + key } });
    if (res.status === 401 || res.status === 403) return { ok:false, reason:'badkey' };
    if (res.status === 429) return { ok:false, reason:'quota' };
    if (!res.ok) return { ok:false, reason:'http' };
    const j = await res.json();
    const docs = (j.documents || []).map(d => ({
      title: d.title || '',
      author: (d.authors || []).join(', '),
      publisher: d.publisher || '',
      coverUrl: d.thumbnail || '',
      isbn: (d.isbn || '').split(' ').pop() || ''
    }));
    return { ok:true, docs };
  } catch(e){
    return { ok:false, reason:'blocked' };   // CSP 또는 네트워크 차단
  }
}
const BOOK_MSG = {
  nokey:   '책 찾기가 아직 준비되지 않았어요. 제목을 적어주세요.',
  badkey:  '책 찾기 열쇠가 맞지 않아요. 부모님께 말씀해 주세요.',
  quota:   '오늘 책 찾기를 너무 많이 했어요. 제목을 적어주세요.',
  http:    '책 정보를 받아오지 못했어요. 제목을 적어주세요.',

};
/* 서점 분류(예: 국내도서>어린이>그림책)를 우리 책장 종류로 */
function catFromShop(path){
  const cats = S.settings.cats && S.settings.cats.length ? S.settings.cats : DEFAULT_CATS;
  const has = c => cats.includes(c) ? c : '';
  const s = String(path || '');
  if (!s) return '';
  if (/외국도서|영어|English|원서|외국어/i.test(s)) return has('영어책');   // 영어 그림책·만화도 영어책으로
  if (/만화|코믹|학습만화/.test(s)) return has('만화');
  if (/그림책/.test(s)) return has('그림책');
  if (/동시|동요|>시(>|$)|시집/.test(s)) return has('시');
  if (/과학|지식|학습|사회|역사|수학|자연|인물|위인|백과/.test(s)) return has('지식책');
  if (/동화|명작|소설|옛이야기|전래/.test(s)) return has('동화책');
  return '';
}

// Open-Meteo WMO 코드 → 우리 아이콘
function wmoToWeather(code){
  if (code === 0) return WEATHERS[0];
  if (code <= 2) return WEATHERS[1];
  if (code === 3) return WEATHERS[2];
  if (code === 45 || code === 48) return WEATHERS[6];
  if (code >= 95) return WEATHERS[4];
  if (code >= 71 && code <= 77) return WEATHERS[5];
  if (code >= 51) return WEATHERS[3];
  return WEATHERS[1];
}
async function fetchWeatherAt(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=weather_code&timezone=auto`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('http');
  const j = await res.json();
  const code = j && j.current && j.current.weather_code;
  if (code == null) throw new Error('shape');
  return wmoToWeather(code);
}
